<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Push at the front",
  p: String.raw`Create the forward_list 1, 2, 3. Push 0 onto the front and print all the elements separated by spaces.`,
  ex: String.raw`0 1 2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 3};
    fl.push_front(0);
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`A forward_list is a singly linked list. It offers push_front and no push_back, because adding at the tail would need a walk to the end.` },

{ n: 2, d: "easy", t: "Only the front is directly available",
  p: String.raw`Create the forward_list 4, 5. Print its first element.`,
  ex: String.raw`4`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    const std::forward_list<int> fl{4, 5};
    std::cout << fl.front() << '\n';
}`,
  why: String.raw`Access is limited to the front, because reaching any other node means following the links from the start.` },

{ n: 3, d: "easy", t: "Count with distance",
  p: String.raw`Create the forward_list 1, 2, 3, 4. Count its elements by measuring the distance from begin to end, then print the count.`,
  ex: String.raw`4`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <iterator>

int main() {
    const std::forward_list<int> fl{1, 2, 3, 4};
    std::cout << std::distance(fl.begin(), fl.end()) << '\n';
}`,
  why: String.raw`forward_list has no size member, so counting means walking the list. std::distance does exactly that walk.` },

{ n: 4, d: "easy", t: "Insert after a node",
  p: String.raw`Create the forward_list 1, 3. Insert 2 directly after the first element, then print the list separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 3};
    fl.insert_after(fl.begin(), 2);
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`insert_after takes an iterator to the node before the insertion point, because a singly linked node cannot reach its predecessor.` },

{ n: 5, d: "easy", t: "Insert at the head",
  p: String.raw`Create the forward_list 2, 3. Insert 1 at the very front using the position before the first element, then print the list separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{2, 3};
    fl.insert_after(fl.before_begin(), 1);
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`before_begin is a sentinel just before the first element. Inserting after it is how a forward_list adds at the head.` },

{ n: 6, d: "easy", t: "Erase the element after a node",
  p: String.raw`Create the forward_list 1, 2, 3. Erase the element that follows the first element, then print the list separated by spaces.`,
  ex: String.raw`1 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 3};
    fl.erase_after(fl.begin());
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`erase_after removes the node after the given iterator, so the iterator it names is the one that stays valid.` },

{ n: 7, d: "easy", t: "Clear and check",
  p: String.raw`Create the forward_list 1. Clear it, then print whether it is empty, as true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1};
    fl.clear();
    std::cout << std::boolalpha << fl.empty() << '\n';
}`,
  why: String.raw`clear destroys all nodes. empty is the constant-time check to use, because it does not need to count anything.` },

{ n: 8, d: "easy", t: "Construct a pair at the front",
  p: String.raw`Create an empty forward_list of pairs of an int and a string. Use emplace_front to add the pair 1 and the string a. Print the int and the string, separated by a space.`,
  ex: String.raw`1 a`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <string>
#include <utility>

int main() {
    std::forward_list<std::pair<int, std::string>> fl;
    fl.emplace_front(1, "a");
    std::cout << fl.front().first << ' ' << fl.front().second << '\n';
}`,
  why: String.raw`emplace_front forwards its arguments to the pair's constructor, so the pair is built directly inside the new node.` },

{ n: 9, d: "easy", t: "Remove every matching value",
  p: String.raw`Create the forward_list 1, 2, 1, 3. Remove every element equal to 1 and print the rest separated by spaces.`,
  ex: String.raw`2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 1, 3};
    fl.remove(1);
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`remove unlinks every matching node in one pass. Nothing needs to be shifted, which is an advantage of linked storage.` },

{ n: 10, d: "easy", t: "Reverse in place",
  p: String.raw`Create the forward_list 1, 2, 3 and reverse it in place. Print the elements separated by spaces.`,
  ex: String.raw`3 2 1`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 3};
    fl.reverse();
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`reverse only rewires the links between existing nodes, so no elements are copied or moved in memory.` },

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Insert before the first larger value",
  p: String.raw`The forward_list 1, 3, 5 is sorted. Insert 4 at the position that keeps it sorted, then print the list separated by spaces.`,
  ex: String.raw`1 3 4 5`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 3, 5};
    auto prev = fl.before_begin();
    while (std::next(prev) != fl.end() && *std::next(prev) < 4) ++prev;
    fl.insert_after(prev, 4);
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Because the list cannot step backwards, the search keeps a position one node behind the candidate. Inserting after that position places the value between its neighbours.` },

{ n: 12, d: "medium", t: "Remove by predicate",
  p: String.raw`Create the forward_list 1, 2, 3, 4, 5. Remove every odd value and print what remains separated by spaces.`,
  ex: String.raw`2 4`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 3, 4, 5};
    fl.remove_if([](int x) { return x % 2 != 0; });
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`remove_if is a member function for forward_list because the generic algorithm would need to move elements and cannot do so efficiently here.` },

{ n: 13, d: "medium", t: "Merge two sorted lists",
  p: String.raw`Merge the sorted forward_list 1, 4, 6 into the sorted forward_list 2, 3, 7, leaving the first list in sorted order. Print the first list separated by spaces, then true if the second list is now empty.`,
  ex: String.raw`1 2 3 4 6 7 true`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> a{1, 4, 6}, b{2, 3, 7};
    a.merge(b);
    for (int x : a) std::cout << x << ' ';
    std::cout << std::boolalpha << b.empty() << '\n';
}`,
  why: String.raw`merge splices nodes from the second list into the first without copying them. Both inputs must be sorted for the result to be sorted.` },

{ n: 14, d: "medium", t: "Sort and remove duplicates",
  p: String.raw`Create the forward_list 3, 1, 3, 2, 1. Sort it, remove the duplicates, and print the result separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{3, 1, 3, 2, 1};
    fl.sort();
    fl.unique();
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`unique only removes adjacent duplicates, so the list must be sorted first.` },

{ n: 15, d: "medium", t: "Splice a list after a node",
  p: String.raw`Create the forward_list a = 1, 2 and the forward_list b = 8, 9. Move all of b into a directly after the first element of a. Print a separated by spaces.`,
  ex: String.raw`1 8 9 2`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> a{1, 2}, b{8, 9};
    a.splice_after(a.begin(), b);
    bool first = true;
    for (int x : a) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`splice_after relinks the nodes of b into a without copying them. The node pointers in b are reused, and b becomes empty.` },

{ n: 16, d: "medium", t: "Middle element with two pointers",
  p: String.raw`For the forward_list 1, 2, 3, 4, 5, print the middle element. Use one pointer that advances one node per step and another that advances two nodes per step.`,
  ex: String.raw`3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    const std::forward_list<int> fl{1, 2, 3, 4, 5};
    auto slow = fl.begin();
    auto fast = fl.begin();
    while (fast != fl.end() && std::next(fast) != fl.end()) {
        fast = std::next(fast, 2);
        ++slow;
    }
    std::cout << *slow << '\n';
}`,
  why: String.raw`When the fast pointer reaches the end, the slow pointer has covered half the list. Walking the list once finds the middle without knowing its length.` },

{ n: 17, d: "medium", t: "Nth from the end",
  p: String.raw`For the forward_list 1, 2, 3, 4, 5, find the second element from the end in one pass, using a lead pointer that is two nodes ahead of a trailing pointer. Print its value.`,
  ex: String.raw`4`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    const std::forward_list<int> fl{1, 2, 3, 4, 5};
    auto lead = fl.begin();
    for (int i = 0; i < 2; ++i) ++lead;
    auto trail = fl.begin();
    while (lead != fl.end()) {
        ++lead;
        ++trail;
    }
    std::cout << *trail << '\n';
}`,
  why: String.raw`Keeping the two pointers a fixed distance apart means the trailing one lands on the target when the lead reaches the end.` },

{ n: 18, d: "medium", t: "Concatenate lists at the tail",
  p: String.raw`Create the forward_list a = 1, 2 and the forward_list b = 3. Append all of b after the last element of a, then print a separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <iterator>

int main() {
    std::forward_list<int> a{1, 2}, b{3};
    auto last = a.before_begin();
    for (auto it = a.begin(); it != a.end(); ++it) last = it;
    a.splice_after(last, b);
    bool first = true;
    for (int x : a) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Finding the last node takes one walk, and then splice_after attaches the other list there in constant time.` },

{ n: 19, d: "medium", t: "Count with a predicate",
  p: String.raw`Count the even numbers in the forward_list 1, 2, 3, 4 using a standard algorithm, and print the count.`,
  ex: String.raw`2`,
  code: String.raw`#include <algorithm>
#include <forward_list>
#include <iostream>

int main() {
    const std::forward_list<int> fl{1, 2, 3, 4};
    std::cout << std::count_if(fl.begin(), fl.end(), [](int x) { return x % 2 == 0; }) << '\n';
}`,
  why: String.raw`count_if needs only forward iterators, which a forward_list provides, so the generic algorithm applies directly.` },

{ n: 20, d: "medium", t: "Remove the head of a list",
  p: String.raw`Create the forward_list 7, 8, 9. Remove the first element and print the new first element.`,
  ex: String.raw`8`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{7, 8, 9};
    fl.pop_front();
    std::cout << fl.front() << '\n';
}`,
  why: String.raw`pop_front unlinks the head node in constant time. There is no pop_back, because removing the tail would need the node before it.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Insert after the second node",
  p: String.raw`Create the forward_list 1, 2, 3, 4. Insert 9 directly after the second element, then print the list separated by spaces.`,
  ex: String.raw`1 2 9 3 4`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 3, 4};
    fl.insert_after(std::next(fl.begin()), 9);
    bool first = true;
    for (int x : fl) {
        std::cout << (first ? "" : " ") << x;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Reaching the second node takes one step from the start. insert_after then links the new node in directly after it.` },

{ n: 22, d: "hard", t: "Reverse a middle section",
  p: String.raw`Create the forward_list 1, 2, 3, 4, 5. Reverse only the elements 2, 3 and 4 in place, leaving 1 and 5 where they are. Print the list separated by spaces.`,
  ex: String.raw`1 4 3 2 5`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <iterator>

int main() {
    std::forward_list<int> fl{1, 2, 3, 4, 5};
    auto prev = fl.begin();            // node 1
    auto first = std::next(prev);      // node 2, the section head
    for (int k = 0; k < 2; ++k) {      // move the node after 'first' to just after 'prev'
        auto moved = std::next(first);
        fl.splice_after(prev, fl, first, std::next(moved));
    }
    bool out = true;
    for (int x : fl) {
        std::cout << (out ? "" : " ") << x;
        out = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Each splice moves the element after the section head to the front of the section. Repeating it for every element after the head reverses the section in place.` },

{ n: 23, d: "hard", t: "Sum of the last k elements",
  p: String.raw`For the forward_list 1, 2, 3, 4, 5, 6 and k equal to 3, print the sum of the last three elements. Use a lead pointer that is k nodes ahead of a trailing pointer.`,
  ex: String.raw`15`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <iterator>
#include <numeric>

int main() {
    const std::forward_list<int> fl{1, 2, 3, 4, 5, 6};
    const int k = 3;
    auto lead = std::next(fl.begin(), k);
    auto trail = fl.begin();
    while (lead != fl.end()) {
        ++lead;
        ++trail;
    }
    std::cout << std::accumulate(trail, fl.end(), 0) << '\n';
}`,
  why: String.raw`When the lead pointer reaches the end, the trailing pointer sits at the start of the last k elements. Summing from there covers exactly those elements.` },

{ n: 24, d: "hard", t: "Stable sort of pairs by key",
  p: String.raw`Create the forward_list of pairs (2, a), (1, b), (2, c), (1, d). Sort it by the first member, keeping equal keys in their original order. Print the second members separated by spaces.`,
  ex: String.raw`b d a c`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <utility>

int main() {
    std::forward_list<std::pair<int, char>> fl{{2, 'a'}, {1, 'b'}, {2, 'c'}, {1, 'd'}};
    fl.sort([](const auto& x, const auto& y) { return x.first < y.first; });
    bool first = true;
    for (const auto& [key, value] : fl) {
        std::cout << (first ? "" : " ") << value;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`The member sort on forward_list is stable, so elements with equal keys keep their input order. It works by merging, which suits linked nodes.` },

{ n: 25, d: "hard", t: "Truncate after a marker value",
  p: String.raw`Create the forward_list 1, 2, 3, 4, 5. Remove every element after the first 3, keeping 3 itself. Print the remaining elements separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <forward_list>
#include <iostream>

int main() {
    std::forward_list<int> fl{1, 2, 3, 4, 5};
    auto it = fl.begin();
    while (*it != 3) ++it;
    while (std::next(it) != fl.end()) fl.erase_after(it);
    bool first = true;
    for (int x : fl) {

const TOTAL = problems.length;
const KEY = "stl-forward-list-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 56, label: "Easy", range: "Problems 1–56", badge: "easy" },
  { from: 11, to: 58, label: "Medium", range: "Problems 11–58", badge: "medium" },
  { from: 21, to: 55, label: "Hard", range: "Problems 21–55", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
