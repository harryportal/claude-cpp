<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Reserved capacity avoids reallocation", idiom: "Allocation avoidance",
  p: String.raw`Create an empty vector of ints and reserve room for ten elements. Record the address of its data. Push the numbers 0 to 9. Print same if the data address is unchanged, or moved otherwise, then a newline.`,
  ex: String.raw`same`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v;
    v.reserve(10);
    const int* before = v.data();
    for (int i = 0; i < 10; ++i) v.push_back(i);
    std::cout << (before == v.data() ? "same" : "moved") << "\n";
}`,
  why: String.raw`Reserving the final size up front means the pushes never need a new buffer. The data pointer stays valid, and no elements are copied or moved.` },

{ n: 2, d: "easy", t: "Push a moved object into a vector", idiom: "Moves and copies",
  p: String.raw`Define Counted with static counters copies and moves. Its copy constructor increments copies, and its move constructor is noexcept and increments moves. Create a Counted and push it into an empty vector using a move. Print copies, a space, then moves, then a newline.`,
  ex: String.raw`copies 0 moves 1`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

struct Counted {
    static inline int copies = 0, moves = 0;
    Counted() = default;
    Counted(const Counted&) { ++copies; }
    Counted(Counted&&) noexcept { ++moves; }
    Counted& operator=(const Counted&) = default;
    Counted& operator=(Counted&&) noexcept = default;
};

int main() {
    std::vector<Counted> v;
    Counted x;
    v.push_back(std::move(x));
    std::cout << "copies " << Counted::copies << " moves " << Counted::moves << "\n";
}`,
  why: String.raw`Moving an object into a container uses the move constructor, so the expensive copy is avoided. The moved-from object still exists, but its contents now belong to the container.` },

{ n: 3, d: "easy", t: "Branchless minimum of two ints", idiom: "Branch behaviour",
  p: String.raw`Write branchless_min(a, b) that returns the smaller of two ints using only arithmetic and bit operations, with no if statement or conditional operator. Print branchless_min(3, 8), a space, then branchless_min(9, 4), then a newline.`,
  ex: String.raw`3 4`,
  code: String.raw`#include <iostream>

int branchless_min(int a, int b) {
    int diff = a - b;
    int mask = diff >> 31;
    return b + (diff & mask);
}

int main() {
    std::cout << branchless_min(3, 8) << " " << branchless_min(9, 4) << "\n";
}`,
  why: String.raw`When the difference is negative, the shift produces an all-ones mask that selects a - b, so the result is a. Otherwise the mask is zero and the result is b. No branch is taken, so the result cannot be mispredicted.` },

{ n: 4, d: "easy", t: "Multiply and divide without overflow", idiom: "Numerical traps",
  p: String.raw`Let a and b be the int 100000, and c the int 1000. Compute a times b divided by c, doing the multiplication in a type wide enough to hold the product. Print the result followed by a newline.`,
  ex: String.raw`10000000`,
  code: String.raw`#include <iostream>

int main() {
    int a = 100000, b = 100000, c = 1000;
    long long wide = static_cast<long long>(a) * b / c;
    std::cout << wide << "\n";
}`,
  why: String.raw`The product of two ints can be as large as 10^10, far beyond the range of int. Converting one operand before multiplying keeps the whole calculation in long long.` },

{ n: 5, d: "easy", t: "Count set bits in a 16-bit mask", idiom: "Bit tricks",
  p: String.raw`Print the number of 1 bits in the unsigned value 0xF0F0, followed by a newline. Use the standard library for the count.`,
  ex: String.raw`8`,
  code: String.raw`#include <bit>
#include <iostream>

int main() {
    std::cout << std::popcount(0xF0F0u) << "\n";
}`,
  why: String.raw`Counting set bits is a single instruction on most processors. The standard library exposes it as popcount, which compilers map to that instruction when it exists.` },

{ n: 6, d: "easy", t: "Best bid from a price level map", idiom: "Order book structures",
  p: String.raw`Keep bids in a map from price to quantity. Add these orders: 5 at price 100, 10 at 101, 7 at 99, and 5 more at 101. The best bid is the highest price with a bid. Print best, a space, the best price, then the word qty, a space, and the quantity at that price, then a newline.`,
  ex: String.raw`best 101 qty 15`,
  code: String.raw`#include <iostream>
#include <map>

int main() {
    std::map<int, int> bids;
    bids[100] += 5;
    bids[101] += 10;
    bids[99] += 7;
    bids[101] += 5;
    auto best = bids.rbegin();
    std::cout << "best " << best->first << " qty " << best->second << "\n";
}`,
  why: String.raw`An ordered map keeps price levels sorted, so the best bid is always at one end. Reading it is constant time, and aggregating quantities at a price is one lookup.` },

{ n: 7, d: "easy", t: "Welford mean and variance of a small list", idiom: "Welford and reproducible Monte Carlo",
  p: String.raw`Using the values 2, 4, 4, 4, 5, 5, 7 and 9, compute the mean and the population variance with a single pass that updates a running mean and a running sum of squared deviations. Print the mean, a space, then the variance, then a newline.`,
  ex: String.raw`5 4`,
  code: String.raw`#include <iostream>

int main() {
    double data[] = {2, 4, 4, 4, 5, 5, 7, 9};
    double mean = 0, m2 = 0;
    int n = 0;
    for (double x : data) {
        ++n;
        double delta = x - mean;
        mean += delta / n;
        m2 += delta * (x - mean);
    }
    std::cout << mean << " " << m2 / n << "\n";
}`,
  why: String.raw`The running update keeps the mean and the sum of squared deviations without storing the values. Each step uses the updated mean, which is what keeps the method numerically stable.` },

{ n: 8, d: "easy", t: "Compile-time table of squares", idiom: "Compile-time tables and measurement",
  p: String.raw`Build an array of the squares of 0 to 9 at compile time. Check at compile time that the entry for 5 is 25. Print the entry for 7, then a newline.`,
  ex: String.raw`49`,
  code: String.raw`#include <array>
#include <iostream>

constexpr std::array<int, 10> make_squares() {
    std::array<int, 10> t{};
    for (int i = 0; i < 10; ++i) t[i] = i * i;
    return t;
}

constexpr auto squares = make_squares();
static_assert(squares[5] == 25);

int main() {
    std::cout << squares[7] << "\n";
}`,
  why: String.raw`A constexpr function fills the table during compilation, so the program only reads precomputed values at run time. The static_assert proves a table entry at build time.` },

// ---------- Medium ----------
{ n: 9, d: "medium", t: "Arena allocation with alignment", idiom: "Allocation avoidance",
  p: String.raw`Write class Arena that owns a 256-byte aligned buffer and a used count. Its allocate function takes a size and an alignment, rounds the current position up to the alignment, reserves the requested bytes, and returns the address. Allocate one int, then one double, from an Arena. Store 3 in the int and 2.5 in the double. Print the int, a space, the double, a space, then the number of bytes used, then a newline.`,
  ex: String.raw`3 2.5 16`,
  code: String.raw`#include <cstddef>
#include <iostream>
#include <new>

class Arena {
    alignas(std::max_align_t) unsigned char buf_[256];
    std::size_t used_ = 0;
public:
    void* allocate(std::size_t n, std::size_t align) {
        std::size_t p = (used_ + align - 1) / align * align;
        if (p + n > sizeof buf_) throw std::bad_alloc();
        used_ = p + n;
        return buf_ + p;
    }
    std::size_t used() const { return used_; }
};

int main() {
    Arena a;
    int* x = static_cast<int*>(a.allocate(sizeof(int), alignof(int)));
    double* y = static_cast<double*>(a.allocate(sizeof(double), alignof(double)));
    *x = 3;
    *y = 2.5;
    std::cout << *x << " " << *y << " " << a.used() << "\n";
}`,
  why: String.raw`A bump allocator hands out memory by moving one pointer forward, which costs almost nothing. Rounding up to each object's alignment keeps every object correctly aligned, at the cost of some padding.` },

{ n: 10, d: "medium", t: "Clearing keeps the buffer", idiom: "Allocation avoidance",
  p: String.raw`Fill a vector of ints with 100 values. Record its capacity. Clear the vector, push one value, and print 1 if the capacity is unchanged or 0 otherwise, then a space, then the size of the vector, then a newline.`,
  ex: String.raw`1 1`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v;
    for (int i = 0; i < 100; ++i) v.push_back(i);
    std::size_t cap = v.capacity();
    v.clear();
    v.push_back(7);
    std::cout << (v.capacity() == cap ? 1 : 0) << " " << v.size() << "\n";
}`,
  why: String.raw`Clearing a vector destroys its elements but keeps the storage. Reusing a vector across iterations therefore avoids paying for the allocation again.` },

{ n: 11, d: "medium", t: "Move a container of counted objects", idiom: "Moves and copies",
  p: String.raw`Define Counted with static counters copies and moves, as before. Define make as a function returning a new Counted by value. In main, write Counted c equal to make(), then print copies, a space, then moves, then a newline.`,
  ex: String.raw`copies 0 moves 0`,
  code: String.raw`#include <iostream>

struct Counted {
    static inline int copies = 0, moves = 0;
    Counted() = default;
    Counted(const Counted&) { ++copies; }
    Counted(Counted&&) noexcept { ++moves; }
};

Counted make() { return Counted(); }

int main() {
    Counted c = make();
    (void)c;
    std::cout << "copies " << Counted::copies << " moves " << Counted::moves << "\n";
}`,
  why: String.raw`Returning a temporary and initialising a variable from it lets the compiler build the object directly in its final place. Neither a copy nor a move is needed at all.` },

{ n: 12, d: "medium", t: "Reallocation moves elements unless space is reserved", idiom: "Moves and copies",
  p: String.raw`Define Item with an int v, an explicit constructor from int, a noexcept move constructor that increments a static counter moves, and a copy constructor. Create an empty vector of Item and emplace three items with values 0 to 2. Print moves without reserve, a space, and the count. Reset the counter. Create another empty vector, reserve room for three items, emplace the same three values, and print moves with reserve, a space, and that count, then a newline.`,
  ex: String.raw`moves without reserve 3
moves with reserve 0`,
  code: String.raw`#include <iostream>
#include <vector>

struct Item {
    static inline int moves = 0;
    int v;
    explicit Item(int x) : v(x) {}
    Item(Item&& o) noexcept : v(o.v) { ++moves; }
    Item(const Item& o) : v(o.v) {}
};

int main() {
    std::vector<Item> v;
    for (int i = 0; i < 3; ++i) v.emplace_back(i);
    std::cout << "moves without reserve " << Item::moves << "\n";
    Item::moves = 0;
    std::vector<Item> w;
    w.reserve(3);
    for (int i = 0; i < 3; ++i) w.emplace_back(i);
    std::cout << "moves with reserve " << Item::moves << "\n";
}`,
  why: String.raw`When a vector grows past its capacity it moves the existing elements into a larger buffer. A noexcept move makes that the cheap path, and reserving the final size avoids growth entirely.` },

{ n: 13, d: "medium", t: "Moving a vector keeps its buffer", idiom: "Moves and copies",
  p: String.raw`Create a vector of unique_ptr to int with one element holding 9. Record the address of that pointed-to int. Move the vector into a second vector. Print 1 if the second vector's element points to the recorded address or 0 otherwise, then a space, then the value it holds, then a space, then 1 if the first vector is empty or 0 otherwise, then a newline.`,
  ex: String.raw`1 9 1`,
  code: String.raw`#include <iostream>
#include <memory>
#include <utility>
#include <vector>

int main() {
    std::vector<std::unique_ptr<int>> a;
    a.push_back(std::make_unique<int>(9));
    int* addr = a[0].get();
    std::vector<std::unique_ptr<int>> b = std::move(a);
    std::cout << (b[0].get() == addr ? 1 : 0) << " " << *b[0] << " " << (a.empty() ? 1 : 0) << "\n";
}`,
  why: String.raw`Moving a vector transfers its buffer pointer, so the elements stay where they were. No element is copied, and the source is left empty.` },

{ n: 14, d: "medium", t: "Branch-free counting with a sum", idiom: "Branch behaviour",
  p: String.raw`Given the ints 12, 55, 49, 50, 3, 99 and 48 in an array, count how many are less than 50 by adding a comparison result to a counter for each element, with no if statement. Print the count, then a newline.`,
  ex: String.raw`4`,
  code: String.raw`#include <iostream>

int main() {
    int data[] = {12, 55, 49, 50, 3, 99, 48};
    int count = 0;
    for (int x : data) count += (x < 50);
    std::cout << count << "\n";
}`,
  why: String.raw`A comparison produces zero or one, which can be added directly. The loop has no unpredictable branch, so its speed does not depend on the pattern of the data.` },

{ n: 15, d: "medium", t: "Sum order does not change the total", idiom: "Branch behaviour",
  p: String.raw`Fill a vector of 1000 values using a simple linear congruential sequence starting from seed 12345, where each value is the bits 16 to 23 of the new state. Compute the sum of the values that are at least 128, in the original order. Then sort a copy and compute the same sum over the copy. Print same if the two sums match or differ otherwise, then a newline.`,
  ex: String.raw`same`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    std::vector<int> v(1000);
    unsigned s = 12345;
    for (auto& x : v) {
        s = s * 1103515245u + 12345u;
        x = (s >> 16) & 255;
    }
    long long sum_unsorted = 0, sum_sorted = 0;
    for (int x : v)
        if (x >= 128) sum_unsorted += x;
    std::vector<int> w = v;
    std::sort(w.begin(), w.end());
    for (int x : w)
        if (x >= 128) sum_sorted += x;
    std::cout << (sum_unsorted == sum_sorted ? "same" : "differ") << "\n";
}`,
  why: String.raw`Sorting the data makes the branch on each value predictable, which is why it is faster on real hardware. The total is the same in either order, so the speed change does not affect the answer.` },

{ n: 16, d: "medium", t: "Subtract a difference without losing precision", idiom: "Numerical traps",
  p: String.raw`Add 0.1 to a double total ten times, starting from zero, and compare the result with 1.0. Then sum the same ten values with Kahan compensated summation, where a separate correction variable is carried through each addition. Compare that result with 1.0. Print 1 if the naive total equals 1.0 or 0 otherwise, then a space, then 1 if the compensated total equals 1.0 or 0 otherwise, then a newline.`,
  ex: String.raw`0 1`,
  code: String.raw`#include <iostream>

int main() {
    double naive = 0.0;
    for (int i = 0; i < 10; ++i) naive += 0.1;
    double sum = 0.0, c = 0.0;
    for (int i = 0; i < 10; ++i) {
        double y = 0.1 - c;
        double t = sum + y;
        c = (t - sum) - y;
        sum = t;
    }
    std::cout << (naive == 1.0 ? 1 : 0) << " " << (sum == 1.0 ? 1 : 0) << "\n";
}`,
  why: String.raw`Each addition of 0.1 rounds, and the rounding errors add up. Kahan summation records the part of each sum that was lost and feeds it back into the next addition, which keeps the error small.` },

{ n: 17, d: "medium", t: "NaN compares unequal to itself", idiom: "Numerical traps",
  p: String.raw`Create a quiet NaN double. Print 1 if it equals itself, or 0 otherwise, then a space, then 1 if the standard library says it is NaN, or 0 otherwise, then a newline.`,
  ex: String.raw`0 1`,
  code: String.raw`#include <cmath>
#include <iostream>
#include <limits>

int main() {
    double nan = std::numeric_limits<double>::quiet_NaN();
    std::cout << (nan == nan ? 1 : 0) << " " << (std::isnan(nan) ? 1 : 0) << "\n";
}`,
  why: String.raw`IEEE 754 defines NaN as unequal to every value, including itself. Checks for NaN must use a test made for that purpose, because an equality test silently fails.` },

{ n: 18, d: "medium", t: "Bit masks extract a bit field", idiom: "Bit tricks",
  p: String.raw`Test whether each of the unsigned values 1, 6, 8 and 0 is a power of two, using a bit test on x and x minus one. Print each answer as 1 or 0, followed by a space, on one line, then a newline.`,
  ex: String.raw`1 0 1 0 `,
  code: String.raw`#include <iostream>

bool is_pow2(unsigned x) {
    return x && !(x & (x - 1));
}

int main() {
    unsigned xs[] = {1, 6, 8, 0};
    for (unsigned x : xs) std::cout << is_pow2(x) << " ";
    std::cout << "\n";
}`,
  why: String.raw`A power of two has exactly one set bit, and subtracting one flips that bit and sets all the bits below it. Their AND is zero only for powers of two, and zero is excluded explicitly.` },

{ n: 19, d: "medium", t: "Trailing zeros and bit width", idiom: "Bit tricks",
  p: String.raw`For the unsigned value 40, print the number of trailing zero bits, then a space, then the number of bits needed to represent it, then a newline.`,
  ex: String.raw`3 6`,
  code: String.raw`#include <bit>
#include <iostream>

int main() {
    unsigned x = 40;
    std::cout << std::countr_zero(x) << " " << std::bit_width(x) << "\n";
}`,
  why: String.raw`Trailing zeros locate the lowest set bit, and bit width gives the position of the highest one. Both come from single instructions on common processors.` },

{ n: 20, d: "medium", t: "Order book matching against best bids", idiom: "Order book structures",
  p: String.raw`Keep bids in a map from price to quantity. Add 5 at 100, 10 at 101 and 7 at 99. Then sell 12 at price 100: match against the highest bids first, as long as the bid price is at least 100, and remove any price level that becomes empty. Print sold, a space, the amount sold, then best, a space, the highest remaining bid price, a space, qty, a space, the quantity at that price, a space, total, a space, and the sum of all remaining quantities, then a newline.`,
  ex: String.raw`sold 12 best 100 qty 3 total 10`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <iterator>
#include <map>

struct Book {
    std::map<int, int> bids;
    int sell(int price, int qty) {
        int sold = 0;
        while (qty > 0 && !bids.empty()) {
            auto it = std::prev(bids.end());
            if (it->first < price) break;
            int take = std::min(qty, it->second);
            it->second -= take;
            qty -= take;
            sold += take;
            if (it->second == 0) bids.erase(it);
        }
        return sold;
    }
};

int main() {
    Book book;
    book.bids[100] += 5;
    book.bids[101] += 10;
    book.bids[99] += 7;
    int sold = book.sell(100, 12);
    auto best = book.bids.rbegin();
    int total = 0;
    for (auto& [p, q] : book.bids) total += q;
    std::cout << "sold " << sold << " best " << best->first << " qty " << best->second << " total " << total << "\n";
}`,
  why: String.raw`Matching walks down from the best price while the incoming order is willing to trade. The map keeps each level's quantity, and levels that empty are removed so the best bid stays correct.` },

{ n: 21, d: "medium", t: "Sorted vector and ordered map agree on the best price", idiom: "Order book structures",
  p: String.raw`Insert the prices 100, 103, 99, 101 and 102 into a sorted vector using insertion at the right position, and into a std::map. Print agree followed by the best price if the highest element in both structures is the same, or disagree otherwise, then a newline.`,
  ex: String.raw`agree 103`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <map>
#include <vector>

int main() {
    std::vector<int> sorted;
    std::map<int, int> levels;
    for (int p : {100, 103, 99, 101, 102}) {
        auto pos = std::upper_bound(sorted.begin(), sorted.end(), p);
        sorted.insert(pos, p);
        levels[p] = 1;
    }
    bool same = sorted.back() == levels.rbegin()->first;
    std::cout << (same ? "agree " : "disagree ") << sorted.back() << "\n";
}`,
  why: String.raw`A sorted vector keeps its maximum at the end, and a map keeps its maximum at the last node. Both give the same answer, but the vector pays for each insert with shifting, while the map pays with allocation and pointer chasing.` },

{ n: 22, d: "medium", t: "Repeatable pseudo-random streams", idiom: "Welford and reproducible Monte Carlo",
  p: String.raw`Write a 64-bit linear congruential generator with multiplier 6364136223846793005, increment 1442695040888963407, and output the top 32 bits of the state, shifted right by 33. Write run(seed), which creates a generator from the seed, draws 1000 values, and returns the sum of each value modulo 1000. Print same if run(42) equals run(42), or differ otherwise, then a space, then same if run(42) equals run(43), or differ otherwise, then a newline.`,
  ex: String.raw`same differ`,
  code: String.raw`#include <cstdint>
#include <iostream>

class Lcg {
    std::uint64_t s_;
public:
    explicit Lcg(std::uint64_t seed) : s_(seed) {}
    std::uint32_t next() {
        s_ = s_ * 6364136223846793005ULL + 1442695040888963407ULL;
        return static_cast<std::uint32_t>(s_ >> 33);
    }
};

long long run(std::uint64_t seed) {
    Lcg g(seed);
    long long sum = 0;
    for (int i = 0; i < 1000; ++i) sum += g.next() % 1000;
    return sum;
}

int main() {
    std::cout << (run(42) == run(42) ? "same" : "differ") << " "
              << (run(42) == run(43) ? "same" : "differ") << "\n";
}`,
  why: String.raw`A seeded generator produces the same sequence every time, which makes a simulation repeatable and debuggable. Different seeds give different sequences, so the second comparison differs.` },

{ n: 23, d: "medium", t: "Mean and variance with a large offset", idiom: "Welford and reproducible Monte Carlo",
  p: String.raw`Use the values 1000000004, 1000000007, 1000000013 and 1000000016. Compute their mean and population variance in a single pass with a running mean and a running sum of squared deviations, using doubles. Print the mean with one decimal place, a space, the variance with one decimal place, then a newline.`,
  ex: String.raw`1000000010.0 22.5`,
  code: String.raw`#include <iomanip>
#include <iostream>

int main() {
    double data[] = {1000000004.0, 1000000007.0, 1000000013.0, 1000000016.0};
    double mean = 0, m2 = 0;
    int n = 0;
    for (double x : data) {
        ++n;
        double delta = x - mean;
        mean += delta / n;
        m2 += delta * (x - mean);
    }
    std::cout << std::fixed << std::setprecision(1) << mean << " " << m2 / n << "\n";
}`,
  why: String.raw`Updating the mean from deviations keeps the arithmetic on small differences, not on the large values. The running method is the one that stays accurate when the data sit far from zero.` },

{ n: 24, d: "medium", t: "Fixed-point table of population counts", idiom: "Compile-time tables and measurement",
  p: String.raw`Build at compile time a table of 256 bytes, where entry i is the number of 1 bits in i. Print entry 255, a space, then entry 10, then a newline.`,
  ex: String.raw`8 2`,
  code: String.raw`#include <array>
#include <iostream>

constexpr std::array<unsigned char, 256> make_pop() {
    std::array<unsigned char, 256> t{};
    for (int i = 1; i < 256; ++i)
        t[i] = static_cast<unsigned char>(t[i / 2] + (i & 1));
    return t;
}

constexpr auto kPop = make_pop();

int main() {
    std::cout << static_cast<int>(kPop[255]) << " " << static_cast<int>(kPop[0b1010]) << "\n";
}`,
  why: String.raw`Each entry is built from an earlier one: the count for i is the count for i divided by two, plus the low bit. Computing the table during compilation leaves nothing to do at run time.` },

{ n: 25, d: "medium", t: "Check that repeated runs agree", idiom: "Compile-time tables and measurement",
  p: String.raw`Write a function work that returns the sum of the integers from 1 to 1000. Compute the reference value once. Then run work three times, counting how many results equal the reference. Print checksum, a space, the reference, a space, runs, a space, the count, a space, then ok, then a newline.`,
  ex: String.raw`checksum 500500 runs 3 ok`,
  code: String.raw`#include <iostream>

long long work() {
    long long s = 0;
    for (int i = 1; i <= 1000; ++i) s += i;
    return s;
}

int main() {
    long long ref = work();
    int ok = 0;
    for (int run = 0; run < 3; ++run)
        if (work() == ref) ++ok;
    std::cout << "checksum " << ref << " runs " << ok << " ok\n";
}`,
  why: String.raw`A benchmark that runs the same work repeatedly must check each result. A wrong answer that is fast is not a measurement of the right code, so the check comes before any timing.` },

{ n: 26, d: "hard", t: "Free list that reuses nodes without allocating", idiom: "Allocation avoidance",
  p: String.raw`Define Node with an int value and a Node pointer next. Write class Pool that owns a vector of three Node objects, and links them into a free list. acquire returns the first free node and removes it from the list. release puts a node back at the front. Acquire two nodes a and b, release a, then acquire again into c. Print reused, a space, 1 if c is the same as a or 0 otherwise, then a space, then distinct, a space, and 1 if b is different from a or 0 otherwise, then a newline.`,
  ex: String.raw`reused 1 distinct 1`,
  code: String.raw`#include <cstddef>
#include <iostream>
#include <vector>

struct Node {
    int value;
    Node* next;
};

class Pool {
    std::vector<Node> storage_;
    Node* free_ = nullptr;
public:
    explicit Pool(std::size_t n) : storage_(n) {
        for (auto& node : storage_) {
            node.next = free_;
            free_ = &node;
        }
    }
    Node* acquire() {
        Node* n = free_;
        if (n) free_ = n->next;
        return n;
    }
    void release(Node* n) {
        n->next = free_;
        free_ = n;
    }
};

int main() {
    Pool pool(3);
    Node* a = pool.acquire();
    Node* b = pool.acquire();
    pool.release(a);
    Node* c = pool.acquire();
    std::cout << "reused " << (c == a ? 1 : 0) << " distinct " << (b != a ? 1 : 0) << "\n";
}`,
  why: String.raw`A pool hands out nodes that already exist, so the allocator is never called after construction. Its storage never resizes, which keeps every node address stable while it is in use.` },

{ n: 27, d: "hard", t: "Move a vector of counted objects without element moves", idiom: "Moves and copies",
  p: String.raw`Define Counted with static counters copies and moves, and a move constructor that increments moves. Create a vector of Counted with capacity reserved for two elements, and emplace two objects. Move the vector into a new vector. Print copies, a space, moves, a space, and the size of the new vector, then a newline. Moves should be counted only from the vector operations themselves.`,
  ex: String.raw`copies 0 moves 0 2`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

struct Counted {
    static inline int copies = 0, moves = 0;
    Counted() = default;
    Counted(const Counted&) { ++copies; }
    Counted(Counted&&) noexcept { ++moves; }
};

int main() {
    std::vector<Counted> a;
    a.reserve(2);
    a.emplace_back();
    a.emplace_back();
    Counted::moves = 0;
    std::vector<Counted> b = std::move(a);
    std::cout << "copies " << Counted::copies << " moves " << Counted::moves << " " << b.size() << "\n";
}`,
  why: String.raw`Moving a vector hands over its buffer, so none of the elements are touched. Only element-wise operations such as growth or copying would cause copies or moves.` },

{ n: 28, d: "hard", t: "Table lookup instead of a branch chain", idiom: "Branch behaviour",
  p: String.raw`Build at compile time a table of 256 booleans that is true for the lowercase vowels a, e, i, o and u. Count how many characters of the string performance are vowels by looking each character up in the table, with no if or switch statement in the loop. Print the count, then a newline.`,
  ex: String.raw`4`,
  code: String.raw`#include <array>
#include <initializer_list>
#include <iostream>
#include <string_view>

constexpr std::array<bool, 256> make_vowels() {
    std::array<bool, 256> t{};
    for (char c : {'a', 'e', 'i', 'o', 'u'})
        t[static_cast<unsigned char>(c)] = true;
    return t;
}

constexpr auto kVowel = make_vowels();

int main() {
    std::string_view s = "performance";
    int count = 0;
    for (char c : s)
        count += kVowel[static_cast<unsigned char>(c)];
    std::cout << count << "\n";
}`,
  why: String.raw`A table turns a chain of comparisons into one memory read per character. The loop has no branch that depends on the data, so its speed stays steady on any input.` },

{ n: 29, d: "hard", t: "Midpoint of large ints without overflow", idiom: "Numerical traps",
  p: String.raw`Let lo be 2000000000 and hi be 2100000000, both ints. Compute their midpoint in a way that never forms lo plus hi, using an int. Print the midpoint, then a space, then 1 if it equals the midpoint computed in a long long from the true sum, or 0 otherwise, then a newline.`,
  ex: String.raw`2050000000 1`,
  code: String.raw`#include <iostream>

int main() {
    int lo = 2000000000, hi = 2100000000;
    int mid = lo + (hi - lo) / 2;
    long long check = (static_cast<long long>(lo) + hi) / 2;
    std::cout << mid << " " << (mid == check ? 1 : 0) << "\n";
}`,
  why: String.raw`The sum of two large ints can be larger than int can hold, and signed overflow is undefined. Adding half of the difference keeps every intermediate value within range.` },

{ n: 30, d: "hard", t: "Pack and unpack three colour channels", idiom: "Bit tricks",
  p: String.raw`Pack the red value 5, green value 200 and blue value 17 into one 32-bit unsigned integer, with red in bits 16 to 23, green in bits 8 to 15 and blue in bits 0 to 7. Print the packed value, then a space, then the three channels read back in the same order, separated by spaces, then a newline.`,
  ex: String.raw`378897 5 200 17`,
  code: String.raw`#include <cstdint>
#include <iostream>

std::uint32_t pack(std::uint32_t r, std::uint32_t g, std::uint32_t b) {
    return (r << 16) | (g << 8) | b;
}

int main() {
    std::uint32_t p = pack(5, 200, 17);
    std::cout << p << " " << ((p >> 16) & 0xFF) << " " << ((p >> 8) & 0xFF) << " " << (p & 0xFF) << "\n";
}`,
  why: String.raw`Each channel occupies its own eight-bit field. Shifting moves a field into position, and masking with 0xFF reads it back out without touching its neighbours.` },

{ n: 31, d: "hard", t: "Ring buffer of recent prices", idiom: "Order book structures",
  p: String.raw`Write class Ring that holds up to four int prices in a fixed array, overwriting the oldest when full. push adds a price. at_recent(k) returns the k-th most recent price, where k is zero for the newest. size returns how many prices are stored. Push the prices 100, 101, 103, 102, 104 and 105 in that order. Print the three most recent prices, separated by spaces, then a newline, then the size.`,
  ex: String.raw`105 104 102
4`,
  code: String.raw`#include <array>
#include <cstddef>
#include <initializer_list>
#include <iostream>

class Ring {
    std::array<int, 4> buf_{};
    std::size_t head_ = 0, size_ = 0;
public:
    void push(int v) {
        buf_[head_] = v;
        head_ = (head_ + 1) % buf_.size();
        if (size_ < buf_.size()) ++size_;
    }
    int at_recent(std::size_t k) const {
        return buf_[(head_ + buf_.size() - 1 - k) % buf_.size()];
    }
    std::size_t size() const { return size_; }
};

int main() {
    Ring r;
    for (int p : {100, 101, 103, 102, 104, 105}) r.push(p);
    for (std::size_t k = 0; k < 3; ++k)
        std::cout << r.at_recent(k) << (k < 2 ? " " : "\n");
    std::cout << r.size() << "\n";
}`,
  why: String.raw`A fixed-size ring keeps the latest window of data with no allocation and no shifting. Walking backwards from the write position recovers the newest entries in order.` },

{ n: 32, d: "hard", t: "Parallel Monte Carlo matches the sequential run", idiom: "Welford and reproducible Monte Carlo",
  p: String.raw`Use a 64-bit linear congruential generator with multiplier 6364136223846793005, increment 1442695040888963407, and output the top 32 bits of the state shifted right by 33. Write run(seed), which draws 1000 values and returns the sum of each value modulo 1000. Sequentially compute run(1) plus run(2) plus run(3) plus run(4). Then run the same four seeds, one per thread, storing each result in its own slot, and add the slots in order. Print match if the two totals are equal or mismatch otherwise, then a newline.`,
  ex: String.raw`match`,
  code: String.raw`#include <cstdint>
#include <iostream>
#include <thread>
#include <vector>

class Lcg {
    std::uint64_t s_;
public:
    explicit Lcg(std::uint64_t seed) : s_(seed) {}
    std::uint32_t next() {
        s_ = s_ * 6364136223846793005ULL + 1442695040888963407ULL;
        return static_cast<std::uint32_t>(s_ >> 33);
    }
};

long long run(std::uint64_t seed) {
    Lcg g(seed);
    long long sum = 0;
    for (int i = 0; i < 1000; ++i) sum += g.next() % 1000;
    return sum;
}

int main() {
    long long seq = run(1) + run(2) + run(3) + run(4);
    std::vector<long long> parts(4, 0);
    std::vector<std::thread> ts;
    for (int t = 0; t < 4; ++t)
        ts.emplace_back([&parts, t] { parts[t] = run(t + 1); });
    for (auto& th : ts) th.join();
    long long par = 0;
    for (long long p : parts) par += p;
    std::cout << (par == seq ? "match" : "mismatch") << "\n";
}`,
  why: String.raw`Giving each thread its own seed and its own result slot makes the parallel work independent of scheduling. Combining the slots in a fixed order gives the same total as the sequential run.` },

{ n: 33, d: "hard", t: "Keep a loop's result alive with a volatile sink", idiom: "Compile-time tables and measurement",
  p: String.raw`Write a loop that adds the integers 0 to 999 into a volatile long long named sink, so the compiler cannot discard the work. After the loop, print sink, then a space, then 1 if sink equals 999 times 1000 divided by 2, or 0 otherwise, then a newline.`,
  ex: String.raw`499500 1`,
  code: String.raw`#include <iostream>

int main() {
    volatile long long sink = 0;
    for (int i = 0; i < 1000; ++i)
        sink = sink + i;
    long long v = sink;
    std::cout << v << " " << (v == 999LL * 1000 / 2 ? 1 : 0) << "\n";
}`,
  why: String.raw`An optimiser may remove a computation whose result is never used, which would make a benchmark measure nothing. Storing into a volatile object forces each update to happen, and checking the value against a formula confirms the work was done correctly.` },

// ---------- Extension ----------
{ n: 34, d: "extension", t: "Small inline buffer that spills to the heap", idiom: "Small-buffer optimisation",
  p: String.raw`Write class SmallVec that stores up to four ints inside the object. When a fifth int is pushed, it moves all its contents to a std::vector on the heap. Provide push, is_inline, get and sum. Push 1 to 4, then record is_inline. Push 5 and 6, then record is_inline again. Print inline, a space, the first flag, a space, inline, a space, the second flag, a space, sum, a space, and the sum of all six values, then a newline.`,
  ex: String.raw`inline 1 inline 0 sum 21`,
  code: String.raw`#include <iostream>
#include <vector>

class SmallVec {
    int inline_[4] = {0, 0, 0, 0};
    int n_ = 0;
    bool spilled_ = false;
    std::vector<int> heap_;
public:
    void push(int v) {
        if (!spilled_ && n_ < 4) {
            inline_[n_++] = v;
            return;
        }
        if (!spilled_) {
            heap_.assign(inline_, inline_ + n_);
            spilled_ = true;
        }
        heap_.push_back(v);
        ++n_;
    }
    bool is_inline() const { return !spilled_; }
    int get(int i) const { return spilled_ ? heap_[i] : inline_[i]; }
    long long sum() const {
        long long s = 0;
        for (int i = 0; i < n_; ++i) s += get(i);
        return s;
    }
};

int main() {
    SmallVec v;
    for (int i = 1; i <= 4; ++i) v.push(i);
    bool a = v.is_inline();
    v.push(5);
    v.push(6);
    bool b = v.is_inline();
    std::cout << "inline " << a << " inline " << b << " sum " << v.sum() << "\n";
}`,
  why: String.raw`Small inline storage avoids a heap allocation for the common small case. The object only pays for the allocation once it outgrows the inline slots, and the spill copies the existing values across.` },

{ n: 35, d: "extension", t: "Look up strings without building a key", idiom: "Transparent lookup",
  p: String.raw`Create a std::map from std::string to int, using the transparent comparator std::less with no template argument, and insert apple with 3, banana with 0 and pear with 7. Keep three queries as std::string_view values: pear, kiwi and apple. Count how many queries are found using find with the string_view directly, without constructing a std::string for each query. Print found, a space, and the count, then a newline.`,
  ex: String.raw`found 2`,
  code: String.raw`#include <iostream>
#include <map>
#include <string>
#include <string_view>
#include <vector>

int main() {
    std::map<std::string, int, std::less<>> stock{{"apple", 3}, {"banana", 0}, {"pear", 7}};
    std::vector<std::string_view> queries{"pear", "kiwi", "apple"};
    int found = 0;
    for (auto q : queries)
        if (stock.find(q) != stock.end()) ++found;
    std::cout << "found " << found << "\n";
}`,
  why: String.raw`A transparent comparator lets a map compare keys of a different type. A string_view query is compared directly with the stored strings, so the lookup builds no temporary string.` },

{ n: 36, d: "extension", t: "Count temporaries when pushing versus emplacing", idiom: "Emplacement",
  p: String.raw`Define Thing with an int constructor and a noexcept move constructor. Both constructors increment a static counter called made. Reset made to zero, push Thing(3) into an empty vector, and record made. Reset made again, emplace 3 into a second empty vector, and print push, a space, the recorded count, a space, emplace, a space, the second count, then a newline.`,
  ex: String.raw`push 2 emplace 1`,
  code: String.raw`#include <iostream>
#include <vector>

struct Thing {
    static inline int made = 0;
    int v;
    Thing(int x) : v(x) { ++made; }
    Thing(Thing&& o) noexcept : v(o.v) { ++made; }
};

int main() {
    Thing::made = 0;
    std::vector<Thing> a;
    a.push_back(Thing(3));
    int push_count = Thing::made;
    Thing::made = 0;
    std::vector<Thing> b;
    b.emplace_back(3);
    std::cout << "push " << push_count << " emplace " << Thing::made << "\n";
}`,
  why: String.raw`push_back of a temporary builds the object once, then moves it into the vector. emplace_back forwards the arguments and builds the object directly in the vector's storage, so no move is needed.` },

{ n: 37, d: "extension", t: "Float addition is not associative", idiom: "Floating-point association",
  p: String.raw`Let a be the float 1e8. Compute x as a plus 1.0f minus a, grouping the operations left to right. Compute y as a minus a plus 1.0f. Print x, a space, and y, then a newline.`,
  ex: String.raw`0 1`,
  code: String.raw`#include <iostream>

int main() {
    float a = 1e8f;
    float x = (a + 1.0f) - a;
    float y = (a - a) + 1.0f;
    std::cout << x << " " << y << "\n";
}`,
  why: String.raw`A float near 1e8 has a spacing of eight between representable values, so adding one rounds back to a. Changing the grouping changes which operations round, so the two results differ.` },

{ n: 38, d: "extension", t: "Integer division and modulo with negative values", idiom: "Integer division",
  p: String.raw`Write floor_div(a, b) that returns the quotient rounded toward negative infinity for ints. Print -7 divided by 2 using the built-in division, a space, -7 modulo 2 using the built-in operator, a space, and floor_div(-7, 2), then a newline.`,
  ex: String.raw`-3 -1 -4`,
  code: String.raw`#include <iostream>

int floor_div(int a, int b) {
    int q = a / b;
    if ((a % b != 0) && ((a < 0) != (b < 0))) --q;
    return q;
}

int main() {
    std::cout << -7 / 2 << " " << -7 % 2 << " " << floor_div(-7, 2) << "\n";
}`,
  why: String.raw`C++ integer division truncates toward zero, so the remainder takes the sign of the dividend. Rounding toward negative infinity needs a correction when the signs differ and the division was inexact.` },

{ n: 39, d: "extension", t: "Compare floats with a relative tolerance", idiom: "Approximate comparison",
  p: String.raw`Write approx_equal(a, b) for doubles, which returns true when the absolute difference is at most 1e-9 times the larger of the two magnitudes. Set a to 0.1 plus 0.2 and b to 0.3. Print 1 if a equals b exactly or 0 otherwise, then a space, then 1 if approx_equal says they are close or 0 otherwise, then a newline.`,
  ex: String.raw`0 1`,
  code: String.raw`#include <algorithm>
#include <cmath>
#include <iostream>

bool approx_equal(double a, double b, double rel = 1e-9) {
    return std::fabs(a - b) <= rel * std::max(std::fabs(a), std::fabs(b));
}

int main() {
    double a = 0.1 + 0.2, b = 0.3;
    std::cout << (a == b ? 1 : 0) << " " << (approx_equal(a, b) ? 1 : 0) << "\n";
}`,
  why: String.raw`Binary floats cannot store 0.1 or 0.3 exactly, so their sums differ in the last bits. A tolerance scaled to the magnitude of the values accepts that difference without accepting real errors.` },

{ n: 40, d: "extension", t: "Visit each set bit with clear-lowest", idiom: "Bit iteration",
  p: String.raw`Let x be the unsigned value 0b10110100. Repeatedly do the following while x is nonzero: print the position of its lowest set bit, followed by a space, then clear that lowest set bit. Print a newline at the end.`,
  ex: String.raw`2 4 5 7 `,
  code: String.raw`#include <bit>
#include <iostream>

int main() {
    unsigned x = 0b10110100;
    while (x) {
        std::cout << std::countr_zero(x) << " ";
        x &= x - 1;
    }
    std::cout << "\n";
}`,
  why: String.raw`Subtracting one from a number flips its lowest set bit and every bit below it. Anding the two clears exactly the lowest set bit, so the loop runs once per set bit and nothing else.` },

{ n: 41, d: "extension", t: "Rotate bits without shifting out", idiom: "Rotations",
  p: String.raw`Rotate the unsigned value 0x80000001 left by one bit, and the unsigned value 1 right by one bit, using the standard rotation functions. Print the first result in hexadecimal, a space, then the second in hexadecimal, then a newline.`,
  ex: String.raw`3 80000000`,
  code: String.raw`#include <bit>
#include <iostream>

int main() {
    std::cout << std::hex << std::rotl(0x80000001u, 1) << " " << std::rotr(1u, 1) << "\n";
}`,
  why: String.raw`A rotation moves bits that fall off one end back in at the other. Unlike a shift, it loses no bits, which is useful in hashing and in random-number generators.` },

{ n: 42, d: "extension", t: "Cancel an order by id from both indexes", idiom: "Order book cancellation",
  p: String.raw`Write class Book with a map from price to total quantity, and a map from order id to a struct holding its price and quantity. add(id, price, qty) records the order in both maps. cancel(id) removes the order from both, reduces its price level, and removes the level if it reaches zero. level(price) returns the quantity at a price, and total returns the sum of all quantities. Add order 1 for 5 at 100, order 2 for 3 at 100, and order 3 for 4 at 99. Cancel order 2. Print level, a space, 100, a space, the quantity at 100, a space, total, a space, and the total quantity, then a newline.`,
  ex: String.raw`level 100 qty 5 total 9`,
  code: String.raw`#include <iostream>
#include <map>

struct Order {
    int price;
    int qty;
};

class Book {
    std::map<int, int> levels_;
    std::map<int, Order> orders_;
public:
    void add(int id, int price, int qty) {
        orders_[id] = {price, qty};
        levels_[price] += qty;
    }
    void cancel(int id) {
        auto it = orders_.find(id);
        if (it == orders_.end()) return;
        int price = it->second.price;
        levels_[price] -= it->second.qty;
        if (levels_[price] == 0) levels_.erase(price);
        orders_.erase(it);
    }
    int level(int price) const {
        auto it = levels_.find(price);
        return it == levels_.end() ? 0 : it->second;
    }
    int total() const {
        int t = 0;
        for (auto& [p, q] : levels_) t += q;
        return t;
    }
};

int main() {
    Book b;
    b.add(1, 100, 5);
    b.add(2, 100, 3);
    b.add(3, 99, 4);
    b.cancel(2);
    std::cout << "level 100 qty " << b.level(100) << " total " << b.total() << "\n";
}`,
  why: String.raw`Cancelling needs to find an order by id and to update the level it belongs to. Keeping an index by id alongside the price levels makes both steps direct, instead of searching the whole book.` },

{ n: 43, d: "extension", t: "Merge two running statistics summaries", idiom: "Parallel Welford merge",
  p: String.raw`Define Stats with a count n, a mean and a sum of squared deviations m2, and an add(x) method using a running update. Define a static merge(a, b) that combines two summaries using the standard parallel formula: the combined mean, and m2 equal to the sum of both m2 values plus the squared difference of the means times the product of the counts divided by the total count. Feed 1, 2 and 3 into one Stats, and 10 and 20 into another. Also feed all five values into a third Stats in order. Merge the first two. Print the merged mean with one decimal place, a space, then 1 if the merged m2 is within 1e-9 of the single-pass m2, or 0 otherwise, then a newline.`,
  ex: String.raw`7.2 1`,
  code: String.raw`#include <cmath>
#include <iomanip>
#include <iostream>

struct Stats {
    double n = 0, mean = 0, m2 = 0;
    void add(double x) {
        n += 1;
        double d = x - mean;
        mean += d / n;
        m2 += d * (x - mean);
    }
    static Stats merge(const Stats& a, const Stats& b) {
        Stats r;
        r.n = a.n + b.n;
        double d = b.mean - a.mean;
        r.mean = a.mean + d * b.n / r.n;
        r.m2 = a.m2 + b.m2 + d * d * a.n * b.n / r.n;
        return r;
    }
};

int main() {
    Stats a, b, all;
    for (double x : {1.0, 2.0, 3.0}) {
        a.add(x);
        all.add(x);
    }
    for (double x : {10.0, 20.0}) {
        b.add(x);
        all.add(x);
    }
    Stats m = Stats::merge(a, b);
    std::cout << std::fixed << std::setprecision(1) << m.mean << " "
              << (std::fabs(m.m2 - all.m2) < 1e-9 ? 1 : 0) << "\n";
}`,
  why: String.raw`Two summaries can be combined without revisiting the data, which is what lets each thread compute its own statistics and merge them at the end. The correction term accounts for the spread between the two group means.` },

{ n: 44, d: "extension", t: "Prime count from a compile-time sieve", idiom: "Compile-time sieve",
  p: String.raw`At compile time, build a table of booleans for the numbers 0 to 50 that marks primes using the sieve of Eratosthenes. At compile time, count the primes in that table and check that the count is 15. At run time, find the largest prime up to 50 from the table. Print the count, a space, and the largest prime, then a newline.`,
  ex: String.raw`15 47`,
  code: String.raw`#include <array>
#include <iostream>

constexpr std::array<bool, 51> sieve() {
    std::array<bool, 51> is{};
    for (int i = 2; i <= 50; ++i) is[i] = true;
    for (int i = 2; i * i <= 50; ++i) {
        if (is[i]) {
            for (int j = i * i; j <= 50; j += i) is[j] = false;
        }
    }
    return is;
}

constexpr auto kIsPrime = sieve();

constexpr int count_primes() {
    int c = 0;
    for (int i = 0; i <= 50; ++i) c += kIsPrime[i];
    return c;
}

static_assert(count_primes() == 15);

int main() {
    int last = 0;
    for (int i = 0; i <= 50; ++i)
        if (kIsPrime[i]) last = i;
    std::cout << count_primes() << " " << last << "\n";
}`,
  why: String.raw`A constexpr function runs during compilation, so the sieve and the count are fixed before the program starts. The static_assert turns a wrong table into a build error rather than a wrong answer.` },

{ n: 45, d: "extension", t: "Select between two values without a branch", idiom: "Branch-free select",
  p: String.raw`Write select(cond, a, b), where cond is 0 or 1, that returns a when cond is 1 and b when cond is 0, using only bitwise operations and arithmetic, with no if or conditional operator. Print select(1, 10, 20), a space, then select(0, 10, 20), then a newline.`,
  ex: String.raw`10 20`,
  code: String.raw`#include <iostream>

int select(int cond, int a, int b) {
    int mask = -cond;
    return b ^ ((a ^ b) & mask);
}

int main() {
    std::cout << select(1, 10, 20) << " " << select(0, 10, 20) << "\n";
}`,
  why: String.raw`Negating one gives a mask of all ones, and zero gives a mask of all zeros. The mask chooses whether the XOR of the two values is applied, so the selection happens without a jump.` },

{ n: 46, d: "applications", t: "Sum a field in two particle layouts", idiom: "Data layout",
  p: String.raw`Define ParticleAoS as a struct with float members x, y, vx and vy, and ParticlesSoA as a struct holding four vectors of float with the same names. Fill 100 particles in both layouts, with x equal to i and the others 0, 1 and 2, as appropriate, for i from 0 to 99. Sum all x values in each layout. Print the two sums separated by a space, then a newline.`,
  ex: String.raw`4950 4950`,
  code: String.raw`#include <iostream>
#include <vector>

struct ParticleAoS {
    float x, y, vx, vy;
};

struct ParticlesSoA {
    std::vector<float> x, y, vx, vy;
};

int main() {
    std::vector<ParticleAoS> aos;
    ParticlesSoA soa;
    for (int i = 0; i < 100; ++i) {
        float v = static_cast<float>(i);
        aos.push_back({v, 0, 1, 2});
        soa.x.push_back(v);
        soa.y.push_back(0);
        soa.vx.push_back(1);
        soa.vy.push_back(2);
    }
    float sa = 0, ss = 0;
    for (auto& p : aos) sa += p.x;
    for (float x : soa.x) ss += x;
    std::cout << sa << " " << ss << "\n";
}`,
  why: String.raw`An array of structs interleaves fields, while a struct of arrays keeps each field contiguous. A loop that reads only one field touches less memory in the second layout, and both layouts give the same answer.` },

{ n: 47, d: "applications", t: "Transpose a matrix block by block", idiom: "Cache blocking",
  p: String.raw`Create a 4 by 4 int matrix m with entry i times 4 plus j at row i, column j. Transpose it into a second matrix t, processing it in 2 by 2 blocks, so that t at row j, column i equals m at row i, column j. Print t at row 0 column 1, a space, then t at row 1 column 0, then a newline.`,
  ex: String.raw`4 1`,
  code: String.raw`#include <iostream>

int main() {
    const int N = 4, B = 2;
    int m[N][N], t[N][N];
    for (int i = 0; i < N; ++i)
        for (int j = 0; j < N; ++j)
            m[i][j] = i * N + j;
    for (int bi = 0; bi < N; bi += B)
        for (int bj = 0; bj < N; bj += B)
            for (int i = bi; i < bi + B; ++i)
                for (int j = bj; j < bj + B; ++j)
                    t[j][i] = m[i][j];
    std::cout << t[0][1] << " " << t[1][0] << "\n";
}`,
  why: String.raw`A plain transpose reads one matrix along rows and writes the other along columns, so one side always jumps through memory. Working in small blocks keeps both the reads and writes within a region that fits in cache.` },

{ n: 48, d: "applications", t: "Branchless lower bound on a sorted array", idiom: "Branchless search",
  p: String.raw`Write lower_bound_bl(first, n, key), which returns the index of the first element of a sorted int array that is at least key, using a loop that selects the next base with a conditional expression and never uses an early exit. Apply it to the array 1, 3, 5, 7, 9, 11, 13, 15 with key 10. Print the index, then a newline.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>

int lower_bound_bl(const int* first, int n, int key) {
    const int* base = first;
    while (n > 1) {
        int half = n / 2;
        base = (base[half] < key) ? base + half : base;
        n -= half;
    }
    return static_cast<int>(base - first) + (*base < key);
}

int main() {
    int a[] = {1, 3, 5, 7, 9, 11, 13, 15};
    std::cout << lower_bound_bl(a, 8, 10) << "\n";
}`,
  why: String.raw`A standard binary search branches on every comparison, and those branches are hard to predict. Selecting the next base with a conditional expression lets the compiler emit a select instead, and the loop always runs the same number of steps for a given size.` },

{ n: 49, d: "applications", t: "Parse numbers without allocating", idiom: "Parsing without allocation",
  p: String.raw`Using the text 12 345 -7 held in a string view, parse each whitespace-separated integer with the standard library's from-chars function, working directly on the characters without creating any strings. Print the sum of the three values, then a newline.`,
  ex: String.raw`350`,
  code: String.raw`#include <charconv>
#include <iostream>
#include <string_view>

int main() {
    std::string_view s = "12 345 -7";
    long long sum = 0;
    const char* p = s.data();
    const char* end = s.data() + s.size();
    while (p < end) {
        while (p < end && *p == ' ') ++p;
        if (p == end) break;
        int v = 0;
        auto [ptr, ec] = std::from_chars(p, end, v);
        if (ec != std::errc()) break;
        sum += v;
        p = ptr;
    }
    std::cout << sum << "\n";
}`,
  why: String.raw`from_chars reads digits straight from a buffer and reports where it stopped. It never allocates or locks a locale, which makes it much cheaper than stream extraction in hot parsing loops.` },

{ n: 50, d: "applications", t: "Store prices as integer ticks", idiom: "Fixed-point arithmetic",
  p: String.raw`Prices are stored as integer ticks of one hundredth. Three prices of 19.99 are held as 1999 ticks each, in an int64 vector. Sum the ticks. Print the whole part of the total, then a dot, then the two-digit fractional part, with a leading zero if it is below ten, then a newline.`,
  ex: String.raw`59.97`,
  code: String.raw`#include <cstdint>
#include <iostream>
#include <vector>

int main() {
    std::vector<std::int64_t> ticks{1999, 1999, 1999};
    std::int64_t total = 0;
    for (auto t : ticks) total += t;
    std::cout << total / 100 << "." << (total % 100 < 10 ? "0" : "") << total % 100 << "\n";
}`,
  why: String.raw`Binary floating point cannot store 19.99 exactly, so sums of prices drift. Integer ticks are exact, and only the final display converts them back to a decimal form.` },

{ n: 51, d: "applications", t: "Break a dependency chain with four accumulators", idiom: "Dependency chains",
  p: String.raw`Sum the integers 1 to 1000 twice. The first sum uses one accumulator. The second uses four accumulators, one for each position within a group of four, and combines them at the end. Print the four-accumulator total, a space, then 1 if it equals the one-accumulator total or 0 otherwise, then a newline.`,
  ex: String.raw`500500 1`,
  code: String.raw`#include <iostream>

int main() {
    long long a0 = 0, a1 = 0, a2 = 0, a3 = 0;
    int i = 1;
    for (; i + 3 <= 1000; i += 4) {
        a0 += i;
        a1 += i + 1;
        a2 += i + 2;
        a3 += i + 3;
    }
    for (; i <= 1000; ++i) a0 += i;
    long long seq = 0;
    for (int k = 1; k <= 1000; ++k) seq += k;
    long long par = a0 + a1 + a2 + a3;
    std::cout << par << " " << (par == seq ? 1 : 0) << "\n";
}`,
  why: String.raw`Each addition into one accumulator must wait for the previous one, which forms a chain the processor cannot overlap. Separate accumulators let independent additions run side by side, and the total is unchanged for integers.` },

{ n: 52, d: "applications", t: "Sort unsigned integers without comparisons", idiom: "Non-comparison sorting",
  p: String.raw`Write an LSD radix sort for unsigned 32-bit integers that processes one byte per pass, from least significant to most significant, using counting buckets and a temporary vector. Sort the values 170, 45, 75, 90, 802, 24, 2 and 66. Print the sorted values, each followed by a space, then a newline.`,
  ex: String.raw`2 24 45 66 75 90 170 802 `,
  code: String.raw`#include <cstddef>
#include <cstdint>
#include <iostream>
#include <vector>

void radix_sort(std::vector<std::uint32_t>& v) {
    std::vector<std::uint32_t> tmp(v.size());
    for (int shift = 0; shift < 32; shift += 8) {
        std::size_t count[257] = {};
        for (auto x : v) ++count[((x >> shift) & 0xFF) + 1];
        for (int b = 0; b < 256; ++b) count[b + 1] += count[b];
        for (auto x : v) tmp[count[(x >> shift) & 0xFF]++] = x;
        v.swap(tmp);
    }
}

int main() {
    std::vector<std::uint32_t> v{170, 45, 75, 90, 802, 24, 2, 66};
    radix_sort(v);
    for (auto x : v) std::cout << x << " ";
    std::cout << "\n";
}`,
  why: String.raw`Each pass distributes the values into buckets by one byte, stably, so the order from earlier passes is preserved. After four passes the whole key is ordered, and the sort never compares two values directly.` },

{ n: 53, d: "applications", t: "Probe a linear-probing table", idiom: "Open addressing",
  p: String.raw`Write class IntSet with eight slots, each an optional int, and a table index of key modulo 8. insert(k) places k in the first empty slot found by moving forward one slot at a time, wrapping around. probes_for(k) starts at key modulo 8, counts one probe for each slot it examines, and stops when it finds k. Insert 3, then 11, then 19. Print probes, a space, and probes_for(19), then a newline.`,
  ex: String.raw`probes 3`,
  code: String.raw`#include <array>
#include <cstddef>
#include <iostream>
#include <optional>

class IntSet {
    std::array<std::optional<int>, 8> slots_{};
public:
    void insert(int k) {
        std::size_t i = static_cast<std::size_t>(k) % 8;
        while (slots_[i]) i = (i + 1) % 8;
        slots_[i] = k;
    }
    int probes_for(int k) const {
        std::size_t i = static_cast<std::size_t>(k) % 8;
        int probes = 1;
        while (slots_[i] && *slots_[i] != k) {
            i = (i + 1) % 8;
            ++probes;
        }
        return probes;
    }
};

int main() {
    IntSet s;
    s.insert(3);
    s.insert(11);
    s.insert(19);
    std::cout << "probes " << s.probes_for(19) << "\n";
}`,
  why: String.raw`Keys that share a home slot are placed in the next free slots, so a lookup walks along that run. Storing the values in one array keeps the walk within a few adjacent cache lines.` },

{ n: 54, d: "applications", t: "Report invalid input as a value", idiom: "Error values instead of exceptions",
  p: String.raw`Write parse_int(s), which returns an optional int. It converts the whole string view to an int with the standard from-chars function, and returns nothing if the conversion fails or does not consume every character. Parse the strings 5, x and 7. Count the valid results and the invalid ones. Print valid, a space, the valid count, a space, invalid, a space, and the invalid count, then a newline.`,
  ex: String.raw`valid 2 invalid 1`,
  code: String.raw`#include <charconv>
#include <iostream>
#include <optional>
#include <string_view>
#include <system_error>
#include <vector>

std::optional<int> parse_int(std::string_view s) {
    int v = 0;
    auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
    if (ec != std::errc() || p != s.data() + s.size()) return std::nullopt;
    return v;
}

int main() {
    std::vector<std::string_view> in{"5", "x", "7"};
    int valid = 0, invalid = 0;
    for (auto s : in) {
        if (parse_int(s)) ++valid;
        else ++invalid;
    }
    std::cout << "valid " << valid << " invalid " << invalid << "\n";
}`,
  why: String.raw`A failed parse is an expected outcome for input, not an exceptional event. Returning an empty optional keeps the failure in the normal control flow, and it costs nothing when the input is good.` },

{ n: 55, d: "applications", t: "Copy records as bytes and compare them", idiom: "Trivially copyable copies",
  p: String.raw`Define Rec with an int id and a float score. Create an array of three Rec with ids 1, 2, 3 and scores 0.5, 1.5, 2.5. Copy the bytes of the whole array into a second array of three Rec. Print equal if the byte comparison of the two arrays reports no difference, or differ otherwise, then a newline.`,
  ex: String.raw`equal`,
  code: String.raw`#include <cstring>
#include <iostream>

struct Rec {
    int id;
    float score;
};

int main() {
    Rec src[3] = {{1, 0.5f}, {2, 1.5f}, {3, 2.5f}};
    Rec dst[3];
    std::memcpy(dst, src, sizeof src);
    std::cout << (std::memcmp(src, dst, sizeof src) == 0 ? "equal" : "differ") << "\n";
}`,
  why: String.raw`Rec has no padding and is trivially copyable, so copying its bytes produces identical objects. Bulk byte copies are often the fastest way to move plain records.` },

{ n: 56, d: "applications", t: "Fuse two passes into one loop", idiom: "Loop fusion",
  p: String.raw`Compute the sum of the squares of 1 to 10 and the sum of their cubes, using one loop that updates both sums. Also compute the same two sums with two separate loops. Print the fused sum of squares, a space, the fused sum of cubes, a space, then same if both pairs match or differ otherwise, then a newline.`,
  ex: String.raw`385 3025 same`,
  code: String.raw`#include <iostream>

int main() {
    long long sq = 0, cu = 0;
    for (int i = 1; i <= 10; ++i) {
        sq += static_cast<long long>(i) * i;
        cu += static_cast<long long>(i) * i * i;
    }
    long long sq2 = 0, cu2 = 0;
    for (int i = 1; i <= 10; ++i) sq2 += static_cast<long long>(i) * i;
    for (int i = 1; i <= 10; ++i) cu2 += static_cast<long long>(i) * i * i;
    std::cout << sq << " " << cu << " " << (sq == sq2 && cu == cu2 ? "same" : "differ") << "\n";
}`,
  why: String.raw`Fusing loops reads the input once instead of twice, which helps when the data is larger than cache. The results are the same, so fusion is a change of scheduling rather than of meaning.` },

// ---------- More applications ----------
{ n: 57, d: "applications", t: "Fixed-capacity stack without heap allocation", idiom: "Fixed-capacity storage",
  p: String.raw`Write class FixedStack, a template on element type T and capacity N, that stores its elements in a std::array and tracks a size. push(v) stores the value and returns true when there is room, or returns false and changes nothing when the stack is full. Push the values 0 to 4 into a FixedStack of int with capacity 4. Print each push result as 1 or 0, separated by spaces, then a space, the word size, a space, and the final size, then a newline.`,
  ex: String.raw`1 1 1 1 0 size 4`,
  code: String.raw`#include <array>
#include <cstddef>
#include <iostream>

template <class T, std::size_t N>
class FixedStack {
    std::array<T, N> data_{};
    std::size_t size_ = 0;
public:
    bool push(const T& v) {
        if (size_ == N) return false;
        data_[size_++] = v;
        return true;
    }
    std::size_t size() const { return size_; }
};

int main() {
    FixedStack<int, 4> s;
    for (int i = 0; i < 5; ++i) std::cout << s.push(i) << " ";
    std::cout << "size " << s.size() << "\n";
}`,
  why: String.raw`A fixed-capacity container keeps all its storage inside the object, so pushing never touches the allocator. Reporting a full stack through the return value lets the caller decide what to do without an exception.` },

{ n: 58, d: "applications", t: "Remove matching elements by swapping with the back", idiom: "Swap-and-pop removal",
  p: String.raw`Start with the vector 5, 1, 5, 2, 5, 3. Remove every element equal to 5 without preserving order: whenever the element at the current index is 5, overwrite it with the last element and shrink the vector by one, without advancing the index. Otherwise advance the index. Sort the remaining elements and print them, each followed by a space, then a newline.`,
  ex: String.raw`1 2 3 `,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{5, 1, 5, 2, 5, 3};
    std::size_t i = 0;
    while (i < v.size()) {
        if (v[i] == 5) {
            v[i] = v.back();
            v.pop_back();
        } else {
            ++i;
        }
    }
    std::sort(v.begin(), v.end());
    for (int x : v) std::cout << x << " ";
    std::cout << "\n";
}`,
  why: String.raw`Overwriting a removed element with the last one costs one copy and no shifting, so removal is constant time per element. Order is lost, which is acceptable when the container is a set of values rather than a sequence.` },

{ n: 59, d: "applications", t: "Absolute value without a branch", idiom: "Branchless absolute value",
  p: String.raw`Write abs_bl(x) for a 32-bit int using only arithmetic and bitwise operations, with no conditional. It should compute the sign mask as x shifted right by 31, then return x xor mask minus mask. Print abs_bl(-5), a space, abs_bl(7), a space, abs_bl(0), then a newline.`,
  ex: String.raw`5 7 0`,
  code: String.raw`#include <iostream>

int abs_bl(int x) {
    int m = x >> 31;
    return (x ^ m) - m;
}

int main() {
    std::cout << abs_bl(-5) << " " << abs_bl(7) << " " << abs_bl(0) << "\n";
}`,
  why: String.raw`For a negative number the mask is all ones, so the xor flips every bit and the subtraction adds one back, which is negation. For a non-negative number the mask is zero and the value is unchanged.` },

{ n: 60, d: "applications", t: "Compare signed and unsigned values safely", idiom: "Mixed-sign comparison",
  p: String.raw`Let a be the int -1 and b be the unsigned int 1. Print 1 if a is less than b in the mathematical sense, using a standard comparison that handles mixed signs correctly, or 0 otherwise, then a space. Then print 1 if the unsigned conversion of a is less than b, or 0 otherwise, using plain unsigned comparison, then a newline.`,
  ex: String.raw`1 0`,
  code: String.raw`#include <iostream>
#include <utility>

int main() {
    int a = -1;
    unsigned b = 1;
    std::cout << std::cmp_less(a, b) << " " << (static_cast<unsigned>(a) < b) << "\n";
}`,
  why: String.raw`In a comparison between int and unsigned, the int is converted to unsigned, so -1 becomes a very large value. The standard comparison functions compare by value instead, which avoids that trap.` },

{ n: 61, d: "applications", t: "Gray code sequence", idiom: "Gray code",
  p: String.raw`For n from 0 to 7, compute the Gray code of n as n xor (n shifted right by one), and print each value followed by a space, then a newline.`,
  ex: String.raw`0 1 3 2 6 7 5 4 `,
  code: String.raw`#include <iostream>

int main() {

}`,

{ n: 62, d: "applications", t: "Reverse the bits of a byte", idiom: "Bit reversal",
  p: String.raw`Write reverse8(x) that returns the 8-bit value with the bits of x in reverse order, built one bit at a time from the least significant end. Print reverse8 of the binary value 00010110 as a decimal number, then a newline.`,

#include <iostream>

std::uint8_t reverse8(std::uint8_t x) {
    std::uint8_t r = 0;
    for (int i = 0; i < 8; ++i) {
        r = static_cast<std::uint8_t>((r << 1) | (x & 1));

{ n: 63, d: "applications", t: "Depth of the top two bid levels", idiom: "Order book depth",

{ n: 64, d: "applications", t: "Delta-encode timestamps and decode them", idiom: "Delta encoding",
  p: String.raw`Start with timestamps 1000, 1003, 1010 and 1011 in a vector of long long. Encode them as differences, where each element is the timestamp minus the previous timestamp, with the first previous value being zero. Then decode the differences back into timestamps by accumulating them. Print the last decoded value, a space, then 1 if the decoded values equal the originals or 0 otherwise, then a newline.`,
  ex: String.raw`1011 1`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<long long> ts{1000, 1003, 1010, 1011};
    std::vector<long long> deltas;
    long long prev = 0;
    for (auto t : ts) {
        deltas.push_back(t - prev);
        prev = t;
    }
    long long cur = 0;
    std::vector<long long> decoded;
    for (auto d : deltas) {
        cur += d;
        decoded.push_back(cur);
    }
    std::cout << decoded.back() << " " << (decoded == ts ? 1 : 0) << "\n";
}`,
  why: String.raw`Sorted timestamps have small differences, which take fewer bits than the full values. Decoding is a running sum, so the original sequence is recovered exactly.` },

{ n: 65, d: "applications", t: "FNV-1a hash of two strings", idiom: "Non-cryptographic hashing",

#include <iostream>
#include <string_view>

std::uint32_t fnv1a(std::string_view s) {
    std::uint32_t h = 2166136261u;
    for (unsigned char c : s) {
        h ^= c;

int main() {

{ n: 66, d: "applications", t: "Fibonacci at compile time", idiom: "Constexpr functions",

{ n: 67, d: "applications", t: "Median by partial selection", idiom: "Selection by partition",

{ n: 68, d: "applications", t: "Check which types have a non-throwing move", idiom: "Move-noexcept traits",

{ n: 69, d: "applications", t: "Add with overflow checks before the operation", idiom: "Overflow-checked arithmetic",
  p: String.raw`Write add_checked(a, b, out) for ints. It returns false and leaves out unchanged if a plus b would overflow, and otherwise stores the sum in out and returns true. The check must be made before the addition, without any operation that overflows. Call it with INT_MAX minus 1 and 5, then with 1 and 2. Print the first result as 1 or 0, a space, the second result as 1 or 0, a space, then the value stored by the second call, then a newline.`,
  ex: String.raw`0 1 3`,
  code: String.raw`#include <climits>
#include <iostream>

bool add_checked(int a, int b, int& out) {
    if ((b > 0 && a > INT_MAX - b) || (b < 0 && a < INT_MIN - b)) return false;
    out = a + b;
    return true;
}

int main() {
    int out = 0;
    bool ok1 = add_checked(INT_MAX - 1, 5, out);
    bool ok2 = add_checked(1, 2, out);
    std::cout << ok1 << " " << ok2 << " " << out << "\n";
