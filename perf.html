// ---------- Allocation, layout and encoding patterns ----------
{ n: 70, d: "applications", t: "Inline small buffer that spills to the heap", idiom: "Inline small buffer",
  p: String.raw`Write a class Small of int with inline capacity 4 that stores its elements in its own object until a fifth element arrives, then moves them to heap storage and grows from there. Provide push(v) and size(). Replace the global operator new so that it increments a counter named allocs. Push the values 0 to 5 into a Small, and print the size, a space, and the number of allocations made during the pushes, then a newline.`,
  ex: String.raw`6 1`,
  code: String.raw`#include <array>
#include <cstddef>
#include <cstdlib>
#include <iostream>

int allocs = 0;
void* operator new(std::size_t n) { ++allocs; return std::malloc(n); }
void operator delete(void* p) noexcept { std::free(p); }
void operator delete(void* p, std::size_t) noexcept { std::free(p); }

class Small {
    static constexpr std::size_t kInline = 4;
    std::array<int, kInline> inline_{};
    int* heap_ = nullptr;
    std::size_t size_ = 0;
    std::size_t cap_ = kInline;
    int* data() { return heap_ ? heap_ : inline_.data(); }
public:
    ~Small() { delete[] heap_; }
    void push(int v) {
        if (size_ == cap_) {
            std::size_t ncap = cap_ * 2;
            int* nh = new int[ncap];
            for (std::size_t i = 0; i < size_; ++i) nh[i] = data()[i];
            delete[] heap_;
            heap_ = nh;
            cap_ = ncap;
        }
        data()[size_++] = v;
    }
    std::size_t size() const { return size_; }
};

int main() {
    Small s;
    int before = allocs;
    for (int i = 0; i < 6; ++i) s.push(i);
    std::cout << s.size() << " " << allocs - before << "\n";
}`,
  why: String.raw`Small containers avoid allocation for the common case where the contents fit in the object. Counting allocations makes the benefit visible: the first four pushes allocate nothing, and only the spill causes one allocation.` },

{ n: 71, d: "applications", t: "Bump allocation with alignment in a fixed buffer", idiom: "Bump allocation",
  p: String.raw`Write a class Arena that owns a 64-byte buffer aligned to 16 bytes. Its allocate(size, align) returns a pointer to a region of size bytes starting at an address that is a multiple of align, placed at the first free position after earlier allocations, or nullptr if it does not fit. Also provide offset(p), which returns the byte offset of p from the start of the buffer. Allocate 3 bytes with alignment 1, then 8 bytes with alignment 8, then 4 bytes with alignment 4. Print the offsets of the three returned pointers separated by spaces, then a newline.`,
  ex: String.raw`0 8 16`,
  code: String.raw`#include <cstddef>
#include <cstdint>
#include <iostream>

class Arena {
    alignas(16) unsigned char buf_[64];
    std::size_t used_ = 0;
public:
    void* allocate(std::size_t size, std::size_t align) {
        std::uintptr_t base = reinterpret_cast<std::uintptr_t>(buf_);
        std::uintptr_t cur = base + used_;
        std::uintptr_t aligned = (cur + align - 1) & ~(align - 1);
        std::size_t end = (aligned - base) + size;
        if (end > sizeof(buf_)) return nullptr;
        used_ = end;
        return reinterpret_cast<void*>(aligned);
    }
    std::size_t offset(const void* p) const {
        return reinterpret_cast<std::uintptr_t>(p) - reinterpret_cast<std::uintptr_t>(buf_);
    }
};

int main() {
    Arena a;
    void* p1 = a.allocate(3, 1);
    void* p2 = a.allocate(8, 8);
    void* p3 = a.allocate(4, 4);
    std::cout << a.offset(p1) << " " << a.offset(p2) << " " << a.offset(p3) << "\n";
}`,
  why: String.raw`Arena allocation is a pointer bump plus rounding up to the required alignment, so each allocation is cheap and nothing is freed individually. The rounding step is where alignment requirements of later objects show up in the offsets.` },

{ n: 72, d: "applications", t: "Short strings stored without a heap allocation", idiom: "Small-string optimization",
  p: String.raw`Write a class MiniStr whose constructor takes a C string. Strings of at most 15 characters must be stored inside the object, and longer strings must be stored on the heap. The class must not be copyable. Replace the global operator new so that it increments a counter named allocs. Construct a MiniStr from "short" in its own scope, then one from "this text is longer than fifteen characters" in its own scope, and print the number of allocations made by each construction, separated by a space, then a newline.`,
  ex: String.raw`0 1`,
  code: String.raw`#include <cstddef>
#include <cstdlib>
#include <cstring>
#include <iostream>

int allocs = 0;
void* operator new(std::size_t n) { ++allocs; return std::malloc(n); }
void operator delete(void* p) noexcept { std::free(p); }
void operator delete(void* p, std::size_t) noexcept { std::free(p); }

class MiniStr {
    static constexpr std::size_t kSmall = 15;
    char small_[kSmall + 1];
    char* heap_ = nullptr;
    std::size_t len_;
public:
    explicit MiniStr(const char* s) : len_(std::strlen(s)) {
        if (len_ <= kSmall) {
            std::memcpy(small_, s, len_ + 1);
        } else {
            heap_ = new char[len_ + 1];
            std::memcpy(heap_, s, len_ + 1);
        }
    }
    MiniStr(const MiniStr&) = delete;
    MiniStr& operator=(const MiniStr&) = delete;
    ~MiniStr() { delete[] heap_; }
    std::size_t size() const { return len_; }
};

int main() {
    int c0 = allocs;
    { MiniStr a("short"); }
    int c1 = allocs;
    { MiniStr b("this text is longer than fifteen characters"); }
    int c2 = allocs;
    std::cout << c1 - c0 << " " << c2 - c1 << "\n";
}`,
  why: String.raw`Most strings in real programs are short, so storing them in the object avoids the allocator entirely. The count of allocations shows the switch between the two representations at the capacity boundary.` },

{ n: 73, d: "applications", t: "First zero byte found in a 64-bit word", idiom: "SWAR byte search",
  p: String.raw`Write a function that receives a 64-bit unsigned value in which byte i, counting from the least significant byte, holds the i-th character of a string. It must return the index of the first byte equal to zero, counting from the least significant byte, or 8 if no byte is zero. Build the word for the 8 characters h, e, l, l, o, the zero character, x, y, and build a second word from eight letters a. Print the result for the first word, a space, and the result for the second word, then a newline.`,
  ex: String.raw`5 8`,
  code: String.raw`#include <bit>
#include <cstdint>
#include <iostream>

std::uint64_t load_word(const char* b) {
    std::uint64_t w = 0;
    for (int i = 0; i < 8; ++i)
        w |= static_cast<std::uint64_t>(static_cast<unsigned char>(b[i])) << (8 * i);
    return w;
}

int first_zero_byte(std::uint64_t v) {
    constexpr std::uint64_t lo = 0x0101010101010101ULL;
    constexpr std::uint64_t hi = 0x8080808080808080ULL;
    std::uint64_t m = (v - lo) & ~v & hi;
    return m ? std::countr_zero(m) / 8 : 8;
}

int main() {
    const char a[8] = {'h', 'e', 'l', 'l', 'o', 0, 'x', 'y'};
    const char b[8] = {'a', 'a', 'a', 'a', 'a', 'a', 'a', 'a'};
    std::cout << first_zero_byte(load_word(a)) << " " << first_zero_byte(load_word(b)) << "\n";
}`,
  why: String.raw`Checking eight bytes at once with word arithmetic is the core of fast string scanning in parsers. The lowest flagged bit is always exact, so counting trailing zeros gives the position of the first match.` },

{ n: 74, d: "applications", t: "Recover the owner of an embedded link", idiom: "Intrusive containers",
  p: String.raw`Define struct Link holding a pointer to the next Link, and struct Item holding an int named value and a Link named link. Create three items with values 1, 2 and 3, and link them into a ring through their links, so that the link of item 1 points to the link of item 2, and so on, with the last pointing back to the first. Starting from the link of item 1, follow the links three times, and sum the values of the items that each link belongs to. Print the sum, then a newline.`,
  ex: String.raw`6`,
  code: String.raw`#include <cstddef>
#include <iostream>

struct Link { Link* next = nullptr; };
struct Item { int value; Link link; };

Item* owner(Link* l) {
    return reinterpret_cast<Item*>(reinterpret_cast<unsigned char*>(l) - offsetof(Item, link));
}

int main() {
    Item a{1, {}}, b{2, {}}, c{3, {}};
    a.link.next = &b.link;
    b.link.next = &c.link;
    c.link.next = &a.link;
    int sum = 0;
    Link* cur = &a.link;
    for (int i = 0; i < 3; ++i) {
        sum += owner(cur)->value;
        cur = cur->next;
    }
    std::cout << sum << "\n";
}`,
  why: String.raw`Intrusive containers keep the link inside the object, so inserting an object never allocates a node. Getting back to the containing object from its link is done by subtracting the member's offset, which is why standard layout matters here.` },

{ n: 75, d: "applications", t: "Object pool that reuses released slots", idiom: "Object pool",
  p: String.raw`Write a class template Pool<T, N> that holds storage for N objects of type T inside itself, with allocate() returning a pointer to a free slot or nullptr when none is left, and release(p) returning a slot to the pool. Neither operation may call the global operator new. Create a Pool of int with 4 slots, allocate two slots a and b, release a, then allocate a slot c. Print 1 if a equals c, a space, and 1 if b is not equal to c, then a newline.`,
  ex: String.raw`1 1`,
  code: String.raw`#include <cstddef>
#include <iostream>

template <class T, std::size_t N>
class Pool {
    union Slot {
        Slot* next;
        alignas(T) unsigned char raw[sizeof(T)];
    };
    Slot slots_[N];
    Slot* free_ = nullptr;
public:
    Pool() {
        for (std::size_t i = 0; i < N; ++i) {
            slots_[i].next = free_;
            free_ = &slots_[i];
        }
    }
    T* allocate() {
        if (!free_) return nullptr;
        Slot* s = free_;
        free_ = s->next;
        return reinterpret_cast<T*>(s->raw);
    }
    void release(T* p) {
        Slot* s = reinterpret_cast<Slot*>(p);
        s->next = free_;
        free_ = s;
    }
};

int main() {
    Pool<int, 4> pool;
    int* a = pool.allocate();
    int* b = pool.allocate();
    pool.release(a);
    int* c = pool.allocate();
    std::cout << (a == c) << " " << (b != c) << "\n";
}`,
  why: String.raw`A pool gives constant-time allocation and release without touching the heap, and reuses memory that is hot in the cache. Storing the free-list link inside the unused slots means the pool needs no extra memory.` },

{ n: 76, d: "applications", t: "Variable-length integer encoding", idiom: "Varint encoding",
  p: String.raw`Encode unsigned 64-bit integers in the little-endian base-128 format: each output byte holds seven bits of the value, starting with the least significant seven, and its top bit is set when further bytes follow. Write encode(v) returning the bytes and decode(bytes) returning the value. Print the encoded byte counts of 1, 300 and 4294967295, separated by spaces, then the value obtained by decoding the encoding of 300, then a newline.`,
  ex: String.raw`1 2 5 300`,
  code: String.raw`#include <cstdint>
#include <iostream>
#include <vector>

std::vector<unsigned char> encode(std::uint64_t v) {
    std::vector<unsigned char> out;
    do {
        unsigned char b = v & 0x7F;
        v >>= 7;
        if (v) b |= 0x80;
        out.push_back(b);
    } while (v);
    return out;
}

std::uint64_t decode(const std::vector<unsigned char>& in) {
    std::uint64_t v = 0;
    int shift = 0;
    for (unsigned char b : in) {
        v |= static_cast<std::uint64_t>(b & 0x7F) << shift;
        shift += 7;
        if (!(b & 0x80)) break;
    }
    return v;
}

int main() {
    std::cout << encode(1).size() << " " << encode(300).size() << " "
              << encode(4294967295ULL).size() << " " << decode(encode(300)) << "\n";
}`,
  why: String.raw`Small integers take one byte, which is why many binary formats use this encoding for lengths and field numbers. The continuation bit makes the format self-delimiting, so a reader never needs an outside length.` },

{ n: 77, d: "applications", t: "Fixed-capacity FIFO without allocation", idiom: "Fixed-capacity ring",
  p: String.raw`Implement a class Fifo that stores up to 4 int values in an array inside the object, with no heap allocation. push(v) returns false when full and true otherwise. pop(out) stores the oldest value in out and returns true, or returns false when empty. Push the values 1 to 5 in order and print each push result followed by a space. Then pop two values and print each followed by a space. Push 5 and print its result followed by a space. Then pop until empty, printing each value followed by a space. End with a newline.`,
  ex: String.raw`1 1 1 1 0 1 2 1 3 4 5`,
  code: String.raw`#include <array>
#include <cstddef>
#include <iostream>

class Fifo {
    std::array<int, 4> buf_{};
    std::size_t head_ = 0, tail_ = 0;
public:
    bool push(int v) {
        if (tail_ - head_ == buf_.size()) return false;
        buf_[tail_++ % buf_.size()] = v;
        return true;
    }
    bool pop(int& out) {
        if (head_ == tail_) return false;
        out = buf_[head_++ % buf_.size()];
        return true;
    }
};

int main() {
    Fifo q;
    for (int i = 1; i <= 5; ++i) std::cout << q.push(i) << " ";
    int v = 0;
    for (int i = 0; i < 2; ++i) {
        q.pop(v);
        std::cout << v << " ";
    }
    std::cout << q.push(5) << " ";
    while (q.pop(v)) std::cout << v << " ";
    std::cout << "\n";
}`,
  why: String.raw`A bounded queue in a fixed array never allocates after construction, which suits real-time code. Counting head and tail as ever-growing indices makes full and empty easy to tell apart without wasting a slot.` },

{ n: 78, d: "applications", t: "Counters that do not share a cache line", idiom: "Cache-line padding",
  p: String.raw`Define a struct Padded holding one long named value, with its size and alignment chosen so that every element of a std::vector<Padded> occupies its own 64-byte cache line. Create a vector of 4 Padded values. Start 4 threads, where thread i adds 1 to element i of the vector 1000 times. Join the threads, then print sizeof(Padded), a space, alignof(Padded), a space, and the sum of all the values, then a newline.`,
  ex: String.raw`64 64 4000`,
  code: String.raw`#include <iostream>
#include <thread>
#include <vector>

struct alignas(64) Padded {
    long value = 0;
};

int main() {
    std::vector<Padded> counters(4);
    std::vector<std::thread> threads;
    for (int i = 0; i < 4; ++i) {
        threads.emplace_back([&counters, i] {
            for (int k = 0; k < 1000; ++k) counters[i].value++;
        });
    }
    for (auto& t : threads) t.join();
    long sum = 0;
    for (auto& c : counters) sum += c.value;
    std::cout << sizeof(Padded) << " " << alignof(Padded) << " " << sum << "\n";
}`,
  why: String.raw`When two threads write to different variables that share a cache line, the line bounces between their cores, which slows both. Padding each counter to a full line keeps the writes independent.` },

// ---------- Expression, pointer, dispatch and table patterns ----------
{ n: 79, d: "applications", t: "Elementwise sum without temporary vectors", idiom: "Expression templates",
  p: String.raw`Define a class Vec holding n doubles, with a constructor taking a size and a fill value. Make a + b + c work elementwise for Vec values, so that assigning the sum to a new Vec computes each element directly from the operands. Count the Vec objects constructed by the program using a global counter that the Vec constructors increment. Create a, b and c with size 3 and fill values 1, 2 and 3, then set the counter to zero. Evaluate Vec r = a + b + c, and print the counter value, a space, and r[0], then a newline.`,
  ex: String.raw`1 6`,
  code: String.raw`#include <cstddef>
#include <iostream>
#include <vector>

int constructions = 0;

class Vec {
    std::vector<double> d_;
public:
    Vec(std::size_t n, double v) : d_(n, v) { ++constructions; }
    template <class E>
    Vec(const E& e) : d_(e.size()) {
        ++constructions;
        for (std::size_t i = 0; i < d_.size(); ++i) d_[i] = e[i];
    }
    double operator[](std::size_t i) const { return d_[i]; }
    std::size_t size() const { return d_.size(); }
};

template <class L, class R>
struct Add {
    const L& l;
    const R& r;
    double operator[](std::size_t i) const { return l[i] + r[i]; }
    std::size_t size() const { return l.size(); }
};

Add<Vec, Vec> operator+(const Vec& a, const Vec& b) { return {a, b}; }

template <class L, class R>
Add<Add<L, R>, Vec> operator+(const Add<L, R>& a, const Vec& b) { return {a, b}; }

int main() {
    Vec a(3, 1.0), b(3, 2.0), c(3, 3.0);
    constructions = 0;
    Vec r = a + b + c;
    std::cout << constructions << " " << r[0] << "\n";
}`,
  why: String.raw`Libraries such as Eigen use expression templates so that a chain of operators builds a description of the computation instead of a chain of temporary results. Evaluating the whole expression at assignment makes one pass over the data and allocates only the final result.` },

{ n: 80, d: "applications", t: "Store a pointer and a tag in one word", idiom: "Tagged pointer",
  p: String.raw`Write a class TaggedPtr that holds an int pointer and a tag from 0 to 3 in a single word-sized value, using the low bits of the pointer, which are zero because the pointed-to int is 8-byte aligned. Provide ptr() and tag(). Create an 8-byte aligned int holding 42, build a TaggedPtr from its address with tag 2, and print the int obtained through ptr(), a space, the tag, a space, and 1 if ptr() equals the original address or 0 otherwise, then a newline.`,
  ex: String.raw`42 2 1`,
  code: String.raw`#include <cstdint>
#include <iostream>

class TaggedPtr {
    std::uintptr_t bits_;
public:
    TaggedPtr(int* p, unsigned tag) : bits_(reinterpret_cast<std::uintptr_t>(p) | tag) {}
    int* ptr() const { return reinterpret_cast<int*>(bits_ & ~std::uintptr_t{3}); }
    unsigned tag() const { return static_cast<unsigned>(bits_ & 3); }
};

int main() {
    alignas(8) static int x = 42;
    TaggedPtr t(&x, 2);
    std::cout << *t.ptr() << " " << t.tag() << " " << (t.ptr() == &x) << "\n";
}`,
  why: String.raw`Compilers and runtimes store small flags in the spare low bits of aligned pointers, for example LLVM's PointerIntPair. The representation stays one word, so passing and storing these values costs nothing extra.` },

{ n: 81, d: "applications", t: "Non-owning reference to any callable", idiom: "Non-owning callable reference",
  p: String.raw`Write a class FunctionRef that can refer to any callable object taking an int and returning an int, without copying or owning it, and that provides operator() taking an int. Write apply_twice(FunctionRef f, int x) returning f(f(x)). Define a lambda that adds 10 to its argument, call apply_twice with that lambda and argument 1, and print the result, then a newline.`,
  ex: String.raw`21`,
  code: String.raw`#include <iostream>
#include <type_traits>

class FunctionRef {
    void* obj_;
    int (*call_)(void*, int);
public:
    template <class F, class = std::enable_if_t<!std::is_same_v<std::decay_t<F>, FunctionRef>>>
    FunctionRef(F& f)
        : obj_(const_cast<void*>(static_cast<const void*>(&f))),
          call_([](void* o, int x) { return (*static_cast<F*>(o))(x); }) {}
    int operator()(int x) const { return call_(obj_, x); }
};

int apply_twice(FunctionRef f, int x) { return f(f(x)); }

int main() {
    int offset = 10;
    auto add = [offset](int x) { return x + offset; };
    std::cout << apply_twice(add, 1) << "\n";
}`,
  why: String.raw`A callable reference costs two pointers and never allocates, unlike a type that owns a copy of the callable. It suits callbacks that are used only for the duration of a call, such as visitors passed into a traversal.` },

{ n: 82, d: "applications", t: "Set that stays correct after erasing in open addressing", idiom: "Deletion markers",
  p: String.raw`Implement a set of ints with an 8-slot table using open addressing: the starting slot is the value modulo 8, and a collision moves to the next slot, wrapping around. Provide insert(k), contains(k) and erase(k). Erasing a key must not make later keys in the same probe sequence unfindable, and inserting must not add a key that is already present. Insert 1, 9 and 17, erase 9, then print contains(17), a space, contains(9), a space, and then after inserting 9 again, contains(9), then a newline.`,
  ex: String.raw`1 0 1`,
  code: String.raw`#include <array>
#include <cstddef>
#include <iostream>

class IntSet {
    enum State : unsigned char { Empty, Full, Deleted };
    struct Slot { State st = Empty; int key = 0; };
    std::array<Slot, 8> t_{};
    static std::size_t home(int k) { return static_cast<std::size_t>(k) % 8; }
public:
    void insert(int k) {
        std::size_t free_slot = 8;
        std::size_t i = home(k);
        for (int n = 0; n < 8; ++n, i = (i + 1) % 8) {
            if (t_[i].st == Full) {
                if (t_[i].key == k) return;
            } else {
                if (free_slot == 8) free_slot = i;
                if (t_[i].st == Empty) break;
            }
        }
        if (free_slot < 8) t_[free_slot] = {Full, k};
    }
    bool contains(int k) const {
        std::size_t i = home(k);
        for (int n = 0; n < 8; ++n, i = (i + 1) % 8) {
            if (t_[i].st == Empty) return false;
            if (t_[i].st == Full && t_[i].key == k) return true;
        }
        return false;
    }
    void erase(int k) {
        std::size_t i = home(k);
        for (int n = 0; n < 8; ++n, i = (i + 1) % 8) {
            if (t_[i].st == Empty) return;
            if (t_[i].st == Full && t_[i].key == k) {
                t_[i].st = Deleted;
                return;
            }
        }
    }
};

int main() {
    IntSet s;
    s.insert(1);
    s.insert(9);
    s.insert(17);
    s.erase(9);
    std::cout << s.contains(17) << " " << s.contains(9) << " ";
    s.insert(9);
    std::cout << s.contains(9) << "\n";
}`,
  why: String.raw`Clearing a slot on erase would break the probe chains that later keys depend on, so open-addressing tables mark the slot as deleted instead. Inserts can reuse those marked slots, but must still check the whole chain for an existing key first.` },

{ n: 83, d: "applications", t: "Map lookup by string_view without building a key", idiom: "Transparent comparators",
  p: String.raw`Create a std::map from std::string keys to int values, with a comparator that allows the map to be searched using std::string_view and C strings as well as std::string, without constructing a std::string for the search. The map contains apple with value 3 and pear with value 5. Look up pear using a std::string_view, and count the entries with key kiwi using a C string. Print the value found for pear, a space, and the count for kiwi, then a newline.`,
  ex: String.raw`5 0`,
  code: String.raw`#include <iostream>
#include <map>
#include <string>
#include <string_view>

struct Less {
    using is_transparent = void;
    bool operator()(std::string_view a, std::string_view b) const { return a < b; }
};

int main() {
    std::map<std::string, int, Less> m{{"apple", 3}, {"pear", 5}};
    std::string_view key = "pear";
    auto it = m.find(key);
    std::cout << (it != m.end() ? it->second : -1) << " " << m.count("kiwi") << "\n";
}`,
  why: String.raw`Without a transparent comparator, every lookup with a string_view or C string first builds a std::string, which costs an allocation when the text is long. Heterogeneous lookup keeps the key as it is and only compares.` },

{ n: 84, d: "applications", t: "Combine field hashes into one hash", idiom: "Hash combining",
  p: String.raw`Write a function hash_combine that takes a size_t seed by reference and a value of any type, and mixes the std::hash of the value into the seed using the Boost-style formula with the constant 0x9e3779b97f4a7c15 and shifts by 6 and 2. Define a struct Point with an int x and a std::string name, and a function hash_point that combines the hashes of both fields. Create a = {1, "a"}, b = {1, "a"} and c = {2, "a"}. Print 1 if hash_point(a) equals hash_point(b), else 0, then a space, then 1 if hash_point(a) equals hash_point(c), else 0, then a newline.`,
  ex: String.raw`1 0`,
  code: String.raw`#include <cstddef>
#include <functional>
#include <iostream>
#include <string>

template <class T>
void hash_combine(std::size_t& seed, const T& v) {
    seed ^= std::hash<T>{}(v) + 0x9e3779b97f4a7c15ULL + (seed << 6) + (seed >> 2);
}

struct Point {
    int x;
    std::string name;
};

std::size_t hash_point(const Point& p) {
    std::size_t seed = 0;
    hash_combine(seed, p.x);
    hash_combine(seed, p.name);
    return seed;
}

int main() {
    Point a{1, "a"}, b{1, "a"}, c{2, "a"};
    std::cout << (hash_point(a) == hash_point(b)) << " " << (hash_point(a) == hash_point(c)) << "\n";
}`,
  why: String.raw`Hash tables of composite keys need one hash per key, built from the hashes of its fields. Mixing with shifts and a large odd constant spreads the bits of each field, so keys differing in one field usually get different hashes.` },

{ n: 85, d: "applications", t: "String copies that share until modified", idiom: "Copy-on-write",
  p: String.raw`Write a class CowString that holds text in a reference-counted representation shared between copies. Copying must not copy the text. Before changing the text, a copy that shares it must get its own copy of the representation, while other copies keep the old text. Provide a constructor from std::string, append(c) for one character, and str(). Create a CowString a from "abc", copy it into b, append d to b, then print the text of a, a space, and the text of b, then a newline.`,
  ex: String.raw`abc abcd`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

class CowString {
    struct Rep {
        std::string s;
        int refs;
    };
    Rep* rep_;
    void detach() {
        if (rep_->refs > 1) {
            --rep_->refs;
            rep_ = new Rep{rep_->s, 1};
        }
    }
public:
    explicit CowString(std::string s) : rep_(new Rep{std::move(s), 1}) {}
    CowString(const CowString& o) : rep_(o.rep_) { ++rep_->refs; }
    CowString& operator=(const CowString& o) {
        if (this != &o) {
            ++o.rep_->refs;
            if (--rep_->refs == 0) delete rep_;
            rep_ = o.rep_;
        }
        return *this;
    }
    ~CowString() {
        if (--rep_->refs == 0) delete rep_;
    }
    void append(char c) {
        detach();
        rep_->s.push_back(c);
    }
    const std::string& str() const { return rep_->s; }
};

int main() {
    CowString a(std::string("abc"));
    CowString b = a;
    b.append('d');
    std::cout << a.str() << " " << b.str() << "\n";
}`,
  why: String.raw`Copy-on-write lets many copies share one buffer until one of them changes, which saves memory and copying for data that is mostly read. The detach step is what keeps a write from being visible through the other copies.` },

{ n: 86, d: "applications", t: "Handles that detect reuse of a slot", idiom: "Generational handles",
  p: String.raw`Implement a table that stores ints and returns handles, each made of an index and a generation number. Removing a value must invalidate the handle that was returned for it, even if its slot is later reused for a new value. Provide add(v) returning a handle, remove(h), and get(h) returning a pointer to the value or nullptr if the handle is no longer valid. Add 10, remove that value using its handle, then add 20. Print 1 if the first handle still refers to a value, else 0, then a space, the value referred to by the second handle, then a space, and 1 if both handles have the same index, else 0, then a newline.`,
  ex: String.raw`0 20 1`,
  code: String.raw`#include <cstdint>
#include <iostream>
#include <vector>

struct Handle {
    std::uint32_t index;
    std::uint32_t gen;
};

class Table {
    struct Slot {
        int value = 0;
        std::uint32_t gen = 0;
        bool alive = false;
    };
    std::vector<Slot> slots_;
    std::vector<std::uint32_t> free_;
public:
    Handle add(int v) {
        std::uint32_t idx;
        if (!free_.empty()) {
            idx = free_.back();
            free_.pop_back();
        } else {
            idx = static_cast<std::uint32_t>(slots_.size());
            slots_.push_back({});
        }
        slots_[idx].value = v;
        slots_[idx].alive = true;
        return {idx, slots_[idx].gen};
    }
    int* get(Handle h) {
        if (h.index >= slots_.size()) return nullptr;
        Slot& s = slots_[h.index];
        return (s.alive && s.gen == h.gen) ? &s.value : nullptr;
    }
    void remove(Handle h) {
        if (get(h)) {
            slots_[h.index].alive = false;
            ++slots_[h.index].gen;
            free_.push_back(h.index);
        }
    }
};

int main() {
    Table t;
    Handle h1 = t.add(10);
    t.remove(h1);
    Handle h2 = t.add(20);
    std::cout << (t.get(h1) ? 1 : 0) << " " << *t.get(h2) << " " << (h1.index == h2.index) << "\n";
}`,
  why: String.raw`Storing pointers to elements breaks as soon as the element is removed and its memory reused. Pairing an index with a generation number lets stale handles be detected cheaply, which is common in game engines and entity systems.` },

{ n: 87, d: "applications", t: "Bit flags as a scoped enumeration", idiom: "Typed bit flags",
  p: String.raw`Define an enum class Perm with the distinct bit values Read, Write and Exec, where Read is bit 0, Write is bit 1 and Exec is bit 2. Provide operator | and operator & for Perm, returning Perm. Define a function any(p) that returns true when p has any bit set. Build p as Read combined with Exec. Print 1 if p & Write is set, else 0, then a space, then 1 if p & Exec is set, else 0, then a space, then the numeric value of p, then a newline.`,
  ex: String.raw`0 1 5`,
  code: String.raw`#include <iostream>

enum class Perm : unsigned { Read = 1u << 0, Write = 1u << 1, Exec = 1u << 2 };

constexpr Perm operator|(Perm a, Perm b) {
    return static_cast<Perm>(static_cast<unsigned>(a) | static_cast<unsigned>(b));
}

constexpr Perm operator&(Perm a, Perm b) {
    return static_cast<Perm>(static_cast<unsigned>(a) & static_cast<unsigned>(b));
}

constexpr bool any(Perm p) { return static_cast<unsigned>(p) != 0; }

int main() {
    Perm p = Perm::Read | Perm::Exec;
    std::cout << any(p & Perm::Write) << " " << any(p & Perm::Exec) << " "
              << static_cast<unsigned>(p) << "\n";
}`,
  why: String.raw`A scoped enumeration with bit values keeps flags type-safe while still compiling to a single integer. Defining the operators once lets flag combinations read like the names they stand for.` },

{ n: 88, d: "applications", t: "Process a sequence in cache-sized windows", idiom: "Chunked views",
  p: String.raw`Using non-owning views of a vector holding the integers 1 to 8, split the vector into consecutive pieces of at most 3 elements, starting from the beginning, without copying any elements. For each piece, compute its sum. Print the sums separated by spaces, then a newline.`,
  ex: String.raw`6 15 15`,
  code: String.raw`#include <algorithm>
#include <cstddef>
#include <iostream>
#include <numeric>
#include <span>
#include <vector>

int main() {
    std::vector<int> v{1, 2, 3, 4, 5, 6, 7, 8};
    std::span<const int> s(v);
    for (std::size_t i = 0; i < s.size(); i += 3) {
        std::size_t len = std::min<std::size_t>(3, s.size() - i);
        auto chunk = s.subspan(i, len);
        std::cout << std::accumulate(chunk.begin(), chunk.end(), 0)
                  << (i + 3 < s.size() ? " " : "\n");
    }
}`,
  why: String.raw`Working through data in blocks that fit in cache is a standard way to get speed from large arrays. Views make the blocks cheap to create, because a span is only a pointer and a length.` },

const TOTAL = problems.length;
const KEY = "cpp-perf-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 8, label: "Easy", range: "Problems 1–8", badge: "easy" },
  { from: 9, to: 25, label: "Medium", range: "Problems 9–25", badge: "medium" },
  { from: 26, to: 33, label: "Hard", range: "Problems 26–33", badge: "hard" },
  { from: 34, to: 45, label: "Extension", range: "Problems 34–45", badge: null },
  { from: 46, to: 88, label: "Applications", range: "Problems 46–88", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
