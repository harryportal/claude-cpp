const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Build by appending",
  p: String.raw`Start with the string ab. Add c with +=, then append de. Print the result.`,
  ex: String.raw`abcde`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    std::string s = "ab";
    s += "c";
    s.append("de");
    std::cout << s << '\n';
}`,
  why: String.raw`operator+= and append both add to the end of the string, growing its buffer as needed.` },

{ n: 2, d: "easy", t: "Size and emptiness",
  p: String.raw`Print the size of the string hello, then whether it is empty as true or false, separated by a space.`,
  ex: String.raw`5 false`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string s = "hello";
    std::cout << s.size() << ' ' << std::boolalpha << s.empty() << '\n';
}`,
  why: String.raw`size counts characters, not bytes of any particular encoding. A string is empty exactly when its size is zero.` },

{ n: 3, d: "easy", t: "at() checks the index",
  p: String.raw`For the string abc, print the character at index 1. Then try index 10 with at, and print bad if it throws std::out_of_range. Separate the two results with a space.`,
  ex: String.raw`b bad`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <string>

int main() {
    const std::string s = "abc";
    std::cout << s.at(1) << ' ';
    try {
        std::cout << s.at(10);
    } catch (const std::out_of_range&) {
        std::cout << "bad";
    }
    std::cout << '\n';
}`,
  why: String.raw`at throws std::out_of_range for an invalid index, while operator[] leaves the check to you.` },

{ n: 4, d: "easy", t: "Find a substring",
  p: String.raw`Print the index where the substring lo first appears in hello.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string s = "hello";
    std::cout << s.find("lo") << '\n';
}`,
  why: String.raw`find returns the position of the first match, or npos when there is none.` },

{ n: 5, d: "easy", t: "npos means not found",
  p: String.raw`Check whether the character z appears in the string hello, by comparing find's result with npos. Print true if it is not found.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string s = "hello";
    std::cout << std::boolalpha << (s.find('z') == std::string::npos) << '\n';
}`,
  why: String.raw`npos is the largest possible size_t value, so it can never be a valid position. Compare with it explicitly.` },

{ n: 6, d: "easy", t: "Extract a suffix",
  p: String.raw`From the string hello world, print the substring that starts at index 6.`,

#include <string>

int main() {
    const std::string s = "hello world";
    std::cout << s.substr(6) << '\n';
}`,

{ n: 7, d: "easy", t: "Lexicographic comparison",
  p: String.raw`Compare apple with banana using the compare member. Print true if the result is negative.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string a = "apple", b = "banana";
    std::cout << std::boolalpha << (a.compare(b) < 0) << '\n';
}`,
  why: String.raw`compare returns a negative, zero or positive value. Strings compare character by character, so a comes before b.` },

{ n: 8, d: "easy", t: "Insert characters",
  p: String.raw`Start with ace. Insert b at index 1, then insert d at index 3. Print the result.`,
  ex: String.raw`abcde`,
  code: String.raw`#include <iostream>
#include <string>

    std::string s = "ace";

    std::cout << s << '\n';
}`,

{ n: 9, d: "easy", t: "Erase a range",
  p: String.raw`Start with hello. Erase the three characters starting at index 1, then print the result.`,
  ex: String.raw`ho`,

#include <string>

    std::string s = "hello";

}`,

{ n: 10, d: "easy", t: "Replace a character",
  p: String.raw`Start with a-b-c. Replace the single character at index 1 with +. Print the result.`,

#include <string>

    std::string s = "a-b-c";

}`,

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Count words in a sentence",
  p: String.raw`Count the words in the sentence "the quick  brown", which has two spaces between quick and brown. Print the count.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <sstream>
#include <string>

int main() {
    std::istringstream in("the quick  brown");
    int words = 0;
    for (std::string w; in >> w;) ++words;
    std::cout << words << '\n';
}`,
  why: String.raw`Stream extraction skips any run of whitespace, so repeated spaces do not create empty words.` },

{ n: 12, d: "medium", t: "Split on a delimiter keeping empty fields",
  p: String.raw`Split the string a,b,,c on each comma, keeping empty fields. Print the fields separated by a bar.`,
  ex: String.raw`a|b||c`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string s = "a,b,,c";
    std::string out;
    bool first = true;
    std::size_t start = 0;
    while (true) {
        const std::size_t pos = s.find(',', start);
        if (!first) out += '|';
        out += s.substr(start, pos == std::string::npos ? std::string::npos : pos - start);
        first = false;
        if (pos == std::string::npos) break;
        start = pos + 1;
    }
    std::cout << out << '\n';
}`,
  why: String.raw`Each field runs from the previous delimiter to the next one. When no delimiter remains, the last field is everything left, which keeps empty fields in the middle.` },

{ n: 13, d: "medium", t: "Trim surrounding whitespace",
  p: String.raw`Trim the leading and trailing spaces and tabs from the string "  hi there" followed by a space and a tab. Print the result inside square brackets.`,
  ex: String.raw`[hi there]`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string s = "  hi there \t";
    const auto first = s.find_first_not_of(" \t");
    const auto last = s.find_last_not_of(" \t");
    std::cout << '[' << s.substr(first, last - first + 1) << "]\n";
}`,
  why: String.raw`find_first_not_of and find_last_not_of locate the first and last characters that are not whitespace, and substr keeps what lies between them.` },

{ n: 14, d: "medium", t: "Reverse the order of words",
  p: String.raw`Reverse the order of the words in the sentence one two three and print the result with single spaces between the words.`,
  ex: String.raw`three two one`,
  code: String.raw`#include <iostream>
#include <sstream>
#include <string>
#include <vector>

int main() {
    std::istringstream in("one two three");
    std::vector<std::string> words;
    for (std::string w; in >> w;) words.push_back(w);
    std::string out;
    for (auto it = words.rbegin(); it != words.rend(); ++it) {
        if (!out.empty()) out += ' ';
        out += *it;
    }
    std::cout << out << '\n';
}`,
  why: String.raw`Collecting the words first lets the output walk them backwards and join them with single spaces.` },

{ n: 15, d: "medium", t: "Palindrome ignoring case and punctuation",
  p: String.raw`Check whether the phrase A man, a plan, a canal: Panama reads the same forwards and backwards when letters are compared without case and punctuation is ignored. Print true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <string>

int main() {
    const std::string s = "A man, a plan, a canal: Panama";
    std::string clean;
    for (unsigned char c : s)
        if (std::isalnum(c)) clean += static_cast<char>(std::tolower(c));
    bool ok = true;
    for (std::size_t i = 0, j = clean.size() - 1; i < j; ++i, --j)
        if (clean[i] != clean[j]) { ok = false; break; }
    std::cout << std::boolalpha << ok << '\n';
}`,
  why: String.raw`Filtering to lowercase letters and digits first reduces the question to a plain palindrome test with two indices moving inward.` },

{ n: 16, d: "medium", t: "Anagram check by sorting",
  p: String.raw`Check whether listen and silent are anagrams of each other. Print true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <string>

int main() {
    std::string a = "listen", b = "silent";
    std::sort(a.begin(), a.end());
    std::sort(b.begin(), b.end());
    std::cout << std::boolalpha << (a == b) << '\n';
}`,
  why: String.raw`Two strings are anagrams exactly when their sorted characters are equal, so sorting both reduces the test to one comparison.` },

{ n: 17, d: "medium", t: "Count vowels ignoring case",
  p: String.raw`Count the vowels a, e, i, o and u in the string Programming Language, ignoring case. Print the count.`,
  ex: String.raw`7`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <string>

int main() {
    const std::string s = "Programming Language";
    int count = 0;
    for (unsigned char c : s) {
        switch (std::tolower(c)) {
            case 'a': case 'e': case 'i': case 'o': case 'u': ++count; break;
            default: break;
        }
    }
    std::cout << count << '\n';
}`,
  why: String.raw`Converting each character to lowercase before the check makes one set of letters cover both cases.` },

{ n: 18, d: "medium", t: "Caesar shift with wrap-around",
  p: String.raw`Shift each lowercase letter of xyz abc forward by three places, wrapping z back to a. Leave spaces unchanged. Print the result.`,
  ex: String.raw`abc def`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    std::string s = "xyz abc";
    for (char& c : s)
        if (c >= 'a' && c <= 'z') c = static_cast<char>('a' + (c - 'a' + 3) % 26);
    std::cout << s << '\n';
}`,
  why: String.raw`Subtracting 'a' maps each letter to an index from 0 to 25, the modulo wraps it, and adding 'a' back gives the shifted letter.` },

{ n: 19, d: "medium", t: "Remove all spaces",
  p: String.raw`Remove every space from the string a b  c so only the letters remain. Print the result.`,
  ex: String.raw`abc`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <string>

int main() {
    std::string s = "a b  c";
    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
    std::cout << s << '\n';
}`,
  why: String.raw`remove shifts the kept characters to the front, and erase trims the leftover tail. Together they remove every match in one pass.` },

{ n: 20, d: "medium", t: "Uppercase a string",
  p: String.raw`Convert the string Hello, World to uppercase and print it.`,
  ex: String.raw`HELLO, WORLD`,
  code: String.raw`#include <algorithm>
#include <cctype>
#include <iostream>
#include <string>

int main() {
    std::string s = "Hello, World";
    std::transform(s.begin(), s.end(), s.begin(),
                   [](unsigned char c) { return static_cast<char>(std::toupper(c)); });
    std::cout << s << '\n';
}`,
  why: String.raw`Casting to unsigned char before toupper avoids undefined behaviour on negative char values. transform writes the result back into the same string.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Longest common prefix",
  p: String.raw`Find the longest common prefix of the strings flower, flow and flight. Print it.`,
  ex: String.raw`fl`,
  code: String.raw`#include <iostream>
#include <string>
#include <vector>

int main() {
    const std::vector<std::string> words{"flower", "flow", "flight"};
    std::string prefix = words.front();
    for (const auto& w : words) {
        std::size_t i = 0;
        while (i < prefix.size() && i < w.size() && prefix[i] == w[i]) ++i;
        prefix.resize(i);
    }
    std::cout << prefix << '\n';
}`,
  why: String.raw`Start with the first word and shrink it to the part that matches each following word. The prefix can only get shorter, so one pass per word is enough.` },

{ n: 22, d: "hard", t: "Run-length decoding",
  p: String.raw`Decode the run-length string 3a2b1c, where each number says how many times the following letter repeats. Print the decoded string.`,
  ex: String.raw`aaabbc`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <string>

int main() {
    const std::string enc = "3a2b1c";
    std::string out;
    std::size_t i = 0;
    while (i < enc.size()) {
        std::size_t count = 0;
        while (std::isdigit(static_cast<unsigned char>(enc[i]))) {
            count = count * 10 + (enc[i] - '0');
            ++i;
        }
        out.append(count, enc[i]);
        ++i;
    }
    std::cout << out << '\n';
}`,
  why: String.raw`The digits before each letter form a count, which append(count, c) writes in one call. Multi-digit counts work because each digit shifts the running total by a factor of ten.` },

{ n: 23, d: "hard", t: "View a slice without copying",
  p: String.raw`Create a string_view over the string hello world. Take the first five characters as a second view, print that view, then print true if its data pointer equals the original string's data pointer. Separate the two results with a space.`,
  ex: String.raw`hello true`,
  code: String.raw`#include <iostream>
#include <string>
#include <string_view>

int main() {
    const std::string s = "hello world";
    const std::string_view sv = s;
    const std::string_view head = sv.substr(0, 5);
    std::cout << head << ' ' << std::boolalpha << (head.data() == s.data()) << '\n';
}`,
  why: String.raw`A string_view only refers to characters owned by another object. Taking a substring adjusts the pointer and length, so no characters are copied.` },

{ n: 26, d: "hard", t: "Find all occurrences",

  ex: String.raw`0 3 5`,

#include <string>

int main() {
    const std::string s = "abcabab", pat = "ab";

}`,

{ n: 27, d: "hard", t: "Reserve capacity ahead of growth",

#include <string>

int main() {

}`,

  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string a = "waterbottle", b = "erbottlewat";
    const bool rotation = a.size() == b.size() && (a + a).find(b) != std::string::npos;

{ n: 30, d: "hard", t: "Edit distance",
  p: String.raw`Compute the minimum number of single-character insertions, deletions and substitutions needed to turn kitten into sitting. Print the number.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

int main() {
    const std::string a = "kitten", b = "sitting";
    std::vector<std::vector<int>> dp(a.size() + 1, std::vector<int>(b.size() + 1, 0));
    for (std::size_t i = 0; i <= a.size(); ++i) dp[i][0] = static_cast<int>(i);
    for (std::size_t j = 0; j <= b.size(); ++j) dp[0][j] = static_cast<int>(j);
    for (std::size_t i = 1; i <= a.size(); ++i)
        for (std::size_t j = 1; j <= b.size(); ++j) {
            const int cost = a[i - 1] == b[j - 1] ? 0 : 1;
            dp[i][j] = std::min({dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost});
        }
    std::cout << dp[a.size()][b.size()] << '\n';
}`,
  why: String.raw`dp[i][j] is the cost of turning the first i characters of a into the first j of b. Each cell takes the cheapest of deleting, inserting, or matching or substituting the last characters.` },

const TOTAL = problems.length;
const KEY = "stl-string-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 56, label: "Easy", range: "Problems 1–56", badge: "easy" },
  { from: 11, to: 58, label: "Medium", range: "Problems 11–58", badge: "medium" },
  { from: 21, to: 30, label: "Hard", range: "Problems 21–30", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
