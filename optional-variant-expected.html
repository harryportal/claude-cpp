<script>
const problems = [
{ n: 1, d: "easy", t: "Empty or filled",
  p: String.raw`Create an optional holding an int that holds no value, and print 1 if it is empty and 0 otherwise. Print the result, then a newline.`,
  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> o;
    std::cout << (o.has_value() ? 0 : 1) << "\n";
}`,
  why: String.raw`A default-constructed optional is empty. has_value reports whether it holds a value, which is distinct from holding a zero.` },

{ n: 2, d: "easy", t: "Reading a stored number",
  p: String.raw`Store 42 in an optional int, then print the stored value, then a newline.`,
  ex: String.raw`42`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> o = 42;
    std::cout << *o << "\n";
}`,
  why: String.raw`Dereferencing an engaged optional gives the stored value. Dereferencing an empty one is undefined behaviour, so the program must check first.` },

{ n: 3, d: "easy", t: "Fallback value",
  p: String.raw`An optional int holds no value. Print the value it gives when asked for a fallback of 7, then a newline.`,
  ex: String.raw`7`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> o;
    std::cout << o.value_or(7) << "\n";
}`,
  why: String.raw`value_or returns the stored value if there is one and the given fallback otherwise, without ever dereferencing an empty optional.` },

{ n: 4, d: "easy", t: "Clearing a value",
  p: String.raw`Store 5 in an optional int, then clear it. Print 1 if it still holds a value and 0 otherwise, then a newline.`,
  ex: String.raw`0`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> o = 5;
    o.reset();
    std::cout << (o.has_value() ? 1 : 0) << "\n";
}`,
  why: String.raw`Clearing an optional destroys the held object and leaves it empty, without any separate notion of a null value.` },

{ n: 5, d: "easy", t: "Length of stored text",
  p: String.raw`Store the text hello in an optional string using in-place construction, then print its length, then a newline.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <optional>
#include <string>

int main() {
    std::optional<std::string> o;
    o.emplace("hello");
    std::cout << o->size() << "\n";
}`,
  why: String.raw`emplace constructs the held object directly inside the optional, and the arrow operator gives access to its members.` },

{ n: 6, d: "easy", t: "Safe division",
  p: String.raw`Write a function that divides two integers and returns an optional result that is empty when the divisor is zero. Print the result of 10 divided by 2, then the result of 1 divided by 0, separated by a space, using -1 for an empty result. Print them, then a newline.`,
  ex: String.raw`5 -1`,
  code: String.raw`#include <iostream>
#include <optional>

std::optional<int> divide(int a, int b) {
    if (b == 0) return std::nullopt;
    return a / b;
}

int main() {
    std::cout << divide(10, 2).value_or(-1) << ' ' << divide(1, 0).value_or(-1) << "\n";
}`,
  why: String.raw`Returning an empty optional signals failure in the return type itself, so callers cannot ignore it the way they might ignore a sentinel value.` },

{ n: 7, d: "easy", t: "Presence in a condition",
  p: String.raw`Store 0 in an optional int. Print yes if it holds a value and no otherwise, then a newline.`,
  ex: String.raw`yes`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> o = 0;
    std::cout << (o ? "yes" : "no") << "\n";
}`,
  why: String.raw`Testing an optional in a condition asks whether it holds a value, not whether the value is true. Zero is a value like any other.` },

{ n: 8, d: "easy", t: "Empty compares as smallest",
  p: String.raw`Print 1 if an empty optional int compares less than an optional int holding 0, and 0 otherwise, then a newline.`,
  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::cout << (std::optional<int>{} < std::optional<int>{0}) << "\n";
}`,
  why: String.raw`Comparing optionals orders an empty one before any engaged one, and compares engaged ones by their values.` },

{ n: 9, d: "easy", t: "Which type is active",
  p: String.raw`Create a variant that can hold either an int or a string, and set it to the int 3. Print the position of the active alternative, counting from 0, then a newline.`,
  ex: String.raw`0`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = 3;
    std::cout << v.index() << "\n";
}`,
  why: String.raw`A variant always holds exactly one alternative. index reports its position in the list of allowed types.` },

{ n: 10, d: "easy", t: "Reading a text alternative",
  p: String.raw`Set a variant that can hold either an int or a string to the text hi, and print the stored text, then a newline.`,
  ex: String.raw`hi`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = std::string("hi");
    std::cout << std::get<std::string>(v) << "\n";
}`,
  why: String.raw`get with a type selects the alternative of that type, and throws if a different alternative is active.` },

{ n: 11, d: "medium", t: "Position of the active text",
  p: String.raw`Set a variant that can hold either an int or a string to the text hi, then print the position of the active alternative, counting from 0, then a newline.`,
  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = std::string("hi");
    std::cout << v.index() << "\n";
}`,
  why: String.raw`The position follows the order of the types in the template argument list, not the order of assignments.` },

{ n: 12, d: "medium", t: "Is it a text value",
  p: String.raw`A variant that can hold an int or a string currently holds the int 9. Print 1 if it holds a string and 0 otherwise, then a newline.`,
  ex: String.raw`0`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = 9;
    std::cout << (std::holds_alternative<std::string>(v) ? 1 : 0) << "\n";
}`,
  why: String.raw`holds_alternative answers a yes-or-no question about the active type without risking an exception.` },

{ n: 13, d: "medium", t: "Peeking without throwing",
  p: String.raw`A variant that can hold an int or a string holds the int 9. Ask for its string value in a way that does not throw. Print 1 if no string is returned and 0 otherwise, then a newline.`,
  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = 9;
    std::cout << (std::get_if<std::string>(&v) == nullptr ? 1 : 0) << "\n";
}`,
  why: String.raw`get_if returns a pointer to the alternative, or nullptr when a different alternative is active, which makes the failure case explicit.` },

{ n: 14, d: "medium", t: "Handling each alternative",
  p: String.raw`Describe the variant holding the int 4, then the variant holding the text ab, printing int:4 and string:ab on separate lines in that order. Print both lines, then a newline.`,
  ex: String.raw`int:4
string:ab`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

template <class... Ts>
struct Overloaded : Ts... {
    using Ts::operator()...;
};
template <class... Ts>
Overloaded(Ts...) -> Overloaded<Ts...>;

int main() {
    auto describe = Overloaded{
        [](int x) { std::cout << "int:" << x << "\n"; },
        [](const std::string& s) { std::cout << "string:" << s << "\n"; }};
    std::variant<int, std::string> a = 4;
    std::variant<int, std::string> b = std::string("ab");
    std::visit(describe, a);
    std::visit(describe, b);
}`,
  why: String.raw`visit calls the function object matching the active alternative. Overloading a set of lambdas gives exhaustive, compile-time-checked handling of every type.` },

{ n: 15, d: "medium", t: "Replacing the stored value",
  p: String.raw`Set a variant that can hold an int or a string to 1, then replace it with the text hello, and print the length of the stored text, then a newline.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = 1;
    v = std::string("hello");
    std::cout << std::get<std::string>(v).size() << "\n";
}`,
  why: String.raw`Assigning a value of another alternative destroys the old one and makes the new alternative active.` },

{ n: 16, d: "medium", t: "Wrong type access",
  p: String.raw`Set a variant that can hold an int or a string to 5, then try to read it as a string. Print caught if the attempt fails, and ok otherwise, then a newline.`,
  ex: String.raw`caught`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = 5;
    try {
        std::get<std::string>(v);
        std::cout << "ok\n";
    } catch (const std::bad_variant_access&) {
        std::cout << "caught\n";
    }
}`,
  why: String.raw`get with the wrong type throws bad_variant_access. get_if is the non-throwing alternative when a mismatch is expected.` },

{ n: 17, d: "medium", t: "Default state",
  p: String.raw`Create a variant that can hold either a placeholder with no data or an int, and leave it in its default state. Print the position of its active alternative, counting from 0, then a newline.`,
  ex: String.raw`0`,
  code: String.raw`#include <iostream>
#include <variant>

int main() {
    std::variant<std::monostate, int> v;
    std::cout << v.index() << "\n";
}`,
  why: String.raw`A variant's default state holds its first alternative, so monostate is the usual choice when the first type should be an empty placeholder.` },

{ n: 18, d: "medium", t: "Totalling mixed numbers",
  p: String.raw`A vector holds the variants 1, 2.5 and 4, where each is either an int or a double. Print their total as a number, then a newline.`,
  ex: String.raw`7.5`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

int main() {
    std::vector<std::variant<int, double>> xs{1, 2.5, 4};
    double total = 0;
    for (const auto& x : xs)
        total += std::visit([](auto v) { return static_cast<double>(v); }, x);
    std::cout << total << "\n";
}`,
  why: String.raw`A generic lambda passed to visit compiles one branch per alternative, so each element is converted using the type it actually holds.` },

{ n: 19, d: "medium", t: "Transforming an optional",
  p: String.raw`Store 5 in an optional int, transform it by doubling the value while keeping the result optional, and print the result with 0 as the fallback, then a newline.`,
  ex: String.raw`10`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> o = 5;
    std::cout << o.transform([](int x) { return x * 2; }).value_or(0) << "\n";
}`,
  why: String.raw`transform applies a function only when a value is present, and returns an empty optional otherwise, so a chain of steps needs no explicit checks.` },

{ n: 20, d: "medium", t: "Chaining steps that can fail",
  p: String.raw`Starting from 40, subtract 10, then divide by 5, where the result is empty if the value is negative. Print the final value, or -1 if any step failed, then a newline.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    auto subtract_ten = [](int x) -> std::optional<int> { return x - 10; };
    auto divide_five = [](int x) -> std::optional<int> {
        if (x < 0) return std::nullopt;
        return x / 5;
    };
    auto r = std::optional<int>{40}.and_then(subtract_ten).and_then(divide_five);
    std::cout << r.value_or(-1) << "\n";
}`,
  why: String.raw`and_then runs the next step only when the previous one produced a value, so the first failure carries through to the end of the chain.` },

{ n: 21, d: "medium", t: "Counting engaged entries",
  p: String.raw`A vector holds the optional ints 1, empty, 3 and empty. Print how many of them hold a value, then a newline.`,
  ex: String.raw`2`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <optional>
#include <vector>

int main() {
    std::vector<std::optional<int>> v{1, std::nullopt, 3, std::nullopt};
    std::cout << std::count_if(v.begin(), v.end(),
                               [](const std::optional<int>& o) { return o.has_value(); })
              << "\n";
}`,
  why: String.raw`Each optional is a self-describing element, so an ordinary algorithm can count the engaged ones with a predicate.` },

{ n: 22, d: "medium", t: "Expected with a message",
  p: String.raw`Write a function that returns the number when it is positive, and otherwise returns the message not positive. Call it with -4 and print the result, which is the message, then a newline.`,
  ex: String.raw`not positive`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

std::expected<int, std::string> positive(int x) {
    if (x > 0) return x;
    return std::unexpected("not positive");
}

int main() {
    auto r = positive(-4);
    std::cout << (r ? std::to_string(*r) : r.error()) << "\n";
}`,
  why: String.raw`expected holds either the success value or the error, so the caller must look at it before using either one.` },

{ n: 23, d: "hard", t: "Chain of checks that succeeds",
  p: String.raw`Write a function that halves an even number and fails on an odd number with the message odd. Apply it three times in a row starting at 8, then print the final value, then a newline.`,
  ex: String.raw`1`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

std::expected<int, std::string> half(int x) {
    if (x % 2 != 0) return std::unexpected("odd");
    return x / 2;
}

int main() {
    auto r = half(8).and_then(half).and_then(half);
    std::cout << r.value() << "\n";
}`,
  why: String.raw`and_then continues along the success path and stops at the first error, so a sequence of fallible steps reads as a single expression.` },

{ n: 24, d: "hard", t: "Chain of checks that fails",
  p: String.raw`Apply the same halving rule to 12 three times in a row. Print the value if every step succeeds, and otherwise print the message from the failing step, then a newline.`,
  ex: String.raw`odd`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

std::expected<int, std::string> half(int x) {
    if (x % 2 != 0) return std::unexpected("odd");
    return x / 2;
}

int main() {
    auto r = half(12).and_then(half).and_then(half);
    if (r) std::cout << *r << "\n";
    else std::cout << r.error() << "\n";
}`,
  why: String.raw`12 becomes 6, then 3. The third step fails on the odd value 3, and that error is what the whole chain returns.` },

{ n: 25, d: "hard", t: "Transforming a success",
  p: String.raw`Start with a successful result holding 4, and square the value using a transformation that keeps the result as a success. Print the value, then a newline.`,
  ex: String.raw`16`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

int main() {
    std::expected<int, std::string> e = 4;
    auto r = e.transform([](int x) { return x * x; });
    std::cout << r.value() << "\n";
}`,
  why: String.raw`transform applies a function to the success value and leaves an error untouched, so the error type does not change.` },

{ n: 26, d: "hard", t: "Recovering from an error",
  p: String.raw`Start with an error holding the text bad, and recover from it by producing the value 0. Print the recovered value, then a newline.`,
  ex: String.raw`0`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

int main() {
    std::expected<int, std::string> e = std::unexpected("bad");
    auto r = e.or_else([](const std::string&) {
        return std::expected<int, std::string>(0);
    });
    std::cout << r.value() << "\n";
}`,
  why: String.raw`or_else runs only on the error path and can turn an error back into a success, which is the opposite of and_then.` },

{ n: 27, d: "hard", t: "Changing the error type",
  p: String.raw`Start with an error holding the text abc, and convert the error into the length of that text. Print the converted error, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

int main() {
    std::expected<int, std::string> e = std::unexpected("abc");
    std::expected<int, std::size_t> m = e ? std::expected<int, std::size_t>(*e)
                                          : std::unexpected(e.error().size());
    std::cout << m.error() << "\n";
}`,
  why: String.raw`Converting to a result with a different error type keeps successes unchanged and rewrites only the error, which is the job the standard map_error function does where the library provides it.` },

{ n: 28, d: "hard", t: "Parsing numbers from text",
  p: String.raw`Write a function that reads an integer from text and returns either the number or the message invalid. Show the result for the text 42 and for the text x, printing the number or message for each, separated by a space, then a newline.`,
  ex: String.raw`42 invalid`,
  code: String.raw`#include <charconv>
#include <expected>
#include <iostream>
#include <string>
#include <string_view>

std::expected<int, std::string> parse(std::string_view s) {
    int v{};
    auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
    if (ec != std::errc{} || p != s.data() + s.size()) return std::unexpected("invalid");
    return v;
}

int main() {
    auto show = [](const std::expected<int, std::string>& r) {

{ n: 32, d: "extension", t: "Summing a recursive tree",
  p: String.raw`Model a tree whose leaves are integers and whose inner nodes hold a list of children. Build a tree with the leaf 1, followed by a node holding the leaves 2 and 3, and print the sum of all leaves, then a newline.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>
#include <type_traits>
#include <variant>
#include <vector>

struct Node {
    std::variant<int, std::vector<Node>> v;
};

int sum(const Node& n) {
    return std::visit([](const auto& x) -> int {
        using T = std::decay_t<decltype(x)>;
        if constexpr (std::is_same_v<T, int>) {
            return x;
        } else {
            int s = 0;
            for (const auto& child : x) s += sum(child);
            return s;
        }
    }, n.v);
}

int main() {
    Node root{std::vector<Node>{Node{1}, Node{std::vector<Node>{Node{2}, Node{3}}}}};
    std::cout << sum(root) << "\n";
}`,
  why: String.raw`A variant can hold either a leaf value or a collection of child nodes, and visit with if constexpr handles each case. This is the same shape as many expression and syntax trees.` },

// ---------- Applications ----------
{ n: 38, d: "applications", t: "Decode a venue message feed",
  p: String.raw`A venue sends one message per line in three forms: NEW id symbol quantity price, CXL id, and FILL id quantity. The price is written in dollars with exactly two decimals, such as 101.50. Decode every line. A line that is not one of the three forms gives unknown_type. A line with too few fields gives missing_field. A number that does not parse, or a price without exactly two decimals, gives bad_number. For each line print ok followed by the message kind (new, cancel or fill), or err followed by the error name, each on its own line.`,
  ex: String.raw`ok:new
ok:cancel
ok:fill
err:unknown_type
err:bad_number
err:missing_field`,
  code: String.raw`#include <charconv>
#include <cstdint>
#include <expected>
#include <iostream>
#include <sstream>
#include <string>
#include <variant>
#include <vector>

enum class DecodeError { UnknownType, MissingField, BadNumber };

struct NewOrder { std::int64_t id; std::string sym; std::int64_t qty; std::int64_t px_cents; };
struct Cancel { std::int64_t id; };
struct Fill { std::int64_t id; std::int64_t qty; };
using Msg = std::variant<NewOrder, Cancel, Fill>;

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

const char* name(DecodeError e) {
    switch (e) {
        case DecodeError::UnknownType: return "unknown_type";
        case DecodeError::MissingField: return "missing_field";
        case DecodeError::BadNumber: return "bad_number";
    }
    return "?";
}

template <class T>
std::expected<T, DecodeError> number(const std::string& s) {
    T v{};
    auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
    if (ec != std::errc{} || p != s.data() + s.size()) return std::unexpected(DecodeError::BadNumber);
    return v;
}

std::expected<std::int64_t, DecodeError> price_cents(const std::string& s) {
    auto dot = s.find('.');
    if (dot == std::string::npos || s.size() - dot - 1 != 2) return std::unexpected(DecodeError::BadNumber);
    auto whole = number<std::int64_t>(s.substr(0, dot));
    auto frac = number<std::int64_t>(s.substr(dot + 1));
    if (!whole || !frac) return std::unexpected(DecodeError::BadNumber);
    return *whole * 100 + *frac;
}

std::expected<Msg, DecodeError> decode(const std::string& line) {
    std::istringstream in(line);
    std::vector<std::string> t;
    for (std::string w; in >> w;) t.push_back(w);
    if (t.empty()) return std::unexpected(DecodeError::UnknownType);
    if (t[0] == "NEW") {
        if (t.size() < 5) return std::unexpected(DecodeError::MissingField);
        auto id = number<std::int64_t>(t[1]);
        auto qty = number<std::int64_t>(t[3]);
        auto px = price_cents(t[4]);
        if (!id) return std::unexpected(id.error());
        if (!qty) return std::unexpected(qty.error());
        if (!px) return std::unexpected(px.error());
        return NewOrder{*id, t[2], *qty, *px};
    }
    if (t[0] == "CXL") {
        if (t.size() < 2) return std::unexpected(DecodeError::MissingField);
        auto id = number<std::int64_t>(t[1]);
        if (!id) return std::unexpected(id.error());
        return Cancel{*id};
    }
    if (t[0] == "FILL") {
        if (t.size() < 3) return std::unexpected(DecodeError::MissingField);
        auto id = number<std::int64_t>(t[1]);
        auto qty = number<std::int64_t>(t[2]);
        if (!id) return std::unexpected(id.error());
        if (!qty) return std::unexpected(qty.error());
        return Fill{*id, *qty};
    }
    return std::unexpected(DecodeError::UnknownType);
}

int main() {
    const std::vector<std::string> feed{
        "NEW 1 AAPL 100 101.50", "CXL 1", "FILL 1 40", "BOGUS", "NEW x AAPL 100 101.50", "FILL 1"};
    for (const auto& line : feed) {
        auto r = decode(line);
        if (!r) { std::cout << "err:" << name(r.error()) << "\n"; continue; }
        std::visit(Overloaded{
            [](const NewOrder&) { std::cout << "ok:new\n"; },
            [](const Cancel&) { std::cout << "ok:cancel\n"; },
            [](const Fill&) { std::cout << "ok:fill\n"; }}, *r);
    }
}`,
  why: String.raw`Each stage returns either a value or a named reason, so a bad line is reported precisely without throwing, and the variant forces every message kind to be handled.` },

{ n: 39, d: "applications", t: "Resolve settings across configuration layers",
  p: String.raw`A service reads settings from three layers. The environment layer has highest precedence, then the file layer, then built-in defaults. The environment sets venue to NYSE. The file sets max_orders to 500. The defaults set max_orders to 100 and venue to SIM. For each of the keys max_orders, venue and timeout, print the effective value followed by the layer it came from in brackets, as key=value (layer). If no layer sets the key, print key=unset.`,
  ex: String.raw`max_orders=500 (file)
venue=NYSE (env)
timeout=unset`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>
#include <utility>
#include <vector>

struct Layer {
    std::string name;
    std::map<std::string, std::string> values;
};

std::optional<std::pair<std::string, std::string>> resolve(const std::string& key, const std::vector<Layer>& layers) {
    for (const auto& layer : layers) {
        auto it = layer.values.find(key);
        if (it != layer.values.end()) return std::pair{it->second, layer.name};
    }
    return std::nullopt;
}

int main() {
    const std::vector<Layer> layers{
        {"env", {{"venue", "NYSE"}}},
        {"file", {{"max_orders", "500"}}},
        {"defaults", {{"max_orders", "100"}, {"venue", "SIM"}}},
    };
    for (std::string key : {"max_orders", "venue", "timeout"}) {
        std::string line = resolve(key, layers)
            .transform([&](const auto& p) { return key + "=" + p.first + " (" + p.second + ")"; })
            .value_or(key + "=unset");
        std::cout << line << "\n";
    }
}`,
  why: String.raw`Looking up each key from highest to lowest precedence gives the value and its origin together, and an absent key falls through to a clear unset result.` },

{ n: 40, d: "applications", t: "Pre-trade risk pipeline",
  p: String.raw`Orders pass through three pre-trade checks in order. First, the quantity must be positive, otherwise the order is rejected for size. Second, the symbol must be in the tradable universe AAPL or MSFT, otherwise it is rejected for symbol. Third, the notional, meaning quantity times price in cents, must not exceed 2000000 cents, otherwise it is rejected for notional. An order that passes all three is accepted and its notional is reported. Check these four orders, in order: AAPL 100 shares at 10150 cents; AAPL 30000 shares at 10150 cents; ZZZZ 10 shares at 100 cents; AAPL 0 shares at 10150 cents. For each, print ok followed by the notional if accepted, or the rejection reason such as reject size, one per line.`,
  ex: String.raw`ok 1015000
reject notional
reject symbol
reject size`,
  code: String.raw`#include <cstdint>
#include <expected>
#include <iostream>
#include <set>
#include <string>

enum class RiskError { BadSize, UnknownSymbol, NotionalExceeded };

struct Order { std::string sym; std::int64_t qty; std::int64_t px_cents; };

constexpr std::int64_t kNotionalLimit = 2000000;

std::expected<Order, RiskError> check_size(Order o) {
    if (o.qty <= 0) return std::unexpected(RiskError::BadSize);
    return o;
}

std::expected<Order, RiskError> check_symbol(Order o) {
    static const std::set<std::string> universe{"AAPL", "MSFT"};
    if (!universe.contains(o.sym)) return std::unexpected(RiskError::UnknownSymbol);
    return o;
}

std::expected<std::int64_t, RiskError> check_notional(Order o) {
    const std::int64_t notional = o.qty * o.px_cents;
    if (notional > kNotionalLimit) return std::unexpected(RiskError::NotionalExceeded);
    return notional;
}

const char* name(RiskError e) {
    switch (e) {
        case RiskError::BadSize: return "reject size";
        case RiskError::UnknownSymbol: return "reject symbol";
        case RiskError::NotionalExceeded: return "reject notional";
    }
    return "reject";
}

int main() {
    const Order orders[] = {
        {"AAPL", 100, 10150},
        {"AAPL", 30000, 10150},
        {"ZZZZ", 10, 100},
        {"AAPL", 0, 10150},
    };
    for (const Order& o : orders) {
        auto r = check_size(o).and_then(check_symbol).and_then(check_notional);
        if (r) std::cout << "ok " << *r << "\n";
        else std::cout << name(r.error()) << "\n";
    }
}`,
  why: String.raw`Chaining the checks with and_then stops at the first failure and carries its reason out, so each rule stays a small function that is easy to test on its own.` },

{ n: 41, d: "applications", t: "Quote cache with staleness",
  p: String.raw`A quote cache stores the latest bid, ask and update time for each symbol. AAPL has bid 100, ask 101 and was updated at time 10. MSFT has bid 200, ask 201 and was updated at time 30. A lookup at the current time 45 returns the quote only if it is no older than 30 time units. Look up AAPL, MSFT and GOOG, which is not in the cache. For a fresh quote print the symbol, bid and ask separated by spaces. For a stale or missing quote print the symbol followed by none.`,
  ex: String.raw`AAPL none
MSFT 200 201
GOOG none`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>

struct Quote { long long bid; long long ask; long long at; };

std::optional<Quote> fresh(const std::map<std::string, Quote>& cache, const std::string& sym, long long now, long long max_age) {
    auto it = cache.find(sym);
    if (it == cache.end()) return std::nullopt;
    if (now - it->second.at > max_age) return std::nullopt;
    return it->second;
}

int main() {
    const std::map<std::string, Quote> cache{
        {"AAPL", {100, 101, 10}},
        {"MSFT", {200, 201, 30}},
    };
    const long long now = 45, max_age = 30;
    for (std::string sym : {"AAPL", "MSFT", "GOOG"}) {
        auto q = fresh(cache, sym, now, max_age);
        if (q) std::cout << sym << ' ' << q->bid << ' ' << q->ask << "\n";
        else std::cout << sym << " none\n";
    }
}`,
  why: String.raw`Treating an old entry as absent at the point of lookup means a caller can never act on a price that has gone stale, without any separate cleanup step.` },

{ n: 42, d: "applications", t: "Account replay from an event log",
  p: String.raw`An account starts with 1000 cents of cash and zero rejected events. Events are applied in order. A deposit adds its amount. A withdrawal removes its amount if the cash is sufficient. A buy of a quantity at a price in cents costs quantity times price, and is applied only if the cash is sufficient. An event that cannot be applied because of insufficient cash is rejected and the account is left unchanged. Replay these events: deposit 500, buy 2 shares at 300 cents, withdraw 2000 cents. Print the final cash and the number of rejected events in the form cash=N rejected=M.`,
  ex: String.raw`cash=900 rejected=1`,
  code: String.raw`#include <cstdint>
#include <expected>
#include <iostream>
#include <variant>

struct Deposit { std::int64_t amt; };
struct Withdraw { std::int64_t amt; };
struct Buy { std::int64_t qty; std::int64_t px; };
using Event = std::variant<Deposit, Withdraw, Buy>;

struct Account { std::int64_t cash; int rejected; };

enum class Reject { Insufficient };

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

std::expected<Account, Reject> apply(Account a, const Event& e) {
    return std::visit(Overloaded{
        [&](const Deposit& d) -> std::expected<Account, Reject> {
            a.cash += d.amt;
            return a;
        },
        [&](const Withdraw& w) -> std::expected<Account, Reject> {
            if (w.amt > a.cash) return std::unexpected(Reject::Insufficient);
            a.cash -= w.amt;
            return a;
        },
        [&](const Buy& b) -> std::expected<Account, Reject> {
            const std::int64_t cost = b.qty * b.px;
            if (cost > a.cash) return std::unexpected(Reject::Insufficient);
            a.cash -= cost;
            return a;
        },
    }, e);
}

int main() {
    Account acc{1000, 0};
    const Event events[] = {Deposit{500}, Buy{2, 300}, Withdraw{2000}};
    for (const Event& e : events) {
        auto r = apply(acc, e);
        if (r) acc = *r;
        else ++acc.rejected;
    }
    std::cout << "cash=" << acc.cash << " rejected=" << acc.rejected << "\n";
}`,
  why: String.raw`Each event returns a new account state or a rejection, so a failed event cannot leave the account half-updated.` },

{ n: 43, d: "applications", t: "Parse a tag-value order message",
  p: String.raw`Parse a message made of tag=value fields separated by vertical bars. An order needs tag 55 for the symbol, 38 for the quantity, 44 for the price in cents and 54 for the side. If any of these tags is missing, the parse fails and the error names the first missing tag as missing tag N. Parse these two messages, in order: 35=D|55=AAPL|38=100|44=10150|54=1 and 35=D|55=MSFT|38=50|44=20000. For a successful parse print ok, the symbol, the quantity and the price, separated by spaces. For a failed parse print err followed by the error text.`,
  ex: String.raw`ok AAPL 100 10150
err missing tag 54`,
  code: String.raw`#include <expected>
#include <iostream>
#include <map>
#include <sstream>
#include <string>

struct Order { std::string sym; long long qty; long long px; };

std::expected<std::string, std::string> field(const std::map<int, std::string>& m, int tag) {
    auto it = m.find(tag);
    if (it == m.end()) return std::unexpected("missing tag " + std::to_string(tag));
    return it->second;
}

std::expected<Order, std::string> parse(const std::string& msg) {
    std::map<int, std::string> fields;
    std::istringstream in(msg);
    for (std::string kv; std::getline(in, kv, '|');) {
        auto eq = kv.find('=');
        fields[std::stoi(kv.substr(0, eq))] = kv.substr(eq + 1);
    }
    auto sym = field(fields, 55);
    if (!sym) return std::unexpected(sym.error());
    auto qty = field(fields, 38);
    if (!qty) return std::unexpected(qty.error());
    auto px = field(fields, 44);
    if (!px) return std::unexpected(px.error());
    auto side = field(fields, 54);
    if (!side) return std::unexpected(side.error());
    return Order{*sym, std::stoll(*qty), std::stoll(*px)};
}

int main() {
    for (std::string msg : {"35=D|55=AAPL|38=100|44=10150|54=1", "35=D|55=MSFT|38=50|44=20000"}) {
        auto r = parse(msg);
        if (r) std::cout << "ok " << r->sym << ' ' << r->qty << ' ' << r->px << "\n";
        else std::cout << "err " << r.error() << "\n";
    }
}`,
  why: String.raw`Each required field is checked in turn and the first failure is returned, so the caller learns exactly which tag is absent.` },

{ n: 44, d: "applications", t: "Retry a submission until it fills or is rejected",
  p: String.raw`An order is submitted to a gateway that answers each attempt with one of three responses: a timeout, a rejection with a reason, or a fill with a quantity. Submission stops at the first rejection or fill, and a timeout triggers another attempt, up to a maximum of three attempts. Two scripted sessions are run. The first session answers timeout, timeout, then a fill of 100. The second session answers with a rejection for insufficient margin on its first attempt. For a fill print filled, the quantity, after, the attempt number and attempts, as a single line. For a rejection print rejected: followed by the reason. If every attempt times out, print gave up after retries.`,
  ex: String.raw`filled 100 after 3 attempts
rejected: insufficient margin`,
  code: String.raw`#include <cstddef>
#include <expected>
#include <iostream>
#include <string>
#include <utility>
#include <variant>
#include <vector>

struct Timeout {};
struct Rejected { std::string reason; };
struct Filled { long long qty; };
using Response = std::variant<Timeout, Rejected, Filled>;

std::expected<std::pair<long long, std::size_t>, std::string> submit(const std::vector<Response>& script, std::size_t max_attempts) {
    for (std::size_t i = 0; i < max_attempts && i < script.size(); ++i) {
        const Response& r = script[i];
        if (std::holds_alternative<Timeout>(r)) continue;
        if (const auto* rej = std::get_if<Rejected>(&r)) return std::unexpected(rej->reason);
        return std::pair{std::get<Filled>(r).qty, i + 1};
    }
    return std::unexpected(std::string("gave up after retries"));
}

void report(const std::expected<std::pair<long long, std::size_t>, std::string>& r) {
    if (r) std::cout << "filled " << r->first << " after " << r->second << " attempts\n";
    else std::cout << "rejected: " << r.error() << "\n";
}

int main() {
    report(submit({Timeout{}, Timeout{}, Filled{100}}, 3));
    report(submit({Rejected{"insufficient margin"}}, 3));
}`,
  why: String.raw`Timeouts are the only response that leads to another attempt, and every other outcome ends the submission with its own value or reason.` },

{ n: 45, d: "applications", t: "Mark price with fallback",

  code: String.raw`#include <iostream>

struct Snapshot {
    std::optional<long long> bid, ask, last;
};

std::optional<long long> mark(const Snapshot& s) {

{ n: 49, d: "applications", t: "Connection state machine",
  p: String.raw`A connection is either idle, connecting with an attempt number, or connected with a session number. From idle, a connect event moves to connecting with attempt 1. From connecting, an acknowledgement carrying a session number moves to connected with that session. A connect event while connected is an error: already connected. Any other event in a state is an error: invalid transition. Apply these events in order to an idle connection: connect, then acknowledgement with session 42, then connect. Each error is printed as error: followed by the message, as soon as it happens. At the end, if the connection is connected, print connected session= followed by the session number.`,
  ex: String.raw`error: already connected
connected session=42`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>
#include <variant>
#include <vector>

struct Idle {};
struct Connecting { int attempt; };
struct Connected { int session; };
using State = std::variant<Idle, Connecting, Connected>;

struct Connect {};
struct Ack { int session; };
using Event = std::variant<Connect, Ack>;

std::expected<State, std::string> step(const State& s, const Event& e) {
    if (std::holds_alternative<Idle>(s) && std::holds_alternative<Connect>(e))
        return Connecting{1};
    if (std::holds_alternative<Connecting>(s) && std::holds_alternative<Ack>(e))
        return Connected{std::get<Ack>(e).session};
    if (std::holds_alternative<Connected>(s) && std::holds_alternative<Connect>(e))
        return std::unexpected(std::string("already connected"));
    return std::unexpected(std::string("invalid transition"));
}

int main() {
    State s = Idle{};
    for (const Event& e : std::vector<Event>{Connect{}, Ack{42}, Connect{}}) {
        auto r = step(s, e);
        if (r) s = *r;
        else std::cout << "error: " << r.error() << "\n";
    }
    if (const auto* c = std::get_if<Connected>(&s))
        std::cout << "connected session=" << c->session << "\n";
}`,
  why: String.raw`Encoding each state as its own type makes the legal transitions explicit, and anything not listed becomes a reported error instead of a silent change.` },

{ n: 50, d: "applications", t: "Parse log lines with optional fields",

  code: String.raw`#include <iostream>
#include <optional>
#include <sstream>
#include <string>

struct Entry {
    std::string level;
    std::optional<std::string> user;
    std::optional<int> code;
};

std::optional<Entry> parse_line(const std::string& line) {
    std::istringstream in(line);
    Entry e;
    if (!(in >> e.level)) return std::nullopt;

int main() {

        if (!e) { std::cout << "unparseable\n"; continue; }

{ n: 54, d: "applications", t: "Tokenize an arithmetic expression with error positions",
  p: String.raw`Split an arithmetic expression into tokens. A run of digits is a number token written as NUM followed by the digits. The operators plus, minus, star and slash become OP followed by the operator. Spaces are skipped. Any other character is an error reported as error at POSITION: unexpected CHARACTER, where POSITION is its 0-based index in the text. Tokenize these two expressions in order: 12 + 3 and 12 + 3x. Print each token on its own line, or the error message if tokenizing fails.`,
  ex: String.raw`NUM 12
OP +
NUM 3
error at 6: unexpected x`,
  code: String.raw`#include <cctype>
#include <expected>
#include <iostream>
#include <string>
#include <vector>

std::expected<std::vector<std::string>, std::string> tokenize(const std::string& s) {
    std::vector<std::string> out;
    std::size_t i = 0;
    while (i < s.size()) {
        const unsigned char c = static_cast<unsigned char>(s[i]);
        if (std::isspace(c)) {
            ++i;
        } else if (std::isdigit(c)) {
            std::size_t j = i;
            while (j < s.size() && std::isdigit(static_cast<unsigned char>(s[j]))) ++j;
            out.push_back("NUM " + s.substr(i, j - i));
            i = j;
        } else if (c == '+' || c == '-' || c == '*' || c == '/') {
            out.push_back(std::string("OP ") + static_cast<char>(c));
            ++i;
        } else {
            return std::unexpected("error at " + std::to_string(i) + ": unexpected " + static_cast<char>(c));
        }
    }
    return out;
}

int main() {
    for (std::string input : {"12 + 3", "12 + 3x"}) {
        auto r = tokenize(input);
        if (r) {
            for (const auto& t : *r) std::cout << t << "\n";
        } else {
            std::cout << r.error() << "\n";
        }
    }
}`,
  why: String.raw`A scanner that returns the first offending position lets a user fix the exact character, instead of getting a generic failure for the whole expression.` },

{ n: 56, d: "applications", t: "Exponential retry delays with a cap",
  p: String.raw`A retry policy waits base times 2 to the attempt number, in milliseconds, but never longer than a cap. The base is 100 ms, the cap is 1000 ms, and at most 5 attempts are allowed, numbered 0 to 4. Print the delay for attempts 0 to 5, separated by spaces. An attempt number at or beyond the limit has no delay, and prints stop.`,
  ex: String.raw`100 200 400 800 1000 stop`,
  code: String.raw`#include <iostream>
#include <optional>

std::optional<long long> backoff(int attempt, long long base, long long cap, int max_attempts) {
    if (attempt >= max_attempts) return std::nullopt;
    long long delay = base;
    for (int i = 0; i < attempt; ++i) {
        delay *= 2;
        if (delay >= cap) return cap;
    }
    return delay;
}

int main() {
    for (int attempt = 0; attempt <= 5; ++attempt) {
        auto d = backoff(attempt, 100, 1000, 5);
        if (d) std::cout << *d << ' ';
        else std::cout << "stop";
    }
    std::cout << "\n";
}`,
  why: String.raw`Returning an empty optional beyond the attempt limit makes "no more retries" a value the caller must check, rather than a special number.` },

{ n: 57, d: "applications", t: "Parse and compare semantic versions",
  p: String.raw`A version has three numeric parts separated by dots, such as 1.4.2. A string that does not have exactly three numeric parts is invalid. Parse these three inputs in order: 1.4.2, 1.10.0 and 1.x.2. For a valid version print ok followed by its parts. For an invalid input print err followed by the input. Then compare the first two valid versions and print A < B: yes if the first is lower, otherwise no, where A and B are the two versions as written.`,
  ex: String.raw`ok 1.4.2
ok 1.10.0
err 1.x.2
1.4.2 < 1.10.0: yes`,
  code: String.raw`#include <charconv>
#include <expected>
#include <iostream>
#include <sstream>
#include <string>
#include <tuple>
#include <vector>

struct Version { int major, minor, patch; };

std::expected<Version, std::string> parse_version(const std::string& s) {
    std::vector<int> parts;
    std::istringstream in(s);
    for (std::string piece; std::getline(in, piece, '.');) {
        int v = 0;
        auto [p, ec] = std::from_chars(piece.data(), piece.data() + piece.size(), v);
        if (ec != std::errc{} || p != piece.data() + piece.size()) return std::unexpected(s);
        parts.push_back(v);
    }
    if (parts.size() != 3) return std::unexpected(s);
    return Version{parts[0], parts[1], parts[2]};
}

bool less(const Version& a, const Version& b) {
    return std::tie(a.major, a.minor, a.patch) < std::tie(b.major, b.minor, b.patch);
}

int main() {
    std::vector<Version> ok;
    for (std::string s : {"1.4.2", "1.10.0", "1.x.2"}) {
        auto r = parse_version(s);
        if (r) {
            std::cout << "ok " << r->major << '.' << r->minor << '.' << r->patch << "\n";
            ok.push_back(*r);
        } else {
            std::cout << "err " << r.error() << "\n";
        }
    }
    std::cout << "1.4.2 < 1.10.0: " << (less(ok[0], ok[1]) ? "yes" : "no") << "\n";
}`,
  why: String.raw`Comparing the parsed numeric parts as a tuple gives correct ordering, where comparing the raw strings would put 1.10.0 before 1.4.2.` },

{ n: 58, d: "applications", t: "Sum a nested document of values",
  p: String.raw`A document is a tree whose nodes are either an integer, a string, or a list of further nodes. Build this tree: a list containing the integer 1, the string x, and a list containing the integer 2 and another list holding the integers 3 and 4. Sum every integer in the tree, ignoring strings, and print the result as sum=N, then a newline.`,
  ex: String.raw`sum=10`,
  code: String.raw`#include <cstddef>
#include <iostream>
#include <string>
#include <type_traits>
#include <variant>
#include <vector>

struct Node {
    std::variant<long long, std::string, std::vector<Node>> v;
};

long long sum(const Node& n) {
    return std::visit([](const auto& x) -> long long {
        using T = std::decay_t<decltype(x)>;
        if constexpr (std::is_same_v<T, long long>) {
            return x;
        } else if constexpr (std::is_same_v<T, std::string>) {
            return 0;
        } else {
            long long total = 0;
            for (const Node& child : x) total += sum(child);
            return total;
        }
    }, n.v);
}

int main() {
    Node tree{std::vector<Node>{
        Node{1LL},
        Node{std::string("x")},
        Node{std::vector<Node>{
            Node{2LL},
            Node{std::vector<Node>{Node{3LL}, Node{4LL}}}}},
    }};
    std::cout << "sum=" << sum(tree) << "\n";
}`,
  why: String.raw`Each node's alternative decides how it is handled, and recursing on the list alternative visits the whole tree without any special case for depth.` },

{ n: 59, d: "applications", t: "Parse a named enumeration from text",
  p: String.raw`A colour setting accepts exactly the words red, green and blue, each mapping to the numbers 0, 1 and 2. Any other text is an error reported as unknown colour: followed by the text. Parse the two settings green and purple in order. For a valid setting print colour followed by its number. For an invalid one print the error message. Print one line per setting.`,
  ex: String.raw`colour 1
unknown colour: purple`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

enum class Colour { Red = 0, Green = 1, Blue = 2 };

std::expected<Colour, std::string> parse_colour(const std::string& s) {
    if (s == "red") return Colour::Red;
    if (s == "green") return Colour::Green;
    if (s == "blue") return Colour::Blue;
    return std::unexpected("unknown colour: " + s);
}

int main() {
    for (std::string s : {"green", "purple"}) {
        auto r = parse_colour(s);
        if (r) std::cout << "colour " << static_cast<int>(*r) << "\n";
        else std::cout << r.error() << "\n";
    }
}`,
  why: String.raw`Mapping each accepted word to a value and returning the error for everything else keeps the set of valid settings in one place.` },

{ n: 60, d: "applications", t: "Add and multiply without overflow",
  p: String.raw`Add or multiply two non-negative 64-bit integers, and report overflow instead of wrapping around when the true result does not fit. Compute these three operations in order: the largest 64-bit signed integer plus 1; 1048576 times 1048576; and 40 plus 2. For a result that fits print it. For an overflow print overflow. Print one line per operation.`,
  ex: String.raw`overflow
1099511627776
42`,
  code: String.raw`#include <expected>
#include <iostream>
#include <limits>
#include <string>

std::expected<long long, std::string> checked_add(long long a, long long b) {
    if (a > std::numeric_limits<long long>::max() - b) return std::unexpected(std::string("overflow"));
    return a + b;
}

std::expected<long long, std::string> checked_mul(long long a, long long b) {
    if (a != 0 && b > std::numeric_limits<long long>::max() / a)
        return std::unexpected(std::string("overflow"));
    return a * b;
}

void show(const std::expected<long long, std::string>& r) {
    if (r) std::cout << *r << "\n";
    else std::cout << r.error() << "\n";
}

int main() {
    show(checked_add(std::numeric_limits<long long>::max(), 1));
    show(checked_mul(1048576, 1048576));
    show(checked_add(40, 2));
}`,
  why: String.raw`Checking against the largest representable value before the operation means the overflow is detected rather than producing a wrong result.` },

{ n: 61, d: "applications", t: "Validate calendar dates",
  p: String.raw`Dates are written as YYYY-MM-DD. The month must be between 1 and 12, otherwise the error is bad month. The day must exist in that month, so February has 29 days only in leap years, otherwise the error is bad day. A year is a leap year if it is divisible by 4, except years divisible by 100 unless they are also divisible by 400. Validate these four dates in order: 2026-11-01, 2024-02-29, 2023-02-29 and 2026-13-01. For a valid date print ok followed by the date. For an invalid one print err followed by the message. Print one line per date.`,
  ex: String.raw`ok 2026-11-01
ok 2024-02-29
err bad day
err bad month`,
  code: String.raw`#include <expected>
#include <iostream>
#include <sstream>
#include <string>

struct Date { int year, month, day; };

std::expected<Date, std::string> parse_date(const std::string& s) {
    int y = 0, m = 0, d = 0;
    char d1 = 0, d2 = 0;
    std::istringstream in(s);
    if (!(in >> y >> d1 >> m >> d2 >> d) || d1 != '-' || d2 != '-')
        return std::unexpected(std::string("bad format"));
    if (m < 1 || m > 12) return std::unexpected(std::string("bad month"));
    static const int days[] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};
    const bool leap = (y % 4 == 0 && y % 100 != 0) || y % 400 == 0;
    int dim = days[m - 1];
    if (m == 2 && leap) dim = 29;
    if (d < 1 || d > dim) return std::unexpected(std::string("bad day"));
    return Date{y, m, d};
}

int main() {
    for (std::string s : {"2026-11-01", "2024-02-29", "2023-02-29", "2026-13-01"}) {
        auto r = parse_date(s);
        if (r) std::cout << "ok " << s << "\n";
        else std::cout << "err " << r.error() << "\n";
    }
}`,
  why: String.raw`Separating the month check from the day check gives each failure its own message, and the leap-year rule is a single expression that is easy to audit.` },

{ n: 62, d: "applications", t: "Decode a pagination cursor",
  p: String.raw`A pagination cursor is written as key:value pairs separated by semicolons, such as page:3;size:20. Both page and size are required. A cursor without size gives the error missing size, and one without page gives missing page. Decode these two cursors in order: page:3;size:20 and page:3. For a valid cursor print page=N size=M separated by a space. For an invalid one print the error message. Print one line per cursor.`,
  ex: String.raw`page=3 size=20
missing size`,
  code: String.raw`#include <expected>
#include <iostream>
#include <optional>
#include <sstream>
#include <string>
#include <utility>

std::expected<std::pair<int, int>, std::string> decode(const std::string& cursor) {
    std::optional<int> page, size;
    std::istringstream in(cursor);
    for (std::string part; std::getline(in, part, ';');) {
        auto colon = part.find(':');
        if (colon == std::string::npos) continue;
        std::string key = part.substr(0, colon);
        int value = std::stoi(part.substr(colon + 1));
        if (key == "page") page = value;
        else if (key == "size") size = value;
    }
    if (!page) return std::unexpected(std::string("missing page"));
    if (!size) return std::unexpected(std::string("missing size"));
    return std::pair{*page, *size};
}

int main() {
    for (std::string c : {"page:3;size:20", "page:3"}) {
        auto r = decode(c);
        if (r) std::cout << "page=" << r->first << " size=" << r->second << "\n";
        else std::cout << r.error() << "\n";
    }
}`,
  why: String.raw`Collecting each optional part as it is read, and checking all required parts at the end, reports every missing field consistently.` },

{ n: 63, d: "applications", t: "Split parsed results into successes and failures",
  p: String.raw`Four text values, 10, x, 30 and y, are parsed as integers. Each parse either succeeds or fails. Add up the successful values and count the failures. Print the result as sum=N failures=M, then a newline.`,
  ex: String.raw`sum=40 failures=2`,
  code: String.raw`#include <charconv>
#include <expected>
#include <iostream>
#include <string>
#include <vector>

std::expected<int, std::string> parse_int(const std::string& s) {
    int v = 0;
    auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
    if (ec != std::errc{} || p != s.data() + s.size()) return std::unexpected("not a number: " + s);
    return v;
}

int main() {
    int sum = 0, failures = 0;
    for (const std::string& s : std::vector<std::string>{"10", "x", "30", "y"}) {
        auto r = parse_int(s);
        if (r) sum += *r;
        else ++failures;
    }
    std::cout << "sum=" << sum << " failures=" << failures << "\n";
}`,
  why: String.raw`Looping over results and branching on each one keeps every failure counted, without stopping at the first bad value.` },

{ n: 64, d: "applications", t: "Evaluate a feature flag with a per-user override",
  p: String.raw`A feature is enabled for users whose id, taken modulo 100, is less than the rollout percentage of 30. A user may have an explicit override, which always wins when present. Evaluate three users in order: id 5 with no override, id 75 with no override, and id 80 with an override of on. Print user, the id, a colon, then on or off, one per line.`,
  ex: String.raw`user 5: on
user 75: off
user 80: on`,
  code: String.raw`#include <iostream>
#include <optional>

struct User { int id; std::optional<bool> override_on; };

bool enabled(const User& u, int rollout_percent) {
    if (u.override_on) return *u.override_on;
    return u.id % 100 < rollout_percent;
}

int main() {
    const User users[] = {
        {5, std::nullopt},
        {75, std::nullopt},
        {80, true},
    };
    for (const User& u : users)
        std::cout << "user " << u.id << ": " << (enabled(u, 30) ? "on" : "off") << "\n";
}`,
  why: String.raw`An explicit override is an optional that is checked first, so a per-user decision never needs the rollout rule at all.` },

{ n: 65, d: "applications", t: "Parse a service endpoint URL",
  p: String.raw`An endpoint is written as scheme://host[:port]/path. Only the schemes http and https are supported, and any other scheme is an error reported as unsupported scheme followed by the scheme. The default port is 80 for http and 443 for https, used when no port is written. A missing path is treated as /. Parse these three URLs in order: https://api.example.com:8443/v1, http://example.com/status, and ftp://x. For a valid endpoint print host:port then a space then the path. For an invalid one print the error message. Print one line per URL.`,
  ex: String.raw`api.example.com:8443 /v1
example.com:80 /status
unsupported scheme ftp`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

struct Endpoint { std::string host; int port; std::string path; };

std::expected<Endpoint, std::string> parse_url(const std::string& u) {
    auto sep = u.find("://");
    if (sep == std::string::npos) return std::unexpected(std::string("missing scheme"));
    const std::string scheme = u.substr(0, sep);
    int port = 0;
    if (scheme == "http") port = 80;
    else if (scheme == "https") port = 443;
    else return std::unexpected("unsupported scheme " + scheme);

    const std::string rest = u.substr(sep + 3);
    auto slash = rest.find('/');
    const std::string hostport = rest.substr(0, slash);
    const std::string path = slash == std::string::npos ? "/" : rest.substr(slash);

    Endpoint e{hostport, port, path};
    auto colon = hostport.find(':');
    if (colon != std::string::npos) {
        e.host = hostport.substr(0, colon);
        e.port = std::stoi(hostport.substr(colon + 1));
    }
    return e;
}

int main() {
    for (std::string u : {"https://api.example.com:8443/v1", "http://example.com/status", "ftp://x"}) {
        auto r = parse_url(u);
        if (r) std::cout << r->host << ':' << r->port << ' ' << r->path << "\n";
        else std::cout << r.error() << "\n";
    }
}`,
  why: String.raw`Deriving the default port from the scheme and falling back to it when the port is absent keeps each URL fully specified before it is used.` },
];

const TOTAL = problems.length;
const KEY = "cpp-optional-variant-expected-v1";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 10, label: "Easy", range: "Problems 1–10", badge: "easy" },
  { from: 11, to: 22, label: "Medium", range: "Problems 11–22", badge: "medium" },
  { from: 23, to: 31, label: "Hard", range: "Problems 23–31", badge: "hard" },
  { from: 32, to: 37, label: "Extension", range: "Problems 32–37", badge: null },
  { from: 38, to: 65, label: "Applications", range: "Problems 38–65", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
