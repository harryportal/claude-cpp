// ---------- Easy ----------
{ n: 1, d: "easy", t: "Size and emptiness at compile time",
  p: String.raw`Create an array of five ints and print its size, then print whether it is empty as true or false.`,
  ex: String.raw`5 false`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    std::array<int, 5> a{};
    std::cout << a.size() << ' ' << std::boolalpha << a.empty() << '\n';
}`,
  why: String.raw`The size is part of the type, so size() is a compile-time constant. An array of length zero is the only empty one.` },

{ n: 2, d: "easy", t: "Partial initialization fills with zeros",
  p: String.raw`Create an array of four ints initialised with 1 and 2 only. Print the values at index 2 and index 3 separated by a space.`,
  ex: String.raw`0 0`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    std::array<int, 4> a{1, 2};
    std::cout << a[2] << ' ' << a[3] << '\n';
}`,
  why: String.raw`Elements that have no initialiser in an aggregate initialisation are value-initialised, which means zero for ints.` },

{ n: 3, d: "easy", t: "at() checks the bounds",
  p: String.raw`Create an array of three ints holding 1, 2 and 3. Print the element at index 5 using at. If it is out of range, print out of range.`,
  ex: String.raw`out of range`,
  code: String.raw`#include <array>
#include <iostream>
#include <stdexcept>

int main() {
    std::array<int, 3> a{1, 2, 3};
    try {
        std::cout << a.at(5);
    } catch (const std::out_of_range&) {
        std::cout << "out of range";
    }
    std::cout << '\n';
}`,
  why: String.raw`at throws std::out_of_range for an invalid index. operator[] does not check, so the same access would read past the end of the array.` },

{ n: 4, d: "easy", t: "Fill and swap",
  p: String.raw`Create two arrays of three ints. Fill the first with 7. Set the second to 1, 2 and 3. Swap the two arrays, then print the first element of each, separated by a space.`,
  ex: String.raw`1 7`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    std::array<int, 3> a{}, b{1, 2, 3};
    a.fill(7);
    a.swap(b);
    std::cout << a[0] << ' ' << b[0] << '\n';
}`,
  why: String.raw`Swapping exchanges the contents of two arrays of the same type. fill sets every element to one value.` },

{ n: 5, d: "easy", t: "Sum with a range-based loop",
  p: String.raw`Sum the elements of the array 4, 5 and 6 using a range-based for loop. Print the total.`,
  ex: String.raw`15`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    const std::array<int, 3> a{4, 5, 6};
    int total = 0;
    for (int x : a) total += x;
    std::cout << total << '\n';
}`,
  why: String.raw`begin and end are provided for arrays, so range-based for visits each element in order without needing an index.` },

{ n: 6, d: "easy", t: "Lexicographic comparison",
  p: String.raw`Compare the arrays {1, 2, 3} and {1, 3, 0} with the less-than operator. Print true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    const std::array<int, 3> a{1, 2, 3}, b{1, 3, 0};
    std::cout << std::boolalpha << (a < b) << '\n';
}`,
  why: String.raw`Arrays compare element by element, like std::lexicographical_compare. The first difference decides, so 2 is less than 3 at index 1.` },

{ n: 7, d: "easy", t: "front and back",
  p: String.raw`Create an array of three strings x, y and z. Print the first and the last string joined together with no separator.`,
  ex: String.raw`xz`,
  code: String.raw`#include <array>
#include <iostream>
#include <string>

int main() {
    const std::array<std::string, 3> a{"x", "y", "z"};
    std::cout << a.front() + a.back() << '\n';
}`,
  why: String.raw`front and back return references to the first and last elements without an index calculation.` },

{ n: 8, d: "easy", t: "data() gives a raw pointer",
  p: String.raw`Create an array of three ints holding 10, 20 and 30. Print the value at index 0 plus the value at index 2, read through the pointer returned by data().`,
  ex: String.raw`40`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    const std::array<int, 3> a{10, 20, 30};
    const int* p = a.data();
    std::cout << p[0] + p[2] << '\n';
}`,
  why: String.raw`data returns a pointer to the first element, and the elements are contiguous. This is how an array can be passed to C APIs that expect a plain pointer.` },

{ n: 9, d: "easy", t: "Structured bindings unpack an array",
  p: String.raw`Create an array of three ints holding 1, 2 and 3. Unpack it into three named variables x, y and z, and print x times 100 plus y times 10 plus z.`,
  ex: String.raw`123`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    const std::array<int, 3> a{1, 2, 3};
    const auto [x, y, z] = a;
    std::cout << x * 100 + y * 10 + z << '\n';
}`,
  why: String.raw`std::array supports structured bindings, so the element count must match the number of names.` },

{ n: 10, d: "easy", t: "constexpr arrays",
  p: String.raw`Declare a compile-time array of four ints holding the squares 0, 1, 4 and 9. Assert at compile time that its last element is 9, then print that element.`,
  ex: String.raw`9`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    constexpr std::array<int, 4> squares{0, 1, 4, 9};
    static_assert(squares.back() == 9);
    std::cout << squares.back() << '\n';
}`,
  why: String.raw`Because std::array is a literal type with constexpr accessors, it can be fully evaluated during compilation.` },

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Binary search on a sorted array",
  p: String.raw`Create the sorted array 1, 3, 5, 7, 9, 11. Print true if 7 is in it, then true or false for 8, separated by a space.`,
  ex: String.raw`true false`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>

int main() {
    const std::array<int, 6> a{1, 3, 5, 7, 9, 11};
    std::cout << std::boolalpha << std::binary_search(a.begin(), a.end(), 7) << ' '
              << std::binary_search(a.begin(), a.end(), 8) << '\n';
}`,
  why: String.raw`binary_search requires sorted input and runs in logarithmic time. It only reports presence, so use lower_bound when you need the position.` },

{ n: 12, d: "medium", t: "Rotate left",
  p: String.raw`Create the array 1, 2, 3, 4, 5. Rotate it left by two positions so that 3 becomes first. Print the elements separated by spaces.`,
  ex: String.raw`3 4 5 1 2`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>

int main() {
    std::array<int, 5> a{1, 2, 3, 4, 5};
    std::rotate(a.begin(), a.begin() + 2, a.end());
    for (std::size_t i = 0; i < a.size(); ++i) std::cout << a[i] << (i + 1 < a.size() ? ' ' : '\n');
}`,
  why: String.raw`rotate takes the new first element as its middle argument. Everything before that position moves to the end in the same relative order.` },

{ n: 13, d: "medium", t: "Count with a predicate",
  p: String.raw`Count the elements greater than 4 in the array 3, 8, 1, 9, 4, 6. Print the count.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>

int main() {
    const std::array<int, 6> a{3, 8, 1, 9, 4, 6};
    std::cout << std::count_if(a.begin(), a.end(), [](int x) { return x > 4; }) << '\n';
}`,
  why: String.raw`count_if applies the predicate to every element and counts the matches. The array is only read, so it takes const iterators.` },

{ n: 14, d: "medium", t: "A 2D grid of characters",
  p: String.raw`Create a 2 by 3 grid of characters, all set to dot. Change the character in row 1, column 2 to hash. Print row 0, a slash, then row 1, with no spaces.`,
  ex: String.raw`.../..#`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    std::array<std::array<char, 3>, 2> grid{};
    for (auto& row : grid) row.fill('.');
    grid[1][2] = '#';
    for (char c : grid[0]) std::cout << c;
    std::cout << '/';
    for (char c : grid[1]) std::cout << c;
    std::cout << '\n';
}`,
  why: String.raw`A nested array stores its rows inline, so grid[r][c] indexes a 2 by 3 block with no extra allocation. fill applies to one row at a time here.` },

{ n: 15, d: "medium", t: "Prefix sums into a second array",
  p: String.raw`Start with the array 1, 2, 3, 4, 5. Build a second array of the same size holding the running sums. Print the element at index 2 of the second array, then its last element, separated by a space.`,
  ex: String.raw`6 15`,
  code: String.raw`#include <array>
#include <iostream>
#include <numeric>

int main() {
    const std::array<int, 5> in{1, 2, 3, 4, 5};
    std::array<int, 5> out{};
    std::partial_sum(in.begin(), in.end(), out.begin());
    std::cout << out[2] << ' ' << out.back() << '\n';
}`,
  why: String.raw`partial_sum writes each running total to the output range. Because the output has a fixed size known at compile time, no reallocation is needed.` },

{ n: 16, d: "medium", t: "2 by 2 matrix product",
  p: String.raw`Multiply the matrix {{1, 2}, {3, 4}} by {{0, 1}, {1, 0}} using two nested arrays of ints. Print the four entries of the result in row-major order, separated by spaces.`,
  ex: String.raw`2 1 4 3`,
  code: String.raw`#include <array>
#include <iostream>

using Mat2 = std::array<std::array<int, 2>, 2>;

Mat2 multiply(const Mat2& a, const Mat2& b) {
    Mat2 c{};
    for (std::size_t i = 0; i < 2; ++i)
        for (std::size_t j = 0; j < 2; ++j)
            for (std::size_t k = 0; k < 2; ++k)
                c[i][j] += a[i][k] * b[k][j];
    return c;
}

int main() {
    const Mat2 c = multiply({{{1, 2}, {3, 4}}}, {{{0, 1}, {1, 0}}});
    for (const auto& row : c)
        for (int x : row) std::cout << x << ' ';
    std::cout << '\n';
}`,
  why: String.raw`The result of a product is built entry by entry from the rows of the left matrix and the columns of the right one. Returning the array by value copies a small fixed block.` },

{ n: 17, d: "medium", t: "Sort strings in place",
  p: String.raw`Create an array of four strings: pear, apple, fig and apple. Sort it alphabetically and print the words separated by spaces.`,
  ex: String.raw`apple apple fig pear`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>
#include <string>

int main() {
    std::array<std::string, 4> words{"pear", "apple", "fig", "apple"};
    std::sort(words.begin(), words.end());
    for (std::size_t i = 0; i < words.size(); ++i) std::cout << words[i] << (i + 1 < words.size() ? ' ' : '\n');
}`,
  why: String.raw`Sorting moves the string objects inside the array, so no separate container is needed. Duplicates stay in place and sort next to each other.` },

{ n: 18, d: "medium", t: "Index of the first match",
  p: String.raw`Search the array 4, 9, 2, 9 for the value 9. Print the index of the first match.`,
  ex: String.raw`1`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>

int main() {
    const std::array<int, 4> a{4, 9, 2, 9};
    const auto it = std::find(a.begin(), a.end(), 9);
    std::cout << std::distance(a.begin(), it) << '\n';
}`,
  why: String.raw`find returns an iterator to the first match, and distance turns it into an index. Converting iterators to indices is the usual way to report a position.` },

{ n: 19, d: "medium", t: "Minimum and maximum together",
  p: String.raw`Find the minimum and maximum of the array 5, -2, 9, 0 in one pass. Print them separated by a space.`,
  ex: String.raw`-2 9`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>

int main() {
    const std::array<int, 4> a{5, -2, 9, 0};
    const auto [lo, hi] = std::minmax_element(a.begin(), a.end());
    std::cout << *lo << ' ' << *hi << '\n';
}`,
  why: String.raw`minmax_element scans the range once and returns iterators to both extremes. Dereferencing them gives the values.` },

{ n: 20, d: "medium", t: "Sieve of Eratosthenes",
  p: String.raw`Use an array of 11 booleans to find the primes up to 10. Print them separated by spaces.`,
  ex: String.raw`2 3 5 7`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    std::array<bool, 11> composite{};
    for (int i = 2; i * i <= 10; ++i)
        if (!composite[i])
            for (int j = i * i; j <= 10; j += i) composite[j] = true;
    bool first = true;
    for (int i = 2; i <= 10; ++i)
        if (!composite[i]) {
            std::cout << (first ? "" : " ") << i;
            first = false;
        }
    std::cout << '\n';
}`,
  why: String.raw`Marking multiples of each prime leaves only primes unmarked. A fixed-size array of flags is a natural fit because the bound is known in advance.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Fixed-capacity ring buffer",
  p: String.raw`Implement a ring buffer of capacity 3 on top of an array of ints. Push the values 1 to 5 in order, overwriting the oldest value when full. Print the three values held, oldest first, separated by spaces.`,
  ex: String.raw`3 4 5`,
  code: String.raw`#include <array>
#include <cstddef>
#include <iostream>

template <typename T, std::size_t N>
class RingBuffer {
    std::array<T, N> data_{};
    std::size_t head_ = 0, count_ = 0;
public:
    void push(const T& v) {
        data_[(head_ + count_) % N] = v;
        if (count_ < N) ++count_;
        else head_ = (head_ + 1) % N;
    }
    void print() const {
        for (std::size_t i = 0; i < count_; ++i)
            std::cout << data_[(head_ + i) % N] << (i + 1 < count_ ? ' ' : '\n');
    }
};

int main() {
    RingBuffer<int, 3> rb;
    for (int v = 1; v <= 5; ++v) rb.push(v);
    rb.print();
}`,
  why: String.raw`The array never changes size. Indices wrap with modulo, and the head moves forward only once the buffer is full, which keeps the oldest element at the front.` },

{ n: 22, d: "hard", t: "Sum over any size with a template",
  p: String.raw`Write a function template that takes a std::array of any length of ints by const reference and returns their sum. Call it on the array 1, 2, 3, 4 and print the result.`,
  ex: String.raw`10`,
  code: String.raw`#include <array>
#include <cstddef>
#include <iostream>

template <std::size_t N>
int sum(const std::array<int, N>& a) {
    int total = 0;
    for (int x : a) total += x;
    return total;
}

int main() {
    std::cout << sum(std::array<int, 4>{1, 2, 3, 4}) << '\n';
}`,
  why: String.raw`The size N is a template parameter, so the same function works for every length without a runtime size argument. The compiler generates one version per length.` },

{ n: 23, d: "hard", t: "Fibonacci table computed at compile time",
  p: String.raw`Write a constexpr function that returns an array of the first 10 Fibonacci numbers, starting with 0 and 1. Print the last element.`,
  ex: String.raw`34`,
  code: String.raw`#include <array>
#include <iostream>

constexpr std::array<int, 10> fib_table() {
    std::array<int, 10> t{0, 1};
    for (std::size_t i = 2; i < t.size(); ++i) t[i] = t[i - 1] + t[i - 2];
    return t;
}

constexpr auto table = fib_table();
static_assert(table[9] == 34);

int main() {
    std::cout << table[9] << '\n';
}`,
  why: String.raw`Since std::array is a literal type, a constexpr function can build it and the compiler evaluates the whole table at compile time. The static_assert proves it.` },

{ n: 24, d: "hard", t: "Dot product of fixed-size vectors",
  p: String.raw`Define a struct Vec3 holding an array of three doubles. Compute the dot product of {1, 2, 3} and {4, 5, 6} and print it with no decimals.`,
  ex: String.raw`32`,
  code: String.raw`#include <array>
#include <iostream>

struct Vec3 {
    std::array<double, 3> v;
};

double dot(const Vec3& a, const Vec3& b) {
    double s = 0;
    for (std::size_t i = 0; i < 3; ++i) s += a.v[i] * b.v[i];
    return s;
}

int main() {
    const Vec3 a{{1, 2, 3}}, b{{4, 5, 6}};
    std::cout << static_cast<long long>(dot(a, b)) << '\n';
}`,
  why: String.raw`Wrapping the array in a struct gives it a meaningful name while keeping the fixed size and no heap allocation. Passing a struct by const reference avoids a copy.` },

{ n: 25, d: "hard", t: "Stable partition of an array",
  p: String.raw`Partition the array 1, 2, 3, 4, 5 so that even numbers come first, keeping the order within each group. Print the result separated by spaces.`,
  ex: String.raw`2 4 1 3 5`,
  code: String.raw`#include <algorithm>
#include <array>
#include <iostream>

int main() {
    std::array<int, 5> a{1, 2, 3, 4, 5};
    std::stable_partition(a.begin(), a.end(), [](int x) { return x % 2 == 0; });
    for (std::size_t i = 0; i < a.size(); ++i) std::cout << a[i] << (i + 1 < a.size() ? ' ' : '\n');
}`,

int bump(std::array<int, 3> copy) {

    for (int& x : copy) {

        total += x;
    }
    return total;
}

  ex: String.raw`11110`,
  code: String.raw`#include <array>
#include <iostream>

int main() {
    const std::array<int, 5> row{0, 1, 1, 0, 0};
    std::array<int, 5> next{};
    for (std::size_t i = 0; i < row.size(); ++i) {

        const int right = i + 1 < row.size() ? row[i + 1] : 0;

    for (int c : next) std::cout << c;

}`,

    std::cout << out << '\n';
}`,
  why: String.raw`The table precomputes the mapping for every letter, so encryption is one lookup per character. The modulo wraps the alphabet back to its start.` },
];

const TOTAL = problems.length;
const KEY = "stl-array-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 56, label: "Easy", range: "Problems 1–56", badge: "easy" },
  { from: 11, to: 58, label: "Medium", range: "Problems 11–58", badge: "medium" },
  { from: 21, to: 48, label: "Hard", range: "Problems 21–48", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
