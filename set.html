<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Duplicates are dropped",
  p: String.raw`Add the values 3, 1, 3 and 2 to an empty set of ints. Print how many elements the set holds.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> s;
    for (int v : {3, 1, 3, 2}) s.insert(v);
    std::cout << s.size() << '\n';
}`,
  why: String.raw`A set holds each value at most once. Inserting a value that is already present changes nothing.` },

{ n: 2, d: "easy", t: "Sorted by default",
  p: String.raw`Add the values 5, 2, 8 and 2 to an empty set of ints. Print the elements in order, separated by spaces.`,
  ex: String.raw`2 5 8`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> s{5, 2, 8, 2};
    bool first = true;
    for (int v : s) {
        std::cout << (first ? "" : " ") << v;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Elements are kept in ascending order at all times, so iterating always visits them sorted.` },

{ n: 3, d: "easy", t: "Membership check",
  p: String.raw`Create a set of ints containing only 4. Print whether it contains 4, then whether it contains 7, separated by a space. Print true or false.`,
  ex: String.raw`true false`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{4};
    std::cout << std::boolalpha << s.contains(4) << ' ' << s.contains(7) << '\n';
}`,
  why: String.raw`Membership is a logarithmic search in a balanced tree, so it stays fast as the set grows.` },

{ n: 4, d: "easy", t: "Count is 0 or 1",
  p: String.raw`Create a set of ints containing 1, 4 and 6. Print the number of times 4 occurs, then the number of times 9 occurs, separated by a space.`,
  ex: String.raw`1 0`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{1, 4, 6};
    std::cout << s.count(4) << ' ' << s.count(9) << '\n';
}`,
  why: String.raw`Because a set has no duplicates, counting a value always yields 0 or 1.` },

{ n: 5, d: "easy", t: "Remove one value",
  p: String.raw`Create a set of ints containing 1, 2, 3, 4 and 5. Remove the value 3, then print the remaining elements in order, separated by spaces.`,
  ex: String.raw`1 2 4 5`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> s{1, 2, 3, 4, 5};
    s.erase(3);
    bool first = true;
    for (int v : s) {
        std::cout << (first ? "" : " ") << v;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Removing by value takes one step per lookup and leaves the order of the remaining elements unchanged.` },

{ n: 6, d: "easy", t: "Search for a value",
  p: String.raw`Create a set of ints containing 2 and 7. Print found if 7 is in the set, and missing if 9 is in the set, separated by a space.`,
  ex: String.raw`found missing`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{2, 7};
    std::cout << (s.find(7) != s.end() ? "found" : "missing") << ' '
              << (s.find(9) != s.end() ? "found" : "missing") << '\n';
}`,
  why: String.raw`Searching returns an iterator to the element, or the end marker when the value is absent.` },

{ n: 7, d: "easy", t: "Insert reports success",
  p: String.raw`Insert 5 into an empty set of ints, then insert 5 again. Print the success flag of the second insertion as true or false.`,
  ex: String.raw`false`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> s;
    s.insert(5);
    auto [it, inserted] = s.insert(5);
    std::cout << std::boolalpha << inserted << '\n';
}`,
  why: String.raw`Insertion returns a pair: an iterator to the element and a flag saying whether anything was actually added.` },

{ n: 8, d: "easy", t: "Build in place",
  p: String.raw`Create an empty set of ints. Construct the value 6 directly inside the set, then print the first element.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> s;
    s.emplace(6);
    std::cout << *s.begin() << '\n';
}`,
  why: String.raw`Constructing the element in place avoids a temporary copy, and the set still keeps it in sorted position.` },

{ n: 9, d: "easy", t: "Smallest and largest",
  p: String.raw`Add 9, 4 and 7 to an empty set of ints. Print the smallest element, then the largest, separated by a space.`,
  ex: String.raw`4 9`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> s{9, 4, 7};
    std::cout << *s.begin() << ' ' << *s.rbegin() << '\n';
}`,
  why: String.raw`Because the elements are sorted, the smallest is at the front and the largest is at the back.` },

{ n: 10, d: "easy", t: "Alphabetical strings",
  p: String.raw`Add the words pear, apple and fig to an empty set of strings. Print the words in order, separated by spaces.`,
  ex: String.raw`apple fig pear`,
  code: String.raw`#include <iostream>
#include <set>
#include <string>

int main() {
    std::set<std::string> s{"pear", "apple", "fig"};
    bool first = true;
    for (const auto& w : s) {
        std::cout << (first ? "" : " ") << w;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Strings compare lexicographically, so the set orders words alphabetically without any extra work.` },

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Combined values",
  p: String.raw`Set a holds 1, 2 and 3. Set b holds 3 and 4. Print the values that appear in either set, in order, separated by spaces.`,
  ex: String.raw`1 2 3 4`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <iterator>
#include <set>

int main() {
    const std::set<int> a{1, 2, 3}, b{3, 4};
    std::set<int> out;
    std::set_union(a.begin(), a.end(), b.begin(), b.end(), std::inserter(out, out.end()));
    bool first = true;
    for (int v : out) {
        std::cout << (first ? "" : " ") << v;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Two sorted ranges can be merged in a single pass, and a set's elements are already sorted.` },

{ n: 12, d: "medium", t: "Shared values",
  p: String.raw`Set a holds 1, 2, 3 and 4. Set b holds 2, 4 and 6. Print the values that appear in both sets, separated by spaces.`,
  ex: String.raw`2 4`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <iterator>
#include <set>

int main() {
    const std::set<int> a{1, 2, 3, 4}, b{2, 4, 6};
    std::set<int> out;
    std::set_intersection(a.begin(), a.end(), b.begin(), b.end(), std::inserter(out, out.end()));
    bool first = true;
    for (int v : out) {
        std::cout << (first ? "" : " ") << v;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Walking two sorted sequences together finds the common values without comparing every pair.` },

{ n: 13, d: "medium", t: "Only in the first",
  p: String.raw`Set a holds 1, 2, 3 and 4. Set b holds 2, 4 and 6. Print the values that are in a but not in b, separated by spaces.`,
  ex: String.raw`1 3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <iterator>
#include <set>

int main() {
    const std::set<int> a{1, 2, 3, 4}, b{2, 4, 6};
    std::set<int> out;
    std::set_difference(a.begin(), a.end(), b.begin(), b.end(), std::inserter(out, out.end()));
    bool first = true;
    for (int v : out) {
        std::cout << (first ? "" : " ") << v;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Difference keeps the elements of the first sequence that the second one does not contain, in the same sorted order.` },

{ n: 14, d: "medium", t: "First at or above a threshold",
  p: String.raw`Create a set of ints containing 10, 20, 30 and 40. Print the smallest element that is at least 25.`,
  ex: String.raw`30`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{10, 20, 30, 40};
    std::cout << *s.lower_bound(25) << '\n';
}`,
  why: String.raw`lower_bound returns the first element not less than the key, which is exactly a threshold lookup in a sorted set.` },

{ n: 15, d: "medium", t: "First strictly above",
  p: String.raw`Create a set of ints containing 10, 20 and 30. Print the smallest element strictly greater than 20.`,
  ex: String.raw`30`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{10, 20, 30};
    std::cout << *s.upper_bound(20) << '\n';
}`,
  why: String.raw`upper_bound returns the first element that compares greater than the key, so an exact match is skipped.` },

{ n: 16, d: "medium", t: "Count in a range",
  p: String.raw`Create a set of ints containing 1, 5, 9, 14 and 20. Print how many of its elements lie between 5 and 15 inclusive.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <iterator>
#include <set>

int main() {
    const std::set<int> s{1, 5, 9, 14, 20};
    auto lo = s.lower_bound(5);
    auto hi = s.upper_bound(15);
    std::cout << std::distance(lo, hi) << '\n';
}`,
  why: String.raw`Two bounds delimit a contiguous run of sorted elements, and the distance between them is the count.` },

{ n: 17, d: "medium", t: "Reverse order",
  p: String.raw`Create a set of ints that keeps its elements in descending order. Add 3, 9 and 1, then print the elements in order, separated by spaces.`,
  ex: String.raw`9 3 1`,
  code: String.raw`#include <functional>
#include <iostream>
#include <set>

int main() {
    std::set<int, std::greater<>> s{3, 9, 1};
    bool first = true;
    for (int v : s) {
        std::cout << (first ? "" : " ") << v;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`The ordering is a template argument. Choosing a different comparison changes the order everywhere in the set.` },

{ n: 18, d: "medium", t: "Pairs sorted by both parts",
  p: String.raw`Add the pairs (2, b), (1, z) and (2, a) to a set of pairs of an int and a string. Print the second part of each pair in set order, separated by spaces.`,
  ex: String.raw`z a b`,
  code: String.raw`#include <iostream>
#include <set>
#include <string>
#include <utility>

int main() {
    std::set<std::pair<int, std::string>> s{{2, "b"}, {1, "z"}, {2, "a"}};
    bool first = true;
    for (const auto& [num, word] : s) {
        std::cout << (first ? "" : " ") << word;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Pairs compare by their first part, then by their second, so the set orders them lexicographically.` },

{ n: 19, d: "medium", t: "Nearest value",
  p: String.raw`Create a set of ints containing 1, 4, 9 and 16. Print the element closest to 10. If two are equally close, print the smaller.`,
  ex: String.raw`9`,
  code: String.raw`#include <cstdlib>
#include <iostream>
#include <iterator>
#include <set>

int main() {
    const std::set<int> s{1, 4, 9, 16};
    const int x = 10;
    auto hi = s.lower_bound(x);
    auto lo = hi;
    if (hi == s.begin()) {
        std::cout << *hi << '\n';
        return 0;
    }
    --lo;
    if (hi == s.end() || x - *lo <= *hi - x) std::cout << *lo << '\n';
    else std::cout << *hi << '\n';
}`,
  why: String.raw`The closest value is always either the last element below the target or the first element at or above it, so two neighbours are enough to decide.` },

{ n: 20, d: "medium", t: "Merging sets",
  p: String.raw`Set a holds 1, 3 and 5. Set b holds 2, 3 and 4. Move every element of b into a. Print the size of a, then the size of b, separated by a space. Elements already present in a stay where they are and are not moved.`,
  ex: String.raw`5 1`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    std::set<int> a{1, 3, 5}, b{2, 3, 4};
    a.merge(b);
    std::cout << a.size() << ' ' << b.size() << '\n';
}`,
  why: String.raw`merge moves nodes rather than copying values. Duplicates cannot be moved, so they stay behind in the source set.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Smaller values to the right",
  p: String.raw`For the array 3 1 2, look at each element and count how many elements after it are smaller than it. Print the three counts separated by spaces.`,
  ex: String.raw`2 0 0`,
  code: String.raw`#include <iostream>
#include <iterator>
#include <set>
#include <vector>

int main() {
    const std::vector<int> a{3, 1, 2};
    std::vector<int> counts(a.size());
    std::set<int> seen;   // values to the right of the current position
    for (std::size_t i = a.size(); i-- > 0;) {
        counts[i] = static_cast<int>(std::distance(seen.begin(), seen.lower_bound(a[i])));
        seen.insert(a[i]);
    }
    for (std::size_t i = 0; i < counts.size(); ++i)
        std::cout << counts[i] << (i + 1 < counts.size() ? " " : "\n");
}`,
  why: String.raw`Scanning from the right, the number of smaller values already seen is the position where the current value would land in the sorted set.` },

{ n: 22, d: "hard", t: "Longest run of consecutive values",
  p: String.raw`From the values 100, 4, 200, 1, 3 and 2, find the length of the longest run of consecutive integers. Print that length.`,
  ex: String.raw`4`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <set>

int main() {
    const std::set<int> s{100, 4, 200, 1, 3, 2};
    std::size_t best = 0;
    for (int x : s) {
        if (s.contains(x - 1)) continue;   // only start counting at the beginning of a run
        std::size_t len = 1;
        while (s.contains(x + static_cast<int>(len))) ++len;
        best = std::max(best, len);
    }
    std::cout << best << '\n';
}`,
  why: String.raw`Starting a count only at the first value of each run keeps the total work proportional to the number of values.` },

{ n: 23, d: "hard", t: "Merge overlapping intervals",
  p: String.raw`Store the intervals [1,3], [2,6], [8,10] and [15,18] in a set ordered by start. Merge any intervals that overlap or touch, then print the merged intervals in order, each as [start,end], separated by spaces.`,
  ex: String.raw`[1,6] [8,10] [15,18]`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <set>
#include <utility>

int main() {
    const std::set<std::pair<int, int>> intervals{{1, 3}, {2, 6}, {8, 10}, {15, 18}};
    std::pair<int, int> cur{-1, -1};
    bool have = false, first = true;
    auto flush = [&] {
        std::cout << (first ? "" : " ") << '[' << cur.first << ',' << cur.second << ']';
        first = false;
    };
    for (const auto& iv : intervals) {
        if (!have) { cur = iv; have = true; }
        else if (iv.first <= cur.second) cur.second = std::max(cur.second, iv.second);
        else { flush(); cur = iv; }
    }
    if (have) flush();
    std::cout << '\n';
}`,
  why: String.raw`Sorted by start, an interval can only overlap the one currently being built, so a single pass suffices.` },

{ n: 24, d: "hard", t: "Next available value",
  p: String.raw`Create a set of ints containing 5, 10 and 20. For each query 7, 20 and 25, print the smallest element that is at least the query value, or none if there is no such element. Separate the answers with spaces.`,
  ex: String.raw`10 20 none`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{5, 10, 20};
    bool first = true;
    for (int q : {7, 20, 25}) {
        auto it = s.lower_bound(q);
        std::cout << (first ? "" : " ");
        if (it == s.end()) std::cout << "none";
        else std::cout << *it;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`lower_bound answers the successor query in logarithmic time, and the end marker signals that no successor exists.` },

{ n: 25, d: "hard", t: "Smallest missing positive",
  p: String.raw`Store the values 3, 4, -1 and 1 in a set of ints. Print the smallest positive integer that is not in the set.`,
  ex: String.raw`2`,
  code: String.raw`#include <iostream>
#include <set>

int main() {
    const std::set<int> s{3, 4, -1, 1};
    int x = 1;
    while (s.contains(x)) ++x;
    std::cout << x << '\n';
}`,
  why: String.raw`Membership tests let you walk upward from 1 and stop at the first gap. Negative values and zero are irrelevant to the answer.` },

{ n: 26, d: "hard", t: "Booking calendar",
  p: String.raw`A calendar holds bookings as half-open intervals [start, end), stored in a set ordered by start. Attempt three bookings in order: [10,20), then [15,25), then [20,30). A booking that overlaps an existing one is refused. Print ok or conflict for each attempt, separated by spaces.`,
  ex: String.raw`ok conflict ok`,
  code: String.raw`#include <iostream>
#include <set>
#include <utility>

int main() {
    std::set<std::pair<int, int>> booked;   // (start, end), sorted by start
    bool first = true;
    for (auto [start, end] : {std::pair{10, 20}, std::pair{15, 25}, std::pair{20, 30}}) {
        bool clash = false;
        auto next = booked.lower_bound({start, 0});
        if (next != booked.end() && next->first < end) clash = true;
        if (next != booked.begin() && std::prev(next)->second > start) clash = true;
        if (!clash) booked.insert({start, end});
        std::cout << (first ? "" : " ") << (clash ? "conflict" : "ok");
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Only the booking that starts just before and the one that starts just after a new request can overlap it, so two neighbour lookups are enough.` },

  code: String.raw`#include <algorithm>

#include <set>
#include <string>

int main() {
    const std::string s = "abcabcbb";
    std::set<char> window;
    std::size_t best = 0, left = 0;
    for (std::size_t right = 0; right < s.size(); ++right) {
        while (window.contains(s[right])) {
            window.erase(s[left]);
            ++left;
        }
        window.insert(s[right]);
        best = std::max(best, window.size());

}`,

#include <queue>
#include <set>
#include <vector>

int main() {
    const std::vector<std::vector<int>> adj{{1, 2}, {0, 3}, {0}, {1}};

    std::set<std::string> mutual;
    std::set_intersection(alice.begin(), alice.end(), erin.begin(), erin.end(),
                          std::inserter(mutual, mutual.end()));
    bool first = true;
    for (const auto& name : mutual) {
        std::cout << (first ? "" : " ") << name;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Mutual connections are the intersection of two neighbourhoods. Keeping each neighbourhood as a set makes that intersection a single ordered pass.` },

const TOTAL = problems.length;
const KEY = "stl-set-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 10, label: "Easy", range: "Problems 1–10", badge: "easy" },
  { from: 11, to: 20, label: "Medium", range: "Problems 11–20", badge: "medium" },
  { from: 21, to: 30, label: "Hard", range: "Problems 21–30", badge: "hard" },
  { from: 31, to: 48, label: "Extension", range: "Problems 31–48", badge: null },
  { from: 49, to: 58, label: "Applications", range: "Problems 49–58", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
