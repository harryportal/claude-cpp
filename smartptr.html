<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Create a unique pointer",
  p: String.raw`Create a unique_ptr to an int holding 42, using a factory function that allocates the object, and print the value through the pointer.`,
  ex: String.raw`42`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto p = std::make_unique<int>(42);
    std::cout << *p << '\n';
}`,
  why: String.raw`A unique_ptr owns its object and frees it automatically when it goes out of scope, so no explicit delete is needed.` },

{ n: 2, d: "easy", t: "Reset empties a pointer",
  p: String.raw`Create a unique_ptr holding 7, then reset it so that it holds nothing. Print true if the pointer is now empty, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto p = std::make_unique<int>(7);
    p.reset();
    std::cout << std::boolalpha << (p == nullptr) << '\n';
}`,
  why: String.raw`Resetting releases the owned object immediately and leaves the pointer empty, which can be checked against nullptr.` },

{ n: 3, d: "easy", t: "Destroyed at end of scope",
  p: String.raw`A struct Noisy prints destroyed when it is destroyed. Create a unique_ptr to a Noisy inside an inner block. End the block, then print after.`,
  ex: String.raw`destroyed
after`,
  code: String.raw`#include <iostream>
#include <memory>

struct Noisy {
    ~Noisy() { std::cout << "destroyed\n"; }
};

int main() {
    {
        std::unique_ptr<Noisy> p = std::make_unique<Noisy>();
    }
    std::cout << "after\n";
}`,
  why: String.raw`The object is destroyed as soon as its owning pointer leaves scope, before the statements that follow the block.` },

{ n: 4, d: "easy", t: "Move ownership",
  p: String.raw`Create a unique_ptr holding 5 and move it into a second unique_ptr. Print whether the first is now empty, then the value held by the second, separated by a space. Print true or false for the first answer.`,
  ex: String.raw`true 5`,
  code: String.raw`#include <iostream>
#include <memory>
#include <utility>

int main() {
    auto a = std::make_unique<int>(5);
    auto b = std::move(a);
    std::cout << std::boolalpha << (a == nullptr) << ' ' << *b << '\n';
}`,
  why: String.raw`A unique_ptr cannot be copied, only moved, so ownership passes from one pointer to another and the source is left empty.` },

{ n: 5, d: "easy", t: "Count the owners",
  p: String.raw`Create a shared_ptr holding 3. Make two more copies of it. Print the number of shared_ptr objects that now refer to the int.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto s = std::make_shared<int>(3);
    auto c1 = s;
    auto c2 = s;
    std::cout << s.use_count() << '\n';
}`,
  why: String.raw`A shared_ptr keeps a count of how many owners share the object, which is available through use_count.` },

{ n: 6, d: "easy", t: "Count drops after a copy leaves scope",
  p: String.raw`Create a shared_ptr holding 3. Make a copy of it inside an inner block. After the block ends, print the number of shared_ptr objects that still refer to the int.`,
  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto s = std::make_shared<int>(3);
    {
        auto c = s;
    }
    std::cout << s.use_count() << '\n';
}`,
  why: String.raw`Each owner that goes out of scope gives up its share, so the count falls back as copies are destroyed.` },

{ n: 7, d: "easy", t: "Observe with a weak pointer",
  p: String.raw`Create a shared_ptr holding 9 and a weak_ptr observing the same int. Lock the weak_ptr and print the value it gives, then a space. Reset the shared_ptr, then print true if the weak_ptr has expired and false otherwise.`,
  ex: String.raw`9 true`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto s = std::make_shared<int>(9);
    std::weak_ptr<int> w = s;
    if (auto l = w.lock())
        std::cout << *l << ' ';
    s.reset();
    std::cout << std::boolalpha << w.expired() << '\n';
}`,
  why: String.raw`A weak_ptr observes an object without owning it, and locking it gives a shared_ptr only while the object still exists.` },

{ n: 8, d: "easy", t: "Sum an array pointer",
  p: String.raw`Create a unique_ptr to an array of three ints holding 1, 2 and 3. Print the sum of the three values.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    std::unique_ptr<int[]> a(new int[3]{1, 2, 3});
    std::cout << a[0] + a[1] + a[2] << '\n';
}`,
  why: String.raw`A unique_ptr can own an array, and the array form releases the whole array when it is destroyed.` },

{ n: 9, d: "easy", t: "Pass ownership to a function",
  p: String.raw`A function takes a unique_ptr to an int by value and returns the value it holds plus one. Call it with a unique_ptr holding 4 and print the result.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <memory>

int plus_one(std::unique_ptr<int> p) {
    return *p + 1;
}

int main() {
    std::cout << plus_one(std::make_unique<int>(4)) << '\n';
}`,
  why: String.raw`Passing a unique_ptr by value transfers ownership into the function, which frees the object when the function returns.` },

{ n: 10, d: "easy", t: "Shared pointers compare equal",
  p: String.raw`Create a shared_ptr to an int holding 1, and a second shared_ptr copied from the first. Print true if the two compare equal, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto a = std::make_shared<int>(1);
    auto b = a;
    std::cout << std::boolalpha << (a == b) << '\n';
}`,
  why: String.raw`Two shared_ptr objects compare equal when they point to the same object, even if they are separate handles.` },
{ n: 11, d: "easy", t: "Pass shared pointer by reference or value",
  p: String.raw`Write two functions that each return the use count of the shared_ptr they receive. One takes it by const reference and the other takes it by value. Create a shared_ptr holding 1, call the first function and then the second, and print both results separated by a space.`,
  ex: String.raw`1 2`,
  code: String.raw`#include <iostream>
#include <memory>

long by_ref(const std::shared_ptr<int>& p) {
    return p.use_count();
}

long by_value(std::shared_ptr<int> p) {
    return p.use_count();
}

int main() {
    auto s = std::make_shared<int>(1);
    std::cout << by_ref(s) << ' ' << by_value(s) << '\n';
}`,
  why: String.raw`Taking a shared_ptr by const reference avoids touching the count, while taking it by value adds an owner for the duration of the call.` },

{ n: 12, d: "easy", t: "Non-owning raw pointer view",
  p: String.raw`A function takes a plain pointer to const int that it only reads and does not own. Create a unique_ptr holding 12, pass its raw pointer to the function, and have the function print the value it points to.`,
  ex: String.raw`12`,
  code: String.raw`#include <iostream>
#include <memory>

void show(const int* p) {
    std::cout << *p << '\n';
}

int main() {
    auto p = std::make_unique<int>(12);
    show(p.get());
}`,
  why: String.raw`A raw pointer parameter that does not own its target lets a function look at an object without taking part in its lifetime.` },

{ n: 13, d: "easy", t: "Address survives a move",
  p: String.raw`Create a unique_ptr holding 3 and remember its raw address. Move it into a second unique_ptr. Print true if the second pointer has the same address as the remembered one, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <memory>
#include <utility>

int main() {
    auto a = std::make_unique<int>(3);
    int* raw = a.get();
    auto b = std::move(a);
    std::cout << std::boolalpha << (b.get() == raw) << '\n';
}`,
  why: String.raw`Moving a unique_ptr transfers the pointer itself, so the object stays at the same address and any raw pointers to it remain valid.` },

{ n: 14, d: "easy", t: "Move an element out of a container",
  p: String.raw`Store a unique_ptr holding 8 in a vector. Move the element out of the vector into a separate unique_ptr. Print the value it holds, then true if the vector's slot is now empty, otherwise false. Separate the two answers with a space.`,
  ex: String.raw`8 true`,
  code: String.raw`#include <iostream>
#include <memory>
#include <utility>
#include <vector>

int main() {
    std::vector<std::unique_ptr<int>> v;
    v.push_back(std::make_unique<int>(8));
    auto taken = std::move(v[0]);
    std::cout << *taken << ' ' << std::boolalpha << (v[0] == nullptr) << '\n';
}`,
  why: String.raw`Taking an owning pointer out of a container leaves an empty slot behind, so the element can be used elsewhere without being copied.` },

// ---------- Medium ----------
{ n: 15, d: "medium", t: "Custom deleter for unique pointer",
  p: String.raw`Create a unique_ptr to a new int holding 1, with a custom deleter that prints deleted and then frees the int. Let the pointer go out of scope inside an inner block, then print after. The output is deleted and then after on separate lines.`,
  ex: String.raw`deleted
after`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto del = [](int* p) {
        std::cout << "deleted\n";
        delete p;
    };
    {
        std::unique_ptr<int, decltype(del)> p(new int(1), del);
    }
    std::cout << "after\n";
}`,
  why: String.raw`A deleter is part of the unique_ptr's type, so any cleanup action can run in place of the default delete when the pointer is destroyed.` },

{ n: 16, d: "medium", t: "Custom deleter for shared pointer",
  p: String.raw`Create a shared_ptr to a new int holding 2, with a deleter that prints freed and then frees the int. Let it go out of scope inside an inner block, then print after. The output is freed and then after on separate lines.`,
  ex: String.raw`freed
after`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    {
        std::shared_ptr<int> p(new int(2), [](int* q) {
            std::cout << "freed\n";
            delete q;
        });
    }
    std::cout << "after\n";
}`,
  why: String.raw`A shared_ptr stores its deleter alongside the count, so the deleter is not part of the pointer's type.` },

{ n: 17, d: "medium", t: "Shared pointer to self",
  p: String.raw`A class Node derives from enable_shared_from_this and has a member function that returns a shared_ptr to the same node. Create a shared_ptr to a Node and obtain a second shared_ptr to it through that function. Print the use count of the first pointer.`,
  ex: String.raw`2`,
  code: String.raw`#include <iostream>
#include <memory>

struct Node : std::enable_shared_from_this<Node> {
    std::shared_ptr<Node> self() { return shared_from_this(); }
};

int main() {
    auto n = std::make_shared<Node>();
    auto s = n->self();
    std::cout << n.use_count() << '\n';
}`,
  why: String.raw`An object that is already owned by a shared_ptr can hand out further shared_ptr copies of itself safely.` },

{ n: 18, d: "medium", t: "Pointer to a member",
  p: String.raw`Create a shared_ptr to a struct Pair that has members a and b. Set a to 10 and b to 20. Build a shared_ptr to member b that shares ownership with the original pointer. Print the value of b through the new pointer, then the use count of the original pointer, separated by a space.`,
  ex: String.raw`20 2`,
  code: String.raw`#include <iostream>
#include <memory>

struct Pair {
    int a = 0;
    int b = 0;
};

int main() {
    auto p = std::make_shared<Pair>();
    p->a = 10;
    p->b = 20;
    std::shared_ptr<int> pb(p, &p->b);
    std::cout << *pb << ' ' << p.use_count() << '\n';
}`,
  why: String.raw`The aliasing form of shared_ptr points at part of an object while keeping the whole object alive.` },

{ n: 19, d: "medium", t: "Delete through a base pointer",
  p: String.raw`A base class Base has a virtual destructor. A class Derived that derives from Base prints deleted derived when it is destroyed. Hold a Derived in a unique_ptr to Base, reset the pointer, then print after. The output is deleted derived and then after on separate lines.`,
  ex: String.raw`deleted derived
after`,
  code: String.raw`#include <iostream>
#include <memory>

struct Base {
    virtual ~Base() = default;
};

struct Derived : Base {
    ~Derived() override { std::cout << "deleted derived\n"; }
};

int main() {
    std::unique_ptr<Base> p = std::make_unique<Derived>();
    p.reset();
    std::cout << "after\n";
}`,
  why: String.raw`Deleting through a base pointer runs the derived destructor only when the base destructor is virtual.` },

{ n: 20, d: "medium", t: "Vector of unique pointers",
  p: String.raw`Store three unique_ptrs to ints holding 1, 2 and 3 in a vector. Print the sum of the values they hold.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

int main() {
    std::vector<std::unique_ptr<int>> v;
    v.push_back(std::make_unique<int>(1));
    v.push_back(std::make_unique<int>(2));
    v.push_back(std::make_unique<int>(3));
    int sum = 0;
    for (const auto& p : v) sum += *p;
    std::cout << sum << '\n';
}`,
  why: String.raw`Containers can hold move-only types such as unique_ptr, and each element is freed when the container is.` },

{ n: 21, d: "medium", t: "Weak pointer counts and expiry",
  p: String.raw`Create a shared_ptr holding 5 and a weak_ptr to it. Print the use count seen through the weak_ptr, then a space. Reset the shared_ptr, then print true if the weak_ptr has expired and false otherwise.`,
  ex: String.raw`1 true`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto s = std::make_shared<int>(5);
    std::weak_ptr<int> w = s;
    std::cout << w.use_count() << ' ';
    s.reset();
    std::cout << std::boolalpha << w.expired() << '\n';
}`,
  why: String.raw`A weak_ptr does not add to the owner count, and it reports expiry once every owning shared_ptr is gone.` },

{ n: 22, d: "medium", t: "Factory returns unique pointer",
  p: String.raw`A function returns a unique_ptr to a new std::string holding hello. Store the result and print the length of the string it points to.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>

std::unique_ptr<std::string> make_text() {
    return std::make_unique<std::string>("hello");
}

int main() {
    auto s = make_text();
    std::cout << s->size() << '\n';
}`,
  why: String.raw`Returning a unique_ptr by value hands ownership to the caller without copying the object.` },

{ n: 23, d: "medium", t: "Release gives up ownership",
  p: String.raw`Create a unique_ptr to an int holding 8. Take the raw pointer out with a call that stops the unique_ptr from owning it, then delete that raw pointer yourself. Print true if the unique_ptr is now empty, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto p = std::make_unique<int>(8);
    int* raw = p.release();
    delete raw;
    std::cout << std::boolalpha << (p == nullptr) << '\n';
}`,
  why: String.raw`release returns the raw pointer and leaves the unique_ptr empty, so the caller becomes responsible for the object.` },

{ n: 24, d: "medium", t: "Cycle keeps nodes alive",
  p: String.raw`Two nodes each hold a shared_ptr to the other. Create both nodes, keep a weak_ptr to the first node, release both local shared_ptr handles, and print true if the first node has been destroyed, otherwise false.`,
  ex: String.raw`false`,
  code: String.raw`#include <iostream>
#include <memory>

struct Node {
    std::shared_ptr<Node> other;
};

int main() {
    auto a = std::make_shared<Node>();
    auto b = std::make_shared<Node>();
    a->other = b;
    b->other = a;
    std::weak_ptr<Node> wa = a;
    a.reset();
    b.reset();
    std::cout << std::boolalpha << wa.expired() << '\n';
}`,
  why: String.raw`Two shared_ptr owners that refer to each other keep one another alive, so their memory is never released.` },
{ n: 25, d: "medium", t: "Reset with a new pointer",
  p: String.raw`A struct Noisy prints destroyed when it is destroyed. Create a unique_ptr holding a Noisy. Call reset with a newly allocated Noisy, then print replaced. Let main finish afterwards.`,
  ex: String.raw`destroyed
replaced
destroyed`,
  code: String.raw`#include <iostream>
#include <memory>

struct Noisy {
    ~Noisy() { std::cout << "destroyed\n"; }
};

int main() {
    auto p = std::make_unique<Noisy>();
    p.reset(new Noisy());
    std::cout << "replaced\n";
}`,
  why: String.raw`reset with a pointer destroys the object it currently owns before taking the new one, so replacing an owned object cleans up the old one at once.` },

{ n: 26, d: "medium", t: "Swap two owners",
  p: String.raw`Create two unique_ptrs, one holding 1 and one holding 2. Swap their contents with the standard swap function, then print the value held by the first and the value held by the second, separated by a space.`,
  ex: String.raw`2 1`,
  code: String.raw`#include <iostream>
#include <memory>
#include <utility>

int main() {
    auto a = std::make_unique<int>(1);
    auto b = std::make_unique<int>(2);
    std::swap(a, b);
    std::cout << *a << ' ' << *b << '\n';
}`,
  why: String.raw`Swapping unique_ptrs exchanges what they own without touching the objects, which makes it cheap even for large objects.` },

{ n: 27, d: "medium", t: "Shared array from a factory",
  p: String.raw`Create a shared_ptr to an array of three ints, using the standard factory that makes a shared array. Assign 1, 2 and 3 to its elements and print the sum.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>
#include <memory>

int main() {
    auto a = std::make_shared<int[]>(3);
    a[0] = 1;
    a[1] = 2;
    a[2] = 3;
    std::cout << a[0] + a[1] + a[2] << '\n';

public:

{ n: 76, d: "applications", t: "Pool reuses released objects",
  p: String.raw`A pool hands out handles built on unique_ptr to int. The handle's deleter returns the int to the pool instead of freeing it. Acquire a handle, note its address, release it by leaving a block, then acquire again. Print true if the second handle has the same address as the first, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

struct Pool;

struct Return {
    Pool* pool;
    void operator()(int* p) const;
};

struct Pool {
    using Handle = std::unique_ptr<int, Return>;
    std::vector<int*> free_list;

    ~Pool() {
        for (int* p : free_list) delete p;
    }

    Handle acquire() {
        int* p;
        if (free_list.empty()) {
            p = new int(0);
        } else {
            p = free_list.back();
            free_list.pop_back();
        }
        return Handle(p, Return{this});
    }
};

void Return::operator()(int* p) const {
    pool->free_list.push_back(p);
}

int main() {
    Pool pool;
    int* first = nullptr;
    {
        auto h = pool.acquire();
        first = h.get();
    }
    auto h2 = pool.acquire();
    std::cout << std::boolalpha << (h2.get() == first) << '\n';
}`,
  why: String.raw`A deleter that hands an object back to a pool lets the pool recycle expensive objects instead of allocating new ones every time.` },

    if (good) std::cout << "open " << good->port << '\n';
}`,
  why: String.raw`Returning an empty unique_ptr is a simple way for a factory to signal that no resource was created.` },
];

const TOTAL = problems.length;
const KEY = "cpp-smartptr-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 14, label: "Easy", range: "Problems 1–14", badge: "easy" },
  { from: 15, to: 37, label: "Medium", range: "Problems 15–37", badge: "medium" },
  { from: 38, to: 50, label: "Hard", range: "Problems 38–50", badge: "hard" },
  { from: 51, to: 60, label: "Extension", range: "Problems 51–60", badge: null },
  { from: 61, to: 80, label: "Applications", range: "Problems 61–80", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
