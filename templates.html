<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Larger of two values",
  p: String.raw`Write a function that returns the larger of two values of the same type. Call it with 3 and 9, and with 2.5 and 1.5. Print both results separated by a space.`,
  ex: String.raw`9 2.5`,
  code: String.raw`#include <iostream>

template <typename T>
T larger(T a, T b) {
    return a > b ? a : b;
}

int main() {
    std::cout << larger(3, 9) << ' ' << larger(2.5, 1.5) << '\n';
}`,
  why: String.raw`One definition serves every type that supports the comparison, so the same logic is reused for int and double without copying it.` },

{ n: 2, d: "easy", t: "Box holding a value",
  p: String.raw`Write a class template Box that stores one value of any type and has a function get that returns it. Create a Box holding the string hello and a Box holding the integer 4. Print both contents separated by a space.`,
  ex: String.raw`hello 4`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

template <typename T>
class Box {
    T value;
public:
    explicit Box(T v) : value(std::move(v)) {}
    const T& get() const { return value; }
};

int main() {
    Box<std::string> s("hello");
    Box<int> i(4);
    std::cout << s.get() << ' ' << i.get() << '\n';
}`,
  why: String.raw`A single class definition produces a separate, fully typed class for each element type it is used with.` },

{ n: 3, d: "easy", t: "Count live objects per type",
  p: String.raw`Write a class template Tracked whose objects increase a count of live objects when constructed and decrease it when destroyed. The count must be kept separately for each type. Create two objects of type Tracked<int> and one object of type Tracked<double>. Print the number of live Tracked<int> objects, then the number of live Tracked<double> objects, separated by a space.`,
  ex: String.raw`2 1`,
  code: String.raw`#include <iostream>

template <typename T>
struct Tracked {
    static inline int live = 0;
    Tracked() { ++live; }
    ~Tracked() { --live; }
};

int main() {
    Tracked<int> a, b;
    Tracked<double> c;
    std::cout << Tracked<int>::live << ' ' << Tracked<double>::live << '\n';
}`,
  why: String.raw`Each instantiation of a class template has its own static members, so the counts for different types do not interfere.` },

{ n: 4, d: "easy", t: "Pair with a defaulted type",
  p: String.raw`Write a class template Pair with two type parameters, where the second parameter defaults to the first. Each Pair has a member first and a member second. Create a Pair<int> holding 1 and 2, and a Pair<int, std::string> holding 3 and x. Print the four values separated by spaces.`,
  ex: String.raw`1 2 3 x`,
  code: String.raw`#include <iostream>
#include <string>

template <typename T, typename U = T>
struct Pair {
    T first;
    U second;
};

int main() {
    Pair<int> p1{1, 2};
    Pair<int, std::string> p2{3, "x"};
    std::cout << p1.first << ' ' << p1.second << ' ' << p2.first << ' ' << p2.second << '\n';
}`,
  why: String.raw`A default for a template parameter lets common uses stay short while still allowing a different second type when needed.` },

{ n: 5, d: "easy", t: "Alias for a vector template",
  p: String.raw`Give the name Vec to std::vector of T, for any type T. Create a Vec<int> holding 4 and 5. Print its number of elements and the sum of its elements, separated by a space.`,
  ex: String.raw`2 9`,
  code: String.raw`#include <iostream>
#include <vector>

template <typename T>
using Vec = std::vector<T>;

int main() {
    Vec<int> v{4, 5};
    int sum = 0;
    for (int x : v) sum += x;
    std::cout << v.size() << ' ' << sum << '\n';
}`,
  why: String.raw`A name for a family of types saves repeating long template arguments throughout a program.` },

{ n: 6, d: "easy", t: "Compare two types",
  p: String.raw`Print whether int and long are the same type, then whether const int and int are the same type. Print each answer as true or false, separated by a space.`,
  ex: String.raw`false false`,
  code: String.raw`#include <iostream>
#include <type_traits>

int main() {
    std::cout << std::boolalpha
              << std::is_same_v<int, long> << ' '
              << std::is_same_v<const int, int> << '\n';
}`,
  why: String.raw`Type traits let code ask questions about types at compile time, such as whether two types are identical.` },

{ n: 7, d: "easy", t: "Accept any argument type",
  p: String.raw`Write a function that accepts an argument of any type and returns twice its value. Call it with 4 and with 1.5. Print the two results separated by a space.`,
  ex: String.raw`8 3`,
  code: String.raw`#include <iostream>

auto twice(auto x) {
    return x + x;
}

int main() {
    std::cout << twice(4) << ' ' << twice(1.5) << '\n';
}`,
  why: String.raw`A parameter declared with auto makes the function generic, so the compiler creates a version for each argument type it is called with.` },

{ n: 8, d: "easy", t: "Convert to a chosen type",
  p: String.raw`Write a function template that takes the type to convert to as its first template argument and a value as its argument, and returns the value converted to that type. Call it so that 7 becomes a double, and print the result with exactly one digit after the decimal point.`,
  ex: String.raw`7.0`,
  code: String.raw`#include <iomanip>
#include <iostream>

template <typename To, typename From>
To convert(From f) {
    return static_cast<To>(f);
}

int main() {
    std::cout << std::fixed << std::setprecision(1) << convert<double>(7) << '\n';
}`,
  why: String.raw`Supplying the target type explicitly while letting the source type be deduced is a common pattern in conversion helpers.` },

{ n: 9, d: "easy", t: "Count the arguments",
  p: String.raw`Write a function that accepts any number of arguments of any types and returns how many it was given. Print the count for a call with 1, the character a and 2.0, then the count for a call with no arguments, separated by a space.`,
  ex: String.raw`3 0`,
  code: String.raw`#include <cstddef>
#include <iostream>

template <typename... Ts>
std::size_t count(Ts...) {
    return sizeof...(Ts);
}

int main() {
    std::cout << count(1, 'a', 2.0) << ' ' << count() << '\n';
}`,
  why: String.raw`The number of arguments in a parameter pack is available at compile time, so the function can report it without any loop.` },

{ n: 10, d: "easy", t: "Holder shows its value",
  p: String.raw`Write a class template Holder<T> whose constructor takes a value of type T and whose function show prints that value. Create a Holder<int> with 5 and a Holder<char> with z. Call show on each, printing the two values separated by a space.`,
  ex: String.raw`5 z`,
  code: String.raw`#include <iostream>

template <typename T>
class Holder {
    T value;
public:
    explicit Holder(T v) : value(v) {}
    void show() const { std::cout << value; }
};

int main() {
    Holder<int>(5).show();
    std::cout << ' ';
    Holder<char>('z').show();
    std::cout << '\n';
}`,
  why: String.raw`The same class template handles numbers and characters alike, with each instance printing the type it was built for.` },
{ n: 11, d: "easy", t: "Full specialisation for two types",
  p: String.raw`A class template TypeName<T> has a static function name that returns other for any type. Give full specializations so that TypeName<int> returns int and TypeName<char> returns char. Print the names for int, char and double, separated by spaces.`,
  ex: String.raw`int char other`,
  code: String.raw`#include <iostream>

template <typename T>
struct TypeName {
    static const char* name() { return "other"; }
};

template <>
struct TypeName<int> {
    static const char* name() { return "int"; }
};

template <>
struct TypeName<char> {
    static const char* name() { return "char"; }
};

int main() {
    std::cout << TypeName<int>::name() << ' ' << TypeName<char>::name() << ' '
              << TypeName<double>::name() << '\n';
}`,
  why: String.raw`Full specializations give a specific type its own definition, which is how a generic template can special-case individual types.` },

{ n: 12, d: "easy", t: "Alias for a pair of one type",
  p: String.raw`Define an alias template Pair2 for std::pair whose two members both have the type T. Create a Pair2<int> holding 3 and 4, and print the sum of its two members.`,
  ex: String.raw`7`,
  code: String.raw`#include <iostream>
#include <utility>

template <typename T>
using Pair2 = std::pair<T, T>;

int main() {
    Pair2<int> p{3, 4};
    std::cout << p.first + p.second << '\n';
}`,
  why: String.raw`An alias template gives a shorter name to a family of types, so the same pattern can be reused with different element types.` },

{ n: 13, d: "easy", t: "Variable template",
  p: String.raw`Define a variable template named pi that holds the value 3.14 converted to the requested type. Print pi with int and pi with double, separated by a space.`,
  ex: String.raw`3 3.14`,
  code: String.raw`#include <iostream>

template <typename T>
constexpr T pi = static_cast<T>(3.14);

int main() {
    std::cout << pi<int> << ' ' << pi<double> << '\n';
}`,
  why: String.raw`A variable template produces a separate variable for each type it is given, similar to how a class template produces a separate class.` },

{ n: 14, d: "easy", t: "Deduce types without arguments",
  p: String.raw`Create a std::pair holding the int 1 and the double 2.5, and a std::vector holding 1, 2 and 3, without writing any template arguments. Print the number of elements in the vector, then the second member of the pair, separated by a space.`,
  ex: String.raw`3 2.5`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

int main() {
    std::pair p{1, 2.5};
    std::vector v{1, 2, 3};
    std::cout << v.size() << ' ' << p.second << '\n';
}`,
  why: String.raw`Class template argument deduction lets the compiler work out the template arguments from the constructor arguments.` },

{ n: 15, d: "easy", t: "Choose text by a bool argument",
  p: String.raw`A function template name takes a bool as a template argument. When the argument is true it returns UP, and when it is false it returns low. Print the result for true and for false, separated by a space.`,
  ex: String.raw`UP low`,
  code: String.raw`#include <iostream>

template <bool Upper>
const char* name() {
    if constexpr (Upper)
        return "UP";
    else
        return "low";
}

int main() {
    std::cout << name<true>() << ' ' << name<false>() << '\n';
}`,
  why: String.raw`Template arguments need not be types; a constant value such as a bool can choose behaviour when the function is instantiated.` },

{ n: 16, d: "easy", t: "Trailing return type",
  p: String.raw`Write a function template add whose return type is the type of adding its two arguments, written after the parameter list. Print add(1, 2.5) and add(1, 2), separated by a space.`,
  ex: String.raw`3.5 3`,
  code: String.raw`#include <iostream>

template <typename A, typename B>
auto add(A a, B b) -> decltype(a + b) {
    return a + b;
}

int main() {
    std::cout << add(1, 2.5) << ' ' << add(1, 2) << '\n';
}`,
  why: String.raw`A trailing return type can refer to the parameters by name, so the result type follows whatever the arguments produce.` },
{ n: 17, d: "easy", t: "Multiply any number of arguments",
  p: String.raw`Write a function template product that accepts any number of int arguments and returns their product, with the product of no arguments being 1. Print product applied to 2, 3 and 4, then product applied to 5 alone, separated by a space.`,
  ex: String.raw`24 5`,
  code: String.raw`#include <iostream>

template <typename... Ts>
int product(Ts... xs) {
    return (1 * ... * xs);
}

int main() {
    std::cout << product(2, 3, 4) << ' ' << product(5) << '\n';
}`,
  why: String.raw`A fold expression applies one operator across every element of a parameter pack, so the function works for any number of arguments.` },
{ n: 18, d: "easy", t: "Recursive variadic total",
  p: String.raw`Write a function template total that returns the sum of any number of int arguments, and also works when given a single argument. Print total applied to 1, 2 and 3.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>

template <typename T>
T total(T x) {
    return x;
}

template <typename T, typename... R>
T total(T x, R... rest) {
    return x + total(rest...);
}

int main() {
    std::cout << total(1, 2, 3) << '\n';
}`,
  why: String.raw`A variadic function can recurse on the rest of its arguments, with a base case that handles the last remaining one.` },

{ n: 19, d: "easy", t: "Decay and remove cv-ref",
  p: String.raw`Print whether std::decay applied to const int& gives int, then whether std::remove_cvref applied to const int& gives int. Print each answer as true or false, separated by a space.`,
  ex: String.raw`true true`,
  code: String.raw`#include <iostream>
#include <type_traits>

int main() {
    std::cout << std::boolalpha
              << std::is_same_v<std::decay_t<const int&>, int> << ' '
              << std::is_same_v<std::remove_cvref_t<const int&>, int> << '\n';
}`,
  why: String.raw`Type transformation traits strip references and qualifiers, which is how generic code gets the plain type it works with.` },

// ---------- Medium ----------
{ n: 20, d: "medium", t: "Special version for bool",
  p: String.raw`A class template Describe<T> has a function name that returns the text generic for any type. Give it a version for bool whose name returns flag. Print the name for Describe<int> and the name for Describe<bool>, separated by a space.`,
  ex: String.raw`generic flag`,
  code: String.raw`#include <iostream>

template <typename T>
struct Describe {
    static const char* name() { return "generic"; }
};

template <>
struct Describe<bool> {
    static const char* name() { return "flag"; }
};

int main() {
    std::cout << Describe<int>::name() << ' ' << Describe<bool>::name() << '\n';
}`,
  why: String.raw`A full specialization replaces the general definition for one exact type, which lets a single type behave differently without changing the rest.` },

{ n: 21, d: "medium", t: "Pointer category",
  p: String.raw`A class template Kind has a function name that returns unknown for any type. Make it return pointer for every pointer type, including pointers to any type. Print the name for int and the name for int*, separated by a space.`,
  ex: String.raw`unknown pointer`,
  code: String.raw`#include <iostream>

template <typename T>
struct Kind {
    static const char* name() { return "unknown"; }
};

template <typename T>
struct Kind<T*> {
    static const char* name() { return "pointer"; }
};

int main() {
    std::cout << Kind<int>::name() << ' ' << Kind<int*>::name() << '\n';
}`,
  why: String.raw`A partial specialization matches a whole family of types, such as every pointer, using a pattern in the template arguments.` },

{ n: 22, d: "medium", t: "Sum of any array length",
  p: String.raw`Write a function that accepts an array of int of any length and returns the sum of its elements. Print the sum of the array 1 2 3 4 5 and the sum of the array 7 8 9, separated by a space.`,
  ex: String.raw`15 24`,
  code: String.raw`#include <cstddef>
#include <iostream>

template <std::size_t N>
int sum(const int (&a)[N]) {
    int total = 0;
    for (std::size_t i = 0; i < N; ++i) total += a[i];
    return total;
}

int main() {
    int data[] = {1, 2, 3, 4, 5};
    int small[] = {7, 8, 9};
    std::cout << sum(data) << ' ' << sum(small) << '\n';
}`,
  why: String.raw`Taking the array by reference lets the compiler deduce its length from the argument, so one function works for arrays of every size.` },

{ n: 23, d: "medium", t: "Matrix element count",
  p: String.raw`Create a class template Matrix whose row count and column count are compile-time values. Its size is the row count times the column count. Print the size of a Matrix with 2 rows and 3 columns, then the size of a Matrix with 4 rows and 4 columns, separated by a space.`,
  ex: String.raw`6 16`,
  code: String.raw`#include <cstddef>
#include <iostream>

template <std::size_t Rows, std::size_t Cols>
struct Matrix {
    static constexpr std::size_t size = Rows * Cols;
    double data[Rows * Cols]{};
};

int main() {
    std::cout << Matrix<2, 3>::size << ' ' << Matrix<4, 4>::size << '\n';
}`,
  why: String.raw`Dimensions given as template arguments are known at compile time, so sizes can be computed and used as constants.` },

{ n: 24, d: "medium", t: "Print values with commas",
  p: String.raw`Write a function that prints any number of values, with each value separated from the next by a comma and a space, and ends the output with a newline. Call it with 1, the string hi and 2.5. The output is the three values in that order.`,
  ex: String.raw`1, hi, 2.5`,
  code: String.raw`#include <iostream>
#include <string>

template <typename... Ts>
void show(const Ts&... xs) {
    bool first = true;
    ((std::cout << (first ? "" : ", ") << xs, first = false), ...);
    std::cout << '\n';
}

int main() {
    show(1, std::string("hi"), 2.5);
}`,
  why: String.raw`Applying one expression to every element of a parameter pack lets a function handle any mix of argument types in one place.` },

{ n: 25, d: "medium", t: "Half for integers only",
  p: String.raw`Write a function template half that returns half of its argument, rounding toward zero. It must accept only integer types, so a call with a floating-point value must not compile. Print half of 9.`,
  ex: String.raw`4`,
  code: String.raw`#include <iostream>
#include <type_traits>

template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0>
T half(T x) {
    return x / 2;
}

int main() {
    std::cout << half(9) << '\n';
}`,
  why: String.raw`Making an unused template parameter depend on a type property removes the function from overload resolution for types that do not qualify.` },

{ n: 26, d: "medium", t: "Compile-time type branch",
  p: String.raw`Write a function template that returns the text integer for integral types, floating for floating-point types, and other for any remaining type. The choice is made at compile time. Print the result for int and for double, separated by a space.`,
  ex: String.raw`integer floating`,
  code: String.raw`#include <iostream>
#include <type_traits>

template <typename T>
const char* kind() {
    if constexpr (std::is_integral_v<T>)
        return "integer";
    else if constexpr (std::is_floating_point_v<T>)
        return "floating";
    else

}

int main() {

}`,
  why: String.raw`A compile-time branch discards the branches that do not apply, so each instantiation contains only the code it needs.` },

{ n: 27, d: "medium", t: "Concept for numeric types",

{ n: 35, d: "medium", t: "Factory that forwards arguments",

{ n: 39, d: "medium", t: "Formatting policy",

{ n: 47, d: "medium", t: "Customise swap through lookup",

{ n: 51, d: "hard", t: "Position of a type",

{ n: 55, d: "hard", t: "Visitor for a variant",

{ n: 58, d: "hard", t: "Store any callable from int to int",

  code: String.raw`#include <iostream>
#include <memory>
#include <utility>

class IntFn {
    struct Concept {
        virtual ~Concept() = default;
        virtual int call(int x) const = 0;
    };
    template <typename F>
    struct Model : Concept {
        F f;
        explicit Model(F g) : f(std::move(g)) {}
        int call(int x) const override { return f(x); }
    };

public:

    int operator()(int x) const { return p->call(x); }

int main() {

    IntFn dbl = [](int x) { return x * 2; };

{ n: 67, d: "hard", t: "Lazy expression with a scale",

{ n: 91, d: "applications", t: "Memoise a function",
  p: String.raw`Write a function template that takes a function from int to int and returns a new function that remembers the results it has already computed for each argument. Wrap a function that increments a counter each time it runs and returns the square of its input. Call the wrapped function with 3, then with 3 again, then with 4. Print how many times the original function ran.`,
  ex: String.raw`2`,
  code: String.raw`#include <iostream>
#include <map>
#include <memory>

int runs = 0;

template <typename F>
auto memo(F f) {
    auto cache = std::make_shared<std::map<int, int>>();
    return [f, cache](int x) {
        auto it = cache->find(x);
        if (it != cache->end()) return it->second;
        int r = f(x);
        (*cache)[x] = r;
        return r;
    };
}

int main() {
    auto sq = memo([](int x) {
        ++runs;
        return x * x;
    });
    sq(3);
    sq(3);
    sq(4);
    std::cout << runs << '\n';
}`,
  why: String.raw`A wrapper that stores results keyed by argument turns repeated calls into lookups, and it works for any function with that signature.` },

{ n: 94, d: "applications", t: "Typed event bus",
  p: String.raw`Build a small event bus. Listeners subscribe to one event type and receive only events of that type. Subscribe a listener for int events that prints int followed by the value, and a listener for string events that prints string followed by the text. Then publish the int 5, and publish the string hello.`,
  ex: String.raw`int 5
string hello`,
  code: String.raw`#include <any>
#include <functional>
#include <iostream>
#include <map>
#include <string>
#include <typeindex>
#include <utility>
#include <vector>

class Bus {
    std::map<std::type_index, std::vector<std::any>> subs;
public:
    template <typename E>
    void subscribe(std::function<void(const E&)> f) {
        subs[std::type_index(typeid(E))].push_back(std::move(f));
    }
    template <typename E>
    void publish(const E& e) {
        for (auto& a : subs[std::type_index(typeid(E))])
            std::any_cast<std::function<void(const E&)>>(a)(e);
    }
};

int main() {
    Bus bus;
    bus.subscribe<int>([](const int& v) { std::cout << "int " << v << '\n'; });
    bus.subscribe<std::string>([](const std::string& s) { std::cout << "string " << s << '\n'; });
    bus.publish(5);
    bus.publish(std::string("hello"));
}`,
  why: String.raw`Keying handlers by the event's type lets a single bus dispatch many kinds of event while each handler keeps its own parameter type.` },

const TOTAL = problems.length;
const KEY = "cpp-templates-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 19, label: "Easy", range: "Problems 1–19", badge: "easy" },
  { from: 20, to: 49, label: "Medium", range: "Problems 20–49", badge: "medium" },
  { from: 50, to: 72, label: "Hard", range: "Problems 50–72", badge: "hard" },
  { from: 73, to: 88, label: "Extension", range: "Problems 73–88", badge: null },
  { from: 89, to: 98, label: "Applications", range: "Problems 89–98", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
