<script>
const problems = [
{ n: 1, d: "easy", t: "Find a value in a sorted array", idiom: "Binary search",
  p: String.raw`In the sorted vector 1, 3, 5, 7, 9, find the index of the value 7. Print the index, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{1, 3, 5, 7, 9};
    int lo = 0, hi = static_cast<int>(v.size()) - 1, target = 7, found = -1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (v[mid] == target) { found = mid; break; }
        if (v[mid] < target) lo = mid + 1;
        else hi = mid - 1;
    }
    std::cout << found << "\n";
}`,
  why: String.raw`Each comparison with the middle element discards half of the remaining candidates, so a sorted array of n values needs about log2(n) comparisons.` },

{ n: 2, d: "easy", t: "Largest value in one pass", idiom: "Linear scan",
  p: String.raw`Find the largest value in the vector 4, 9, 2. Print it, then a newline.`,
  ex: String.raw`9`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{4, 9, 2};
    int best = v[0];
    for (int x : v)
        if (x > best) best = x;
    std::cout << best << "\n";
}`,
  why: String.raw`Keeping a running best value while scanning once is the simplest linear algorithm. It touches each element exactly once.` },

{ n: 3, d: "easy", t: "Insertion sort", idiom: "Insertion sort",
  p: String.raw`Sort the vector 5, 2, 4, 1 in ascending order. Print the result separated by spaces, then a newline.`,
  ex: String.raw`1 2 4 5`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{5, 2, 4, 1};
    for (std::size_t i = 1; i < v.size(); ++i) {
        int key = v[i];
        std::size_t j = i;
        while (j > 0 && v[j - 1] > key) {
            v[j] = v[j - 1];
            --j;
        }
        v[j] = key;
    }
    for (int x : v) std::cout << x << " ";
    std::cout << "\n";
}`,
  why: String.raw`Insertion sort works like sorting a hand of cards: each new card slides left past larger cards. It is quadratic in general but fast on nearly sorted input.` },

{ n: 4, d: "easy", t: "Count swaps made by bubble sort", idiom: "Bubble sort",
  p: String.raw`Sort the vector 3, 2, 1 in ascending order, counting every time two elements are exchanged. Print the count, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

int main() {
    std::vector<int> v{3, 2, 1};
    int swaps = 0;
    for (std::size_t pass = 0; pass + 1 < v.size(); ++pass)
        for (std::size_t i = 0; i + 1 < v.size() - pass; ++i)
            if (v[i] > v[i + 1]) {
                std::swap(v[i], v[i + 1]);
                ++swaps;
            }
    std::cout << swaps << "\n";
}`,
  why: String.raw`Every swap fixes exactly one inversion, so the number of swaps a sorting algorithm makes equals the number of pairs that were out of order to begin with.` },

{ n: 5, d: "easy", t: "Greatest common divisor", idiom: "Euclid's algorithm",
  p: String.raw`Compute the greatest common divisor of 48 and 18. Print the result, then a newline.`,
  ex: String.raw`6`,
  code: String.raw`#include <iostream>

int main() {
    int a = 48, b = 18;
    while (b != 0) {
        int r = a % b;
        a = b;
        b = r;
    }
    std::cout << a << "\n";
}`,
  why: String.raw`The remainder of the larger number by the smaller has the same common divisors, and it is strictly smaller. That shrinks the problem until it is trivial.` },

{ n: 6, d: "easy", t: "Count primes up to a bound", idiom: "Sieve of Eratosthenes",
  p: String.raw`Count the primes less than or equal to 20. Print the count, then a newline.`,
  ex: String.raw`8`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    const int n = 20;
    std::vector<bool> composite(n + 1, false);
    int count = 0;
    for (int i = 2; i <= n; ++i) {
        if (composite[i]) continue;
        ++count;
        for (int j = i * i; j <= n; j += i) composite[j] = true;
    }
    std::cout << count << "\n";
}`,
  why: String.raw`The sieve crosses out multiples of each prime, so every composite is marked by its smallest prime factor. It runs in roughly n log log n time.` },

{ n: 7, d: "easy", t: "Iterative Fibonacci", idiom: "Iteration",
  p: String.raw`Compute the tenth Fibonacci number, where the first two numbers are 0 and 1. Print it, then a newline.`,
  ex: String.raw`55`,
  code: String.raw`#include <iostream>

int main() {
    long long a = 0, b = 1;
    for (int i = 0; i < 10; ++i) {
        long long t = a + b;
        a = b;
        b = t;
    }
    std::cout << a << "\n";
}`,
  why: String.raw`Each Fibonacci number depends only on the two before it, so a loop with two variables computes the sequence in linear time and constant space.` },

{ n: 8, d: "easy", t: "Factorial of ten", idiom: "Accumulation",
  p: String.raw`Compute 10 factorial, the product of the integers 1 through 10, using a 64-bit integer. Print the result, then a newline.`,
  ex: String.raw`3628800`,
  code: String.raw`#include <iostream>

int main() {
    long long f = 1;
    for (int i = 2; i <= 10; ++i) f *= i;
    std::cout << f << "\n";
}`,
  why: String.raw`Accumulating a product in a loop is the iterative form of a recursive definition. A 64-bit result is needed here because the value grows quickly.` },

{ n: 9, d: "easy", t: "Reverse an array in place", idiom: "Two indices",
  p: String.raw`Reverse the vector 1, 2, 3, 4. Print the result separated by spaces, then a newline.`,
  ex: String.raw`4 3 2 1`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

int main() {
    std::vector<int> v{1, 2, 3, 4};
    std::size_t i = 0, j = v.size() - 1;
    while (i < j) {
        std::swap(v[i], v[j]);
        ++i;
        --j;
    }
    for (int x : v) std::cout << x << " ";
    std::cout << "\n";
}`,
  why: String.raw`Swapping from both ends uses two indices that converge, so each element is touched once and no extra array is needed.` },

{ n: 10, d: "easy", t: "Sum of decimal digits", idiom: "Digit extraction",
  p: String.raw`Compute the sum of the decimal digits of 98765. Print the sum, then a newline.`,
  ex: String.raw`35`,
  code: String.raw`#include <iostream>

int main() {
    int n = 98765, s = 0;
    while (n > 0) {
        s += n % 10;
        n /= 10;
    }
    std::cout << s << "\n";
}`,
  why: String.raw`Repeated division by ten exposes the digits from the least significant end. The same pattern works in any base.` },

{ n: 11, d: "medium", t: "Merge sort", idiom: "Divide and conquer",
  p: String.raw`Sort the vector 5, 1, 4, 2, 3 in ascending order. Print the result separated by spaces, then a newline.`,
  ex: String.raw`1 2 3 4 5`,
  code: String.raw`#include <iostream>
#include <vector>

void merge_sort(std::vector<int>& v, std::size_t lo, std::size_t hi) {
    if (hi - lo < 2) return;
    std::size_t mid = lo + (hi - lo) / 2;
    merge_sort(v, lo, mid);
    merge_sort(v, mid, hi);
    std::vector<int> merged;
    std::size_t i = lo, j = mid;
    while (i < mid && j < hi) merged.push_back(v[i] <= v[j] ? v[i++] : v[j++]);
    while (i < mid) merged.push_back(v[i++]);
    while (j < hi) merged.push_back(v[j++]);
    for (std::size_t k = 0; k < merged.size(); ++k) v[lo + k] = merged[k];
}

int main() {
    std::vector<int> v{5, 1, 4, 2, 3};
    merge_sort(v, 0, v.size());
    for (int x : v) std::cout << x << " ";
    std::cout << "\n";
}`,
  why: String.raw`Merge sort halves the problem, sorts the halves, and merges them in linear time. Its O(n log n) cost holds for every input, not just typical ones.` },

{ n: 12, d: "medium", t: "Quicksort with a partition", idiom: "Partitioning",
  p: String.raw`Sort the vector 9, 4, 7, 1 in ascending order. Print the result separated by spaces, then a newline.`,
  ex: String.raw`1 4 7 9`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

void quicksort(std::vector<int>& v, int lo, int hi) {
    if (lo >= hi) return;
    int pivot = v[hi], i = lo;
    for (int j = lo; j < hi; ++j)
        if (v[j] < pivot) std::swap(v[i++], v[j]);
    std::swap(v[i], v[hi]);
    quicksort(v, lo, i - 1);
    quicksort(v, i + 1, hi);
}

int main() {
    std::vector<int> v{9, 4, 7, 1};
    quicksort(v, 0, static_cast<int>(v.size()) - 1);
    for (int x : v) std::cout << x << " ";
    std::cout << "\n";
}`,
  why: String.raw`Quicksort places the pivot in its final position and recurses on both sides. It is fast on average and sorts in place, but its worst case depends on pivot choice.` },

{ n: 13, d: "medium", t: "Pair with a target sum in a sorted array", idiom: "Two pointers",
  p: String.raw`In the sorted vector 1, 2, 4, 7, 11, find the two values that add up to 9. Print the two values separated by a space, then a newline.`,
  ex: String.raw`2 7`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{1, 2, 4, 7, 11};
    int target = 9;
    std::size_t i = 0, j = v.size() - 1;
    while (i < j) {
        int s = v[i] + v[j];
        if (s == target) break;
        if (s < target) ++i;
        else --j;
    }
    std::cout << v[i] << " " << v[j] << "\n";
}`,
  why: String.raw`In a sorted array, a sum that is too small can only be fixed by moving the left pointer right, and one that is too large by moving the right pointer left. Each step rules out one side safely.` },

{ n: 14, d: "medium", t: "Maximum sum of a fixed-size window", idiom: "Sliding window",
  p: String.raw`For the vector 1, 3, -1, -3, 5, 3, 6, 7, find the largest sum of any three consecutive elements. Print the maximum sum, then a newline.`,
  ex: String.raw`16`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{1, 3, -1, -3, 5, 3, 6, 7};
    const std::size_t k = 3;
    int sum = 0;
    for (std::size_t i = 0; i < k; ++i) sum += v[i];
    int best = sum;
    for (std::size_t i = k; i < v.size(); ++i) {
        sum += v[i] - v[i - k];
        best = std::max(best, sum);
    }
    std::cout << best << "\n";
}`,
  why: String.raw`A window moves by adding the element that enters and removing the one that leaves, so each window costs constant time instead of being summed from scratch.` },

{ n: 15, d: "medium", t: "Largest sum of a contiguous subarray", idiom: "Kadane's algorithm",
  p: String.raw`Find the largest sum of a contiguous run of elements in -2, 1, -3, 4, -1, 2, 1, -5, 4. Print the result, then a newline.`,
  ex: String.raw`6`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{-2, 1, -3, 4, -1, 2, 1, -5, 4};
    int cur = v[0], best = v[0];
    for (std::size_t i = 1; i < v.size(); ++i) {
        cur = std::max(v[i], cur + v[i]);
        best = std::max(best, cur);
    }
    std::cout << best << "\n";
}`,
  why: String.raw`At each position, the best subarray ending there either extends the previous one or starts fresh. Recording only that running value gives the answer in one pass.` },

{ n: 16, d: "medium", t: "Answer range sums from prefix sums", idiom: "Prefix sums",
  p: String.raw`For the vector 2, 4, 6, 8, 10, find the sum of the elements at indices 1 through 3, inclusive. Print the sum, then a newline.`,
  ex: String.raw`18`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{2, 4, 6, 8, 10};
    std::vector<int> pre(v.size() + 1, 0);
    for (std::size_t i = 0; i < v.size(); ++i) pre[i + 1] = pre[i] + v[i];
    std::cout << pre[4] - pre[1] << "\n";
}`,
  why: String.raw`After one linear pass to build prefix sums, any range sum is a single subtraction. This turns many range queries from linear work each into constant work each.` },

{ n: 17, d: "medium", t: "Fewest coins for an amount", idiom: "Dynamic programming",
  p: String.raw`Using coins of values 1, 2 and 5, with an unlimited supply of each, find the fewest coins that make 11. Print the result, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    const int target = 11;
    const std::vector<int> coins{1, 2, 5};
    std::vector<int> dp(target + 1, 1000000);
    dp[0] = 0;
    for (int a = 1; a <= target; ++a)
        for (int c : coins)
            if (c <= a) dp[a] = std::min(dp[a], dp[a - c] + 1);
    std::cout << dp[target] << "\n";
}`,
  why: String.raw`Dynamic programming stores the answer to each subproblem so it is computed once. Here each amount reuses the best answer for amounts smaller by one coin.` },

{ n: 18, d: "medium", t: "Length of a longest common subsequence", idiom: "Dynamic programming",
  p: String.raw`Find the length of the longest common subsequence of the strings abcde and ace, where a subsequence keeps the original order but may skip characters. Print the length, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

int main() {
    std::string a = "abcde", b = "ace";
    std::vector<std::vector<int>> dp(a.size() + 1, std::vector<int>(b.size() + 1, 0));
    for (std::size_t i = 1; i <= a.size(); ++i)
        for (std::size_t j = 1; j <= b.size(); ++j)
            dp[i][j] = a[i - 1] == b[j - 1] ? dp[i - 1][j - 1] + 1
                                            : std::max(dp[i - 1][j], dp[i][j - 1]);
    std::cout << dp[a.size()][b.size()] << "\n";
}`,
  why: String.raw`Matching characters extend a shared subsequence from the diagonal, and mismatches fall back to the better of two shorter prefixes. The table fills in order, so each cell is ready when it is needed.` },

{ n: 19, d: "medium", t: "Best value within a weight limit", idiom: "Dynamic programming",
  p: String.raw`You have items with (weight, value) pairs (1, 1), (2, 3), (3, 4) and (4, 5), and a capacity of 5. Each item may be used at most once. Find the largest total value that fits within the capacity. Print the value, then a newline.`,
  ex: String.raw`7`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    const std::vector<std::pair<int, int>> items{{1, 1}, {2, 3}, {3, 4}, {4, 5}};
    const int cap = 5;
    std::vector<int> dp(cap + 1, 0);
    for (auto [w, v] : items)
        for (int c = cap; c >= w; --c)
            dp[c] = std::max(dp[c], dp[c - w] + v);
    std::cout << dp[cap] << "\n";
}`,
  why: String.raw`Iterating capacities downward means each item is counted at most once, because the entries it reads have not yet been updated for this item.` },

{ n: 20, d: "medium", t: "Shortest hop count in an unweighted graph", idiom: "Breadth-first search",
  p: String.raw`The undirected graph has vertices 0 to 4 and edges 0-1, 0-2, 1-3, 2-3 and 3-4. Find the number of edges on the shortest path from vertex 0 to vertex 4. Print the number, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    std::vector<std::vector<int>> adj(5);
    auto add = [&](int a, int b) { adj[a].push_back(b); adj[b].push_back(a); };
    add(0, 1); add(0, 2); add(1, 3); add(2, 3); add(3, 4);
    std::vector<int> dist(5, -1);
    std::queue<int> q;
    dist[0] = 0;
    q.push(0);
    while (!q.empty()) {
        int u = q.front();
        q.pop();
        for (int v : adj[u])
            if (dist[v] < 0) {
                dist[v] = dist[u] + 1;
                q.push(v);
            }
    }
    std::cout << dist[4] << "\n";
}`,
  why: String.raw`A breadth-first search visits vertices in order of distance from the source, so the first time it reaches a vertex is along a shortest path.` },

{ n: 21, d: "medium", t: "Depth-first visit order", idiom: "Depth-first search",
  p: String.raw`The directed graph has edges 0 to 1, 0 to 2 and 1 to 3. Starting at vertex 0, visit the vertices so that neighbours are tried in increasing order and each vertex is recorded when first reached. Print the recorded order separated by spaces, then a newline.`,
  ex: String.raw`0 1 3 2`,
  code: String.raw`#include <iostream>
#include <vector>

std::vector<std::vector<int>> adj{{1, 2}, {3}, {}, {}};
std::vector<bool> seen(4, false);

void dfs(int u) {
    seen[u] = true;
    std::cout << u << " ";
    for (int v : adj[u])
        if (!seen[v]) dfs(v);
}

int main() {

}`,
  why: String.raw`Depth-first search follows one branch as far as it goes before backtracking. Marking vertices when entered keeps it from looping forever on cycles.` },

{ n: 22, d: "medium", t: "Shortest weighted path", idiom: "Dijkstra's algorithm",
  p: String.raw`The directed weighted graph has edges 0 to 1 with weight 4, 0 to 2 with weight 1, 2 to 1 with weight 2, and 1 to 3 with weight 1. Find the shortest distance from vertex 0 to vertex 3. Print the distance, then a newline.`,
  ex: String.raw`4`,
  code: String.raw`#include <functional>
#include <iostream>
#include <limits>
#include <queue>
#include <utility>
#include <vector>

int main() {
    std::vector<std::vector<std::pair<int, int>>> adj(4);
    adj[0] = {{1, 4}, {2, 1}};
    adj[2] = {{1, 2}};
    adj[1] = {{3, 1}};
    std::vector<int> dist(4, std::numeric_limits<int>::max());
    using State = std::pair<int, int>;
    std::priority_queue<State, std::vector<State>, std::greater<State>> pq;
    dist[0] = 0;
    pq.push({0, 0});
    while (!pq.empty()) {
        auto [d, u] = pq.top();
        pq.pop();
        if (d > dist[u]) continue;

            }
    }

}`,
  why: String.raw`Dijkstra's algorithm settles vertices in order of distance, which is only correct when all weights are nonnegative. A heap gives the next closest vertex quickly.` },

{ n: 23, d: "medium", t: "Count connected components", idiom: "Union-find",
  p: String.raw`There are 4 elements numbered 0 to 3, initially each in its own group. Join the groups containing 0 and 1, then print the number of groups. Then join the groups containing 2 and 3, then the groups containing 1 and 2, and print the number of groups again. Print the two counts separated by a space, then a newline.`,
  ex: String.raw`3 1`,
  code: String.raw`#include <iostream>
#include <numeric>
#include <vector>

struct DSU {
    std::vector<int> parent;
    int sets;
    explicit DSU(int n) : parent(n), sets(n) { std::iota(parent.begin(), parent.end(), 0); }
    int find(int x) { return parent[x] == x ? x : parent[x] = find(parent[x]); }
    void unite(int a, int b) {
        a = find(a);
        b = find(b);
        if (a != b) {
            parent[a] = b;
            --sets;
        }
    }
};

int main() {
    DSU d(4);
    d.unite(0, 1);
    int first = d.sets;
    d.unite(2, 3);
    d.unite(1, 2);
    std::cout << first << " " << d.sets << "\n";
}`,
  why: String.raw`A disjoint-set forest answers whether two elements are connected and merges their sets almost in constant time, which is why it underlies many connectivity and clustering algorithms.` },

{ n: 24, d: "hard", t: "Order tasks respecting dependencies", idiom: "Topological sort",
  p: String.raw`There are six tasks numbered 0 to 5, with the prerequisites: 5 before 2, 5 before 0, 4 before 0, 4 before 1, 2 before 3 and 3 before 1. Print an order of the tasks in which every prerequisite comes before the task that needs it, always choosing the smallest-numbered task when there is a choice. Print the order separated by spaces, then a newline.`,
  ex: String.raw`4 5 0 2 3 1`,
  code: String.raw`#include <functional>
#include <iostream>
#include <queue>
#include <vector>

int main() {
    const int n = 6;
    std::vector<std::vector<int>> out(n);
    std::vector<int> indeg(n, 0);
    auto edge = [&](int a, int b) { out[a].push_back(b); ++indeg[b]; };
    edge(5, 2); edge(5, 0); edge(4, 0); edge(4, 1); edge(2, 3); edge(3, 1);
    std::priority_queue<int, std::vector<int>, std::greater<int>> ready;
    for (int i = 0; i < n; ++i)
        if (indeg[i] == 0) ready.push(i);
    while (!ready.empty()) {
        int u = ready.top();
        ready.pop();
        std::cout << u << " ";
        for (int v : out[u])
            if (--indeg[v] == 0) ready.push(v);
    }
    std::cout << "\n";
}`,
  why: String.raw`Repeatedly removing a task with no remaining prerequisites produces a valid order whenever the dependencies contain no cycle. Using a heap for the ready set makes the tie-breaking deterministic.` },

{ n: 25, d: "hard", t: "Longest prefix that is also a suffix", idiom: "KMP prefix function",

  code: String.raw`#include <iostream>
#include <string>
#include <vector>

int main() {
    std::string s = "aabaaab";
    std::vector<int> pi(s.size(), 0);
    for (std::size_t i = 1; i < s.size(); ++i) {
        int k = pi[i - 1];
        while (k > 0 && s[i] != s[k]) k = pi[k - 1];
        if (s[i] == s[k]) ++k;

{ n: 26, d: "hard", t: "Count placements of non-attacking queens", idiom: "Backtracking",
  p: String.raw`Count the ways to place six queens on a six-by-six chessboard so that no two queens attack each other. Print the count, then a newline.`,
  ex: String.raw`4`,
  code: String.raw`#include <iostream>
#include <vector>

int n = 6;
std::vector<bool> cols(6, false), d1(12, false), d2(12, false);

int solve(int row) {
    if (row == n) return 1;
    int total = 0;
    for (int c = 0; c < n; ++c) {
        if (cols[c] || d1[row + c] || d2[row - c + n - 1]) continue;
        cols[c] = d1[row + c] = d2[row - c + n - 1] = true;
        total += solve(row + 1);
        cols[c] = d1[row + c] = d2[row - c + n - 1] = false;
    }
    return total;
}

int main() {
    std::cout << solve(0) << "\n";
}`,
  why: String.raw`Backtracking explores the choices one at a time and abandons any partial placement that already violates a rule. It is exhaustive, but pruning keeps the search far smaller than trying every arrangement.` },

{ n: 27, d: "hard", t: "Subset sum by table", idiom: "Dynamic programming",

  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    const std::vector<int> nums{3, 34, 4, 12, 5, 2};
    const int target = 9;
    std::vector<bool> reach(target + 1, false);
    reach[0] = true;
    for (int x : nums)
        for (int s = target; s >= x; --s)

}`,

{ n: 28, d: "hard", t: "Minimum edits between two words", idiom: "Edit distance",
  p: String.raw`Find the minimum number of single-character insertions, deletions and substitutions needed to turn kitten into sitting. Print the number, then a newline.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

int main() {
    std::string a = "kitten", b = "sitting";
    std::vector<std::vector<int>> d(a.size() + 1, std::vector<int>(b.size() + 1));
    for (std::size_t i = 0; i <= a.size(); ++i) d[i][0] = static_cast<int>(i);
    for (std::size_t j = 0; j <= b.size(); ++j) d[0][j] = static_cast<int>(j);
    for (std::size_t i = 1; i <= a.size(); ++i)
        for (std::size_t j = 1; j <= b.size(); ++j) {
            int sub = d[i - 1][j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1);
            d[i][j] = std::min({d[i - 1][j] + 1, d[i][j - 1] + 1, sub});
        }
    std::cout << d[a.size()][b.size()] << "\n";
}`,
  why: String.raw`Edit distance is the cost of the cheapest sequence of edits, found by combining the costs of three smaller subproblems. Spell checkers and diff tools are built on this recurrence.` },

{ n: 29, d: "hard", t: "k-th largest with a bounded heap", idiom: "Heaps",

{ n: 31, d: "hard", t: "Smallest integer whose square reaches a bound", idiom: "Binary search on the answer",

{ n: 33, d: "hard", t: "All-pairs shortest distances", idiom: "Floyd-Warshall",
  p: String.raw`The directed graph has vertices 0, 1 and 2, with edges 0 to 1 of weight 3, 1 to 2 of weight 4, and 0 to 2 of weight 10. Find the shortest distance from vertex 0 to vertex 2, considering all possible paths. Print the distance, then a newline.`,
  ex: String.raw`7`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    const int INF = 1000000, n = 3;
    std::vector<std::vector<int>> d(n, std::vector<int>(n, INF));
    for (int i = 0; i < n; ++i) d[i][i] = 0;
    d[0][1] = 3;
    d[1][2] = 4;
    d[0][2] = 10;
    for (int k = 0; k < n; ++k)
        for (int i = 0; i < n; ++i)
            for (int j = 0; j < n; ++j)
                d[i][j] = std::min(d[i][j], d[i][k] + d[k][j]);
    std::cout << d[0][2] << "\n";
}`,

{ n: 34, d: "extension", t: "Recover the shortest path itself", idiom: "Path reconstruction",
  p: String.raw`The directed weighted graph has edges 0 to 1 with weight 4, 0 to 2 with weight 1, 2 to 1 with weight 2, and 1 to 3 with weight 1. Find the shortest path from vertex 0 to vertex 3, and list the vertices along it in order. Print the vertices separated by spaces, then a newline.`,
  ex: String.raw`0 2 1 3`,
  code: String.raw`#include <algorithm>
#include <functional>
#include <iostream>
#include <limits>
#include <queue>
#include <utility>
#include <vector>

int main() {
    std::vector<std::vector<std::pair<int, int>>> adj(4);
    adj[0] = {{1, 4}, {2, 1}};
    adj[2] = {{1, 2}};
    adj[1] = {{3, 1}};
    const int INF = std::numeric_limits<int>::max();
    std::vector<int> dist(4, INF), from(4, -1);
    using State = std::pair<int, int>;
    std::priority_queue<State, std::vector<State>, std::greater<State>> pq;
    dist[0] = 0;
    pq.push({0, 0});
    while (!pq.empty()) {
        auto [d, u] = pq.top();
        pq.pop();
        if (d > dist[u]) continue;
        for (auto [v, w] : adj[u])
            if (d + w < dist[v]) {
                dist[v] = d + w;
                from[v] = u;
                pq.push({dist[v], v});
            }
    }
    std::vector<int> path;
    for (int v = 3; v != -1; v = from[v]) path.push_back(v);
    std::reverse(path.begin(), path.end());
    for (int v : path) std::cout << v << " ";
    std::cout << "\n";
}`,
  why: String.raw`Storing a predecessor for each vertex costs one extra array and lets the algorithm return the route, not just its length. Walking the predecessors backwards from the target gives the path in reverse.` },

{ n: 35, d: "extension", t: "Count permutations with next_permutation", idiom: "Permutation generation",

  p: String.raw`From the intervals (1, 3), (2, 4), (3, 5) and (0, 6), choose as many as possible so that no two chosen intervals overlap, where touching at an endpoint is allowed. Print the number chosen, then a newline.`,

{ n: 38, d: "extension", t: "Memoized recursion", idiom: "Memoization",
  p: String.raw`Compute the fiftieth Fibonacci number, where the first two numbers are 0 and 1. Print the result, then a newline.`,
  ex: String.raw`12586269025`,
  code: String.raw`#include <iostream>
#include <map>

std::map<int, long long> memo;

long long fib(int n) {
    if (n < 2) return n;
    auto it = memo.find(n);
    if (it != memo.end()) return it->second;
    long long r = fib(n - 1) + fib(n - 2);
    memo[n] = r;
    return r;
}

int main() {
    std::cout << fib(50) << "\n";
}`,
  why: String.raw`Caching results of a recursive definition turns an exponential computation into a linear one, since each subproblem is solved once.` },

{ n: 39, d: "extension", t: "Majority element by cancellation", idiom: "Boyer-Moore voting",
  p: String.raw`The vector 2, 2, 1, 1, 1, 2, 2 contains an element that appears more than half the time. Find it. Print it, then a newline.`,
  ex: String.raw`2`,
  code: String.raw`#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{2, 2, 1, 1, 1, 2, 2};
    int candidate = 0, count = 0;
    for (int x : v) {
        if (count == 0) candidate = x;
        count += (x == candidate) ? 1 : -1;

}`,

{ n: 40, d: "applications", t: "Merge several sorted lists", idiom: "Heap-based merge",
  p: String.raw`Merge the three sorted lists 1, 4, 7; 2, 5; and 3, 6 into one sorted sequence. Print the merged values separated by spaces, then a newline.`,
  ex: String.raw`1 2 3 4 5 6 7`,
  code: String.raw`#include <functional>
#include <iostream>
#include <queue>
#include <tuple>
#include <vector>

int main() {
    std::vector<std::vector<int>> lists{{1, 4, 7}, {2, 5}, {3, 6}};
    using Item = std::tuple<int, std::size_t, std::size_t>;
    std::priority_queue<Item, std::vector<Item>, std::greater<Item>> pq;
    for (std::size_t i = 0; i < lists.size(); ++i) pq.push({lists[i][0], i, 0});
    while (!pq.empty()) {
        auto [val, li, idx] = pq.top();
        pq.pop();

        if (idx + 1 < lists[li].size()) pq.push({lists[li][idx + 1], li, idx + 1});
    }
    std::cout << "\n";
}`,
  why: String.raw`Merging k sorted sequences with a heap of their current fronts takes O(n log k) time. External sorting of files that do not fit in memory relies on the same idea.` },

{ n: 41, d: "applications", t: "Rooms needed for overlapping meetings", idiom: "Sweep line",

{ n: 42, d: "applications", t: "Longest strictly increasing subsequence", idiom: "Patience sorting",
  p: String.raw`Find the length of the longest strictly increasing subsequence of 10, 9, 2, 5, 3, 7, 101, 18. Print the length, then a newline.`,

int main() {

{ n: 43, d: "applications", t: "Group anagrams", idiom: "Hashing with canonical keys",

{ n: 44, d: "applications", t: "Cheapest path through a grid", idiom: "Grid dynamic programming",
  p: String.raw`In the grid with rows 1 3 1, 1 5 1 and 4 2 1, find the minimum total of the cell values along a path from the top-left to the bottom-right corner, moving only right or down. Print the minimum sum, then a newline.`,
  ex: String.raw`7`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    std::vector<std::vector<int>> g{{1, 3, 1}, {1, 5, 1}, {4, 2, 1}};
    std::size_t R = g.size(), C = g[0].size();
    std::vector<std::vector<int>> dp(R, std::vector<int>(C, 0));
    for (std::size_t i = 0; i < R; ++i)
        for (std::size_t j = 0; j < C; ++j) {
            int best = 0;
            if (i == 0 && j == 0) best = 0;
            else if (i == 0) best = dp[i][j - 1];
            else if (j == 0) best = dp[i - 1][j];
            else best = std::min(dp[i - 1][j], dp[i][j - 1]);
            dp[i][j] = g[i][j] + best;
        }
    std::cout << dp[R - 1][C - 1] << "\n";
}`,

{ n: 45, d: "applications", t: "Validate bracket nesting", idiom: "Stack matching",
  p: String.raw`Check whether the bracket strings ()[]{} and ([)] are properly nested. Print 1 for the first string being valid and 0 for the second, separated by a space, then a newline.`,
  ex: String.raw`1 0`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>

bool valid(const std::string& s) {
    std::stack<char> st;
    for (char c : s) {
        if (c == '(' || c == '[' || c == '{') {
            st.push(c);
        } else {
            char open = c == ')' ? '(' : c == ']' ? '[' : '{';
            if (st.empty() || st.top() != open) return false;
            st.pop();
        }
    }
    return st.empty();
}

int main() {
    std::cout << valid("()[]{}") << " " << valid("([)]") << "\n";
}`,

const TOTAL = problems.length;
const KEY = "cpp-algorithms-v1";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 10, label: "Easy", range: "Problems 1–10", badge: "easy" },
  { from: 11, to: 23, label: "Medium", range: "Problems 11–23", badge: "medium" },
  { from: 24, to: 33, label: "Hard", range: "Problems 24–33", badge: "hard" },
  { from: 34, to: 39, label: "Extension", range: "Problems 34–39", badge: null },
  { from: 40, to: 46, label: "Applications", range: "Problems 40–46", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
