{ n: 64, d: "hard", t: "Store different shapes behind one type", idiom: "Type erasure",
  p: String.raw`Write a class Shape that can hold any value that has an area() method returning a double and a name() method returning a std::string. Callers must not need to name the held type. Shape must be copyable. Objects of unrelated types must work without a common base class. Store a Square with side 2 and a Circle with radius 1 in a std::vector<Shape>. Then print each name followed by its area with two decimals, and print done.`,
  ex: String.raw`square 4.00
circle 3.14
done`,
  code: String.raw`#include <concepts>
#include <iomanip>
#include <iostream>
#include <memory>
#include <string>
#include <type_traits>
#include <utility>
#include <vector>

class Shape {
    struct Concept {
        virtual ~Concept() = default;
        virtual std::unique_ptr<Concept> clone() const = 0;
        virtual double area() const = 0;
        virtual std::string name() const = 0;
    };
    template <typename T>
    struct Model : Concept {
        T obj;
        explicit Model(T o) : obj(std::move(o)) {}
        std::unique_ptr<Concept> clone() const override { return std::make_unique<Model>(obj); }
        double area() const override { return obj.area(); }
        std::string name() const override { return obj.name(); }
    };
    std::unique_ptr<Concept> impl_;
public:
    template <typename T>
        requires (!std::same_as<std::decay_t<T>, Shape>)
    Shape(T obj) : impl_(std::make_unique<Model<T>>(std::move(obj))) {}
    Shape(const Shape& o) : impl_(o.impl_->clone()) {}
    Shape& operator=(const Shape& o) { impl_ = o.impl_->clone(); return *this; }
    Shape(Shape&&) noexcept = default;
    Shape& operator=(Shape&&) noexcept = default;
    double area() const { return impl_->area(); }
    std::string name() const { return impl_->name(); }
};

struct Square {
    double side;
    double area() const { return side * side; }
    std::string name() const { return "square"; }
};

struct Circle {
    double radius;
    double area() const { return 3.14159265358979 * radius * radius; }
    std::string name() const { return "circle"; }
};

int main() {
    std::vector<Shape> shapes;
    shapes.push_back(Square{2});
    shapes.push_back(Circle{1});
    for (const Shape& s : shapes) {
        std::cout << s.name() << " " << std::fixed << std::setprecision(2) << s.area() << "\n";
    }
    std::cout << "done\n";
}`,
  why: String.raw`A class template stores each concrete object behind a private abstract interface, so the outer type can hold any object without inheriting from anything. Copying works because each stored object knows how to clone itself.` },

{ n: 65, d: "hard", t: "Share text until one copy changes", idiom: "Copy-on-write",
  p: String.raw`Write a class Text that holds its characters in a shared buffer, so copying a Text does not copy the characters. Before a Text changes its characters, it must make its own private copy of the buffer if another Text still shares it, and it must print detach when it does so. Create a Text t holding abc, copy it into u, append d to u, print t and then u each on its own line, and print done.`,
  ex: String.raw`detach
abc
abcd
done`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>
#include <utility>

class Text {
    std::shared_ptr<std::string> data_;
    void detach() {
        if (data_.use_count() > 1) {
            data_ = std::make_shared<std::string>(*data_);
            std::cout << "detach\n";
        }
    }
public:
    explicit Text(std::string s) : data_(std::make_shared<std::string>(std::move(s))) {}
    void append(char c) {
        detach();
        data_->push_back(c);
    }
    const std::string& str() const { return *data_; }
};

int main() {
    Text t("abc");
    Text u = t;
    u.append('d');
    std::cout << t.str() << "\n" << u.str() << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`Copies share one buffer, so copying is cheap. The buffer is duplicated only at the moment a write would otherwise be visible to another copy, which keeps values independent.` },

{ n: 66, d: "hard", t: "Close handles in the right order after a move", idiom: "Custom deleter with ownership moved between containers",
  p: String.raw`Define a Handle struct with an int id. open_handle prints open followed by the id and returns a new Handle with that id. close_handle prints close followed by the id and deletes the handle. Create a unique_ptr to a Handle with id 1, using close_handle as its deleter. Move it into a vector of such pointers. Emplace a pointer to a handle with id 2 into the vector. Then reset the original pointer to a handle with id 3. Erase the first element of the vector, print end, and let main finish.`,
  ex: String.raw`open 1
open 2
open 3
close 1
end
close 2
close 3`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

struct Handle { int id; };

Handle* open_handle(int id) {
    std::cout << "open " << id << "\n";
    return new Handle{id};
}

void close_handle(Handle* h) {
    std::cout << "close " << h->id << "\n";
    delete h;
}

int main() {
    using Ptr = std::unique_ptr<Handle, void (*)(Handle*)>;
    Ptr a(open_handle(1), close_handle);
    std::vector<Ptr> v;
    v.push_back(std::move(a));

}`,
  why: String.raw`A unique_ptr keeps its deleter when it is moved, so a moved handle is still closed by the right function. Destruction runs in reverse declaration order, so the vector's contents are closed before the original pointer.` },

{ n: 67, d: "hard", t: "Retry an initialiser after it throws", idiom: "Call once (retry after exception)",
  p: String.raw`A function init increments a counter. The first time it is called it throws a runtime_error with the message boom. Otherwise it prints init followed by the counter. Write a function run that calls std::call_once with a std::once_flag and init. It prints the message of the exception if the call throws, and prints ok if the call returns. Call run twice, then call std::call_once once more directly from main with the same flag and function, then print done followed by the counter.`,
  ex: String.raw`error boom
init 2
ok
done 2`,
  code: String.raw`#include <exception>
#include <iostream>
#include <mutex>
#include <stdexcept>

std::once_flag flag;
int attempts = 0;

void init() {
    ++attempts;
    if (attempts == 1) throw std::runtime_error("boom");
    std::cout << "init " << attempts << "\n";
}

void run() {
    try {
        std::call_once(flag, init);
        std::cout << "ok\n";
    } catch (const std::exception& e) {
        std::cout << "error " << e.what() << "\n";
    }
}

int main() {
    run();
    run();
    std::call_once(flag, init);
    std::cout << "done " << attempts << "\n";
}`,
  why: String.raw`If the function passed to call_once throws, the flag is left unset, so a later call runs it again. Once it returns normally, the flag is set and no further call runs it.` },

{ n: 68, d: "hard", t: "Keep the old value when a copy throws", idiom: "Copy-and-swap (strong exception guarantee)",
  p: String.raw`Define an Item holding a name. Copying an Item whose name is bad throws a runtime_error with the message copy failed. Define a Box that holds a vector of Items and has a copy assignment operator that takes its argument by value and swaps it with itself. Create a Box a holding x and y, and a Box b holding ok and bad. Assign b to a inside a try block, print the message of any exception caught, then print the items of a on one line and the items of b on another.`,
  ex: String.raw`copy failed
x y
ok bad`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <string>
#include <utility>
#include <vector>

struct Item {
    std::string name;
    explicit Item(std::string n) : name(std::move(n)) {}
    Item(Item&&) noexcept = default;
    Item(const Item& o) : name(o.name) {
        if (o.name == "bad") throw std::runtime_error("copy failed");
    }
    Item& operator=(const Item&) = delete;
    Item& operator=(Item&&) = delete;
};

class Box {
    std::vector<Item> items;
public:
    explicit Box(std::vector<Item> v) : items(std::move(v)) {}
    Box(const Box&) = default;
    Box(Box&&) noexcept = default;
    friend void swap(Box& a, Box& b) noexcept { std::swap(a.items, b.items); }
    Box& operator=(Box other) {
        swap(*this, other);
        return *this;
    }
    void show() const {
        for (const Item& i : items) std::cout << i.name << ' ';
        std::cout << '\n';
    }
};

int main() {
    std::vector<Item> va;
    va.push_back(Item{"x"});
    va.push_back(Item{"y"});
    Box a(std::move(va));
    std::vector<Item> vb;
    vb.push_back(Item{"ok"});
    vb.push_back(Item{"bad"});
    Box b(std::move(vb));
    try {
        a = b;
    } catch (const std::exception& e) {
        std::cout << e.what() << "\n";
    }
    a.show();
    b.show();
}`,
  why: String.raw`The by-value parameter is built first, so the throw happens before anything is swapped in. The object keeps its old contents when an operation fails, which is the strong guarantee.` },

{ n: 69, d: "hard", t: "Parse and halve numbers as one chain", idiom: "Result type (monadic chaining)",
  p: String.raw`Write a parse function that turns a string into an int. It returns an error message of trailing followed by the string if the whole string is not consumed, and bad followed by the string if the text is not a number. Write a half function that returns an error message of odd followed by the number if the number is odd, and otherwise returns half of it. Chain parse with two calls to half for each of the inputs 12, 6x, abc and 6. Print ok followed by the value, or err followed by the message, for each input on its own line.`,
  ex: String.raw`ok 3
err trailing 6x
err bad abc
err odd 3`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

std::expected<int, std::string> parse(const std::string& s) {
    try {
        std::size_t used = 0;
        int v = std::stoi(s, &used);
        if (used != s.size()) return std::unexpected("trailing " + s);
        return v;
    } catch (const std::exception&) {
        return std::unexpected("bad " + s);
    }
}

std::expected<int, std::string> half(int v) {
    if (v % 2 != 0) return std::unexpected("odd " + std::to_string(v));
    return v / 2;
}

int main() {
    for (std::string s : {"12", "6x", "abc", "6"}) {
        auto r = parse(s).and_then(half).and_then(half);
        if (r) std::cout << "ok " << *r << "\n";
        else std::cout << "err " << r.error() << "\n";
    }
}`,
  why: String.raw`Each step returns either a value or an error, and and_then runs the next step only on a value. A failure at any point flows through unchanged, so the error handling is written once at the end.` },

{ n: 70, d: "hard", t: "Undo edits in reverse order", idiom: "Command with undo log",
  p: String.raw`Keep a document as a string. Define a Command with apply and undo operations that act on the document. Define Append, which adds its text to the end, and Trim, which removes the last character and remembers it for undo. Run Append with hello, then Append with the text " world" including its leading space, then Trim, keeping every command in a history. Print the document. Then undo the last two commands in reverse order and print the document. Then undo the last remaining command, print the document in square brackets, and print the size of the history.`,
  ex: String.raw`hello worl
hello
[] 0`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>
#include <vector>

struct Command {
    virtual ~Command() = default;
    virtual void apply(std::string& d) = 0;
    virtual void undo(std::string& d) = 0;
};

struct Append : Command {
    std::string text;
    explicit Append(std::string s) : text(std::move(s)) {}
    void apply(std::string& d) override { d += text; }
    void undo(std::string& d) override { d.erase(d.size() - text.size()); }
};

struct Trim : Command {
    std::string removed;
    void apply(std::string& d) override {
        removed = d.substr(d.size() - 1);
        d.pop_back();
    }
    void undo(std::string& d) override { d += removed; }
};

int main() {
    std::string doc;
    std::vector<std::unique_ptr<Command>> history;
    auto run = [&](std::unique_ptr<Command> c) {
        c->apply(doc);
        history.push_back(std::move(c));
    };
    run(std::make_unique<Append>("hello"));
    run(std::make_unique<Append>(" world"));
    run(std::make_unique<Trim>());
    std::cout << doc << "\n";
    for (int i = 0; i < 2; ++i) {
        history.back()->undo(doc);
        history.pop_back();
    }
    std::cout << doc << "\n";
    history.back()->undo(doc);
    history.pop_back();
    std::cout << "[" << doc << "] " << history.size() << "\n";
}`,
  why: String.raw`Each command knows how to reverse itself, so the history only needs to store commands, not copies of the document. Undoing in last-in, first-out order returns the document to each earlier state.` },

{ n: 71, d: "hard", t: "Watch which moves a vector really uses", idiom: "noexcept move for vector growth",
  p: String.raw`Define a template class Obj with an int id, a static copy counter and a static move counter. Its copy constructor increments the copy counter. Its move constructor increments the move counter and is noexcept only when the template argument is true. Write a function run that takes a name and a bool template argument, builds a std::vector of three Obj values with emplace_back in a loop, and then prints the name, the word copies, the copy count, the word moves and the move count, separated by spaces. Call run with true and the name nothrow, then with false and the name throwing.`,
  ex: String.raw`nothrow copies 0 moves 3
throwing copies 3 moves 0`,
  code: String.raw`#include <iostream>
#include <vector>

template <bool NothrowMove>
struct Obj {
    int id;
    static inline int copies = 0;
    static inline int moves = 0;
    explicit Obj(int i) : id(i) {}
    Obj(const Obj& o) : id(o.id) { ++copies; }
    Obj(Obj&& o) noexcept(NothrowMove) : id(o.id) { ++moves; }
};

template <bool NT>
void run(const char* name) {
    std::vector<Obj<NT>> v;
    for (int i = 0; i < 3; ++i) v.emplace_back(i);
    std::cout << name << " copies " << Obj<NT>::copies << " moves " << Obj<NT>::moves << "\n";
}

int main() {
    run<true>("nothrow");
    run<false>("throwing");
}`,
  why: String.raw`When a vector grows it moves its elements only if the move cannot throw. Otherwise it copies them, so a throwing move makes every reallocation pay for copies instead.` },

{ n: 72, d: "hard", t: "Transfer money between accounts from two threads", idiom: "Deadlock-free locking with std::scoped_lock",
  p: String.raw`Define an Account with a std::mutex and an int balance. Write transfer, which takes two accounts and an amount, and moves the amount from the first to the second while holding both mutexes. Start two threads: one makes 1000 transfers of 1 from a to b, and the other makes 1000 transfers of 2 from b to a. Join both threads, then print a's balance, b's balance and their sum separated by spaces. Both accounts start with 1000.`,
  ex: String.raw`2000 0 2000`,
  code: String.raw`#include <iostream>
#include <mutex>
#include <thread>

struct Account {
    std::mutex m;
    int balance;
};

void transfer(Account& from, Account& to, int amt) {
    std::scoped_lock lk(from.m, to.m);
    from.balance -= amt;
    to.balance += amt;
}

int main() {
    Account a{{}, 1000};
    Account b{{}, 1000};
    std::thread t1([&] { for (int i = 0; i < 1000; ++i) transfer(a, b, 1); });
    std::thread t2([&] { for (int i = 0; i < 1000; ++i) transfer(b, a, 2); });
    t1.join();
    t2.join();
    std::cout << a.balance << ' ' << b.balance << ' ' << a.balance + b.balance << '\n';
}`,
  why: String.raw`std::scoped_lock locks several mutexes with a deadlock-avoidance algorithm, so the two threads cannot each hold one lock while waiting for the other. The total is preserved because every transfer is atomic.` },

{ n: 73, d: "hard", t: "Let only a designated class change the engine", idiom: "Attorney-client (friend-restricted construction)",
  p: String.raw`Define an Engine with a private ignite method that takes an rpm and records it, and increments a start count. Engine exposes public getters for rpm and the start count. Define a Mechanic class that is the only class allowed to call ignite, and has a static tune method that takes an Engine and an rpm, and calls ignite only if the rpm is greater than 0. In main, tune an engine to 0, then to 800, then to 1200. Print the rpm and the start count, separated by a space.`,
  ex: String.raw`1200 2`,
  code: String.raw`#include <iostream>

class Engine {
    int rpm_ = 0;
    int starts_ = 0;
    void ignite(int rpm) { rpm_ = rpm; ++starts_; }
    friend class Mechanic;
public:
    int rpm() const { return rpm_; }
    int starts() const { return starts_; }
};

class Mechanic {
public:
    static void tune(Engine& e, int rpm) {
        if (rpm > 0) e.ignite(rpm);
    }
};

int main() {
    Engine e;
    Mechanic::tune(e, 0);
    Mechanic::tune(e, 800);
    Mechanic::tune(e, 1200);
    std::cout << e.rpm() << ' ' << e.starts() << '\n';
}`,
  why: String.raw`A friend declaration lets one named class reach private members without making them public. Other code cannot call ignite, and the rule for when it runs stays in one place.` },

{ n: 74, d: "hard", t: "Report a port that is not a number or is out of range", idiom: "Result type (value or error)",
  p: String.raw`Define Error with a string message. Define parse_port, which returns either an int or an Error. It returns the error empty if the string is empty. It returns the error not a number: followed by the string if any character is not a digit. It returns the error out of range: followed by the string if the number is above 65535. Otherwise it returns the number. For each of the inputs 8080, empty, 80x and 70000, print port followed by the number, or error followed by the message.`,
  ex: String.raw`port 8080
error empty
error not a number: 80x
error out of range: 70000`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

struct Error { std::string msg; };
using Result = std::variant<int, Error>;

Result parse_port(const std::string& s) {
    if (s.empty()) return Error{"empty"};
    int v = 0;
    for (char c : s) {
        if (c < '0' || c > '9') return Error{"not a number: " + s};
        v = v * 10 + (c - '0');
    }
    if (v > 65535) return Error{"out of range: " + s};
    return v;
}

int main() {
    for (const char* in : {"8080", "", "80x", "70000"}) {
        Result r = parse_port(in);
        if (std::holds_alternative<int>(r))
            std::cout << "port " << std::get<int>(r) << '\n';
        else
            std::cout << "error " << std::get<Error>(r).msg << '\n';
    }
}`,
  why: String.raw`The return type states that a call yields a value or an error, so callers must check which one they have before using it. No exception is thrown for an expected bad input.` },

{ n: 75, d: "hard", t: "Ignore assignment of an object to itself", idiom: "Self-assignment check",
  p: String.raw`Define Text, which owns a heap std::string through a pointer. Its constructor takes a std::string and its destructor frees it. Copy construction is not allowed. Its copy assignment operator returns early and prints self when assigning an object to itself. Otherwise it frees its own string and copies the other's. Create a Text a holding one and a Text b holding two. Assign b to a, assign a to itself, then print a's string.`,
  ex: String.raw`self
two`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

class Text {
    std::string* p_;
public:
    explicit Text(std::string s) : p_(new std::string(std::move(s))) {}
    ~Text() { delete p_; }
    Text(const Text&) = delete;
    Text& operator=(const Text& o) {
        if (this == &o) {
            std::cout << "self\n";
            return *this;
        }
        delete p_;
        p_ = new std::string(*o.p_);
        return *this;
    }
    const std::string& get() const { return *p_; }
};

int main() {
    Text a("one");
    Text b("two");
    a = b;
    a = a;
    std::cout << a.get() << '\n';
}`,
  why: String.raw`Freeing the old string before copying from the source would destroy the source too when both are the same object. The self-check keeps the object valid in that case.` },

{ n: 76, d: "hard", t: "Close a C-style database handle through a unique_ptr", idiom: "Custom deleter for C handles",
  p: String.raw`Define a CDb struct with an int id. Define db_open, which prints open followed by the id and returns a new CDb, and db_close, which prints close followed by the id and deletes the CDb. Define a functor DbCloser whose call operator calls db_close. Define DbPtr as a unique_ptr to CDb with DbCloser as its deleter, and connect, which returns a DbPtr from db_open. In main, connect 1 and keep it. In a block, connect 2, reset that pointer, and print after reset. Then connect 3, print c ready if the pointer is not null, and let main finish.`,
  ex: String.raw`open 1
open 2
close 2
after reset
open 3
c ready
close 3
close 1`,
  code: String.raw`#include <iostream>
#include <memory>

struct CDb { int id; };

CDb* db_open(int id) {
    std::cout << "open " << id << "\n";
    return new CDb{id};
}

void db_close(CDb* d) {
    std::cout << "close " << d->id << "\n";
    delete d;
}

struct DbCloser {
    void operator()(CDb* d) const { db_close(d); }
};

using DbPtr = std::unique_ptr<CDb, DbCloser>;

DbPtr connect(int id) { return DbPtr(db_open(id)); }

int main() {
    DbPtr a = connect(1);
    {
        DbPtr b = connect(2);
        b.reset();
        std::cout << "after reset\n";
    }
    DbPtr c = connect(3);
    if (c) std::cout << "c ready\n";
}`,
  why: String.raw`A unique_ptr with a deleter that calls the C close function releases the handle on every exit path, and reset closes it early. The functor makes the close call part of the type, so no caller can forget it.` },

{ n: 77, d: "hard", t: "Pass in collaborators instead of creating them", idiom: "Dependency injection",
  p: String.raw`Define an abstract Clock with a now method returning an int. RealClock returns 1000. FakeClock holds an int that it returns. Define a Logger that takes a shared_ptr to a Clock in its constructor, has a log method that stores the current time, a space and the message, and a lines method returning the stored lines. In main, create a FakeClock holding 42 and a Logger using it. Log start. Change the fake clock to 50 and log stop. Create a second Logger using a RealClock and log boot. Print every line of the first logger, then every line of the second.`,
  ex: String.raw`42 start
50 stop
1000 boot`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>
#include <vector>

struct Clock {
    virtual ~Clock() = default;
    virtual int now() const = 0;
};

struct RealClock : Clock {
    int now() const override { return 1000; }
};

struct FakeClock : Clock {
    int t;
    explicit FakeClock(int v) : t(v) {}
    int now() const override { return t; }
};

class Logger {
    std::shared_ptr<Clock> clock_;
    std::vector<std::string> lines_;
public:
    explicit Logger(std::shared_ptr<Clock> c) : clock_(std::move(c)) {}
    void log(const std::string& m) { lines_.push_back(std::to_string(clock_->now()) + ' ' + m); }
    const std::vector<std::string>& lines() const { return lines_; }
};

int main() {
    auto fake = std::make_shared<FakeClock>(42);
    Logger a(fake);
    a.log("start");
    fake->t = 50;
    a.log("stop");
    Logger b(std::make_shared<RealClock>());
    b.log("boot");
    for (const auto& s : a.lines()) std::cout << s << '\n';
    for (const auto& s : b.lines()) std::cout << s << '\n';
}`,
  why: String.raw`The logger receives its clock from outside, so a test can supply a fake whose time it controls. The class does not decide which clock it uses, and it works with any implementation of the interface.` },

{ n: 78, d: "hard", t: "Restore a global mode when nested calls end", idiom: "Scope guard (restore value on exit)",
  p: String.raw`A global string mode starts as normal. Define ModeGuard, whose constructor saves the current mode and sets it to the given value, and whose destructor puts the saved value back. Define inner, which sets the mode to debug for its scope and prints inner followed by the mode. Define outer, which sets the mode to quiet for its scope, prints outer followed by the mode, calls inner, then prints after inner followed by the mode. In main, call outer, then print main followed by the mode.`,
  ex: String.raw`outer quiet
inner debug
after inner quiet
main normal`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

std::string mode = "normal";

class ModeGuard {
    std::string saved_;
public:
    explicit ModeGuard(std::string m) : saved_(mode) { mode = std::move(m); }
    ~ModeGuard() { mode = saved_; }
};

void inner() {
    ModeGuard g("debug");
    std::cout << "inner " << mode << '\n';
}

void outer() {
    ModeGuard g("quiet");
    std::cout << "outer " << mode << '\n';
    inner();
    std::cout << "after inner " << mode << '\n';
}

int main() {
    outer();
    std::cout << "main " << mode << '\n';
}`,
  why: String.raw`Each guard remembers the value it replaced, so nested changes unwind in reverse order and leave the global as it was before the outermost call.` },

{ n: 79, d: "hard", t: "Route writes to any sink through one type", idiom: "Type erasure",
  p: String.raw`Write a class AnyWriter that can hold any callable taking a const string reference, without being a template itself. Copying an AnyWriter shares the held callable. Its write method forwards the string to the held callable. Create writer a that appends its text to an ostringstream buf, and writer b that increments a count and prints the text in square brackets. Write ab through a, cd through b, copy b into c, and write ef through c. Print the content of buf, then a space, then count.`,
  ex: String.raw`[cd]
[ef]
ab 2`,
  code: String.raw`#include <concepts>
#include <iostream>
#include <memory>
#include <sstream>
#include <string>
#include <type_traits>
#include <utility>

class AnyWriter {
    struct Base {
        virtual ~Base() = default;
        virtual void write(const std::string&) = 0;
    };
    template <typename W>
    struct Impl : Base {
        W w;
        explicit Impl(W x) : w(std::move(x)) {}
        void write(const std::string& s) override { w(s); }
    };
    std::shared_ptr<Base> p_;
public:
    template <typename W>
        requires (!std::same_as<std::decay_t<W>, AnyWriter>)
    AnyWriter(W w) : p_(std::make_shared<Impl<W>>(std::move(w))) {}
    void write(const std::string& s) { p_->write(s); }
};

int main() {
    std::ostringstream buf;
    int count = 0;
    AnyWriter a([&](const std::string& s) { buf << s; });
    AnyWriter b([&](const std::string& s) {
        ++count;
        std::cout << "[" << s << "]\n";
    });
    a.write("ab");
    b.write("cd");
    AnyWriter c = b;
    c.write("ef");
    std::cout << buf.str() << ' ' << count << '\n';
}`,
  why: String.raw`The outer class stores a pointer to an abstract base, and each template instance inherits from that base. Callers see one non-template type, while any callable can be held behind it.` },

{ n: 80, d: "hard", t: "Copy a shared vector only when it is written", idiom: "Copy-on-write",
  p: String.raw`Define CowVec, which holds a vector of ints through a shared_ptr. Before a push, if the vector is shared with another CowVec, it makes its own copy and prints copy. Give it a size method and an at method. In main, create a CowVec a with values 1 and 2. Copy a into b, copy b into c. Push 3 onto c, then push 4 onto b. Print the sizes of a, b and c and the value at index 1 of b, separated by spaces.`,
  ex: String.raw`copy
copy
2 3 3 2`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

class CowVec {
    std::shared_ptr<std::vector<int>> d_;
    void detach() {
        if (d_.use_count() > 1) {
            d_ = std::make_shared<std::vector<int>>(*d_);
            std::cout << "copy\n";
        }
    }
public:
    CowVec() : d_(std::make_shared<std::vector<int>>()) {}
    void push(int v) {
        detach();
        d_->push_back(v);
    }
    int at(std::size_t i) const { return (*d_)[i]; }
    std::size_t size() const { return d_->size(); }
};

int main() {
    CowVec a;
    a.push(1);
    a.push(2);
    CowVec b = a;
    CowVec c = b;
    c.push(3);
    b.push(4);
    std::cout << a.size() << ' ' << b.size() << ' ' << c.size() << ' ' << b.at(1) << '\n';
}`,
  why: String.raw`Copies share one buffer, so copying is cheap. The buffer is duplicated only when a write would otherwise be visible through another copy, which keeps the values independent.` },

{ n: 81, d: "hard", t: "Release resources in reverse on failure", idiom: "RAII (exception-safe acquisition)",
  p: String.raw`Define Lock with a name and a flag. Its constructor throws a runtime_error with the message busy followed by the name if the flag is true. Otherwise it prints lock followed by the name. Its destructor prints unlock followed by the name. Define move_money, which takes a flag, creates a Lock named accounts with no failure, then a Lock named ledger with the flag, and prints transfer. In main, call move_money with false, then with true inside a try block, printing the message when it is caught.`,
  ex: String.raw`lock accounts
lock ledger
transfer
unlock ledger
unlock accounts
lock accounts
unlock accounts
busy ledger`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <string>

class Lock {
    std::string n_;
public:
    Lock(std::string n, bool fail) : n_(std::move(n)) {
        if (fail) throw std::runtime_error("busy " + n_);
        std::cout << "lock " << n_ << "\n";
    }
    ~Lock() { std::cout << "unlock " << n_ << "\n"; }
};

void move_money(bool fail_second) {
    Lock a("accounts", false);
    Lock b("ledger", fail_second);
    std::cout << "transfer\n";
}

int main() {
    move_money(false);
    try {
        move_money(true);
    } catch (const std::runtime_error& e) {
        std::cout << e.what() << "\n";
    }
}`,
  why: String.raw`When the second constructor throws, the first lock is already held and must be released. Its destructor runs during unwinding, so the cleanup needs no catch block.` },

{ n: 82, d: "hard", t: "Retry an initialiser that fails at first", idiom: "Call once (retry after exception)",
  p: String.raw`Define connect, which increments a counter and throws a runtime_error with the message try while the counter is below 3. Once the counter reaches 3 it prints connected after followed by the counter. Define run, which calls std::call_once with a shared std::once_flag and connect inside a try block. It prints attempt followed by its number and done if the call returns, or failed if it throws. In main, call run for numbers 0 to 3 in a loop.`,
  ex: String.raw`attempt 0 failed
attempt 1 failed
connected after 3
attempt 2 done
attempt 3 done`,
  code: String.raw`#include <iostream>
#include <mutex>
#include <stdexcept>

std::once_flag flag;
int tries = 0;

void connect() {
    ++tries;
    if (tries < 3) throw std::runtime_error("try");
    std::cout << "connected after " << tries << "\n";
}

void run(int i) {
    try {
        std::call_once(flag, connect);
        std::cout << "attempt " << i << " done\n";
    } catch (const std::exception&) {
        std::cout << "attempt " << i << " failed\n";
    }
}

int main() {
    for (int i = 0; i < 4; ++i) run(i);
}`,
  why: String.raw`A call_once that throws leaves its flag unset, so the next caller tries again. Once one call succeeds, later calls return at once without running the function.` },

{ n: 83, d: "hard", t: "Keep a pool's items when copying one fails", idiom: "Copy-and-swap (strong exception guarantee)",
  p: String.raw`Define Risky holding an int. Its copy constructor throws a runtime_error with the message negative if the value is below zero. Define Pool holding a vector of Risky values, with a copy constructor that copies the vector, a friend swap, a copy assignment that takes its argument by value and swaps with it, and a sum method. In main, create Pool a from the values 1 and 2, and Pool b from the values 10 and -1. Assign b to a inside a try block, printing the message if it throws. Then print the sums of a and b separated by a space.`,
  ex: String.raw`negative
3 9`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <utility>
#include <vector>

struct Risky {
    int v;
    Risky(int x) : v(x) {}
    Risky(const Risky& o) : v(o.v) {
        if (v < 0) throw std::runtime_error("negative");
    }
    Risky(Risky&&) noexcept = default;
    Risky& operator=(const Risky&) = delete;
    Risky& operator=(Risky&&) = delete;
};

class Pool {
    std::vector<Risky> items_;
public:
    explicit Pool(std::vector<Risky> v) : items_(std::move(v)) {}
    Pool(const Pool&) = default;
    friend void swap(Pool& a, Pool& b) noexcept { std::swap(a.items_, b.items_); }
    Pool& operator=(Pool o) {
        swap(*this, o);
        return *this;
    }
    int sum() const {
        int s = 0;
        for (const Risky& r : items_) s += r.v;
        return s;
    }
};

int main() {
    std::vector<Risky> x;
    x.emplace_back(1);
    x.emplace_back(2);
    Pool a(std::move(x));
    std::vector<Risky> y;
    y.emplace_back(10);
    y.emplace_back(-1);
    Pool b(std::move(y));
    try {
        a = b;
    } catch (const std::exception& e) {
        std::cout << e.what() << "\n";
    }
    std::cout << a.sum() << ' ' << b.sum() << '\n';
}`,
  why: String.raw`The by-value parameter makes the copy before anything is swapped. A failure while copying leaves the target unchanged, and the swap is noexcept, so the commit cannot fail.` },

{ n: 84, d: "hard", t: "Chain parsing and transforms over expected values", idiom: "Result type (monadic chaining)",
  p: String.raw`Define an enum Err with the values Missing and Invalid. find takes a key and returns an expected string with an Err error: for user it returns two spaces, ann, and two spaces; for age it returns x31; for any other key it returns Missing. number takes a string and returns an expected int: if the string is empty or does not start with x it returns Invalid, otherwise the number formed by the rest of the string. For each key age, user and zip, chain find, then number, then a transform that doubles the value. Print the key, a colon and a space, then the doubled value, or invalid, or missing, depending on the error.`,
  ex: String.raw`age: 62
user: invalid
zip: missing`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>

enum class Err { Missing, Invalid };

std::expected<std::string, Err> find(const std::string& key) {
    if (key == "user") return std::string("  ann  ");
    if (key == "age") return std::string("x31");
    return std::unexpected(Err::Missing);
}

std::expected<int, Err> number(const std::string& s) {
    if (s.empty() || s[0] != 'x') return std::unexpected(Err::Invalid);
    return std::stoi(s.substr(1));
}

int main() {
    for (const char* k : {"age", "user", "zip"}) {
        auto r = find(k).and_then(number).transform([](int v) { return v * 2; });
        std::cout << k << ": ";
        if (r) std::cout << *r << '\n';
        else std::cout << (r.error() == Err::Missing ? "missing" : "invalid") << '\n';
    }
}`,
  why: String.raw`Each step either passes a value to the next step or forwards its error unchanged. The chain reads top to bottom, and the error is handled once at the end.` },

{ n: 85, d: "hard", t: "Close connections in the order they leave a map", idiom: "Custom deleter with ownership moved between containers",
  p: String.raw`Define Conn with an int id. Define a functor CloseCounter whose call operator prints close followed by the id and deletes the Conn. Define ConnPtr as a unique_ptr to Conn with CloseCounter as its deleter. In main, create a std::map from int to ConnPtr, and insert connections 1 and 2 under keys 1 and 2. Assign a new connection 3 to key 1. Print closed followed by the number of closes so far, which is kept in a global counter. Extract the entry for key 2 into a node, print extracted followed by its key, and let main finish.`,
  ex: String.raw`close 1
closed 1
extracted 2
close 2
close 3`,
  code: String.raw`#include <iostream>
#include <map>
#include <memory>

struct Conn { int id; };

int closed = 0;

struct CloseCounter {
    void operator()(Conn* c) const {
        ++closed;
        std::cout << "close " << c->id << "\n";
        delete c;
    }
};

using ConnPtr = std::unique_ptr<Conn, CloseCounter>;

int main() {
    std::map<int, ConnPtr> pool;
    pool.emplace(1, ConnPtr(new Conn{1}));
    pool.emplace(2, ConnPtr(new Conn{2}));
    pool[1] = ConnPtr(new Conn{3});
    std::cout << "closed " << closed << "\n";
    auto node = pool.extract(2);
    std::cout << "extracted " << node.key() << "\n";
}`,
  why: String.raw`A unique_ptr carries its deleter with it, so an entry closes correctly no matter which container it is moved into or out of. Replacing a value closes the old one, and the extracted node keeps its own pointer until it goes out of scope.` },

// ---------- Extension ----------
{ n: 86, d: "extension", t: "Only a factory creates a token", idiom: "Passkey idiom",
  p: String.raw`A Token can only be created by a class Factory, but any code may pass a Token to Service. Service has a function use that takes a Token by value and prints ok. Create a Service and pass it a Token obtained from Factory.`,
  ex: String.raw`ok`,

class Token {

    friend class Factory;

class Service {
public:

{ n: 87, d: "extension", t: "Hand-written dispatch table", idiom: "Hand-rolled function table (vtable)",

{ n: 91, d: "extension", t: "Move-only values in a growing vector", idiom: "noexcept move for vector growth",
  p: String.raw`A Handle type holds an int id. It can be moved but not copied, and its move operations do not throw. Put handles with ids 1, 2 and 3 into a vector, one after another, so the vector grows as it goes, and print the ids separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <cstddef>
#include <iostream>
#include <vector>

struct Handle {
    int id;
    explicit Handle(int i) : id(i) {}
    Handle(Handle&&) noexcept = default;
    Handle& operator=(Handle&&) noexcept = default;
    Handle(const Handle&) = delete;
    Handle& operator=(const Handle&) = delete;
};

int main() {
    std::vector<Handle> v;
    v.emplace_back(1);
    v.emplace_back(2);
    v.emplace_back(3);

{ n: 92, d: "extension", t: "Share one style object per name", idiom: "Flyweight (shared immutable objects)",
  p: String.raw`Write a function style(name) that returns a shared pointer to a read-only Style object for that font name. A Style is created only the first time its name is requested, and at that moment the function prints created followed by the name. Call style with serif, then sans, then serif again. Print 1 if the first and third results are the same object and 0 otherwise, then a space, then the same check for the first and second results. Then print done.`,
  ex: String.raw`created serif
created sans
1 0
done`,
  code: String.raw`#include <iostream>
#include <map>
#include <memory>
#include <string>

struct Style {
    std::string font;
};

std::shared_ptr<const Style> style(const std::string& name) {
    static std::map<std::string, std::shared_ptr<const Style>> cache;
    auto it = cache.find(name);
    if (it != cache.end()) return it->second;
    std::cout << "created " << name << "\n";
    auto s = std::make_shared<Style>(Style{name});
    cache.emplace(name, s);
    return s;
}

int main() {
    auto a = style("serif");
    auto b = style("sans");
    auto c = style("serif");
    std::cout << (a == c) << " " << (a == b) << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`Objects that are shared and never change can be reused by anyone who asks for the same key. The cache keeps one instance per key, so many users do not each store a copy of the same data.` },

{ n: 93, d: "extension", t: "Count constructions through a chain of returns", idiom: "Guaranteed copy elision (return a prvalue)",
  p: String.raw`Define Counter, whose default constructor increments a static count, and whose copy and move constructors are deleted. Define make, which returns Counter{}, and wrap, which returns the result of make(). In main, declare a Counter c initialised from wrap(), then print the count.`,
  ex: String.raw`1`,

struct Counter {
    static inline int made = 0;
    Counter() { ++made; }
    Counter(const Counter&) = delete;
    Counter(Counter&&) = delete;
};

Counter make() { return Counter{}; }
Counter wrap() { return make(); }

int main() {
    Counter c = wrap();
    (void)c;
    std::cout << Counter::made << "\n";
}`,

{ n: 94, d: "extension", t: "Sort references without moving the objects", idiom: "Non-owning reference (std::reference_wrapper)",
  p: String.raw`Define Person with a name and an age. Create a vector of three people: ann aged 31, bo aged 19 and cy aged 25. Create a vector of std::reference_wrapper to Person that refers to them, and sort those references by age, ascending. Print each name followed by a space, then a newline. Then set the first person's age to 99 in the original vector, and print the age of the last reference.`,
  ex: String.raw`bo cy ann 
99`,
  code: String.raw`#include <algorithm>
#include <functional>
#include <iostream>
#include <string>
#include <vector>

struct Person {
    std::string name;
    int age;
};

int main() {
    std::vector<Person> people{{"ann", 31}, {"bo", 19}, {"cy", 25}};
    std::vector<std::reference_wrapper<Person>> refs(people.begin(), people.end());
    std::sort(refs.begin(), refs.end(),
              [](const std::reference_wrapper<Person>& a, const std::reference_wrapper<Person>& b) {
                  return a.get().age < b.get().age;
              });
    for (const auto& r : refs) std::cout << r.get().name << ' ';
    std::cout << '\n';
    people[0].age = 99;
    std::cout << refs.back().get().age << '\n';
}`,
  why: String.raw`A reference_wrapper stores a reference, so a container of them can be sorted and copied cheaply while the people stay in one place. A change made through the original vector is visible through every reference.` },

{ n: 95, d: "extension", t: "Make a token only the ledger can create", idiom: "Passkey idiom",
  p: String.raw`Define a Passkey class whose default constructor is private, and make Ledger its only friend. Ledger has a total, a public commit method that takes an int and a Passkey and adds the int to the total, and a public add_twice method that adds a value twice, each time through commit with a Passkey it creates itself. In main, create a Ledger, call add_twice with 3, and print the total. Then print 1 if a Passkey can be default constructed from outside, or 0 otherwise.`,
  ex: String.raw`6 0`,
  code: String.raw`#include <iostream>
#include <type_traits>

class Ledger;

class Passkey {
    Passkey() = default;
    friend class Ledger;
};

class Ledger {
    int total_ = 0;
public:
    void commit(int v, Passkey) { total_ += v; }
    void add_twice(int v) {
        commit(v, Passkey{});
        commit(v, Passkey{});
    }
    int total() const { return total_; }
};

int main() {
    Ledger l;
    l.add_twice(3);
    std::cout << l.total() << ' ' << std::is_default_constructible_v<Passkey> << '\n';
}`,
  why: String.raw`The key's constructor is private, so only the class that befriends it can make a key, and only that class can call the method that asks for one. The key does not need to store anything.` },

{ n: 96, d: "extension", t: "Dispatch through a hand-written table of functions", idiom: "Hand-rolled function table (vtable)",
  p: String.raw`Define an Ops struct holding three function pointers: draw takes a void pointer, area takes a void pointer and returns an int, and destroy takes a void pointer. Define Square with an int side. Implement sq_draw, which prints square followed by the side, sq_area, which returns the side squared, and sq_destroy, which prints freed and deletes the square. Define Obj with a pointer to an Ops table and a void pointer to the data. In main, make a static Ops table for the square functions, create an Obj holding a Square of side 4, call draw, print area, then call destroy.`,
  ex: String.raw`square 4
16
freed`,
  code: String.raw`#include <iostream>

struct Ops {
    void (*draw)(void*);
    int (*area)(void*);
    void (*destroy)(void*);
};

struct Square { int s; };

void sq_draw(void* p) { std::cout << "square " << static_cast<Square*>(p)->s << "\n"; }
int sq_area(void* p) { int s = static_cast<Square*>(p)->s; return s * s; }
void sq_destroy(void* p) {
    delete static_cast<Square*>(p);
    std::cout << "freed\n";
}

struct Obj {
    const Ops* ops;
    void* data;
};

int main() {
    static const Ops square_ops{sq_draw, sq_area, sq_destroy};
    Obj o{&square_ops, new Square{4}};
    o.ops->draw(o.data);
    std::cout << o.ops->area(o.data) << "\n";
    o.ops->destroy(o.data);
}`,
  why: String.raw`A struct of function pointers, plus a data pointer, is how dynamic dispatch works underneath. Each object carries the table that matches its type, so the caller needs no inheritance.` },

{ n: 97, d: "extension", t: "Check at compile time which overload a call selects", idiom: "Deleted template overload",
  p: String.raw`Define a function take that takes a double and prints double followed by the value. Also declare a template take that accepts any type and is deleted. Define a template callable that takes a pack of argument types and is true when a call to take with those arguments compiles, and false otherwise. In main, call take with 2.5. Then print true or false for whether take can be called with a double, with an int, and with a std::string, separated by spaces, using std::boolalpha.`,
  ex: String.raw`double 2.5
true false false`,
  code: String.raw`#include <iostream>
#include <string>
#include <type_traits>
#include <utility>

void take(double d) { std::cout << "double " << d << "\n"; }

template <class T>
void take(T) = delete;

template <class... A>
auto check(int) -> decltype(take(std::declval<A>()...), std::true_type{});

template <class...>
std::false_type check(...);

template <class... A>
constexpr bool callable = decltype(check<A...>(0))::value;

int main() {
    take(2.5);
    std::cout << std::boolalpha << callable<double> << ' ' << callable<int> << ' '
              << callable<std::string> << '\n';
}`,
  why: String.raw`The deleted template is an exact match for any type, so it beats the conversion to double for an int and rejects it. A deleted function still takes part in overload resolution, and a call to it is ill-formed, which the trait detects without a compile error.` },

{ n: 98, d: "extension", t: "Share one style object for each font name", idiom: "Flyweight (shared immutable objects)",
  p: String.raw`Define Glyph with a character and a font name. Define GlyphFactory, which returns a shared pointer to a Glyph for a character and font. It keeps a pool keyed by the pair, creates a Glyph only when the pair is new, and reports its pool size. Define Placed holding a shared pointer to a Glyph and a position. In main, lay out the text abcab in font mono, one Placed per character with its index as the position. Print the pool size, then 1 if the first and fourth glyphs are the same object and 0 otherwise, then 1 if the first and second are the same object and 0 otherwise, separated by spaces.`,
  ex: String.raw`3 1 0`,
  code: String.raw`#include <iostream>
#include <map>
#include <memory>
#include <string>
#include <utility>
#include <vector>

struct Glyph {
    char ch;
    std::string font;
};

class GlyphFactory {
    std::map<std::pair<char, std::string>, std::shared_ptr<const Glyph>> pool_;
public:
    std::shared_ptr<const Glyph> get(char c, const std::string& f) {
        auto key = std::make_pair(c, f);
        auto it = pool_.find(key);
        if (it != pool_.end()) return it->second;
        auto g = std::make_shared<Glyph>(Glyph{c, f});
        pool_.emplace(key, g);
        return g;
    }
    std::size_t size() const { return pool_.size(); }
};

struct Placed {
    std::shared_ptr<const Glyph> g;
    int x;
};

int main() {
    GlyphFactory gf;
    std::vector<Placed> line;
    const std::string text = "abcab";
    for (std::size_t i = 0; i < text.size(); ++i)
        line.push_back({gf.get(text[i], "mono"), static_cast<int>(i)});
    std::cout << gf.size() << ' ' << (line[0].g == line[3].g) << ' '
              << (line[0].g == line[1].g) << '\n';
}`,
  why: String.raw`Each distinct glyph is stored once and shared by every position that uses it. Positions hold only the shared pointer and their own coordinates, so a long text needs far fewer glyph objects.` },

{ n: 100, d: "applications", t: "Parse configuration lines into values or errors", idiom: "Result type (value or error per line)",
  p: String.raw`Write a function that parses a line of the form key=value, where the value must be a whole number. If there is no equals sign, it returns the error missing =. If the value contains a non-digit, it returns the error not a number. Otherwise it returns the key and the number. Parse the lines a=1 and b=x. For a success print the key, an equals sign, and the number. For a failure print error followed by the message.`,
  ex: String.raw`a=1
error not a number`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>
#include <utility>

std::expected<std::pair<std::string, int>, std::string> parse_line(const std::string& line) {
    auto eq = line.find('=');
    if (eq == std::string::npos) return std::unexpected(std::string("missing ="));
    std::string key = line.substr(0, eq);
    std::string val = line.substr(eq + 1);
    for (char c : val)
        if (c < '0' || c > '9') return std::unexpected(std::string("not a number"));
    return std::pair{key, std::stoi(val)};
}

int main() {
    for (const char* l : {"a=1", "b=x"}) {
        auto r = parse_line(l);
        if (r)
            std::cout << r->first << '=' << r->second << '\n';
        else
            std::cout << "error " << r.error() << '\n';
    }
}`,
  why: String.raw`Returning each line's result or error as a value lets a loader report every bad line instead of stopping at the first one.` },

{ n: 101, d: "applications", t: "Roll back unless committed", idiom: "Scope guard (rollback unless committed)",
  p: String.raw`A Transaction object prints committed when its commit function is called, and prints rollback when it is destroyed unless it was committed. Run one transaction that is committed, and one that is not, each in its own block, committing only the first.`,
  ex: String.raw`committed
rollback`,
  code: String.raw`#include <iostream>

class Transaction {
    bool committed = false;
public:
    Transaction() = default;
    Transaction(const Transaction&) = delete;
    Transaction& operator=(const Transaction&) = delete;
    void commit() {
        committed = true;
        std::cout << "committed\n";
    }
    ~Transaction() {
        if (!committed) std::cout << "rollback\n";
    }
};

int main() {
    {
        Transaction t1;
        t1.commit();
    }
    {
        Transaction t2;
    }
}`,
  why: String.raw`Making the default action on scope exit a rollback means a forgotten commit cannot leave changes half applied.` },

{ n: 102, d: "applications", t: "Build a request with validation", idiom: "Builder",
  p: String.raw`A Req builder sets a path and a timeout through chained calls. Its build function returns the request as GET, a space, the path, a space and the timeout, or an error. The error is no path when the path is empty, or bad timeout when the timeout is not positive. Build a request for /a with timeout 30 and print its result. Then build a request for /b with no timeout and print its error.`,
  ex: String.raw`GET /a 30
bad timeout`,
  code: String.raw`#include <expected>
#include <iostream>
#include <string>
#include <utility>

class Req {
    std::string path_;
    int timeout_ = 0;
public:
    Req& to(std::string p) { path_ = std::move(p); return *this; }
    Req& within(int s) { timeout_ = s; return *this; }
    std::expected<std::string, std::string> build() const {
        if (path_.empty()) return std::unexpected(std::string("no path"));
        if (timeout_ <= 0) return std::unexpected(std::string("bad timeout"));
        return "GET " + path_ + " " + std::to_string(timeout_);
    }
};

int main() {
    auto ok = Req().to("/a").within(30).build();
    if (ok) std::cout << *ok << '\n';
    auto bad = Req().to("/b").build();
    if (!bad) std::cout << bad.error() << '\n';
}`,
  why: String.raw`Collecting settings through chained calls and checking them once at build time lets the request be validated as a whole, with a clear error when something is missing.` },

{ n: 103, d: "applications", t: "Register plugins by name", idiom: "Registry (factory map keyed by name)",
  p: String.raw`A Registry maps plugin names to factory functions that create new plugins. Plugins have a function run that returns text: Upper returns UPPER, and Lower returns lower. Register up for Upper and low for Lower, then print the result of run for up, then for low, separated by a space.`,
  ex: String.raw`UPPER lower`,
  code: String.raw`#include <functional>
#include <iostream>
#include <map>
#include <memory>
#include <string>
#include <utility>

struct Plugin {
    virtual ~Plugin() = default;
    virtual std::string run() const = 0;
};

struct Upper : Plugin {
    std::string run() const override { return "UPPER"; }
};

struct Lower : Plugin {
    std::string run() const override { return "lower"; }
};

class Registry {
    std::map<std::string, std::function<std::unique_ptr<Plugin>()>> factories;
public:
    void add(const std::string& name, std::function<std::unique_ptr<Plugin>()> f) {
        factories[name] = std::move(f);
    }
    std::unique_ptr<Plugin> create(const std::string& name) const {
        return factories.at(name)();
    }
};

int main() {
    Registry r;
    r.add("up", [] { return std::make_unique<Upper>(); });
    r.add("low", [] { return std::make_unique<Lower>(); });
    std::cout << r.create("up")->run() << ' ' << r.create("low")->run() << '\n';
}`,
  why: String.raw`Keeping factories in a table keyed by name lets new plugin types be added at run time without changing the code that creates them.` },

{ n: 104, d: "applications", t: "Pricing rules as functions in a map", idiom: "Strategy via function table",

{ n: 105, d: "applications", t: "Named event handlers", idiom: "Named callback table (dispatch by name)",

{ n: 106, d: "applications", t: "Cache lookup that may find nothing", idiom: "Optional return (std::optional)",
  p: String.raw`A cache returns an optional value for a key. Look up key 1 in an empty cache and print hit or miss. Then store x under key 1 and look it up again, printing hit or miss. Separate the two answers with a space.`,
  ex: String.raw`miss hit`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>
#include <utility>

class Cache {
    std::map<int, std::string> store;
public:
    std::optional<std::string> get(int k) const {
        auto it = store.find(k);
        if (it == store.end()) return std::nullopt;
        return it->second;
    }
    void put(int k, std::string v) { store[k] = std::move(v); }
};

int main() {
    Cache c;
    std::cout << (c.get(1) ? "hit" : "miss") << ' ';
    c.put(1, "x");
    std::cout << (c.get(1) ? "hit" : "miss") << '\n';
}`,
  why: String.raw`Returning an optional makes a miss explicit in the type, so callers cannot forget to check for a value that is not there.` },

done`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>
#include <utility>

struct Request {
    std::string user;
    int items;
};

class Handler {
    std::shared_ptr<Handler> next_;
protected:
    virtual bool try_handle(const Request& r) = 0;
public:
    virtual ~Handler() = default;
    void set_next(std::shared_ptr<Handler> n) { next_ = std::move(n); }
    bool handle(const Request& r) {
        if (try_handle(r)) return true;
        return next_ ? next_->handle(r) : false;
    }
};

class Auth : public Handler {
protected:
    bool try_handle(const Request& r) override {
        if (r.user.empty()) { std::cout << "denied\n"; return true; }
        return false;
    }
};

class Rate : public Handler {
protected:
    bool try_handle(const Request& r) override {
        if (r.items > 3) { std::cout << "throttled\n"; return true; }
        return false;
    }
};

class Serve : public Handler {
protected:
    bool try_handle(const Request&) override {
        std::cout << "served\n";
        return true;
    }
};

int main() {
    auto a = std::make_shared<Auth>();
    auto r = std::make_shared<Rate>();
    auto s = std::make_shared<Serve>();
    a->set_next(r);
    r->set_next(s);
    a->handle(Request{"", 1});
    a->handle(Request{"bob", 5});
    a->handle(Request{"amy", 2});
    std::cout << "done\n";
}`,
  why: String.raw`Each handler gets a chance at the request and decides whether to stop it or pass it on. The sender knows only the first handler, so handlers can be added or reordered without changing the code that submits requests.` },

{ n: 109, d: "applications", t: "Roll back a failed transfer in reverse order", idiom: "Scope guard (transaction rollback)",
  p: String.raw`A Txn object records an undo action before each step runs. A step runs its action and then prints did followed by the step name. If the Txn is destroyed without being committed, it runs the recorded undo actions in reverse order. Start with balance 100 and entries 0. In a try block, create a Txn and run three steps: debit subtracts 30 from balance; log adds 1 to entries; fee subtracts 60 from balance and throws a runtime_error with the message insufficient if the balance is then below 20. Each undo reverts its own step. Commit after the three steps. Catch the exception and print failed followed by its message. Then print balance and entries separated by a space.`,
  ex: String.raw`did debit
did log
failed: insufficient
100 0`,
  code: String.raw`#include <functional>
#include <iostream>
#include <stdexcept>
#include <utility>
#include <vector>

class Txn {
    std::vector<std::function<void()>> undo_;
    bool committed_ = false;
public:
    template <typename F, typename U>
    void step(const char* name, F action, U undo) {
        undo_.push_back(std::move(undo));
        action();
        std::cout << "did " << name << "\n";
    }
    void commit() { committed_ = true; }
    ~Txn() {
        if (!committed_)
            for (auto it = undo_.rbegin(); it != undo_.rend(); ++it) (*it)();
    }
};

int main() {
    int balance = 100;
    int entries = 0;
    try {
        Txn t;
        t.step("debit", [&] { balance -= 30; }, [&] { balance += 30; });
        t.step("log", [&] { ++entries; }, [&] { --entries; });
        t.step("fee", [&] {
            balance -= 60;
            if (balance < 20) throw std::runtime_error("insufficient");
        }, [&] { balance += 60; });
        t.commit();
    } catch (const std::exception& e) {
        std::cout << "failed: " << e.what() << "\n";
    }
    std::cout << balance << " " << entries << "\n";
}`,
  why: String.raw`Registering the undo before the action means a step that fails part-way is still reverted. Undoing in reverse order restores each value that later steps depended on, and the commit call turns the guard off on success.` },

{ n: 110, d: "applications", t: "Flush buffered log lines when the logger ends", idiom: "RAII (flush on destruction)",
  p: String.raw`Define BufferedLog, which stores lines in a vector. Its write method adds a line. Its flush method prints each stored line, then prints the text -- flushed followed by the number of lines flushed, and clears the vector. Its destructor calls flush if any lines remain. Define job, which takes a count n and creates a BufferedLog. It writes the text step followed by each number from 0 to n-1. If n is greater than 1 it flushes, then writes tail. In main, call job with 1, then job with 3.`,

-- flushed 1
step 0
step 1
step 2
-- flushed 3
tail
-- flushed 1`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>
#include <vector>

class BufferedLog {
    std::vector<std::string> buf_;
public:
    void write(std::string s) { buf_.push_back(std::move(s)); }
    void flush() {
        for (const auto& s : buf_) std::cout << s << '\n';
        std::cout << "-- flushed " << buf_.size() << '\n';
        buf_.clear();
    }
    ~BufferedLog() { if (!buf_.empty()) flush(); }
};

void job(int n) {
    BufferedLog log;
    for (int i = 0; i < n; ++i) log.write("step " + std::to_string(i));

        log.write("tail");
    }
}

int main() {
    job(1);
    job(3);
}`,

{ n: 111, d: "applications", t: "Collect valid lines and report the bad ones", idiom: "Result type (value or error per line)",
  p: String.raw`Define Err with a line number and a reason. Define parse_line, which takes a line number and text and returns either an int or an Err. If the text has no equals sign, the reason is no =. If the part after the equals sign is not a number, the reason is bad value. Otherwise it returns the number. In main, parse the lines a=1, b 2, c=x and d=40, numbering them from 1. Add each int to a total, and for each error print line followed by the line number, a colon, a space and the reason. Finally print total followed by the total.`,
  ex: String.raw`line 2: no =
line 3: bad value
total 41`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>
#include <vector>

struct Err {
    int line;
    std::string why;
};

std::variant<int, Err> parse_line(int no, const std::string& s) {
    auto eq = s.find('=');
    if (eq == std::string::npos) return Err{no, "no ="};
    try {
        return std::stoi(s.substr(eq + 1));
    } catch (...) {
        return Err{no, "bad value"};
    }
}

int main() {
    std::vector<std::string> lines{"a=1", "b 2", "c=x", "d=40"};
    int total = 0;
    int n = 0;
    for (const auto& l : lines) {
        ++n;
        auto r = parse_line(n, l);
        if (auto* v = std::get_if<int>(&r)) {
            total += *v;
        } else {
            const Err& e = std::get<Err>(r);
            std::cout << "line " << e.line << ": " << e.why << '\n';
        }
    }
    std::cout << "total " << total << '\n';
}`,
  why: String.raw`Each line yields its own value or error, so one bad line does not stop the rest from loading. The caller decides how to report each failure and can keep the good results.` },

{ n: 112, d: "applications", t: "Undo config changes unless the update commits", idiom: "Scope guard (rollback unless committed)",
  p: String.raw`Define Apply, which takes a reference to a std::map from string to int and saves a copy of it. Its commit method marks it as done. Its destructor restores the saved copy and prints rolled back if commit was not called. Define update, which takes the map and a bool. It creates an Apply, sets threads to 8 and retries to 3 in the map, and returns early if the bool is false. Otherwise it commits. In main, start with a map holding threads 2. Call update with false, then print the threads value and the count of retries, separated by a space. Call update with true, then print the threads and retries values, separated by a space.`,
  ex: String.raw`rolled back
2 0
8 3`,
  code: String.raw`#include <iostream>
#include <map>
#include <string>

class Apply {
    std::map<std::string, int>& cfg_;
    std::map<std::string, int> saved_;
    bool done_ = false;
public:
    explicit Apply(std::map<std::string, int>& c) : cfg_(c), saved_(c) {}
    std::map<std::string, int>& cfg() { return cfg_; }
    void commit() { done_ = true; }
    ~Apply() {
        if (!done_) {
            cfg_ = saved_;
            std::cout << "rolled back\n";
        }
    }
};

void update(std::map<std::string, int>& cfg, bool ok) {
    Apply a(cfg);
    a.cfg()["threads"] = 8;
    a.cfg()["retries"] = 3;
    if (!ok) return;
    a.commit();
}

int main() {
    std::map<std::string, int> cfg{{"threads", 2}};
    update(cfg, false);
    std::cout << cfg["threads"] << ' ' << cfg.count("retries") << '\n';
    update(cfg, true);
    std::cout << cfg["threads"] << ' ' << cfg["retries"] << '\n';
}`,
  why: String.raw`The guard starts in the rolled-back state and only the commit call turns the undo off. An early return therefore reverts every change made so far, and the success path keeps them.` },

{ n: 113, d: "applications", t: "Build a URL, rejecting missing parts at build time", idiom: "Builder",
  p: String.raw`Define UrlBuilder with optional scheme and host, an int port that defaults to 0, and a path that defaults to a single slash. Give it setter methods scheme, host, port and path, each returning the builder. Its build method throws an invalid_argument with the message scheme required if no scheme was set, host required if no host was set, and otherwise returns scheme followed by ://, the host, then a colon and the port if the port is not 0, then the path. In main, print the URL built with scheme https, host ex.com, port 8443 and path /api. Then build with scheme http only inside a try block and print the message. Then print the URL built with host a and scheme ftp.`,

host required
ftp://a/`,
  code: String.raw`#include <iostream>
#include <optional>
#include <stdexcept>
#include <string>
#include <utility>

class UrlBuilder {
    std::optional<std::string> scheme_, host_;
    int port_ = 0;
    std::string path_ = "/";
public:
    UrlBuilder& scheme(std::string s) { scheme_ = std::move(s); return *this; }
    UrlBuilder& host(std::string h) { host_ = std::move(h); return *this; }
    UrlBuilder& port(int p) { port_ = p; return *this; }
    UrlBuilder& path(std::string p) { path_ = std::move(p); return *this; }
    std::string build() const {
        if (!scheme_) throw std::invalid_argument("scheme required");
        if (!host_) throw std::invalid_argument("host required");
        std::string out = *scheme_ + "://" + *host_;
        if (port_ != 0) out += ":" + std::to_string(port_);

int main() {

{ n: 114, d: "applications", t: "Create plugins by name and reject duplicates", idiom: "Registry (factory map keyed by name)",
  p: String.raw`Define an abstract Plugin with a run method returning a string. Define Upper, which runs to UPPER, and Count, which runs to COUNT. Define Registry, which maps names to functions that create a unique_ptr to Plugin. Its add method throws a logic_error with the message duplicate followed by the name if the name is already registered. Its make method returns the created plugin, or a null pointer for an unknown name. In main, register upper and count. Register upper again inside a try block and print the message. Then, for each of the names count, nope and upper, print the name, a colon, a space, and the run result, or none if make returned null.`,
  ex: String.raw`duplicate upper
count: COUNT
nope: none
upper: UPPER`,
  code: String.raw`#include <functional>
#include <iostream>
#include <map>
#include <memory>
#include <stdexcept>
#include <string>

struct Plugin {
    virtual ~Plugin() = default;
    virtual std::string run() const = 0;
};

struct Upper : Plugin {
    std::string run() const override { return "UPPER"; }
};

struct Count : Plugin {
    std::string run() const override { return "COUNT"; }
};

class Registry {
    std::map<std::string, std::function<std::unique_ptr<Plugin>()>> f_;
public:
    void add(const std::string& n, std::function<std::unique_ptr<Plugin>()> f) {
        if (f_.count(n)) throw std::logic_error("duplicate " + n);
        f_.emplace(n, std::move(f));
    }
    std::unique_ptr<Plugin> make(const std::string& n) const {
        auto it = f_.find(n);
        if (it == f_.end()) return nullptr;
        return it->second();
    }
};

int main() {
    Registry r;
    r.add("upper", [] { return std::make_unique<Upper>(); });
    r.add("count", [] { return std::make_unique<Count>(); });
    try {
        r.add("upper", [] { return std::make_unique<Upper>(); });
    } catch (const std::logic_error& e) {
        std::cout << e.what() << '\n';
    }
    for (const char* n : {"count", "nope", "upper"}) {
        auto p = r.make(n);
        std::cout << n << ": " << (p ? p->run() : std::string("none")) << '\n';
    }
}`,
  why: String.raw`Plugins are looked up by name in a map of creation functions, so new plugin types are added by registering them without changing the code that creates them. Duplicate names are rejected so one name always maps to one factory.` },

{ n: 116, d: "applications", t: "Route events to named handlers and count them", idiom: "Named callback table (dispatch by name)",
  p: String.raw`Define Dispatcher, which maps an event name to a list of handlers. Each handler takes a string payload. Its on method adds a handler to an event. Its emit method calls every handler for that event with the payload, and returns the number of handlers called, which is 0 for an event with no handlers. In main, subscribe two handlers to save. The first prints write followed by the payload. The second prints index followed by the payload's length. Emit save with doc1, then emit open with x, printing each returned count on its own line.`,
  ex: String.raw`write doc1
index 4
2
0`,
  code: String.raw`#include <functional>
#include <iostream>
#include <map>
#include <string>
#include <vector>

class Dispatcher {
    std::map<std::string, std::vector<std::function<void(const std::string&)>>> h_;
public:
    void on(const std::string& ev, std::function<void(const std::string&)> f) {
        h_[ev].push_back(std::move(f));
    }
    int emit(const std::string& ev, const std::string& payload) {
        auto it = h_.find(ev);
        if (it == h_.end()) return 0;
        for (const auto& f : it->second) f(payload);
        return static_cast<int>(it->second.size());
    }
};

int main() {
    Dispatcher d;
    d.on("save", [](const std::string& p) { std::cout << "write " << p << '\n'; });
    d.on("save", [](const std::string& p) { std::cout << "index " << p.size() << '\n'; });
    std::cout << d.emit("save", "doc1") << '\n';
    std::cout << d.emit("open", "x") << '\n';
}`,
  why: String.raw`Handlers are stored under their event names, so one emit reaches every handler registered for that name. An unknown event is simply absent from the table, which needs no special case in the sender.` },

{ n: 117, d: "applications", t: "Look up a user's city, returning nothing when missing", idiom: "Optional return (std::optional)",
  p: String.raw`Define city_of, which takes a map from user name to user id, a map from user id to city, and a user name. It returns an optional string. It returns nothing if the user is not in the first map, or if the user's id is not in the second map. Otherwise it returns the city. In main, using users ann mapped to u1 and bo mapped to u2, and cities with u1 mapped to Leeds, print each of the names ann, bo and cy, a colon, a space, and the city, or unknown if there is none.`,

#include <map>
#include <optional>
#include <string>

std::optional<std::string> city_of(const std::map<std::string, std::string>& users,
                                   const std::map<std::string, std::string>& cities,
                                   const std::string& user) {
    auto u = users.find(user);

{ n: 118, d: "applications", t: "Pass a request along until a handler accepts it", idiom: "Chain of responsibility",
  p: String.raw`Define Handler as a std::function that takes an int and returns an optional string. In main, build a vector of two handlers: the first returns negative when the number is below 0, and the second returns even when the number is even, and otherwise each returns nothing. Define route, which tries each handler in order and returns the first string produced, or fallback if none produce one. For the numbers -3, 4 and 7, print the number, a space, and the route result.`,
  ex: String.raw`-3 negative
4 even
7 fallback`,
  code: String.raw`#include <functional>
#include <iostream>
#include <optional>
#include <string>
#include <vector>

using Handler = std::function<std::optional<std::string>(int)>;

std::string route(const std::vector<Handler>& chain, int n) {
    for (const auto& h : chain) {
        if (auto r = h(n)) return *r;
    }
    return "fallback";
}

int main() {
    std::vector<Handler> chain{
        [](int n) -> std::optional<std::string> {
            if (n < 0) return "negative";
            return std::nullopt;
        },
        [](int n) -> std::optional<std::string> {
            if (n % 2 == 0) return "even";
            return std::nullopt;

    for (int n : {-3, 4, 7}) std::cout << n << ' ' << route(chain, n) << '\n';
}`,
  why: String.raw`Each handler either answers the request or returns nothing so the next handler can try. The caller only sees the chain's first answer, and handlers can be reordered or added without changing the caller.` },

{ n: 119, d: "applications", t: "Send a welcome email through one simple call", idiom: "Facade",
  p: String.raw`Define three helper classes. Templates has render, which takes a template name and a user name and returns the template name, a comma, a space and the user name. Mailer has send, which takes a recipient and a body and prints to followed by the recipient, a colon, a space and the body. Directory has email_of, which returns the user name followed by @corp.example. Define Notifier, which holds one of each helper and has a welcome method that takes a user name, looks up the email, renders the Welcome template for the user, and sends it. In main, call welcome for ann and then for bo.`,

{ n: 120, d: "applications", t: "Write a file through a temporary and discard it on failure", idiom: "Scope guard (transaction rollback)",
  p: String.raw`Define FileTxn with a target name. Its constructor prints tmp followed by the target and .tmp. Its commit method prints rename to followed by the target and records the commit. Its destructor prints delete followed by the target and .tmp if it was not committed. Define save, which takes an int, creates a FileTxn for data, throws an invalid_argument with the message negative if the int is below 0, prints wrote followed by the int, and commits. In main, call save with 5, then call save with -2 inside a try block, printing error followed by the message when caught.`,
  ex: String.raw`tmp data.tmp
wrote 5
rename to data
tmp data.tmp
delete data.tmp
error negative`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <string>
#include <utility>

class FileTxn {
    std::string target_;
    bool committed_ = false;
public:
    explicit FileTxn(std::string t) : target_(std::move(t)) {
        std::cout << "tmp " << target_ << ".tmp\n";

    void commit() {
        std::cout << "rename to " << target_ << '\n';
        committed_ = true;
    }
    ~FileTxn() {
        if (!committed_) std::cout << "delete " << target_ << ".tmp\n";
    }
};

void save(int v) {
    FileTxn t("data");
    if (v < 0) throw std::invalid_argument("negative");
    std::cout << "wrote " << v << '\n';
    t.commit();
}

int main() {
    save(5);

        save(-2);
    } catch (const std::invalid_argument& e) {
        std::cout << "error " << e.what() << '\n';

}`,
  why: String.raw`The temporary file is removed by the destructor on every path that did not commit, so a failed save leaves no partial output behind. Only a successful commit makes the change visible.` },

try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 17, label: "Easy", range: "Problems 1–17", badge: "easy" },
  { from: 18, to: 55, label: "Medium", range: "Problems 18–55", badge: "medium" },
  { from: 56, to: 85, label: "Hard", range: "Problems 56–85", badge: "hard" },
  { from: 86, to: 98, label: "Extension", range: "Problems 86–98", badge: null },
  { from: 99, to: 120, label: "Applications", range: "Problems 99–120", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
