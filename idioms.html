<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Close a resource at scope end", idiom: "RAII",
  p: String.raw`A class Resource prints open when it is constructed and close when it is destroyed. Create a Resource inside an inner block, end the block, then print done.`,
  ex: String.raw`open
close
done`,
  code: String.raw`#include <iostream>

struct Resource {
    Resource() { std::cout << "open\n"; }
    ~Resource() { std::cout << "close\n"; }
};

int main() {
    {
        Resource r;
    }
    std::cout << "done\n";
}`,
  why: String.raw`Tying a resource's release to an object's destructor means the resource is released on every exit path, including early returns and exceptions.` },

{ n: 2, d: "easy", t: "Copy a plain data record", idiom: "Rule of zero",
  p: String.raw`A struct Config holds a string name and a vector of ints, and has no special member functions. Create a Config named abc with values 1 and 2, copy it into a new Config, and print the length of the copy's name and the number of its values, separated by a space.`,
  ex: String.raw`3 2`,
  code: String.raw`#include <iostream>
#include <string>
#include <vector>

struct Config {
    std::string name;
    std::vector<int> values;
};

int main() {
    Config c{"abc", {1, 2}};
    Config d = c;
    std::cout << d.name.size() << ' ' << d.values.size() << '\n';
}`,
  why: String.raw`A class built only from members that copy themselves needs no copy or destructor of its own, so the compiler's defaults are correct.` },

{ n: 3, d: "easy", t: "Run cleanup when a block exits", idiom: "Scope guard",
  p: String.raw`Write a class ScopeExit that stores a function and calls it when it is destroyed. Inside a block, create a ScopeExit whose function prints cleanup, and print work inside the same block. After the block, print end.`,
  ex: String.raw`work
cleanup
end`,
  code: String.raw`#include <functional>
#include <iostream>
#include <utility>

class ScopeExit {
    std::function<void()> f;
public:
    explicit ScopeExit(std::function<void()> g) : f(std::move(g)) {}
    ~ScopeExit() { f(); }
};

int main() {
    {
        ScopeExit g([] { std::cout << "cleanup\n"; });
        std::cout << "work\n";
    }
    std::cout << "end\n";
}`,
  why: String.raw`Running a stored action from a destructor guarantees cleanup happens when the block ends, however the block is left.` },

{ n: 4, d: "easy", t: "Remove even numbers in place", idiom: "Erase-remove idiom",
  p: String.raw`Given the vector 1 2 3 4 5 6, remove all even numbers from it in place. Print the remaining numbers separated by spaces.`,
  ex: String.raw`1 3 5`,
  code: String.raw`#include <algorithm>
#include <cstddef>
#include <iostream>
#include <vector>

int main() {
    std::vector<int> v{1, 2, 3, 4, 5, 6};
    v.erase(std::remove_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; }), v.end());
    for (std::size_t i = 0; i < v.size(); ++i)
        std::cout << v[i] << (i + 1 < v.size() ? ' ' : '\n');
}`,
  why: String.raw`Moving the unwanted elements to the back and then erasing that range is the standard way to remove many elements from a vector efficiently.` },

{ n: 5, d: "easy", t: "Assign one buffer to another", idiom: "Copy-and-swap",
  p: String.raw`Create a Buffer class that owns a dynamic array of ints and knows its size. Create a Buffer of size 2 and a Buffer of size 4, assign the first to the second, and print the second's size.`,
  ex: String.raw`2`,
  code: String.raw`#include <algorithm>
#include <cstddef>
#include <iostream>
#include <utility>

class Buffer {
    int* d;
    std::size_t n;
public:
    explicit Buffer(std::size_t k) : d(new int[k]{}), n(k) {}
    Buffer(const Buffer& o) : d(new int[o.n]), n(o.n) { std::copy(o.d, o.d + n, d); }
    friend void swap(Buffer& a, Buffer& b) noexcept {
        std::swap(a.d, b.d);
        std::swap(a.n, b.n);
    }
    Buffer& operator=(Buffer o) {
        swap(*this, o);
        return *this;
    }
    ~Buffer() { delete[] d; }
    std::size_t size() const { return n; }
};

int main() {
    Buffer a(2);
    Buffer b(4);
    b = a;
    std::cout << b.size() << '\n';
}`,
  why: String.raw`Taking the assigned value by value and swapping it into place gives assignment that is exception safe and handles self-assignment without a special check.` },

{ n: 6, d: "easy", t: "Build a request with chained calls", idiom: "Named parameter idiom",
  p: String.raw`Write a Request class whose methods method, url and timeout each set one field and return the request so that calls can be chained. Build a GET request for http://x with a timeout of 30, and print its string form, which is the method, url and timeout separated by spaces.`,
  ex: String.raw`GET http://x 30`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

class Request {
    std::string m;
    std::string u;
    int t = 0;
public:
    Request& method(std::string s) { m = std::move(s); return *this; }
    Request& url(std::string s) { u = std::move(s); return *this; }
    Request& timeout(int s) { t = s; return *this; }
    std::string str() const { return m + ' ' + u + ' ' + std::to_string(t); }
};

int main() {
    std::cout << Request().method("GET").url("http://x").timeout(30).str() << '\n';
}`,
  why: String.raw`Setters that return a reference to the object let callers name each option in the order they like, which reads well for optional settings.` },

{ n: 7, d: "easy", t: "Prevent copying a type", idiom: "Non-copyable type",
  p: String.raw`Define a class Locked that cannot be copied. Print true if Locked cannot be copy constructed, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <type_traits>

class Locked {
public:
    Locked() = default;
    Locked(const Locked&) = delete;
    Locked& operator=(const Locked&) = delete;
};

int main() {
    std::cout << std::boolalpha << !std::is_copy_constructible_v<Locked> << '\n';
}`,
  why: String.raw`Deleting the copy operations makes the compiler reject any attempt to duplicate an object that owns something unique, such as a lock or a file.` },

{ n: 8, d: "easy", t: "One shared instance", idiom: "Meyers singleton",
  p: String.raw`A class Logger has a single shared instance that is returned by a static function, and its constructor is private. Print true if two calls to that function return the same object, otherwise false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>

class Logger {
public:
    static Logger& instance() {
        static Logger l;
        return l;
    }
private:
    Logger() = default;
};

int main() {
    std::cout << std::boolalpha << (&Logger::instance() == &Logger::instance()) << '\n';
}`,
  why: String.raw`A function-local static is created once, the first time it is reached, so every caller gets the same object without any manual setup.` },

{ n: 9, d: "easy", t: "Destroy a derived object through a base pointer", idiom: "Virtual destructor for a polymorphic base",
  p: String.raw`Define a class Base and a class Derived that derives from it. Each destructor prints its class name. Create a Derived on the heap, hold it through a Base pointer, delete it through that pointer, then print done.`,
  ex: String.raw`derived
base
done`,
  code: String.raw`#include <iostream>

struct Base {
    virtual ~Base() { std::cout << "base\n"; }
};

struct Derived : Base {
    ~Derived() override { std::cout << "derived\n"; }
};

int main() {
    Base* b = new Derived();
    delete b;
    std::cout << "done\n";
}`,
  why: String.raw`A base class that is used polymorphically needs a virtual destructor. Without it, deleting through a base pointer skips the derived part of the cleanup.` },

{ n: 10, d: "easy", t: "Close a file even when a write fails", idiom: "RAII",
  p: String.raw`Define a FileHandle class whose constructor takes a name and prints open followed by the name. Its destructor prints close followed by the name. Its method write takes an int and throws an invalid_argument with the message negative if the value is below zero. Otherwise it prints the name, an arrow and the value. Define a function save that creates a FileHandle named a.txt, writes the value it is given, then prints saved. In main, call save with 7, then call save with -1 inside a try block, printing error followed by the message when it is caught.`,
  ex: String.raw`open a.txt
a.txt <- 7
saved
close a.txt
open a.txt
close a.txt
error: negative`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <string>

class FileHandle {
    std::string name_;
public:
    explicit FileHandle(std::string n) : name_(std::move(n)) { std::cout << "open " << name_ << "\n"; }
    ~FileHandle() { std::cout << "close " << name_ << "\n"; }
    void write(int v) const {
        if (v < 0) throw std::invalid_argument("negative");
        std::cout << name_ << " <- " << v << "\n";
    }
};

void save(int v) {
    FileHandle f("a.txt");
    f.write(v);
    std::cout << "saved\n";
}

int main() {
    save(7);
    try {
        save(-1);
    } catch (const std::exception& e) {
        std::cout << "error: " << e.what() << "\n";
    }
}`,
  why: String.raw`The destructor runs during stack unwinding, so the file is closed even though write threw before save could print saved. The caller sees the error without any cleanup code of its own.` },

{ n: 11, d: "easy", t: "Discard a guard once the step succeeds", idiom: "Scope guard",
  p: String.raw`Write a Guard class that stores a function and calls it when destroyed, unless its dismiss method has been called. Define a function step that takes a bool. It creates a Guard whose function prints rollback, prints step followed by the bool, and dismisses the guard if the bool is true. Call step with true, then with false, then print end.`,
  ex: String.raw`step 1
step 0
rollback
end`,
  code: String.raw`#include <functional>
#include <iostream>
#include <utility>

class Guard {
    std::function<void()> f_;
    bool active_ = true;
public:
    explicit Guard(std::function<void()> f) : f_(std::move(f)) {}
    void dismiss() { active_ = false; }
    ~Guard() { if (active_) f_(); }
};

void step(bool ok) {
    Guard g([] { std::cout << "rollback\n"; });
    std::cout << "step " << ok << "\n";
    if (ok) g.dismiss();
}

int main() {
    step(true);
    step(false);
    std::cout << "end\n";
}`,
  why: String.raw`The guard runs its cleanup on every exit path, and dismissing it means the step has succeeded and needs no undo. Only the failing call prints rollback.` },

{ n: 12, d: "easy", t: "Keep a document's fields through a move", idiom: "Rule of zero",
  p: String.raw`Define a struct Document with a std::string title, a std::vector of std::string tags, and a std::unique_ptr to an int revision. It has no special member functions. Create a Document a with title notes, tags x and y, and revision 3. Move a into a new Document b. Print the title, the number of tags and the revision of b, then whether a's revision is null as 1 or 0, then the number of tags in a, all separated by spaces.`,
  ex: String.raw`notes 2 3 1 0`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>
#include <utility>
#include <vector>

struct Document {
    std::string title;
    std::vector<std::string> tags;
    std::unique_ptr<int> revision;
};

int main() {
    Document a{"notes", {"x", "y"}, std::make_unique<int>(3)};
    Document b = std::move(a);
    std::cout << b.title << ' ' << b.tags.size() << ' ' << *b.revision << ' '
              << (a.revision == nullptr) << ' ' << a.tags.size() << '\n';
}`,
  why: String.raw`Each member knows how to move itself, so the struct needs no special members. The unique_ptr makes the type move-only, and the compiler generates a correct move.` },

{ n: 13, d: "easy", t: "Build a window with optional settings", idiom: "Named parameter idiom",
  p: String.raw`Write a Window class with a title defaulting to untitled, a width of 640, a height of 480 and a visible flag set to true. Give each setting a method named title, width, height or visible that sets it and returns the window so calls can be chained. Its method str returns the title, the width and height joined by x, and the word shown or hidden, all separated by spaces. Print the str of a window with height 900, title editor and visible false, then the str of a window with width 1280 only.`,
  ex: String.raw`editor 640x900 hidden
untitled 1280x480 shown`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

class Window {
    std::string title_ = "untitled";
    int w_ = 640, h_ = 480;
    bool vis_ = true;
public:
    Window& title(std::string t) { title_ = std::move(t); return *this; }
    Window& width(int w) { w_ = w; return *this; }
    Window& height(int h) { h_ = h; return *this; }
    Window& visible(bool v) { vis_ = v; return *this; }
    std::string str() const {
        return title_ + " " + std::to_string(w_) + "x" + std::to_string(h_) + (vis_ ? " shown" : " hidden");
    }
};

int main() {
    std::cout << Window().height(900).title("editor").visible(false).str() << '\n';
    std::cout << Window().width(1280).str() << '\n';
}`,
  why: String.raw`Each setter names one option, so callers pick only the options they need and in any order. Defaults apply to everything left unset.` },

{ n: 14, d: "easy", t: "Declare a type that can only be moved", idiom: "Non-copyable type",
  p: String.raw`Define a class Connection with a default constructor and move operations, where copying is not allowed. Print true or false, for each of these in order: whether Connection can be copy constructed, whether it can be copy assigned, and whether it can be move constructed. Then create a Connection a and move it into a Connection b. Use std::boolalpha for the printed values.`,
  ex: String.raw`false false true`,
  code: String.raw`#include <iostream>
#include <type_traits>

class Connection {
public:
    Connection() = default;
    Connection(const Connection&) = delete;
    Connection& operator=(const Connection&) = delete;
    Connection(Connection&&) noexcept = default;
    Connection& operator=(Connection&&) noexcept = default;
};

int main() {
    std::cout << std::boolalpha
              << std::is_copy_constructible_v<Connection> << ' '
              << std::is_copy_assignable_v<Connection> << ' '
              << std::is_move_constructible_v<Connection> << '\n';
    Connection a;
    Connection b = std::move(a);
    (void)b;
}`,
  why: String.raw`Deleting the copy operations while defaulting the move operations gives a type that owns something unique and can still be handed to another owner. The type traits show which operations the compiler accepts.` },

{ n: 15, d: "easy", t: "Load settings once and share them", idiom: "Meyers singleton",
  p: String.raw`Define a Settings class with a private constructor that prints init. It holds a level, starting at 1, with a setter and a getter. Its static function get returns a reference to one shared Settings object, created the first time get is called. In main, call get to set the level to 5, print the level through get, then print 1 if two calls to get return the same object and 0 otherwise.`,
  ex: String.raw`init
5
1`,
  code: String.raw`#include <iostream>

class Settings {
public:
    static Settings& get() {
        static Settings s;
        return s;
    }
    int level() const { return level_; }
    void set_level(int v) { level_ = v; }
private:
    Settings() { std::cout << "init\n"; }
    int level_ = 1;
};

int main() {
    Settings::get().set_level(5);
    std::cout << Settings::get().level() << '\n';
    std::cout << (&Settings::get() == &Settings::get()) << '\n';
}`,
  why: String.raw`A function-local static is constructed on first use and then reused, so the object is created lazily and only once. The private constructor keeps other code from making its own copies.` },

{ n: 16, d: "easy", t: "Swap a stack's contents safely", idiom: "Copy-and-swap",
  p: String.raw`Define a Stack class that holds a std::vector of ints. It has a constructor taking a vector, a push method, and a print method that writes its values separated by spaces. Its copy assignment operator takes its argument by value and swaps the contents with itself. Create a Stack a holding 1 and 2, and a Stack b holding 9. Assign a to b, push 3 onto b, then assign a to itself. Print a, then b.`,
  ex: String.raw`1 2
1 2 3`,
  code: String.raw`#include <iostream>
#include <utility>
#include <vector>

class Stack {
    std::vector<int> v_;
public:
    Stack(std::vector<int> v) : v_(std::move(v)) {}
    Stack(const Stack&) = default;
    Stack(Stack&&) noexcept = default;
    friend void swap(Stack& a, Stack& b) noexcept { std::swap(a.v_, b.v_); }
    Stack& operator=(Stack o) {
        swap(*this, o);
        return *this;
    }
    void push(int x) { v_.push_back(x); }
    void print() const {
        for (int x : v_) std::cout << x << ' ';
        std::cout << '\n';
    }
};

int main() {
    Stack a({1, 2});
    Stack b({9});
    b = a;
    b.push(3);
    a = a;
    a.print();
    b.print();
}`,
  why: String.raw`The by-value parameter makes the copy first, and the swap is noexcept, so the target is only changed once the copy is complete. Self-assignment works without a special check.` },

{ n: 17, d: "easy", t: "Destroy a derived object held by a base pointer", idiom: "Virtual destructor for a polymorphic base",
  p: String.raw`Define Base with a destructor that prints ~Base. Define Mid deriving from Base, and Leaf deriving from Mid, each with a destructor that prints its own name with a tilde. Put a Leaf and then a plain Base into a vector of unique_ptr to Base. Remove the last element, print popped, then let main finish.`,
  ex: String.raw`~Base
popped
~Leaf
~Mid
~Base`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

struct Base {
    virtual ~Base() { std::cout << "~Base\n"; }
};

struct Mid : Base {
    ~Mid() override { std::cout << "~Mid\n"; }
};

struct Leaf : Mid {
    ~Leaf() override { std::cout << "~Leaf\n"; }
};

int main() {
    std::vector<std::unique_ptr<Base>> v;
    v.push_back(std::make_unique<Leaf>());
    v.push_back(std::make_unique<Base>());
    v.pop_back();
    std::cout << "popped\n";
}`,
  why: String.raw`With a virtual destructor, deleting through a base pointer runs the destructors of the whole chain from the most derived class upwards. Without it, the Mid and Leaf parts would never be cleaned up.` },

// ---------- Medium ----------
{ n: 18, d: "medium", t: "Hide a counter's implementation", idiom: "Pimpl idiom",
  p: String.raw`Define a Widget whose data is kept in a private implementation struct, held through a unique pointer, so the header does not expose that struct. Widget has a function bump that adds 1 to a counter, and a function value that returns the counter. Call bump twice and print value.`,
  ex: String.raw`2`,
  code: String.raw`#include <iostream>
#include <memory>

class Widget {
    struct Impl;
    std::unique_ptr<Impl> p;
public:
    Widget();
    ~Widget();
    void bump();
    int value() const;
};

struct Widget::Impl {
    int count = 0;
};

Widget::Widget() : p(std::make_unique<Impl>()) {}
Widget::~Widget() = default;
void Widget::bump() { ++p->count; }
int Widget::value() const { return p->count; }

int main() {
    Widget w;
    w.bump();
    w.bump();
    std::cout << w.value() << '\n';
}`,
  why: String.raw`Keeping the data in a separate struct behind a pointer lets the implementation change without forcing every file that includes the header to be rebuilt.` },

{ n: 19, d: "medium", t: "Unsubscribe when a handle ends", idiom: "RAII subscription (scoped observer handle)",
  p: String.raw`Define a Subscription class that runs a stored function when it is destroyed, and that can be moved. Inside a block, start with a counter at 0, increment it, create a Subscription whose function decrements the counter, and print the counter. After the block, print the counter. Separate the two printed values with a space.`,
  ex: String.raw`1 0`,
  code: String.raw`#include <functional>
#include <iostream>
#include <utility>

class Subscription {
    std::function<void()> on_end;
public:
    explicit Subscription(std::function<void()> f) : on_end(std::move(f)) {}
    Subscription(Subscription&& o) noexcept : on_end(std::exchange(o.on_end, nullptr)) {}
    ~Subscription() {
        if (on_end) on_end();
    }
};

int main() {
    int count = 0;
    {
        ++count;
        Subscription s([&] { --count; });
        std::cout << count << ' ';
    }
    std::cout << count << '\n';
}`,
  why: String.raw`Tying a registration to an object's lifetime means the listener is removed automatically when the object goes away, so nothing is left behind.` },

{ n: 21, d: "medium", t: "Remove records that fail a rule", idiom: "Erase-remove idiom",
  p: String.raw`Given the people Ann aged 30, Bo aged 12, Cy aged 40 and Di aged 9, remove everyone under 18 from the collection in place. Print the remaining names separated by spaces.`,
  ex: String.raw`Ann Cy`,
  code: String.raw`#include <algorithm>
#include <cstddef>
#include <iostream>
#include <string>
#include <vector>

struct Person {
    std::string name;
    int age;
};

int main() {
    std::vector<Person> ps{{"Ann", 30}, {"Bo", 12}, {"Cy", 40}, {"Di", 9}};
    ps.erase(std::remove_if(ps.begin(), ps.end(),
                            [](const Person& p) { return p.age < 18; }),
             ps.end());
    for (std::size_t i = 0; i < ps.size(); ++i)
        std::cout << ps[i].name << (i + 1 < ps.size() ? ' ' : '\n');
}`,
  why: String.raw`Removing records by a predicate keeps the survivors in their original order and reclaims the space they used in one pass.` },

{ n: 22, d: "medium", t: "Remove entries while iterating a map", idiom: "Iterator-based erase",
  p: String.raw`A map holds the keys 1, 2, 3 and 4, with values 10, 20, 30 and 40. Remove every entry whose key is odd, doing the removal while walking through the map. Print the remaining keys separated by spaces.`,
  ex: String.raw`2 4`,
  code: String.raw`#include <iostream>
#include <map>

int main() {
    std::map<int, int> m{{1, 10}, {2, 20}, {3, 30}, {4, 40}};
    for (auto it = m.begin(); it != m.end();) {
        if (it->first % 2 == 1)
            it = m.erase(it);
        else
            ++it;
    }
    bool first = true;
    for (const auto& [k, v] : m) {
        std::cout << (first ? "" : " ") << k;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`Erasing through an iterator returns the next valid position, so a walk can remove entries safely without invalidating the iteration.` },

{ n: 23, d: "medium", t: "Handle messages by their type", idiom: "Visitor with std::visit and overloaded lambdas",
  p: String.raw`Messages are stored in variants. One message is a Move with a step count of 3, and another is a Say with the text hi. Print each message, one per line, using a separate branch of code for each kind of message: a Move prints moved followed by its step count, and a Say prints said followed by its text.`,
  ex: String.raw`moved 3
said hi`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

struct Move { int steps; };
struct Say { std::string text; };

template <class... Ts>
struct Overloaded : Ts... {
    using Ts::operator()...;
};

template <class... Ts>
Overloaded(Ts...) -> Overloaded<Ts...>;

int main() {
    std::variant<Move, Say> msgs[] = {Move{3}, Say{"hi"}};
    for (const auto& m : msgs)
        std::visit(Overloaded{
            [](const Move& x) { std::cout << "moved " << x.steps << '\n'; },
            [](const Say& x) { std::cout << "said " << x.text << '\n'; }}, m);
}`,
  why: String.raw`Visiting a variant with one callable per alternative makes the compiler check that every kind of message is handled.` },

{ n: 24, d: "medium", t: "Fixed report outline with custom body", idiom: "Non-virtual interface (NVI)",
  p: String.raw`A Report base class has a public function print that prints the line H, then calls a body function. The body is supplied by derived classes and is not public. Derive Sales, whose body prints body on its own line, and print a Sales report.`,
  ex: String.raw`H
body`,
  code: String.raw`#include <iostream>

class Report {
public:
    void print() const {
        header();
        body();
    }
    virtual ~Report() = default;
private:
    void header() const { std::cout << "H\n"; }
    virtual void body() const = 0;
};

class Sales : public Report {
    void body() const override { std::cout << "body\n"; }
};

int main() {
    Sales s;
    s.print();
}`,
  why: String.raw`A public function that fixes the order of steps, with private hooks for derived classes to fill in, stops subclasses from skipping or reordering the steps.` },

{ n: 25, d: "medium", t: "Create objects by name", idiom: "Factory method",
  p: String.raw`Write a function make_shape that returns a unique pointer to a shape chosen by name. The name square gives a square of side 4, and the name rect gives a rectangle of width 2 and height 3. Print the area of the square, then the area of the rectangle, separated by a space.`,
  ex: String.raw`16 6`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>

struct Shape {
    virtual ~Shape() = default;
    virtual int area() const = 0;
};

struct Square : Shape {
    int s;
    explicit Square(int x) : s(x) {}
    int area() const override { return s * s; }
};

struct Rect : Shape {
    int w;
    int h;
    Rect(int a, int b) : w(a), h(b) {}
    int area() const override { return w * h; }
};

std::unique_ptr<Shape> make_shape(const std::string& kind) {
    if (kind == "square") return std::make_unique<Square>(4);
    if (kind == "rect") return std::make_unique<Rect>(2, 3);
    return nullptr;
}

int main() {
    auto s = make_shape("square");
    auto r = make_shape("rect");
    std::cout << s->area() << ' ' << r->area() << '\n';
}`,
  why: String.raw`A factory hides which concrete type it creates, so callers depend only on the base type and new shapes can be added inside the factory.` },

{ n: 26, d: "medium", t: "Load a resource once across threads", idiom: "Call once (std::call_once)",
  p: String.raw`Four threads each call a function ensure_loaded. Make sure the loading step runs exactly once no matter how many threads call the function at the same time. Join all four threads, then print how many times the step ran.`,
  ex: String.raw`1`,
  code: String.raw`#include <iostream>
#include <mutex>
#include <thread>
#include <vector>

int loads = 0;
std::once_flag flag;

void ensure_loaded() {
    std::call_once(flag, [] { ++loads; });
}

int main() {
    std::vector<std::thread> ts;
    for (int i = 0; i < 4; ++i) ts.emplace_back(ensure_loaded);
    for (auto& t : ts) t.join();
    std::cout << loads << '\n';
}`,
  why: String.raw`Running one-time setup through a once flag lets many threads share lazy initialisation safely, with only one of them doing the work.` },

{ n: 27, d: "medium", t: "Release the old value on move assignment", idiom: "Move assignment with release of the old value",
  p: String.raw`A class Res holds a string name. Its move assignment first prints release followed by the old name, then takes the name from the source and leaves the source empty. Create Res A with name A and Res B with name B, move B into A, then print A's name and whether B's name is empty, separated by a space.`,
  ex: String.raw`release A
B true`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

class Res {
public:
    std::string name;
    explicit Res(std::string n) : name(std::move(n)) {}
    Res(Res&& o) noexcept : name(std::exchange(o.name, "")) {}
    Res& operator=(Res&& o) noexcept {
        if (this != &o) {
            std::cout << "release " << name << '\n';
            name = std::exchange(o.name, "");
        }
        return *this;
    }
};

int main() {
    Res a("A");
    Res b("B");
    a = std::move(b);
    std::cout << a.name << ' ' << std::boolalpha << b.name.empty() << '\n';
}`,
  why: String.raw`Move assignment must free what the target held before taking the source's value, and it must leave the source in a valid empty state.` },

{ n: 28, d: "medium", t: "Own a buffer with all five special members", idiom: "Rule of five",
  p: String.raw`Define a class Buffer that owns a heap array of ints. Its constructor takes a size and prints make. Its destructor prints free. Its copy constructor prints copy, its move constructor prints move, its copy assignment prints copy=, and its move assignment prints move=. A copy duplicates the array. A move leaves the source with no array and size 0, and move assignment frees the target's old array first. In main: create a of size 2; construct b as a copy of a; construct c by moving from a; assign b to c by copy assignment; assign b to a by move assignment. Print a=, then the sizes of a, b and c as a=N b=N c=N, then print done.`,
  ex: String.raw`make
copy
move
copy=
move=
a=2 b=0 c=2
done
free
free
free`,
  code: String.raw`#include <cstddef>
#include <iostream>
#include <utility>

class Buffer {
    int* data_;
    std::size_t size_;
public:
    explicit Buffer(std::size_t n) : data_(new int[n]()), size_(n) { std::cout << "make\n"; }
    ~Buffer() { delete[] data_; std::cout << "free\n"; }
    Buffer(const Buffer& o) : data_(new int[o.size_]()), size_(o.size_) { std::cout << "copy\n"; }
    Buffer(Buffer&& o) noexcept
        : data_(std::exchange(o.data_, nullptr)), size_(std::exchange(o.size_, 0)) {
        std::cout << "move\n";
    }
    Buffer& operator=(const Buffer& o) {
        if (this != &o) {
            int* fresh = new int[o.size_]();
            delete[] data_;
            data_ = fresh;
            size_ = o.size_;
        }
        std::cout << "copy=\n";
        return *this;
    }
    Buffer& operator=(Buffer&& o) noexcept {
        if (this != &o) {
            delete[] data_;
            data_ = std::exchange(o.data_, nullptr);
            size_ = std::exchange(o.size_, 0);
        }
        std::cout << "move=\n";
        return *this;
    }
    std::size_t size() const { return size_; }
};

int main() {
    Buffer a(2);
    Buffer b = a;
    Buffer c = std::move(a);
    c = b;
    a = std::move(b);
    std::cout << "a=" << a.size() << " b=" << b.size() << " c=" << c.size() << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`A class that manages a resource directly must define all five special members together, or the compiler's defaults copy the pointer and free it twice. Each special member here is written to keep ownership correct.` },

{ n: 29, d: "medium", t: "Share a greeting through a template base", idiom: "CRTP (curiously recurring template pattern)",
  p: String.raw`Write a class template Greeter whose greet() member prints hello followed by the name() of the object it is called on. Define Alice and Bob, each deriving from Greeter, and each with its own name(). Call greet() on an Alice, then on a Bob, then print done.`,
  ex: String.raw`hello alice
hello bob
done`,
  code: String.raw`#include <iostream>
#include <string>

template <typename Derived>
struct Greeter {
    void greet() const {
        std::cout << "hello " << static_cast<const Derived&>(*this).name() << "\n";
    }
};

struct Alice : Greeter<Alice> {
    std::string name() const { return "alice"; }
};

struct Bob : Greeter<Bob> {
    std::string name() const { return "bob"; }
};

int main() {
    Alice a;
    a.greet();
    Bob b;
    b.greet();
    std::cout << "done\n";
}`,
  why: String.raw`The base class template is parameterised by the class that derives from it, so its member can call the derived type's function with no virtual dispatch. The cast is safe because the object really is a Derived.` },

{ n: 30, d: "medium", t: "Notify attached listeners in order", idiom: "Observer pattern",
  p: String.raw`Write a class Subject that keeps a list of listener functions, each taking an int. attach adds a listener. notify calls every listener with the value, in the order they were attached. Attach one listener that prints a followed by the value, then one that prints b followed by twice the value. Call notify with 5, then print done.`,
  ex: String.raw`a5
b10
done`,
  code: String.raw`#include <functional>
#include <iostream>
#include <utility>
#include <vector>

class Subject {
    std::vector<std::function<void(int)>> listeners_;
public:
    void attach(std::function<void(int)> f) { listeners_.push_back(std::move(f)); }
    void notify(int v) const {
        for (const auto& f : listeners_) f(v);
    }
};

int main() {
    Subject s;
    s.attach([](int v) { std::cout << "a" << v << "\n"; });
    s.attach([](int v) { std::cout << "b" << v * 2 << "\n"; });
    s.notify(5);
    std::cout << "done\n";
}`,
  why: String.raw`The subject stores callbacks and calls each one when its state changes, without knowing what the listeners do. New listeners can be added without changing the subject.` },

{ n: 31, d: "medium", t: "Walk a range with a custom iterator", idiom: "Iterator (begin and end pair)",
  p: String.raw`Write a class Countdown built from a starting integer. It must support a range-for loop that yields the starting value, then one less, and so on down to 1, and stops before 0. Iterate over Countdown(3), printing each value on its own line, then print done.`,
  ex: String.raw`3
2
1
done`,
  code: String.raw`#include <iostream>

class Countdown {
    int start_;
public:
    explicit Countdown(int n) : start_(n) {}

    class iterator {
        int v_;
    public:
        explicit iterator(int v) : v_(v) {}
        int operator*() const { return v_; }
        iterator& operator++() { --v_; return *this; }
        bool operator!=(const iterator& o) const { return v_ != o.v_; }
    };

    iterator begin() const { return iterator(start_); }
    iterator end() const { return iterator(0); }
};

int main() {
    for (int v : Countdown(3)) std::cout << v << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`A type that provides begin and end returning iterators can be used in a range-for loop. The iterator only needs dereference, increment and inequality to drive the loop.` },

{ n: 32, d: "medium", t: "Adapt a legacy printer to a new interface", idiom: "Adapter",
  p: String.raw`A legacy class LegacyPrinter has a method print_text that takes a C string and prints it followed by a newline. Define an abstract class Sink with a virtual write(const std::string&) method. Define a class that implements Sink by forwarding to a LegacyPrinter, appending ! to the text first. Create a LegacyPrinter, wrap it, call write with hi through a Sink reference, then print done.`,
  ex: String.raw`hi!
done`,
  code: String.raw`#include <iostream>
#include <string>

struct LegacyPrinter {
    void print_text(const char* s) { std::cout << s << "\n"; }
};

struct Sink {
    virtual ~Sink() = default;
    virtual void write(const std::string& s) = 0;
};

class PrinterAdapter : public Sink {
    LegacyPrinter& p_;
public:
    explicit PrinterAdapter(LegacyPrinter& p) : p_(p) {}
    void write(const std::string& s) override {
        p_.print_text((s + "!").c_str());
    }
};

int main() {
    LegacyPrinter lp;
    PrinterAdapter ad(lp);
    Sink& s = ad;
    s.write("hi");
    std::cout << "done\n";
}`,
  why: String.raw`The adapter has the interface the caller expects and translates each call into the call the legacy class understands. Neither side has to change to work with the other.` },

{ n: 33, d: "medium", t: "Load an image only when first used", idiom: "Proxy (lazy initialisation)",
  p: String.raw`Write a class Image whose constructor prints loading, and whose pixel() returns 7. Write a class LazyImage with the same pixel() method. A LazyImage creates no Image until pixel() is first called, and creates one only then. Create a LazyImage, call pixel() and print the result, call it again and print the result, then print done.`,
  ex: String.raw`loading
7
7
done`,
  code: String.raw`#include <iostream>
#include <memory>

class Image {
public:
    Image() { std::cout << "loading\n"; }
    int pixel() const { return 7; }
};

class LazyImage {
    std::unique_ptr<Image> img_;
public:
    int pixel() {
        if (!img_) img_ = std::make_unique<Image>();
        return img_->pixel();
    }
};

int main() {
    LazyImage li;
    std::cout << li.pixel() << "\n";
    std::cout << li.pixel() << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`The proxy has the same interface as the real object and stands in for it. It delays the costly construction until the first real use, then reuses the same object.` },

{ n: 34, d: "medium", t: "Choose an advance strategy by iterator category", idiom: "Tag dispatch",
  p: String.raw`Write a function step_by(it, n) that moves an iterator forward by n positions. For a random-access iterator it moves in one operation and prints jumped. For any other iterator it moves one position at a time and prints walked. Use a std::vector<int> iterator and a std::forward_list<int> iterator. Step each by 2 and print the value it then points to, and print done at the end.`,
  ex: String.raw`jumped
30
walked
3
done`,
  code: String.raw`#include <forward_list>
#include <iostream>
#include <iterator>
#include <vector>

template <typename It>
void step_by(It& it, int n, std::forward_iterator_tag) {
    for (int i = 0; i < n; ++i) ++it;
    std::cout << "walked\n";
}

template <typename It>
void step_by(It& it, int n, std::random_access_iterator_tag) {
    it += n;
    std::cout << "jumped\n";
}

template <typename It>
void step_by(It& it, int n) {
    step_by(it, n, typename std::iterator_traits<It>::iterator_category{});
}

int main() {
    std::vector<int> v{10, 20, 30, 40};
    auto vi = v.begin();
    step_by(vi, 2);
    std::cout << *vi << "\n";
    std::forward_list<int> f{1, 2, 3};
    auto fi = f.begin();
    step_by(fi, 2);
    std::cout << *fi << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`An empty tag object, whose type is the iterator category, selects the overload at compile time. Each category gets the fastest code it supports, with no runtime check.` },

{ n: 35, d: "medium", t: "Find the right swap by argument lookup", idiom: "Idiomatic swap (ADL customisation point)",
  p: String.raw`Define a struct Name holding a std::string, inside a namespace shop. Provide a swap for Name in that same namespace that prints custom swap and then swaps the two strings. Write a function exchange_values(a, b) that swaps two values of one type using an unqualified call to swap. Swap two Names holding x and y and print their text, then swap two ints holding 1 and 2 and print them, then print done.`,
  ex: String.raw`custom swap
yx
21
done`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

namespace shop {
struct Name { std::string s; };

void swap(Name& x, Name& y) {
    std::cout << "custom swap\n";
    std::swap(x.s, y.s);
}
}

template <typename T>
void exchange_values(T& a, T& b) {
    using std::swap;
    swap(a, b);
}

int main() {
    shop::Name p{"x"}, q{"y"};
    exchange_values(p, q);
    std::cout << p.s << q.s << "\n";
    int i = 1, j = 2;
    exchange_values(i, j);
    std::cout << i << j << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`An unqualified call with a using-declaration for std::swap lets argument-dependent lookup find a type's own swap, and falls back to the standard one for types without it.` },

{ n: 36, d: "medium", t: "Hand out a shared pointer to self", idiom: "enable_shared_from_this",
  p: String.raw`Define a struct Node that can give out a shared pointer to itself through a method self(). Create a Node held by a shared pointer n, get s from n->self(), then print 1 if s and n point to the same object and 0 otherwise, followed by the use count of n, then print done.`,
  ex: String.raw`1 2
done`,
  code: String.raw`#include <iostream>
#include <memory>

struct Node : std::enable_shared_from_this<Node> {
    std::shared_ptr<Node> self() { return shared_from_this(); }
};

int main() {
    auto n = std::make_shared<Node>();
    auto s = n->self();
    std::cout << (s == n) << " " << n.use_count() << "\n";
    std::cout << "done\n";
}`,
  why: String.raw`A class that derives from enable_shared_from_this can produce shared pointers to itself that share ownership with the existing ones. Creating a new control block from a raw this pointer would double-delete the object.` },

{ n: 37, d: "medium", t: "Open a session where a later resource fails", idiom: "RAII (exception-safe acquisition)",
  p: String.raw`Define a Socket class whose constructor takes a name and a flag. If the flag is true it throws a runtime_error with the message cannot open followed by the name. Otherwise it prints open followed by the name. Its destructor prints close followed by the name. Define a Session class that owns a db Socket and then a cache Socket. Its constructor takes a flag that is passed to the cache socket only. In main, create a Session with the flag false inside a block, print ready, and let the block end. Then create a Session with the flag true inside a try block, and print the message of the exception when it is caught.`,
  ex: String.raw`open db
open cache
ready
close cache
close db
open db
close db
cannot open cache`,
  code: String.raw`#include <iostream>
#include <stdexcept>
#include <string>

struct Socket {
    std::string name;
    Socket(std::string n, bool fail) : name(std::move(n)) {
        if (fail) throw std::runtime_error("cannot open " + name);
        std::cout << "open " << name << "\n";
    }
    ~Socket() { std::cout << "close " << name << "\n"; }
};

class Session {
    Socket db;
    Socket cache;
public:
    explicit Session(bool failCache) : db("db", false), cache("cache", failCache) {}
};

int main() {
    {
        Session s(false);
        std::cout << "ready\n";
    }
    try {
        Session s(true);
    } catch (const std::exception& e) {
        std::cout << e.what() << "\n";
    }
}`,
  why: String.raw`Members that were fully built are destroyed when a later member's constructor throws, in reverse order of declaration. Each resource is released by its own destructor, so a failed session does not leak the sockets that opened before the failure.` },

{ n: 38, d: "medium", t: "Total shapes with a visitor over a variant", idiom: "Visitor with std::visit and overloaded lambdas",
  p: String.raw`Define three shape types: Circle with an int radius, Rect with int width and height, and Tri with int base and height. Store the shapes in a std::variant. Compute each shape's value with a visitor built from overloaded lambdas: a circle's value is three times the radius squared, a rectangle's value is width times height and also counts that rectangle, and a triangle's value is base times height divided by two. Given the shapes Circle 2, Rect 3 4, Tri 5 2 and Rect 1 1, print the total of all values and then the number of rectangles, separated by a space.`,
  ex: String.raw`30 2`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

struct Circle { int radius; };
struct Rect { int width; int height; };
struct Tri { int base; int height; };

template <class... Ts>
struct overloaded : Ts... {
    using Ts::operator()...;
};
template <class... Ts>
overloaded(Ts...) -> overloaded<Ts...>;

using Shape = std::variant<Circle, Rect, Tri>;

int main() {
    std::vector<Shape> shapes{Circle{2}, Rect{3, 4}, Tri{5, 2}, Rect{1, 1}};
    int total = 0;
    int rects = 0;
    for (const Shape& s : shapes) {
        total += std::visit(overloaded{
            [](const Circle& c) { return 3 * c.radius * c.radius; },
            [&](const Rect& r) { ++rects; return r.width * r.height; },
            [](const Tri& t) { return t.base * t.height / 2; }
        }, s);
    }
    std::cout << total << " " << rects << "\n";
}`,
  why: String.raw`std::visit calls the one lambda whose parameter matches the active alternative. Adding a shape type without a matching lambda is a compile error, so no alternative can be forgotten.` },

{ n: 39, d: "medium", t: "Hide a widget's state behind a pointer", idiom: "Pimpl idiom",
  p: String.raw`Define a Widget class whose name is kept in a hidden implementation struct owned through a unique_ptr. Its constructor takes a name. It has rename and name methods, a destructor, and move operations, but no copy operations. The implementation struct prints release followed by its name when it is destroyed. In main, create a Widget alpha, move it into b, and print b's name. Create a Widget gamma as c, move b into c, print c's name, then let main finish.`,
  ex: String.raw`alpha
release gamma
beta
release beta`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>
#include <utility>

class Widget {
    struct Impl;
    std::unique_ptr<Impl> p_;
public:
    explicit Widget(std::string name);
    ~Widget();
    Widget(Widget&&) noexcept;
    Widget& operator=(Widget&&) noexcept;
    void rename(std::string n);
    std::string name() const;
};

struct Widget::Impl {
    std::string name;
    ~Impl() { std::cout << "release " << name << "\n"; }
};

Widget::Widget(std::string n) : p_(std::make_unique<Impl>()) { p_->name = std::move(n); }
Widget::~Widget() = default;
Widget::Widget(Widget&&) noexcept = default;
Widget& Widget::operator=(Widget&&) noexcept = default;
void Widget::rename(std::string n) { p_->name = std::move(n); }
std::string Widget::name() const { return p_->name; }

int main() {
    Widget a("alpha");
    Widget b = std::move(a);
    std::cout << b.name() << "\n";
    b.rename("beta");
    Widget c("gamma");
    c = std::move(b);
    std::cout << c.name() << "\n";
}`,
  why: String.raw`Because the implementation type is complete only in the source file, the header never needs its members. Move operations are declared in the header and defaulted in the source, where the type is known to be complete.` },

{ n: 40, d: "medium", t: "Unsubscribe automatically when a handle ends", idiom: "RAII subscription (scoped observer handle)",
  p: String.raw`Write a Bus class whose method on takes a listener function taking an int, stores it under a new id, and returns a Subscription. Destroying the Subscription, or move-assigning over it, removes the listener and prints off followed by the id. Bus has emit, which calls every listener with the value. Subscribe a listener printing a and then the value, and subscribe another printing b. In main, call emit with 1 inside a block where a second subscription is made to a listener printing b. Let the block end, emit 2, replace the first subscription with an empty one, emit 3, and print end.`,
  ex: String.raw`a 1
b 1
off 1
a 2
off 0
end`,
  code: String.raw`#include <functional>
#include <iostream>
#include <map>
#include <utility>

class Subscription {
    std::function<void()> unsub_;
public:
    Subscription() = default;
    explicit Subscription(std::function<void()> f) : unsub_(std::move(f)) {}
    Subscription(Subscription&& o) noexcept : unsub_(std::exchange(o.unsub_, nullptr)) {}
    Subscription& operator=(Subscription&& o) noexcept {
        if (this != &o) {
            if (unsub_) unsub_();
            unsub_ = std::exchange(o.unsub_, nullptr);
        }
        return *this;
    }
    ~Subscription() { if (unsub_) unsub_(); }
};

class Bus {
    std::map<int, std::function<void(int)>> h_;
    int next_ = 0;
public:
    Subscription on(std::function<void(int)> f) {
        int id = next_++;
        h_[id] = std::move(f);
        return Subscription([this, id] {
            h_.erase(id);
            std::cout << "off " << id << "\n";
        });
    }
    void emit(int v) const {
        for (const auto& [id, f] : h_) f(v);
    }
};

int main() {
    Bus bus;
    Subscription a = bus.on([](int v) { std::cout << "a " << v << "\n"; });
    {
        Subscription b = bus.on([](int v) { std::cout << "b " << v << "\n"; });
        bus.emit(1);
    }
    bus.emit(2);
    a = Subscription();
    bus.emit(3);
    std::cout << "end\n";
}`,
  why: String.raw`A handle that unsubscribes in its destructor ties the listener's lifetime to a scope. The move operations transfer that responsibility, and move-assigning over a handle releases the old listener first.` },

{ n: 41, d: "medium", t: "Count copies made when a function takes a value", idiom: "Sink parameter (pass by value, then move)",
  p: String.raw`Define Text, which holds a std::string and has static copy and move counters. Its constructor takes a const char pointer, its copy constructor counts a copy and its move constructor counts a move. Define Log with a reserve method that reserves room for n lines, and an add method that takes a Text by value and stores it with a move. In main, reserve room for 4 lines, create a Text a holding x, add a, then add a temporary Text holding y. Print the copy count and the move count separated by a space.`,
  ex: String.raw`1 2`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>
#include <vector>

struct Text {
    std::string v;
    static inline int copies = 0;
    static inline int moves = 0;
    Text(const char* s) : v(s) {}
    Text(const Text& o) : v(o.v) { ++copies; }
    Text(Text&& o) noexcept : v(std::move(o.v)) { ++moves; }
};

class Log {
    std::vector<Text> lines_;
public:
    void reserve(std::size_t n) { lines_.reserve(n); }
    void add(Text t) { lines_.push_back(std::move(t)); }
};

int main() {
    Log log;
    log.reserve(4);
    Text a("x");
    log.add(a);
    log.add(Text("y"));
    std::cout << Text::copies << ' ' << Text::moves << '\n';
}`,
  why: String.raw`A by-value parameter lets lvalues and rvalues both work with one function. The argument is copied only when it is an lvalue, and a prvalue is built directly in the parameter, so only the final store costs a move.` },

{ n: 42, d: "medium", t: "Remove empty stock entries while walking a map", idiom: "Iterator-based erase",
  p: String.raw`Create a std::map from product name to stock count, containing apple 0, pear 3, fig 0 and kiwi 5. Walk the map with an iterator. For each entry with a count of 0, print drop followed by the name and erase it, moving the iterator to the element erase returns. Otherwise move to the next element. Then print each remaining name and count as name=count, in map order.`,
  ex: String.raw`drop apple
drop fig
kiwi=5
pear=3`,
  code: String.raw`#include <iostream>
#include <map>
#include <string>

int main() {
    std::map<std::string, int> stock{{"apple", 0}, {"pear", 3}, {"fig", 0}, {"kiwi", 5}};
    for (auto it = stock.begin(); it != stock.end();) {
        if (it->second == 0) {
            std::cout << "drop " << it->first << "\n";
            it = stock.erase(it);
        } else {
            ++it;
        }
    }
    for (const auto& [name, count] : stock) std::cout << name << '=' << count << "\n";
}`,
  why: String.raw`Erasing through an iterator returns the next valid position, so a walk can remove entries without skipping one or using an invalidated iterator. Only the erased element is invalidated.` },

{ n: 43, d: "medium", t: "Fix the steps of an export and let subclasses fill them", idiom: "Non-virtual interface (NVI)",
  p: String.raw`Define an Exporter class with a public method run that takes a count. If the count is negative, run throws an invalid_argument. Otherwise it calls begin, then write once for each number from 0 up to the count minus one, then end. The begin, write and end steps are private virtual functions. begin and end print begin and end by default, and write is pure virtual. Define Csv, which overrides begin to print header only, and overrides write to print row followed by the number. In main, run a Csv with count 2, then run it with count -1 inside a try block, printing bad followed by the message when caught.`,
  ex: String.raw`header
row 0
row 1
end
bad n`,
  code: String.raw`#include <iostream>
#include <stdexcept>

class Exporter {
public:
    virtual ~Exporter() = default;
    void run(int count) {
        if (count < 0) throw std::invalid_argument("n");
        begin();
        for (int i = 0; i < count; ++i) write(i);
        end();
    }
private:
    virtual void begin() { std::cout << "begin\n"; }
    virtual void write(int i) = 0;
    virtual void end() { std::cout << "end\n"; }
};

class Csv : public Exporter {
    void begin() override { std::cout << "header\n"; }
    void write(int i) override { std::cout << "row " << i << "\n"; }
};

int main() {
    Csv c;
    c.run(2);
    try {
        c.run(-1);
    } catch (const std::invalid_argument& e) {
        std::cout << "bad " << e.what() << "\n";
    }
}`,
  why: String.raw`The public method fixes the order of the steps and checks the arguments once. Subclasses supply only the varying pieces, so they cannot skip or reorder the steps.` },

{ n: 44, d: "medium", t: "Create dialog-specific buttons through a virtual factory", idiom: "Factory method",
  p: String.raw`Define an abstract Button with a draw method returning a string. WinButton draws [win] and MacButton draws (mac). Define an abstract Dialog with a public render method that returns the draw result of a button made by a protected virtual make method, followed by ok. WinDialog and MacDialog each override make to return their button. In main, put a WinDialog and a MacDialog into an array of unique_ptr to Dialog and print the render result of each.`,
  ex: String.raw`[win] ok
(mac) ok`,
  code: String.raw`#include <iostream>
#include <memory>
#include <string>

struct Button {
    virtual ~Button() = default;
    virtual std::string draw() const = 0;
};

struct WinButton : Button {
    std::string draw() const override { return "[win]"; }
};

struct MacButton : Button {
    std::string draw() const override { return "(mac)"; }
};

class Dialog {
public:
    virtual ~Dialog() = default;
    std::string render() const { return make()->draw() + " ok"; }
protected:
    virtual std::unique_ptr<Button> make() const = 0;
};

class WinDialog : public Dialog {
protected:
    std::unique_ptr<Button> make() const override { return std::make_unique<WinButton>(); }
};

class MacDialog : public Dialog {
protected:
    std::unique_ptr<Button> make() const override { return std::make_unique<MacButton>(); }
};

int main() {
    std::unique_ptr<Dialog> ds[] = {std::make_unique<WinDialog>(), std::make_unique<MacDialog>()};
    for (const auto& d : ds) std::cout << d->render() << "\n";
}`,
  why: String.raw`The base class's code calls a virtual method that each subclass answers with its own product. The caller works with the abstract types only and never names the concrete button.` },

{ n: 45, d: "medium", t: "Keep the old resource when assigning over it", idiom: "Move assignment with release of the old value",
  p: String.raw`Define Res, which owns a heap int. Its constructor takes a value and prints acquire followed by it. Its destructor deletes the int and, if it still owns one, prints release followed by its value. Its move constructor takes ownership and leaves the source empty. Its move assignment deletes the target's int, takes the source's, and does nothing when assigning an object to itself. Its method value returns the owned int, or -1 if it owns nothing. In main, create a Res holding 1 named a and a Res holding 2 named b. Move a into b, print the value of b and the value of a separated by a space. Then move b into itself through a reference, print the value of b, and let main finish.`,
  ex: String.raw`acquire 1
acquire 2
1 -1
1
release 1`,
  code: String.raw`#include <iostream>
#include <utility>

class Res {
    int* p_;
public:
    explicit Res(int v) : p_(new int(v)) { std::cout << "acquire " << v << "\n"; }
    ~Res() {
        if (p_) {
            std::cout << "release " << *p_ << "\n";
            delete p_;
        }
    }
    Res(Res&& o) noexcept : p_(std::exchange(o.p_, nullptr)) {}
    Res& operator=(Res&& o) noexcept {
        if (this != &o) {
            delete p_;
            p_ = std::exchange(o.p_, nullptr);
        }
        return *this;
    }
    int value() const { return p_ ? *p_ : -1; }
};

int main() {
    Res a(1);
    Res b(2);
    b = std::move(a);
    std::cout << b.value() << ' ' << a.value() << '\n';
    Res& alias = b;
    b = std::move(alias);
    std::cout << b.value() << '\n';
}`,
  why: String.raw`Move assignment must free what the target held before taking the source's value, or that memory leaks. The self-check stops the move from freeing the object's own resource before it is taken.` },

{ n: 46, d: "medium", t: "Compare versions using only less-than", idiom: "CRTP (curiously recurring template pattern)",
  p: String.raw`Define a template class Ordered with friend functions for greater than, less than or equal, and greater than or equal, each written only in terms of operator less than on the derived type. Define Version deriving from Ordered of Version. It has a major and minor number, a constructor, an equality operator, and a less than operator that compares major then minor. Compare the versions 1.9, 2.0 and 2.0 and print the results of b greater than a, a greater than or equal to b, b less than or equal to c, and a less than or equal to c, separated by spaces, where 1 means true and 0 means false.`,
  ex: String.raw`1 0 1 1`,
  code: String.raw`#include <iostream>

template <typename D>
struct Ordered {
    friend bool operator>(const D& a, const D& b) { return b < a; }
    friend bool operator<=(const D& a, const D& b) { return !(b < a); }
    friend bool operator>=(const D& a, const D& b) { return !(a < b); }
};

struct Version : Ordered<Version> {
    int major, minor;
    Version(int a, int b) : major(a), minor(b) {}
    friend bool operator<(const Version& a, const Version& b) {
        return a.major < b.major || (a.major == b.major && a.minor < b.minor);
    }
    friend bool operator==(const Version& a, const Version& b) {
        return a.major == b.major && a.minor == b.minor;
    }
};

int main() {
    Version a(1, 9), b(2, 0), c(2, 0);
    std::cout << (b > a) << ' ' << (a >= b) << ' ' << (b <= c) << ' ' << (a <= c) << '\n';
}`,
  why: String.raw`The base template supplies the other comparison operators by calling back into the derived type's single operator, and the derived type is known at compile time, so there is no virtual dispatch.` },

{ n: 47, d: "medium", t: "Notify only listeners that are still alive", idiom: "Observer pattern",
  p: String.raw`Define a Listener struct with an int id and a method on that prints listener followed by the id and got followed by the value. Define a Source class with an attach method that takes a shared_ptr to a Listener and keeps only a weak reference to it, and a publish method that calls on for every listener still alive. Listeners that have been destroyed are removed during publish. In main, attach a listener with id 2 inside a block so it is destroyed when the block ends. Then attach a listener with id 1 that stays alive. Publish 10, then print the number of remaining listeners.`,
  ex: String.raw`listener 1 got 10
1`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

struct Listener {
    int id;
    void on(int v) const { std::cout << "listener " << id << " got " << v << "\n"; }
};

class Source {
    std::vector<std::weak_ptr<Listener>> ls_;
public:
    void attach(const std::shared_ptr<Listener>& l) { ls_.push_back(l); }
    void publish(int v) {
        std::erase_if(ls_, [&](const std::weak_ptr<Listener>& w) {
            auto p = w.lock();
            if (!p) return true;
            p->on(v);
            return false;
        });
    }
    std::size_t count() const { return ls_.size(); }
};

int main() {
    Source s;
    auto a = std::make_shared<Listener>(Listener{1});
    {
        auto b = std::make_shared<Listener>(Listener{2});
        s.attach(b);
    }
    s.attach(a);
    s.publish(10);
    std::cout << s.count() << "\n";
}`,
  why: String.raw`A weak reference lets the subject observe a listener without keeping it alive. Locking the weak pointer during publish tells the subject whether the listener still exists.` },

{ n: 48, d: "medium", t: "Walk a linked list in a range-for loop", idiom: "Iterator (begin and end pair)",
  p: String.raw`Define a List class that owns its nodes through unique_ptr, with a push method that adds a value at the front. Its nested class It is an iterator that dereferences to the value of the node it points to, moves to the next node on increment, and compares by node pointer. The List methods begin and end return It objects. In main, push 1, 2 and 3, print the values in a range-for loop each followed by a space, then a newline. Then iterate over an empty list and print the number of elements visited.`,
  ex: String.raw`3 2 1 
0`,
  code: String.raw`#include <iostream>
#include <memory>

struct Node {
    int v;
    std::unique_ptr<Node> next;
};

class List {
    std::unique_ptr<Node> head_;
public:
    void push(int v) { head_ = std::make_unique<Node>(Node{v, std::move(head_)}); }

    class It {
        const Node* n_;
    public:
        explicit It(const Node* n) : n_(n) {}
        const int& operator*() const { return n_->v; }
        It& operator++() { n_ = n_->next.get(); return *this; }
        bool operator!=(const It& o) const { return n_ != o.n_; }
    };

    It begin() const { return It(head_.get()); }
    It end() const { return It(nullptr); }
};

int main() {
    List l;
    for (int i = 1; i <= 3; ++i) l.push(i);
    for (int x : l) std::cout << x << ' ';
    std::cout << '\n';
    List e;
    int count = 0;
    for (int x : e) { (void)x; ++count; }
    std::cout << count << '\n';
}`,
  why: String.raw`A class with begin and end that return an iterator can be used in a range-for loop. The iterator only needs dereference, increment and inequality, and the list stays a plain owner of its nodes.` },

{ n: 49, d: "medium", t: "Expose a legacy callback API as a std::function", idiom: "Adapter",
  p: String.raw`A legacy function legacy_fire takes a C function pointer that takes an int and a void pointer, and calls it with 1, 2 and 3 using the same void pointer. Define an Adapter class that stores a std::function taking an int. Its run method calls legacy_fire with a static trampoline and the adapter itself as the context. The trampoline multiplies the value by 10 and calls the stored function. In main, create an Adapter whose function prints got followed by the value and adds the value to a sum. Run it, then print sum followed by the sum.`,
  ex: String.raw`got 10
got 20
got 30
sum 60`,
  code: String.raw`#include <functional>
#include <iostream>
#include <utility>

using LegacyCb = void (*)(int, void*);

void legacy_fire(LegacyCb cb, void* ctx) {
    for (int i = 1; i <= 3; ++i) cb(i, ctx);
}

class Adapter {
    std::function<void(int)> f_;
public:
    explicit Adapter(std::function<void(int)> f) : f_(std::move(f)) {}
    void run() { legacy_fire(&Adapter::trampoline, this); }
private:
    static void trampoline(int v, void* ctx) {
        static_cast<Adapter*>(ctx)->f_(v * 10);
    }
};

int main() {
    int sum = 0;
    Adapter a([&](int v) {
        sum += v;
        std::cout << "got " << v << "\n";
    });
    a.run();
    std::cout << "sum " << sum << "\n";
}`,
  why: String.raw`The legacy API needs a plain function pointer and an untyped context. The adapter passes itself as the context and forwards each call to a modern callable, so callers never see the void pointer.` },

{ n: 50, d: "medium", t: "Compute an expensive value once, on first use", idiom: "Proxy (lazy initialisation)",
  p: String.raw`Define a LazyValue class that holds a function returning an int and an optional result. Its get method runs the function only if no result is stored yet, stores the result, and returns it. In main, create a LazyValue whose function prints computing and returns six times seven. Print the result of get, then print it again.`,
  ex: String.raw`computing
42
42`,
  code: String.raw`#include <functional>
#include <iostream>
#include <optional>
#include <utility>

class LazyValue {
    std::function<int()> make_;
    std::optional<int> v_;
public:
    explicit LazyValue(std::function<int()> f) : make_(std::move(f)) {}
    int get() {
        if (!v_) v_ = make_();
        return *v_;
    }
};

int main() {
    LazyValue total([] {
        std::cout << "computing\n";
        return 6 * 7;
    });
    std::cout << total.get() << '\n';
    std::cout << total.get() << '\n';
}`,
  why: String.raw`The proxy stands in for the real value and defers the costly work until the first real use. Later calls reuse the stored result, so the work happens once.` },

{ n: 51, d: "medium", t: "Pick an implementation from a type trait tag", idiom: "Tag dispatch",
  p: String.raw`Write describe, a template that returns integer when its argument has an integral type and other otherwise. Implement it by passing a tag object to a helper overloaded on the two boolean tag types. Print describe applied to 3, to 2.5, to a std::string holding x, and to the character c, separated by spaces.`,
  ex: String.raw`integer other other integer`,
  code: String.raw`#include <iostream>
#include <string>
#include <type_traits>

template <typename T>
std::string describe_impl(const T&, std::true_type) { return "integer"; }

template <typename T>
std::string describe_impl(const T&, std::false_type) { return "other"; }

template <typename T>
std::string describe(const T& v) {
    return describe_impl(v, std::is_integral<T>{});
}

int main() {
    std::cout << describe(3) << ' ' << describe(2.5) << ' '
              << describe(std::string("x")) << ' ' << describe('c') << '\n';
}`,
  why: String.raw`The trait's type is a true_type or false_type, and that type selects the matching overload at compile time. The dispatch costs nothing at runtime.` },

{ n: 52, d: "medium", t: "Swap a wrapped value through argument lookup", idiom: "Idiomatic swap (ADL customisation point)",
  p: String.raw`Inside a namespace lib, define a template class Box that holds a value and has a get method returning a reference to it. Give Box a friend swap that prints lib::swap and then swaps the held values using an unqualified call with a using-declaration for std::swap. In the global scope, create two Box objects of int, holding 5 and 2. Call swap on them without any qualification, then print the two values with a space between them.`,
  ex: String.raw`lib::swap
2 5`,
  code: String.raw`#include <iostream>
#include <utility>

namespace lib {
template <typename T>
class Box {
    T v_;
public:
    explicit Box(T v) : v_(std::move(v)) {}
    T& get() { return v_; }
    friend void swap(Box& a, Box& b) {
        std::cout << "lib::swap\n";
        using std::swap;
        swap(a.v_, b.v_);
    }
};
}

int main() {
    lib::Box<int> x(5), y(2);
    swap(x, y);
    std::cout << x.get() << ' ' << y.get() << '\n';
}`,
  why: String.raw`An unqualified call lets argument-dependent lookup find the swap that lives beside the type. The using-declaration keeps std::swap as the fallback for the held value.` },

{ n: 53, d: "medium", t: "Hand out a shared pointer to a session", idiom: "enable_shared_from_this",
  p: String.raw`Define a Session class that derives from enable_shared_from_this of Session. It has an id, a start method that adds weak_from_this to a vector of weak pointers passed in, and a destructor that prints end followed by the id. In main, inside a block, create session 1 and session 2 as shared pointers, and start each one with the same vector. Let the block end. Then print the size of the vector and 1 if the first entry has expired, or 0 otherwise, separated by a space.`,
  ex: String.raw`end 2
end 1
2 1`,
  code: String.raw`#include <iostream>
#include <memory>
#include <vector>

class Session : public std::enable_shared_from_this<Session> {
    int id_;
public:
    explicit Session(int id) : id_(id) {}
    void start(std::vector<std::weak_ptr<Session>>& reg) { reg.push_back(weak_from_this()); }
    ~Session() { std::cout << "end " << id_ << "\n"; }
};

int main() {
    std::vector<std::weak_ptr<Session>> reg;
    {
        auto s = std::make_shared<Session>(1);
        s->start(reg);
        auto t = std::make_shared<Session>(2);
        t->start(reg);
    }
    std::cout << reg.size() << ' ' << reg[0].expired() << '\n';
}`,
  why: String.raw`A class that derives from enable_shared_from_this can give out pointers that share ownership with the existing shared_ptr. Creating a new control block from this would make two owners that each delete the object.` },

{ n: 54, d: "medium", t: "Run an initialiser once per object", idiom: "Call once (std::call_once)",
  p: String.raw`Define a Cache class with a mutable std::once_flag and a mutable int value. Its get method calls std::call_once with a lambda that prints loading and sets the value to 99, then returns the value. Create two Cache objects, a and b. Print the result of a.get twice, then the result of b.get once.`,
  ex: String.raw`loading
99
99
loading
99`,
  code: String.raw`#include <iostream>
#include <mutex>

class Cache {
    mutable std::once_flag f_;
    mutable int value_ = 0;
public:
    int get() const {
        std::call_once(f_, [this] {
            std::cout << "loading\n";
            value_ = 99;
        });
        return value_;
    }
};

int main() {
    Cache a, b;
    std::cout << a.get() << '\n';
    std::cout << a.get() << '\n';

{ n: 55, d: "medium", t: "Make a string class that copies, moves and assigns safely", idiom: "Rule of five",
  p: String.raw`Define Str, which owns a heap copy of a C string. Its constructor takes a const char pointer. It has a copy constructor, a move constructor that leaves the source owning nothing, a copy-and-move assignment operator that takes its argument by value and swaps with it, and a destructor. Its c_str method returns the owned text. In main, create Str a holding hi and Str b holding there. Move a into c. Assign c to b, then move b into a. Print a's text, c's text, then 1 if b owns nothing and 0 otherwise, separated by spaces.`,
  ex: String.raw`hi hi 1`,
  code: String.raw`#include <cstring>
#include <iostream>
#include <utility>

class Str {
    char* s_;
public:
    Str(const char* t) : s_(new char[std::strlen(t) + 1]) { std::strcpy(s_, t); }
    Str(const Str& o) : s_(new char[std::strlen(o.s_) + 1]) { std::strcpy(s_, o.s_); }
    Str(Str&& o) noexcept : s_(std::exchange(o.s_, nullptr)) {}
    Str& operator=(Str o) noexcept {
        std::swap(s_, o.s_);
        return *this;
    }
    ~Str() { delete[] s_; }
    const char* c_str() const { return s_; }
};

int main() {
    Str a("hi");
    Str b("there");
    Str c(std::move(a));
    b = c;
    a = std::move(b);
    std::cout << a.c_str() << ' ' << c.c_str() << ' ' << (b.c_str() == nullptr) << '\n';
}`,
  why: String.raw`A class that manages memory directly must handle copy, move, assignment and destruction together. The move leaves the source owning nothing, so its destructor is safe, and the by-value assignment reuses the copy and move constructors.` },

// ---------- Hard ----------
{ n: 56, d: "hard", t: "Transfer between accounts without deadlock", idiom: "Deadlock-free locking with std::scoped_lock",
  p: String.raw`Two accounts each start with a balance of 100 and each has its own mutex. Two threads run at the same time: one makes 100 transfers of 1 from a to b, and the other makes 100 transfers of 1 from b to a. Each transfer must lock both accounts together. Join both threads and print the total of both balances.`,
  ex: String.raw`200`,
  code: String.raw`#include <iostream>
#include <mutex>
#include <thread>

struct Account {
    std::mutex m;
    int balance = 100;
};

void transfer(Account& from, Account& to, int amount) {
    std::scoped_lock lock(from.m, to.m);
    from.balance -= amount;
    to.balance += amount;
}

int main() {
    Account a;
    Account b;
    std::thread t1([&] { for (int i = 0; i < 100; ++i) transfer(a, b, 1); });
    std::thread t2([&] { for (int i = 0; i < 100; ++i) transfer(b, a, 1); });
    t1.join();
    t2.join();
    std::cout << a.balance + b.balance << '\n';
}`,
  why: String.raw`Locking several mutexes in one call lets the library choose a safe order, so two threads locking the same pair in opposite directions cannot deadlock.` },

{ n: 57, d: "hard", t: "Create a secret only through a friend", idiom: "Attorney-client (friend-restricted construction)",
  p: String.raw`A class Secret holds a private int and has a private constructor that takes it. Only a class Attorney is allowed to construct a Secret. Attorney has a static function make that creates a Secret holding 42. In main, create a Secret through Attorney and print its value through a public function.`,

public:

{ n: 58, d: "hard", t: "Parse with a result that is value or error", idiom: "Result type (value or error)",
  p: String.raw`Write a function that parses a string as a whole number and returns either the number or an error message. An empty string gives the error empty. A string containing a non-digit gives the error bad followed by a space and the string. Call it on the strings 12 and x. For a success print ok followed by the number, and for a failure print error followed by the message, one per line.`,
  ex: String.raw`ok 12
error bad x`,
  code: String.raw`#include <cctype>
#include <expected>
#include <iostream>
#include <string>

std::expected<int, std::string> parse_positive(const std::string& s) {
    if (s.empty()) return std::unexpected(std::string("empty"));
    for (char c : s)
        if (!std::isdigit(static_cast<unsigned char>(c)))
            return std::unexpected(std::string("bad ") + s);
    return std::stoi(s);
}

int main() {

{ n: 59, d: "hard", t: "Undo the last append", idiom: "Command with undo log",
  p: String.raw`An editor holds a text string. Appending adds text and records how to undo that append. Undo removes the most recent append. Append ab, then append cd, undo once, and print the text.`,
  ex: String.raw`ab`,
  code: String.raw`#include <functional>
#include <iostream>
#include <string>
#include <vector>

class Editor {
    std::string text;
    std::vector<std::function<void()>> undo;
public:
    void append(const std::string& s) {
        text += s;
        undo.push_back([this, s] { text.erase(text.size() - s.size()); });
    }
    void undo_last() {
        if (!undo.empty()) {
            undo.back()();
            undo.pop_back();
        }
    }
    const std::string& str() const { return text; }
};

int main() {
    Editor e;
    e.append("ab");
    e.append("cd");
    e.undo_last();
    std::cout << e.str() << '\n';
}`,
  why: String.raw`Recording a reversal alongside each change lets an application undo edits in reverse order without storing whole copies of the document.` },

{ n: 60, d: "hard", t: "Assign a holder to itself", idiom: "Self-assignment check",
  p: String.raw`A Holder class holds a string and has a copy assignment operator. Create a Holder holding abc, make a reference to it, and assign the reference back to the holder itself. Print the holder's string.`,
  ex: String.raw`abc`,
  code: String.raw`#include <iostream>
#include <string>
#include <utility>

class Holder {
    std::string s;
public:
    explicit Holder(std::string v) : s(std::move(v)) {}
    Holder& operator=(const Holder& o) {
        if (this != &o) s = o.s;
        return *this;
    }
    const std::string& str() const { return s; }
};

int main() {
    Holder h("abc");
    Holder& alias = h;
    h = alias;

{ n: 61, d: "hard", t: "Close a C handle automatically", idiom: "Custom deleter for C handles",
  p: String.raw`A C-style API has a function open_handle that returns a pointer to a handle with an id, and a function close_handle that closes it. Wrap the pointer so that close_handle runs automatically when leaving a block. Inside a block, open handle 1 and print using. Leave the block, then print done.`,

using
closed 1
done`,
  code: String.raw`#include <iostream>
#include <memory>

struct Handle {
    int id;
};

Handle* open_handle(int id) {
    std::cout << "open " << id << '\n';
    return new Handle{id};
}

void close_handle(Handle* h) {

{ n: 62, d: "hard", t: "Pass a dependency in from outside", idiom: "Dependency injection",
  p: String.raw`A Sender interface has a function send that takes a string. A ConsoleSender prints sent followed by the message. A Notifier stores a reference to a Sender that is passed to it at construction, and never creates its own sender. Create a ConsoleSender, give it to a Notifier, and call notify with bob, which sends bob through the sender.`,
  ex: String.raw`sent bob`,
  code: String.raw`#include <iostream>
#include <string>

struct Sender {
    virtual ~Sender() = default;
    virtual void send(const std::string& m) = 0;
};

struct ConsoleSender : Sender {
    void send(const std::string& m) override { std::cout << "sent " << m << '\n'; }
};

class Notifier {
    Sender& sender_;
public:
    explicit Notifier(Sender& s) : sender_(s) {}
    void notify(const std::string& who) { sender_.send(who); }
};

int main() {
    ConsoleSender cs;
    Notifier n(cs);
    n.notify("bob");
}`,
  why: String.raw`Receiving collaborators through the constructor makes a class easy to test with a fake and lets the caller decide which implementation is used.` },

{ n: 63, d: "hard", t: "Restore a value when a scope ends", idiom: "Scope guard (restore value on exit)",
  p: String.raw`A Restore object holds a reference to an int and the int's value at the time it was created, and puts that old value back when it is destroyed. Start with level equal to 1. Inside a block, create a Restore for level, set level to 2, and print level followed by a space. After the block, print level.`,
  ex: String.raw`2 1`,

struct Restore {
    int& ref;
    int old;
    ~Restore() { ref = old; }
};

int main() {
    int level = 1;
    {
        Restore r{level, level};
        level = 2;
        std::cout << level << ' ';
