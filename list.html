    for (int x : b) std::cout << x << ' ';

}`,

// ---------- Hard ----------
{ n: 21, d: "hard", t: "LRU cache from a list and a map",
  p: String.raw`Build a cache of capacity 2. Put key 1 with value a, then key 2 with value b, then read key 1, then put key 3 with value c. When the cache is over capacity, evict the least recently used key. Print the keys from most to least recently used, separated by spaces.`,
  ex: String.raw`3 1`,
  code: String.raw`#include <iostream>
#include <list>
#include <unordered_map>
#include <utility>

int main() {
    const std::size_t capacity = 2;
    std::list<std::pair<int, char>> order;   // front is most recent
    std::unordered_map<int, std::list<std::pair<int, char>>::iterator> index;

    auto touch = [&](int key) {
        order.splice(order.begin(), order, index[key]);
    };
    auto put = [&](int key, char value) {
        if (auto found = index.find(key); found != index.end()) {
            found->second->second = value;
            touch(key);
            return;
        }
        if (order.size() == capacity) {
            index.erase(order.back().first);
            order.pop_back();
        }
        order.emplace_front(key, value);
        index[key] = order.begin();
    };
    auto get = [&](int key) {
        if (index.count(key)) touch(key);
    };

    put(1, 'a');
    put(2, 'b');
    get(1);
    put(3, 'c');
    bool first = true;
    for (const auto& [key, value] : order) {
        std::cout << (first ? "" : " ") << key;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`The map finds an entry in constant time, and the list keeps recency order. Moving a node with splice updates its position without reallocating, and the iterators stored in the map stay valid.` },

{ n: 22, d: "hard", t: "Insertion sort by splicing",
  p: String.raw`Start with the list 4, 1, 3, 2. Repeatedly take the front element and splice it into a second list at its sorted position. Print the sorted second list separated by spaces.`,
  ex: String.raw`1 2 3 4`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <list>

int main() {
    std::list<int> src{4, 1, 3, 2}, out;
    while (!src.empty()) {
        const int x = src.front();
        const auto pos = std::find_if(out.begin(), out.end(), [x](int y) { return y > x; });
        out.splice(pos, src, src.begin());
    }
    for (int x : out) std::cout << x << ' ';
    std::cout << '\n';
}`,
  why: String.raw`Splicing the front node into the output avoids copying values. Each insertion searches the sorted output for its place, so the result is sorted after the last element is moved.` },

{ n: 23, d: "hard", t: "Iterator survives erasing neighbours",

    l.erase(l.begin());

{ n: 25, d: "hard", t: "Interleave two lists",
  p: String.raw`Interleave the lists 1, 3, 5 and 2, 4, 6 so the output alternates between them, starting with the first list. Print the result separated by spaces.`,
  ex: String.raw`1 2 3 4 5 6`,
  code: String.raw`#include <iostream>
#include <list>

int main() {
    std::list<int> a{1, 3, 5}, b{2, 4, 6}, out;
    while (!a.empty() || !b.empty()) {
        if (!a.empty()) out.splice(out.end(), a, a.begin());

    }
    for (int x : out) std::cout << x << ' ';

}`,

  ex: String.raw`0 6 10 3`,
  code: String.raw`#include <iostream>
#include <list>
#include <utility>

int main() {
    std::list<std::pair<int, int>> blocks{{0, 4}, {4, 2}, {10, 3}};
    for (auto it = blocks.begin(); it != blocks.end();) {
        auto next = std::next(it);
        if (next != blocks.end() && it->first + it->second == next->first) {
            it->second += next->second;
            blocks.erase(next);
        } else {
            ++it;
        }

    for (const auto& [start, size] : blocks) std::cout << start << ' ' << size << ' ';

}`,

#include <iostream>
#include <iterator>
#include <list>

int main() {

    bool first_batch = true;
    while (!queue.empty()) {
        std::list<int> batch;

const TOTAL = problems.length;
const KEY = "stl-list-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 56, label: "Easy", range: "Problems 1–56", badge: "easy" },
  { from: 11, to: 58, label: "Medium", range: "Problems 11–58", badge: "medium" },
  { from: 21, to: 29, label: "Hard", range: "Problems 21–29", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
