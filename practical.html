#include <string_view>

std::string_view trim(std::string_view s) {
    while (!s.empty() && s.front() == ' ') s.remove_prefix(1);

{ n: 4, d: "easy", t: "Combined hash of a key",
  p: String.raw`A key has a name and an id. Compute a hash for two equal keys by combining the hashes of the name and the id with the usual mixing step. Print whether the two hashes are equal, as true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <functional>
#include <iostream>
#include <string>

struct Key {
    std::string name;
    int id;
};

template <class T>
void hash_combine(std::size_t& seed, const T& v) {
    seed ^= std::hash<T>{}(v) + 0x9e3779b9 + (seed << 6) + (seed >> 2);
}

std::size_t hash_key(const Key& k) {
    std::size_t s = 0;
    hash_combine(s, k.name);
    hash_combine(s, k.id);
    return s;
}

int main() {
    Key a{"x", 1}, b{"x", 1};
    std::cout << std::boolalpha << (hash_key(a) == hash_key(b)) << '\n';
}`,
  why: String.raw`Hash tables need equal keys to produce equal hashes. Mixing each field into one running seed is the standard way to hash a struct.` },

{ n: 6, d: "easy", t: "Cleanup at scope exit",

class ScopeGuard {

{ n: 10, d: "easy", t: "Handle each alternative",

#include <string>
#include <variant>

template <class... Ts>
struct Overloaded : Ts... {
    using Ts::operator()...;
};
template <class... Ts>
Overloaded(Ts...) -> Overloaded<Ts...>;

int main() {
    std::variant<int, std::string> v{std::string("hi")};
    std::visit(Overloaded{

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Fixed-size ring buffer",
  p: String.raw`A ring buffer holds at most 3 values. Push 1 through 5 into it, so that the oldest values are overwritten when it is full. Print the values it holds from oldest to newest, separated by spaces.`,
  ex: String.raw`3 4 5`,
  code: String.raw`#include <iostream>
#include <vector>

class Ring {
    std::vector<int> buf;
    std::size_t head = 0, count = 0;

public:
    explicit Ring(std::size_t cap) : buf(cap) {}
    void push(int v) {
        buf[(head + count) % buf.size()] = v;
        if (count < buf.size()) ++count;
        else head = (head + 1) % buf.size();
    }
    int at(std::size_t i) const { return buf[(head + i) % buf.size()]; }
    std::size_t size() const { return count; }
};

int main() {
    Ring r(3);
    for (int v = 1; v <= 5; ++v) r.push(v);
    for (std::size_t i = 0; i < r.size(); ++i)
        std::cout << r.at(i) << (i + 1 < r.size() ? ' ' : '\n');
}`,
  why: String.raw`Log buffers and audio pipelines use fixed-size rings so memory never grows. The oldest entry is dropped when a new one arrives.` },

{ n: 12, d: "medium", t: "Least recently used eviction",
  p: String.raw`A cache holds at most 2 entries and evicts the entry that was used least recently. Put key 1 with value a, then key 2 with value b. Read key 1. Put key 3 with value c. Print whether key 2 is still present, then the value stored for key 1, separated by a space. Print true or false for presence.`,
  ex: String.raw`false a`,
  code: String.raw`#include <iostream>
#include <list>
#include <string>
#include <unordered_map>

class LRU {
    using Entry = std::pair<int, std::string>;
    std::size_t cap;
    std::list<Entry> order;
    std::unordered_map<int, std::list<Entry>::iterator> idx;

public:
    explicit LRU(std::size_t c) : cap(c) {}
    std::string get(int k) {
        auto it = idx.find(k);
        if (it == idx.end()) return "-";
        order.splice(order.begin(), order, it->second);
        return it->second->second;
    }
    void put(int k, std::string v) {
        auto it = idx.find(k);
        if (it != idx.end()) {
            it->second->second = v;
            order.splice(order.begin(), order, it->second);
            return;
        }
        if (order.size() == cap) {
            idx.erase(order.back().first);
            order.pop_back();
        }
        order.emplace_front(k, v);
        idx[k] = order.begin();
    }
    bool has(int k) const { return idx.count(k) > 0; }
};

int main() {
    LRU c(2);
    c.put(1, "a");
    c.put(2, "b");
    c.get(1);
    c.put(3, "c");
    std::cout << std::boolalpha << c.has(2) << ' ' << c.get(1) << '\n';
}`,
  why: String.raw`A hash map finds entries quickly, and a linked list keeps their recency order. Moving a node to the front on access is constant time with splice.` },

{ n: 13, d: "medium", t: "Reuse a released slot",
  p: String.raw`A pool hands out integer slots 0 to 3 from a free list. Acquire three slots, release the second one you acquired, then acquire again. Print true if the new slot is the same number as the released one.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <vector>

class Pool {
    std::vector<int> free_list;

public:
    explicit Pool(std::size_t n) {
        for (std::size_t i = n; i-- > 0;) free_list.push_back(static_cast<int>(i));
    }
    int acquire() {
        int i = free_list.back();
        free_list.pop_back();
        return i;
    }
    void release(int i) { free_list.push_back(i); }
};

int main() {
    Pool p(4);
    int a = p.acquire();
    int b = p.acquire();
    int c = p.acquire();
    (void)a;
    (void)c;
    p.release(b);
    int d = p.acquire();
    std::cout << std::boolalpha << (d == b) << '\n';
}`,
  why: String.raw`Object pools avoid repeated allocation in hot loops. A free list makes both acquire and release constant time.` },

{ n: 14, d: "medium", t: "Aligned bump allocation",

int main() {
    std::size_t offset = 0;
    offset += 3;

{ n: 15, d: "medium", t: "Compare version strings",
  p: String.raw`Compare the version 1.10.0 with the version 1.9.9 by their numeric parts, comparing the major number first, then the minor, then the patch. Print -1 if the first is smaller, 1 if it is larger, or 0 if they are equal.`,

#include <iostream>
#include <sstream>
#include <string>

std::array<int, 3> parse(const std::string& s) {
    std::array<int, 3> v{};
    std::stringstream ss(s);
    std::string part;
    for (int i = 0; i < 3 && std::getline(ss, part, '.'); ++i) v[i] = std::stoi(part);

}

int main() {

{ n: 16, d: "medium", t: "Wildcard matching",
  p: String.raw`Check whether the pattern test_*.txt matches the names test_1.txt and test.txt. In the pattern, * matches any run of characters, including none, and other characters match themselves. Print true or false for each name, separated by a space.`,
  ex: String.raw`true false`,
  code: String.raw`#include <iostream>
#include <string_view>

bool match(std::string_view p, std::string_view s) {
    if (p.empty()) return s.empty();
    if (p[0] == '*')
        return match(p.substr(1), s) || (!s.empty() && match(p, s.substr(1)));
    if (s.empty()) return false;
    if (p[0] == s[0]) return match(p.substr(1), s.substr(1));
    return false;
}

int main() {
    std::cout << std::boolalpha << match("test_*.txt", "test_1.txt") << ' '
              << match("test_*.txt", "test.txt") << '\n';
}`,
  why: String.raw`Build tools and file filters use glob patterns. Trying each way the star could absorb characters is a direct way to decide a match.` },

{ n: 18, d: "medium", t: "Variable-length integer encoding",
  p: String.raw`Encode the unsigned value 300 in the variable-length format used by binary protocols. Seven bits go into each byte, low bits first. Every byte except the last has its high bit set. Print the byte values in decimal, separated by spaces.`,
  ex: String.raw`172 2`,
  code: String.raw`#include <cstdint>
#include <iostream>
#include <vector>

int main() {
    std::uint32_t v = 300;
    std::vector<unsigned> out;
    while (v >= 0x80) {
        out.push_back((v & 0x7F) | 0x80);
        v >>= 7;

{ n: 19, d: "medium", t: "Base64 encoding",
  p: String.raw`Encode the three-character text Man using the standard Base64 alphabet, without padding since the input length is a multiple of three. Print the encoded text.`,
  ex: String.raw`TWFu`,
  code: String.raw`#include <iostream>
#include <string>

int main() {
    const std::string tbl =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    const std::string in = "Man";
    std::string out;
    for (std::size_t i = 0; i < in.size(); i += 3) {
        unsigned n = static_cast<unsigned char>(in[i]) << 16;
        if (i + 1 < in.size()) n |= static_cast<unsigned char>(in[i + 1]) << 8;
        if (i + 2 < in.size()) n |= static_cast<unsigned char>(in[i + 2]);
        for (int k = 0; k < 4; ++k) out += tbl[(n >> (18 - 6 * k)) & 63];
    }
    std::cout << out << '\n';
}`,
  why: String.raw`Base64 turns three bytes into four printable characters. Network protocols and config files embed binary data this way.` },

{ n: 20, d: "medium", t: "Retry delays with a cap",

  code: String.raw`#include <algorithm>

int main() {

{ n: 21, d: "medium", t: "Count tokens in a sequence",
  p: String.raw`Count the number of tokens in the expression x = 3 + y1;. A token is either a run of letters and digits, or a single other non-space character. Print the count.`,
  ex: String.raw`6`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <string_view>
#include <vector>

std::vector<std::string_view> tokenize(std::string_view s) {
    std::vector<std::string_view> out;
    std::size_t i = 0;
    while (i < s.size()) {
        unsigned char c = s[i];
        if (std::isspace(c)) { ++i; continue; }
        std::size_t j = i + 1;
        if (std::isalnum(c))
            while (j < s.size() && std::isalnum(static_cast<unsigned char>(s[j]))) ++j;
        out.push_back(s.substr(i, j - i));
        i = j;
    }
    return out;
}

int main() {

{ n: 25, d: "medium", t: "Subscriber removed by its handle",
  p: String.raw`An event bus lets callers subscribe a handler and receive a handle. When the handle is destroyed, its handler is removed automatically. Subscribe two handlers that each add 1 to a counter. Destroy the second handle, then emit an event once. Print the counter.`,
  ex: String.raw`1`,
  code: String.raw`#include <functional>
#include <iostream>
#include <utility>
#include <vector>

class Bus;

class Subscription {
    Bus* bus;
    int id;

public:
    Subscription(Bus* b, int i) : bus(b), id(i) {}
    ~Subscription();
};

class Bus {
public:
    std::vector<std::pair<int, std::function<void()>>> handlers;
    int next = 0;
    Subscription subscribe(std::function<void()> f) {
        handlers.push_back({next, std::move(f)});
        return Subscription(this, next++);
    }
    void remove(int id) {
        std::erase_if(handlers, [&](const auto& h) { return h.first == id; });
    }
    void emit() {
        for (auto& h : handlers) h.second();
    }
};

Subscription::~Subscription() { bus->remove(id); }

int main() {
    Bus bus;
    int count = 0;
    auto s1 = bus.subscribe([&] { ++count; });
    {
        auto s2 = bus.subscribe([&] { ++count; });
    }
    bus.emit();
    std::cout << count << '\n';
}`,
  why: String.raw`Tying a subscription's lifetime to a handle object means forgotten unsubscribes cannot leave dangling callbacks behind.` },

{ n: 26, d: "medium", t: "Worker pool with futures",
  p: String.raw`Build a pool of three worker threads that run submitted tasks. Submit five tasks, where task i returns i times i for i from 1 to 5. Collect each result through its future, then print the sum of the results.`,
  ex: String.raw`55`,
  code: String.raw`#include <condition_variable>
#include <functional>
#include <future>
#include <iostream>
#include <memory>
#include <mutex>
#include <queue>
#include <thread>
#include <vector>

class Pool {
    std::mutex m;
    std::condition_variable cv;
    std::queue<std::function<void()>> tasks;
    bool stop = false;
    std::vector<std::thread> workers;

public:
    explicit Pool(int n) {
        for (int i = 0; i < n; ++i)
            workers.emplace_back([this] {
                for (;;) {
                    std::function<void()> job;
                    {
                        std::unique_lock lk(m);
                        cv.wait(lk, [&] { return stop || !tasks.empty(); });
                        if (stop && tasks.empty()) return;
                        job = std::move(tasks.front());
                        tasks.pop();
                    }
                    job();
                }
            });
    }
    template <class F>
    auto submit(F f) -> std::future<decltype(f())> {
        auto task = std::make_shared<std::packaged_task<decltype(f())()>>(std::move(f));
        auto fut = task->get_future();
        {
            std::lock_guard g(m);
            tasks.emplace([task] { (*task)(); });
        }
        cv.notify_one();
        return fut;
    }
    ~Pool() {
        {
            std::lock_guard g(m);
            stop = true;
        }
        cv.notify_all();
        for (auto& t : workers) t.join();
    }
};

int main() {
    Pool pool(3);
    std::vector<std::future<int>> fs;
    for (int i = 1; i <= 5; ++i)
        fs.push_back(pool.submit([i] { return i * i; }));
    int sum = 0;
    for (auto& f : fs) sum += f.get();
    std::cout << sum << '\n';
}`,
  why: String.raw`A fixed set of workers pulls tasks from one queue, and futures carry each result back to the submitter. Joining in the destructor makes shutdown orderly.` },

{ n: 27, d: "medium", t: "Count words with a prefix",
  p: String.raw`Store the words car, cart and dog in a prefix tree, where each node records how many words pass through it. Count the words that start with ca and print the number.`,
  ex: String.raw`2`,
  code: String.raw`#include <array>
#include <iostream>
#include <memory>
#include <string>

struct TrieNode {
    std::array<std::unique_ptr<TrieNode>, 26> kids;
    int count = 0;
};

void insert(TrieNode& root, const std::string& w) {
    TrieNode* n = &root;
    for (char c : w) {
        auto& k = n->kids[c - 'a'];
        if (!k) k = std::make_unique<TrieNode>();
        n = k.get();
        ++n->count;
    }
}

int prefix_count(const TrieNode& root, const std::string& p) {
    const TrieNode* n = &root;
    for (char c : p) {
        const auto& k = n->kids[c - 'a'];
        if (!k) return 0;
        n = k.get();
    }
    return n->count;
}

int main() {
    TrieNode root;
    for (const char* w : {"car", "cart", "dog"}) insert(root, w);
    std::cout << prefix_count(root, "ca") << '\n';
}`,
  why: String.raw`Autocomplete systems answer prefix queries in time proportional to the prefix length, using counts stored on the path.` },

{ n: 28, d: "medium", t: "Lookup after collisions",
  p: String.raw`A hash table with 8 slots places each key at its key modulo 8, and on collision moves to the next slot. Insert key 1 with value 10, then key 9 with value 90, which collides with key 1. Erase key 1, leaving its slot marked as deleted so that later lookups keep searching past it. Look up key 9 and key 17, printing its value or missing. Separate the two answers with a space.`,
  ex: String.raw`90 missing`,
  code: String.raw`#include <iostream>
#include <optional>
#include <vector>

class Table {
    struct Slot {
        enum { Empty, Used, Dead } st = Empty;
        int key = 0;
        int val = 0;
    };
    std::vector<Slot> s;

public:
    Table() : s(8) {}
    void insert(int k, int v) {
        std::size_t i = k % s.size();
        while (s[i].st == Slot::Used && s[i].key != k) i = (i + 1) % s.size();
        s[i] = {Slot::Used, k, v};
    }
    void erase(int k) {
        std::size_t i = k % s.size();
        for (std::size_t n = 0; n < s.size(); ++n, i = (i + 1) % s.size()) {
            if (s[i].st == Slot::Empty) return;
            if (s[i].st == Slot::Used && s[i].key == k) { s[i].st = Slot::Dead; return; }
        }
    }
    std::optional<int> find(int k) const {
        std::size_t i = k % s.size();
        for (std::size_t n = 0; n < s.size(); ++n, i = (i + 1) % s.size()) {
            if (s[i].st == Slot::Empty) return std::nullopt;
            if (s[i].st == Slot::Used && s[i].key == k) return s[i].val;
        }
        return std::nullopt;
    }
};

int main() {
    Table t;
    t.insert(1, 10);
    t.insert(9, 90);
    t.erase(1);
    if (auto v = t.find(9)) std::cout << *v; else std::cout << "missing";
    std::cout << ' ';
    if (auto v = t.find(17)) std::cout << *v; else std::cout << "missing";
    std::cout << '\n';
}`,
  why: String.raw`Open addressing keeps everything in one array. Deleted slots must be marked rather than emptied, or lookups past them would stop too early.` },

{ n: 29, d: "medium", t: "Intrusive list reordering",
  p: String.raw`Three nodes with values 1, 2 and 3 are linked into a circular list that stores the links inside the nodes themselves. Move the node with value 1 to the end of the list. Print the values in order, separated by spaces.`,
  ex: String.raw`2 3 1`,
  code: String.raw`#include <iostream>

struct Node {
    int v;
    Node* prev = nullptr;
    Node* next = nullptr;
};

struct List {
    Node head{0};
    List() { head.prev = head.next = &head; }
    void push_back(Node* n) {
        n->prev = head.prev;
        n->next = &head;
        head.prev->next = n;
        head.prev = n;
    }
    void unlink(Node* n) {
        n->prev->next = n->next;
        n->next->prev = n->prev;
        n->prev = n->next = nullptr;
    }
};

int main() {
    Node a{1}, b{2}, c{3};
    List l;
    l.push_back(&a);
    l.push_back(&b);
    l.push_back(&c);
    l.unlink(&a);
    l.push_back(&a);
    for (Node* p = l.head.next; p != &l.head; p = p->next)
        std::cout << p->v << (p->next != &l.head ? ' ' : '\n');
}`,
  why: String.raw`Intrusive lists embed their links in the objects they hold, so inserting or removing needs no allocation. The Linux kernel and many engines use this layout.` },

class SmallVec {

{ n: 36, d: "hard", t: "Thread-safe bounded queue with shutdown",
  p: String.raw`Build a bounded queue that holds at most two items. One producer thread pushes the numbers 1 through 6 and then closes the queue. One consumer thread pops items until the queue is closed and empty, adding them up. Print the total.`,
  ex: String.raw`21`,
  code: String.raw`#include <condition_variable>
#include <deque>
#include <iostream>
#include <mutex>
#include <optional>
#include <thread>

class BoundedQueue {
    std::mutex m;
    std::condition_variable not_full, not_empty;
    std::deque<int> q;
    std::size_t cap;
    bool closed = false;

public:
    explicit BoundedQueue(std::size_t c) : cap(c) {}
    void push(int v) {
        std::unique_lock lk(m);
        not_full.wait(lk, [&] { return q.size() < cap; });
        q.push_back(v);
        not_empty.notify_one();
    }
    void close() {
        {
            std::lock_guard g(m);
            closed = true;
        }
        not_empty.notify_all();
    }
    std::optional<int> pop() {
        std::unique_lock lk(m);
        not_empty.wait(lk, [&] { return !q.empty() || closed; });
        if (q.empty()) return std::nullopt;
        int v = q.front();
        q.pop_front();
        not_full.notify_one();
        return v;
    }
};

int main() {
    BoundedQueue bq(2);
    int total = 0;
    std::thread consumer([&] {
        while (auto v = bq.pop()) total += *v;
    });
    std::thread producer([&] {
        for (int i = 1; i <= 6; ++i) bq.push(i);
        bq.close();
    });
    producer.join();
    consumer.join();
    std::cout << total << '\n';
}`,
  why: String.raw`A capacity bound gives backpressure, so a fast producer waits instead of exhausting memory. Closing the queue lets the consumer finish cleanly.` },

{ n: 41, d: "hard", t: "Resolve a config with fallbacks",
  p: String.raw`Look up a setting in a list of sources in priority order. The sources are a command-line map with timeout set to 30, an environment map with timeout set to 60 and retries set to 3, and a defaults map with retries set to 5 and host set to localhost. Return the first value found for each key. Print timeout, retries and host, separated by spaces.`,
  ex: String.raw`30 3 localhost`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>
#include <vector>

using Source = std::map<std::string, int>;

std::optional<int> lookup(const std::vector<Source>& sources, const std::string& key) {
    for (const auto& s : sources) {
        auto it = s.find(key);
        if (it != s.end()) return it->second;
    }
    return std::nullopt;
}

int main() {
    const std::vector<Source> sources{
        {{"timeout", 30}},
        {{"timeout", 60}, {"retries", 3}},

}`,
  why: String.raw`Layered configuration is resolved by searching sources from highest to lowest priority, and the first hit wins. Real tools do this for flags, environment and file settings.` },

class SquareCache {

public:

    }

};

int main() {

  code: String.raw`#include <iostream>

int main() {

    for (int i = 0; i <= 2; ++i) {

{ n: 47, d: "hard", t: "Event timeline with a priority queue",
  p: String.raw`Events occur at times 5, 1 and 3 and must be processed in time order. Processing the event at time 1 also schedules a new event at time 2 with the name D. Print the names of the events in the order they are processed, separated by spaces. The original events are named A at time 1, B at time 3 and C at time 5.`,
  ex: String.raw`A D B C`,
  code: String.raw`#include <functional>
#include <iostream>
#include <queue>
#include <string>
#include <utility>
#include <vector>

int main() {
    using Event = std::pair<int, std::string>;
    std::priority_queue<Event, std::vector<Event>, std::greater<>> events;
    events.push({5, "C"});
    events.push({1, "A"});
    events.push({3, "B"});
    bool first = true;
    while (!events.empty()) {
        Event e = events.top();
        events.pop();
        std::cout << (first ? "" : " ") << e.second;
        first = false;
        if (e.second == "A") events.push({2, "D"});
    }
    std::cout << '\n';
}`,
  why: String.raw`A discrete-event simulator in a network or game engine is a priority queue keyed by time. Handling an event can schedule later ones.` },

  ex: String.raw`3`,

int main() {

#include <string>
#include <vector>

int main() {
    std::string text;
    std::vector<std::string> history, redo;
    auto edit = [&](const std::string& s) {
        history.push_back(text);
        text += s;
        redo.clear();
    };
    auto undo = [&] {
        if (!history.empty()) {
            redo.push_back(text);
            text = history.back();
            history.pop_back();
        }
    };
    auto redo_op = [&] {
        if (!redo.empty()) {
            history.push_back(text);
            text = redo.back();
            redo.pop_back();
        }
    };
    edit("a");
    edit("b");
    undo();
    redo_op();
    std::cout << text << '\n';
}`,

  p: String.raw`An account's history is a list of events: deposit 10, withdraw 3, deposit 5. Replay them in order, starting from a balance of 0, and print the final balance.`,
  ex: String.raw`12`,
  code: String.raw`#include <iostream>
#include <type_traits>
#include <variant>
#include <vector>

struct Deposit { int amount; };
struct Withdraw { int amount; };
using Event = std::variant<Deposit, Withdraw>;

int main() {
    const std::vector<Event> log{Deposit{10}, Withdraw{3}, Deposit{5}};
    long balance = 0;
    for (const auto& e : log)
        std::visit([&](auto ev) {
            if constexpr (std::is_same_v<decltype(ev), Deposit>) balance += ev.amount;
            else balance -= ev.amount;
        }, e);
    std::cout << balance << '\n';
}`,

    std::string out;
    for (std::size_t i = 0; i < s.size();) {
        std::size_t j = i;
        while (j < s.size() && s[j] == s[i]) ++j;

const TOTAL = problems.length;
const KEY = "cpp-practical-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 10, label: "Easy", range: "Problems 1–10", badge: "easy" },
  { from: 11, to: 30, label: "Medium", range: "Problems 11–30", badge: "medium" },
  { from: 31, to: 48, label: "Hard", range: "Problems 31–48", badge: "hard" },
  { from: 49, to: 62, label: "Extension", range: "Problems 49–62", badge: null },
  { from: 63, to: 70, label: "Applications", range: "Problems 63–70", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
