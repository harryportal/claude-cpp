{ n: 1, d: "easy", t: "Front and back",
  p: String.raw`Push 1, 2 and 3 onto a queue. Print the front and the back, separated by a space. Then pop the front and print the new front.`,

{ n: 5, d: "easy", t: "Reverse with a stack",
  p: String.raw`Move the elements of the queue 1, 2, 3 through a stack so the order is reversed. Then pop the stack into a new queue and print its elements from front to back, separated by spaces.`,
  ex: String.raw`3 2 1`,
  code: String.raw`#include <iostream>
#include <queue>
#include <stack>

int main() {
    std::queue<int> q;
    for (int v : {1, 2, 3}) q.push(v);
    std::stack<int> s;
    while (!q.empty()) { s.push(q.front()); q.pop(); }
    while (!s.empty()) { q.push(s.top()); s.pop(); }
    while (!q.empty()) {
        std::cout << q.front() << (q.size() > 1 ? " " : "\n");
        q.pop();
    }
}`,
  why: String.raw`Moving values to a stack reverses them, and moving them back into a queue keeps the reversed order.` },

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Level-order traversal",
  p: String.raw`A tree has root 1 with children 2 and 3, and node 2 has children 4 and 5. Traverse it level by level using a queue. Print each level's values separated by spaces, with levels separated by " | ".`,
  ex: String.raw`1 | 2 3 | 4 5`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    // children[v] lists the children of node v
    const std::vector<std::vector<int>> children{{}, {2, 3}, {4, 5}, {}, {}, {}};
    std::queue<int> level;
    level.push(1);
    bool firstLevel = true;
    while (!level.empty()) {
        const std::size_t n = level.size();
        if (!firstLevel) std::cout << " | ";
        firstLevel = false;
        for (std::size_t i = 0; i < n; ++i) {
            const int v = level.front();
            level.pop();
            std::cout << v << (i + 1 < n ? " " : "");
            for (int c : children[v]) level.push(c);
        }
    }
    std::cout << '\n';
}`,
  why: String.raw`The queue holds the current level's nodes. Recording its size before processing lets each level be printed as a block, and children join the back for the next level.` },

{ n: 12, d: "medium", t: "Shortest path on a grid",
  p: String.raw`On an open 3 by 3 grid where you can move up, down, left or right one cell at a time, find the fewest moves from the top-left cell to the bottom-right cell using breadth-first search. Print the number of moves.`,
  ex: String.raw`4`,
  code: String.raw`#include <iostream>
#include <queue>
#include <utility>
#include <vector>

int main() {
    constexpr int N = 3;
    std::vector<std::vector<int>> dist(N, std::vector<int>(N, -1));
    std::queue<std::pair<int, int>> q;
    dist[0][0] = 0;
    q.push({0, 0});
    const int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
    while (!q.empty()) {
        const auto [r, c] = q.front();
        q.pop();
        for (int k = 0; k < 4; ++k) {
            const int nr = r + dr[k], nc = c + dc[k];
            if (nr < 0 || nc < 0 || nr >= N || nc >= N || dist[nr][nc] != -1) continue;
            dist[nr][nc] = dist[r][c] + 1;
            q.push({nr, nc});
        }
    }
    std::cout << dist[N - 1][N - 1] << '\n';
}`,
  why: String.raw`Breadth-first search visits cells in order of their distance from the start. The first time a cell is reached gives its shortest distance, so the answer is read off when the goal is labelled.` },

{ n: 13, d: "medium", t: "Interleave the two halves of a queue",
  p: String.raw`Start with the queue 1, 2, 3, 4, 5, 6. Split it into two halves, then alternately take one element from the first half and one from the second, pushing them into a new queue. Print the new queue from front to back, separated by spaces.`,
  ex: String.raw`1 4 2 5 3 6`,
  code: String.raw`#include <iostream>
#include <queue>

int main() {
    std::queue<int> deck;
    for (int v = 1; v <= 6; ++v) deck.push(v);
    std::queue<int> left, right, out;
    for (int i = 0; i < 3; ++i) { left.push(deck.front()); deck.pop(); }
    while (!deck.empty()) { right.push(deck.front()); deck.pop(); }
    while (!left.empty()) {
        out.push(left.front()); left.pop();
        out.push(right.front()); right.pop();
    }
    while (!out.empty()) {
        std::cout << out.front() << (out.size() > 1 ? " " : "\n");
        out.pop();
    }
}`,
  why: String.raw`Each half is kept in its own queue and drawn from in order, so the alternation preserves each half's sequence.` },

{ n: 14, d: "medium", t: "Generate binary numbers in order",
  p: String.raw`Using a queue of strings, generate the first five binary numbers starting from 1. Each number is produced by appending 0 and then 1 to the previous one. Print them separated by spaces.`,
  ex: String.raw`1 10 11 100 101`,
  code: String.raw`#include <iostream>
#include <queue>
#include <string>

int main() {
    std::queue<std::string> q;
    q.push("1");
    for (int i = 0; i < 5; ++i) {
        const std::string s = q.front();
        q.pop();
        std::cout << s << (i < 4 ? " " : "\n");
        q.push(s + "0");
        q.push(s + "1");
    }
}`,
  why: String.raw`Taking the front and enqueuing its two extensions produces the numbers in increasing order, because every number is enqueued after all smaller ones.` },

{ n: 15, d: "medium", t: "Rotate a queue",
  p: String.raw`Start with the queue 1, 2, 3, 4. Rotate it left by two positions by moving the front element to the back two times. Print the queue from front to back, separated by spaces.`,
  ex: String.raw`3 4 1 2`,
  code: String.raw`#include <iostream>
#include <queue>

int main() {
    std::queue<int> q;
    for (int v : {1, 2, 3, 4}) q.push(v);
    for (int i = 0; i < 2; ++i) { q.push(q.front()); q.pop(); }
    while (!q.empty()) {
        std::cout << q.front() << (q.size() > 1 ? " " : "\n");
        q.pop();
    }
}`,
  why: String.raw`Moving the front to the back is a rotation. Repeating it the required number of times shifts the queue without changing its contents.` },

{ n: 16, d: "medium", t: "Queue built from two stacks",
  p: String.raw`Implement a queue using two stacks. Enqueue 1 and 2, dequeue once, enqueue 3, then dequeue twice. Print the three dequeued values separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <iostream>
#include <stack>

class TwoStackQueue {
    std::stack<int> in_, out_;
    void shift() {
        if (out_.empty())
            while (!in_.empty()) { out_.push(in_.top()); in_.pop(); }
    }
public:
    void enqueue(int v) { in_.push(v); }
    int dequeue() { shift(); const int v = out_.top(); out_.pop(); return v; }
};

int main() {
    TwoStackQueue q;
    q.enqueue(1);
    q.enqueue(2);
    std::cout << q.dequeue() << ' ';
    q.enqueue(3);
    std::cout << q.dequeue() << ' ' << q.dequeue() << '\n';
}`,
  why: String.raw`New values go onto one stack. When the output stack runs dry, the input is moved over, which reverses it back to first-in order. Each element moves at most twice, so operations are amortised constant time.` },

{ n: 17, d: "medium", t: "Students who cannot take a sandwich",
  p: String.raw`Students stand in a queue with preferences 1, 1, 1, 0, 0, 1, where 1 means they want a square sandwich and 0 means round. Sandwiches are stacked with 1, 0, 0, 0, 1, 1 on top first. The student at the front takes the top sandwich if it matches their preference, and otherwise goes to the back of the queue. Stop when no student wants the sandwich on top. Print how many students cannot eat.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    std::queue<int> students;
    for (int v : {1, 1, 1, 0, 0, 1}) students.push(v);
    std::queue<int> sandwiches;
    for (int v : {1, 0, 0, 0, 1, 1}) sandwiches.push(v);
    int stuck = 0;
    while (!students.empty() && stuck < static_cast<int>(students.size())) {
        if (students.front() == sandwiches.front()) {
            students.pop();
            sandwiches.pop();
            stuck = 0;
        } else {
            students.push(students.front());
            students.pop();
            ++stuck;
        }
    }
    std::cout << students.size() << '\n';
}`,
  why: String.raw`Each student is either served or sent to the back. If a full pass produces no service, every remaining student wants the other kind, so the leftover count is the answer.` },

{ n: 18, d: "medium", t: "Recent pings in a time window",
  p: String.raw`A counter receives pings at times 1, 100, 3001 and 3002. For each ping, count how many pings fall in the window from that ping's time minus 3000 up to and including its own time. Print the counts separated by spaces.`,
  ex: String.raw`1 2 3 3`,
  code: String.raw`#include <iostream>
#include <queue>

int main() {
    std::queue<int> recent;
    for (int t : {1, 100, 3001, 3002}) {
        recent.push(t);
        while (recent.front() < t - 3000) recent.pop();
        std::cout << recent.size() << (t == 3002 ? "\n" : " ");
    }
}`,
  why: String.raw`Pings arrive in time order, so the oldest one is always at the front. Removing expired pings from the front keeps the queue exactly equal to the window.` },

{ n: 19, d: "medium", t: "Elimination game",

    for (int v = 1; v <= 5; ++v) players.push(v);

{ n: 20, d: "medium", t: "Sum of queues of queues",
  p: String.raw`Create a queue of queues holding the rows 1, 2 and 3, 4. Add up every value in every inner queue, and print the total.`,
  ex: String.raw`10`,
  code: String.raw`#include <iostream>
#include <queue>

int main() {
    std::queue<std::queue<int>> rows;
    std::queue<int> r1, r2;
    r1.push(1); r1.push(2);
    r2.push(3); r2.push(4);
    rows.push(r1);
    rows.push(r2);
    int total = 0;
    while (!rows.empty()) {
        auto row = rows.front();
        rows.pop();
        while (!row.empty()) { total += row.front(); row.pop(); }
    }
    std::cout << total << '\n';
}`,
  why: String.raw`Each element is a queue in its own right. Copying the front row to a local lets it be drained without affecting the outer queue.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Topological order with Kahn's method",
  p: String.raw`A task graph has edges 1 to 2, 1 to 3, 2 to 4 and 3 to 4, meaning each task must finish before the ones it points to. Print an order in which all tasks can be done, separated by spaces.`,
  ex: String.raw`1 2 3 4`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    const int n = 4;
    std::vector<std::vector<int>> adj(n);
    std::vector<int> indegree(n, 0);
    auto edge = [&](int u, int v) { adj[u].push_back(v); ++indegree[v]; };
    edge(0, 1); edge(0, 2); edge(1, 3); edge(2, 3);

    std::queue<int> ready;
    for (int v = 0; v < n; ++v) if (indegree[v] == 0) ready.push(v);

    bool first = true;
    while (!ready.empty()) {
        const int u = ready.front();
        ready.pop();
        std::cout << (first ? "" : " ") << u + 1;
        first = false;
        for (int v : adj[u]) if (--indegree[v] == 0) ready.push(v);
    }
    std::cout << '\n';
}`,
  why: String.raw`A task with no unfinished prerequisites is ready. Processing ready tasks from a queue and releasing their dependents in turn gives a valid order, and a cycle would leave some tasks unreleased.` },

{ n: 22, d: "hard", t: "Rotting spread through a grid",
  p: String.raw`In the grid 2 1 1 / 1 1 0 / 0 1 1, each cell holding 2 is rotten, each 1 is fresh, and each 0 is empty. Every minute, rot spreads from rotten cells to fresh cells that touch them up, down, left or right. Print the number of minutes until no fresh cell remains.`,
  ex: String.raw`4`,
  code: String.raw`#include <iostream>
#include <queue>
#include <utility>
#include <vector>

int main() {
    std::vector<std::vector<int>> g{{2, 1, 1}, {1, 1, 0}, {0, 1, 1}};
    const int R = static_cast<int>(g.size()), C = static_cast<int>(g[0].size());
    std::queue<std::pair<int, int>> rotten;
    int fresh = 0;
    for (int r = 0; r < R; ++r)
        for (int c = 0; c < C; ++c) {
            if (g[r][c] == 2) rotten.push({r, c});
            if (g[r][c] == 1) ++fresh;
        }
    const int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
    int minutes = 0;
    while (!rotten.empty() && fresh > 0) {
        ++minutes;
        const std::size_t level = rotten.size();
        for (std::size_t i = 0; i < level; ++i) {
            const auto [r, c] = rotten.front();
            rotten.pop();
            for (int k = 0; k < 4; ++k) {
                const int nr = r + dr[k], nc = c + dc[k];
                if (nr < 0 || nc < 0 || nr >= R || nc >= C || g[nr][nc] != 1) continue;
                g[nr][nc] = 2;
                --fresh;
                rotten.push({nr, nc});
            }
        }
    }
    std::cout << (fresh == 0 ? minutes : -1) << '\n';
}`,
  why: String.raw`Every rotten cell spreads in the same minute, so processing the queue one level at a time counts minutes exactly. A cell infected during one level is only processed in the next.` },

{ n: 23, d: "hard", t: "Shortest word ladder",
  p: String.raw`Transform the word hit into cog by changing one letter at a time, where every intermediate word must be in the list hot, dot, dog, lot, log and cog. Print the number of words in the shortest such sequence, including hit and cog.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <queue>
#include <set>
#include <string>
#include <utility>

int main() {
    const std::string start = "hit", goal = "cog";
    const std::set<std::string> dictionary{"hot", "dot", "dog", "lot", "log", "cog"};
    std::queue<std::pair<std::string, int>> q;
    std::set<std::string> seen{start};
    q.push({start, 1});
    int answer = 0;
    while (!q.empty()) {
        const auto [word, len] = q.front();
        q.pop();
        if (word == goal) { answer = len; break; }
        for (std::size_t i = 0; i < word.size(); ++i) {
            std::string next = word;
            for (char c = 'a'; c <= 'z'; ++c) {
                next[i] = c;
                if (dictionary.count(next) && !seen.count(next)) {
                    seen.insert(next);
                    q.push({next, len + 1});
                }
            }
        }
    }
    std::cout << answer << '\n';
}`,
  why: String.raw`Words one letter apart are neighbours, so breadth-first search over them finds the fewest steps. The first time a word is reached is its shortest distance, and marking it seen prevents revisits.` },

{ n: 24, d: "hard", t: "Stack built from two queues",
  p: String.raw`Implement a stack using two queues. Push 1, 2 and 3, then pop once, then print the value popped and the new top, separated by a space.`,
  ex: String.raw`3 2`,
  code: String.raw`#include <iostream>
#include <queue>

class QueueStack {
    std::queue<int> main_, aux_;
public:
    void push(int v) {
        aux_.push(v);
        while (!main_.empty()) { aux_.push(main_.front()); main_.pop(); }
        main_.swap(aux_);
    }
    int pop() { const int v = main_.front(); main_.pop(); return v; }
    int top() const { return main_.front(); }
};

int main() {
    QueueStack s;
    s.push(1); s.push(2); s.push(3);
    const int popped = s.pop();
    std::cout << popped << ' ' << s.top() << '\n';
}`,
  why: String.raw`After each push, the new value is placed at the front of the main queue by moving the older values behind it. The front is then always the most recent value, which is exactly stack behaviour.` },

{ n: 25, d: "hard", t: "Recover the shortest path",
  p: String.raw`An undirected graph has edges 0-1, 1-2, 2-4, 0-3 and 3-4. Find a shortest path from 0 to 4 using breadth-first search and print its nodes in order, separated by spaces.`,
  ex: String.raw`0 3 4`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    const std::vector<std::vector<int>> adj{{1, 3}, {0, 2}, {1, 4}, {0, 4}, {2, 3}};
    const int start = 0, goal = 4;
    std::vector<int> parent(adj.size(), -1);
    std::vector<bool> seen(adj.size(), false);
    std::queue<int> q;
    q.push(start);
    seen[start] = true;
    while (!q.empty()) {
        const int u = q.front();
        q.pop();
        for (int v : adj[u]) {
            if (seen[v]) continue;
            seen[v] = true;
            parent[v] = u;
            q.push(v);
        }
    }
    std::vector<int> path;
    for (int v = goal; v != -1; v = parent[v]) path.push_back(v);
    for (std::size_t i = path.size(); i-- > 0;) std::cout << path[i] << (i > 0 ? " " : "\n");
}`,
  why: String.raw`Breadth-first search records, for each node, the node it was first reached from. Walking those parent links back from the goal and reversing gives a shortest path.` },

{ n: 26, d: "hard", t: "Bipartite check by two-colouring",
  p: String.raw`Check whether the graph with edges 0-1, 1-2, 2-3 and 3-0 can have its nodes split into two groups so that every edge joins different groups. Use breadth-first search to assign the groups. Print true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    const std::vector<std::vector<int>> adj{{1, 3}, {0, 2}, {1, 3}, {0, 2}};
    std::vector<int> color(adj.size(), -1);
    bool ok = true;
    for (std::size_t s = 0; s < adj.size() && ok; ++s) {
        if (color[s] != -1) continue;
        color[s] = 0;
        std::queue<std::size_t> q;
        q.push(s);
        while (!q.empty() && ok) {
            const std::size_t u = q.front();
            q.pop();
            for (std::size_t v : adj[u]) {
                if (color[v] == -1) {
                    color[v] = 1 - color[u];
                    q.push(v);
                } else if (color[v] == color[u]) {
                    ok = false;
                    break;
                }
            }
        }
    }
    std::cout << std::boolalpha << ok << '\n';
}`,
  why: String.raw`Breadth-first search gives each neighbour the opposite colour of the node it was reached from. A conflict, where an edge joins two nodes of the same colour, means the graph has an odd cycle and cannot be split.` },

  ex: String.raw`2`,
  code: String.raw`#include <iostream>
#include <queue>
#include <string>

int main() {
    std::queue<std::string> inbox;
    inbox.push("m1");
    inbox.push("m2");
    int processed = 0;
    while (!inbox.empty()) {
        const std::string msg = inbox.front();
        inbox.pop();
        (void)msg;
        ++processed;
    }
    std::cout << processed << '\n';
}`,
  why: String.raw`A worker queue decouples producers from consumers. Items are handled strictly in arrival order, and the loop ends when nothing is left.` },

{ n: 53, d: "medium", t: "Degrees of separation",
  p: String.raw`In a friendship network, Ann is friends with Bob, Bob is friends with Cy, and Cy is friends with Dee. Using breadth-first search from Ann, print the fewest friendship steps needed to reach Dee.`,
  ex: String.raw`3`,
  code: String.raw`#include <iostream>
#include <queue>
#include <vector>

int main() {
    // 0 Ann, 1 Bob, 2 Cy, 3 Dee
    const std::vector<std::vector<int>> friends{{1}, {0, 2}, {1, 3}, {2}};
    std::vector<int> dist(friends.size(), -1);
    std::queue<int> q;
    dist[0] = 0;
    q.push(0);
    while (!q.empty()) {
        const int u = q.front();
        q.pop();
        for (int v : friends[u]) {
            if (dist[v] != -1) continue;
            dist[v] = dist[u] + 1;
            q.push(v);
        }
    }
    std::cout << dist[3] << '\n';
}`,
  why: String.raw`Breadth-first search explores everyone one step away before anyone two steps away, so the first time Dee is reached gives the fewest steps.` },

{ n: 54, d: "medium", t: "Cashier serving in turns",
  p: String.raw`Customers 1, 2 and 3 need 3, 1 and 2 turns of service. At a cashier, each turn serves the customer at the front for one turn, and an unfinished customer goes to the back of the line. Print the customers in the order they finish, separated by spaces.`,
  ex: String.raw`2 3 1`,
  code: String.raw`#include <iostream>
#include <queue>
#include <utility>

int main() {
    std::queue<std::pair<int, int>> line;   // (customer, turns left)
    line.push({1, 3});
    line.push({2, 1});
    line.push({3, 2});
    bool first = true;
    while (!line.empty()) {
        auto [id, left] = line.front();
        line.pop();
        --left;
        if (left == 0) {
            std::cout << (first ? "" : " ") << id;
            first = false;
        } else {
            line.push({id, left});
        }
    }
    std::cout << '\n';
}`,
  why: String.raw`Serving one turn and returning unfinished customers to the back gives each customer a fair share of the cashier in turn. Customers finish in the order their last turn happens.` },

{ n: 55, d: "easy", t: "Keyboard input buffer",
  p: String.raw`Keys a, b and c are pressed in that order and stored in a buffer queue. The program reads them back in the order they were pressed. Print the characters read, with no spaces.`,
  ex: String.raw`abc`,
  code: String.raw`#include <iostream>
#include <queue>

int main() {
    std::queue<char> buffer;
    for (char k : {'a', 'b', 'c'}) buffer.push(k);
    while (!buffer.empty()) {
        std::cout << buffer.front();
        buffer.pop();
    }
    std::cout << '\n';
}`,
  why: String.raw`Keystrokes are delivered in the order they were typed, which is first in, first out. A queue is the natural buffer between typing and reading.` },

{ n: 56, d: "medium", t: "First-in, first-out page cache",
  p: String.raw`A cache holds at most 2 pages and evicts the oldest one when full. Pages 1, 2 and 3 are loaded in that order. Print the cached pages from front to back, separated by spaces.`,
  ex: String.raw`2 3`,
  code: String.raw`#include <iostream>
#include <queue>

int main() {
    constexpr std::size_t capacity = 2;
    std::queue<int> cache;
    for (int page : {1, 2, 3}) {
        if (cache.size() == capacity) cache.pop();
        cache.push(page);
    }
    while (!cache.empty()) {
        std::cout << cache.front() << (cache.size() > 1 ? " " : "\n");
        cache.pop();
    }
}`,
  why: String.raw`Evicting from the front removes the page that was loaded longest ago, which is the first-in, first-out replacement policy.` },

{ n: 57, d: "medium", t: "Flood fill by breadth-first search",
  p: String.raw`A 2 by 2 grid is entirely open. Starting from the top-left cell, use breadth-first search to visit every open cell that can be reached by moving up, down, left or right. Print how many cells were visited.`,
  ex: String.raw`4`,
  code: String.raw`#include <iostream>
#include <queue>
#include <utility>
#include <vector>

int main() {
    const int R = 2, C = 2;
    std::vector<std::vector<bool>> open(R, std::vector<bool>(C, true));
    std::vector<std::vector<bool>> seen(R, std::vector<bool>(C, false));
    std::queue<std::pair<int, int>> q;
    q.push({0, 0});
    seen[0][0] = true;
    int visited = 0;
    const int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
    while (!q.empty()) {
        const auto [r, c] = q.front();
        q.pop();
        ++visited;
        for (int k = 0; k < 4; ++k) {
            const int nr = r + dr[k], nc = c + dc[k];
            if (nr < 0 || nc < 0 || nr >= R || nc >= C) continue;
            if (!open[nr][nc] || seen[nr][nc]) continue;
            seen[nr][nc] = true;
            q.push({nr, nc});
        }
    }
    std::cout << visited << '\n';
}`,
  why: String.raw`Breadth-first search marks each reachable cell as seen the moment it is queued, so every open cell is counted exactly once.` },

{ n: 58, d: "easy", t: "Stage backlog",

const TOTAL = problems.length;
const KEY = "stl-queue-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 58, label: "Easy", range: "Problems 1–58", badge: "easy" },
  { from: 11, to: 57, label: "Medium", range: "Problems 11–57", badge: "medium" },
  { from: 21, to: 30, label: "Hard", range: "Problems 21–30", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
