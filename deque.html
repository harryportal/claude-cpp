<script>
const problems = [
// ---------- Easy ----------
{ n: 1, d: "easy", t: "Push at both ends",
  p: String.raw`Start with an empty deque. Push 2 at the back, push 1 at the front and push 3 at the back. Print the contents in order, separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> d;
    d.push_back(2);
    d.push_front(1);
    d.push_back(3);
    for (std::size_t i = 0; i < d.size(); ++i) std::cout << d[i] << (i + 1 < d.size() ? ' ' : '\n');
}`,
  why: String.raw`A deque grows at both ends in amortised constant time, which is the main thing it offers over a vector.` },

{ n: 2, d: "easy", t: "Size and checked access",
  p: String.raw`Create the deque 10, 20, 30. Print its size, then the element at index 1 using at, separated by a space.`,
  ex: String.raw`3 20`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    const std::deque<int> d{10, 20, 30};
    std::cout << d.size() << ' ' << d.at(1) << '\n';
}`,
  why: String.raw`at checks the index and throws std::out_of_range when it is invalid, like the array and vector versions.` },

{ n: 3, d: "easy", t: "Pop from both ends",
  p: String.raw`Create the deque 1, 2, 3, 4. Remove the element at the front and the element at the back. Print the new front and back, separated by a space.`,
  ex: String.raw`2 3`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 2, 3, 4};
    d.pop_front();
    d.pop_back();
    std::cout << d.front() << ' ' << d.back() << '\n';
}`,
  why: String.raw`Both pop operations run in constant time, which is why a deque works as a queue or a stack.` },

{ n: 4, d: "easy", t: "Construct in place at the front",
  p: String.raw`Create an empty deque of strings. Use emplace_front to construct a string of three x characters at the front, then print the front element.`,
  ex: String.raw`xxx`,
  code: String.raw`#include <deque>
#include <iostream>
#include <string>

int main() {
    std::deque<std::string> d;
    d.emplace_front(3, 'x');
    std::cout << d.front() << '\n';
}`,
  why: String.raw`emplace_front passes its arguments straight to the element's constructor, so the string is built in its final location with no temporary.` },

{ n: 5, d: "easy", t: "Index from both ends",
  p: String.raw`Create the deque 5, 6, 7. Print the sum of its first element and its last element.`,
  ex: String.raw`12`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    const std::deque<int> d{5, 6, 7};
    std::cout << d[0] + d[d.size() - 1] << '\n';
}`,
  why: String.raw`Deques support random access, so any element can be read with an index in constant time.` },

{ n: 6, d: "easy", t: "Insert in the middle",
  p: String.raw`Create the deque 1, 2, 4. Insert 3 so that it sits before the 4. Print all the elements separated by spaces.`,
  ex: String.raw`1 2 3 4`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 2, 4};
    d.insert(d.begin() + 2, 3);
    for (std::size_t i = 0; i < d.size(); ++i) std::cout << d[i] << (i + 1 < d.size() ? ' ' : '\n');
}`,
  why: String.raw`insert shifts the elements after the position. The shift is cheaper on the shorter side, so inserting near either end costs less than in the middle.` },

{ n: 7, d: "easy", t: "Erase a range",
  p: String.raw`Create the deque 1, 2, 3, 4, 5. Erase the first two elements. Print the rest separated by spaces.`,
  ex: String.raw`3 4 5`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 2, 3, 4, 5};
    d.erase(d.begin(), d.begin() + 2);
    for (std::size_t i = 0; i < d.size(); ++i) std::cout << d[i] << (i + 1 < d.size() ? ' ' : '\n');
}`,
  why: String.raw`erase takes a half-open range, so the first iterator is included and the second is excluded.` },

{ n: 8, d: "easy", t: "resize fills with a value",
  p: String.raw`Create an empty deque of ints. Resize it to three elements, each holding 9. Print the sum of the elements.`,
  ex: String.raw`27`,
  code: String.raw`#include <deque>
#include <iostream>
#include <numeric>

int main() {
    std::deque<int> d;
    d.resize(3, 9);
    std::cout << std::accumulate(d.begin(), d.end(), 0) << '\n';
}`,
  why: String.raw`resize with a value argument fills the new slots with copies of that value.` },

{ n: 9, d: "easy", t: "Clear and check emptiness",
  p: String.raw`Create the deque 1, 2. Clear it, then print whether it is empty, as true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 2};
    d.clear();
    std::cout << std::boolalpha << d.empty() << '\n';
}`,
  why: String.raw`clear destroys every element and leaves the size at zero.` },

{ n: 10, d: "easy", t: "Iterate in reverse",
  p: String.raw`Create the deque 1, 2, 3. Print its elements from last to first, separated by spaces.`,
  ex: String.raw`3 2 1`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    const std::deque<int> d{1, 2, 3};
    bool first = true;
    for (auto it = d.rbegin(); it != d.rend(); ++it) {
        std::cout << (first ? "" : " ") << *it;
        first = false;
    }
    std::cout << '\n';
}`,
  why: String.raw`rbegin and rend give a reverse iterator pair, so the loop walks the deque backwards without any index arithmetic.` },

// ---------- Medium ----------
{ n: 11, d: "medium", t: "FIFO processing",
  p: String.raw`Push the tasks 1, 2 and 3 into a deque in that order. Process the two oldest tasks, then print the task that is now at the front.`,
  ex: String.raw`3`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> tasks;
    tasks.push_back(1);
    tasks.push_back(2);
    tasks.push_back(3);
    tasks.pop_front();
    tasks.pop_front();
    std::cout << tasks.front() << '\n';
}`,
  why: String.raw`A queue takes items at the back and serves them from the front. Popping from the front keeps the oldest items first.` },

{ n: 12, d: "medium", t: "Maximum of each sliding window",
  p: String.raw`For the sequence 1, 3, -1, -3, 5, 3, 6, 7 and a window of size 3, print the maximum of each window, separated by spaces.`,
  ex: String.raw`3 3 5 5 6 7`,
  code: String.raw`#include <deque>
#include <iostream>
#include <vector>

int main() {
    const std::vector<int> a{1, 3, -1, -3, 5, 3, 6, 7};
    const std::size_t k = 3;
    std::deque<std::size_t> window;   // indices, values decreasing
    bool first = true;
    for (std::size_t i = 0; i < a.size(); ++i) {
        while (!window.empty() && a[window.back()] <= a[i]) window.pop_back();
        window.push_back(i);
        if (window.front() + k <= i) window.pop_front();
        if (i + 1 >= k) {
            std::cout << (first ? "" : " ") << a[window.front()];
            first = false;
        }
    }
    std::cout << '\n';
}`,
  why: String.raw`The deque keeps indices whose values decrease from front to back, so the front is always the window maximum. Each index enters and leaves once, which makes the whole scan linear.` },

{ n: 13, d: "medium", t: "Fewest 1-cost steps with 0-cost moves",
  p: String.raw`Four nodes 0, 1, 2 and 3 are connected in a line. The edge 0 to 1 costs 0, the edge 1 to 2 costs 1 and the edge 2 to 3 costs 0. Print the cheapest total cost from node 0 to node 3. Edges can be used in either direction.`,
  ex: String.raw`1`,
  code: String.raw`#include <deque>
#include <iostream>
#include <limits>
#include <utility>
#include <vector>

int main() {
    // adjacency: (neighbour, cost)
    const std::vector<std::vector<std::pair<int, int>>> g{
        {{1, 0}}, {{0, 0}, {2, 1}}, {{1, 1}, {3, 0}}, {{2, 0}}};
    std::vector<int> dist(g.size(), std::numeric_limits<int>::max());
    std::deque<int> q{0};
    dist[0] = 0;
    while (!q.empty()) {
        const int u = q.front();
        q.pop_front();
        for (const auto& [v, w] : g[u]) {
            if (dist[u] + w < dist[v]) {
                dist[v] = dist[u] + w;
                if (w == 0) q.push_front(v);
                else q.push_back(v);
            }
        }
    }
    std::cout << dist[3] << '\n';
}`,
  why: String.raw`Pushing zero-cost neighbours to the front and one-cost neighbours to the back keeps the deque sorted by distance, so the first time a node is popped its distance is final.` },

{ n: 14, d: "medium", t: "References survive push_back",
  p: String.raw`Create the deque 1, 2, 3. Keep a reference to the first element. Push 100 more ints onto the back, then print the value of the referenced element.`,
  ex: String.raw`1`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 2, 3};
    int& first = d.front();
    for (int i = 0; i < 100; ++i) d.push_back(i);
    std::cout << first << '\n';
}`,
  why: String.raw`push_back on a deque invalidates iterators but not references to existing elements. The element itself never moves, so the reference still refers to it.` },

{ n: 15, d: "medium", t: "Rotate right by one",
  p: String.raw`Create the deque 1, 2, 3, 4. Rotate it right by one position so that 4 comes first. Print the elements separated by spaces.`,
  ex: String.raw`4 1 2 3`,
  code: String.raw`#include <algorithm>
#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 2, 3, 4};
    std::rotate(d.begin(), d.end() - 1, d.end());
    for (std::size_t i = 0; i < d.size(); ++i) std::cout << d[i] << (i + 1 < d.size() ? ' ' : '\n');
}`,
  why: String.raw`rotate makes the element at the given middle position the new first one. Choosing the last element as the middle moves it to the front.` },

{ n: 16, d: "medium", t: "Sort a deque",
  p: String.raw`Create the deque 4, 1, 3, 2. Sort it in ascending order and print the result separated by spaces.`,
  ex: String.raw`1 2 3 4`,
  code: String.raw`#include <algorithm>
#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{4, 1, 3, 2};
    std::sort(d.begin(), d.end());
    for (std::size_t i = 0; i < d.size(); ++i) std::cout << d[i] << (i + 1 < d.size() ? ' ' : '\n');
}`,
  why: String.raw`A deque has random-access iterators, so the standard sort works on it directly. The elements are moved within the deque's blocks.` },

{ n: 17, d: "medium", t: "Remove consecutive duplicates",
  p: String.raw`Create the deque 1, 1, 2, 2, 2, 3. Remove consecutive duplicates so that each value appears once. Print the result separated by spaces.`,
  ex: String.raw`1 2 3`,
  code: String.raw`#include <algorithm>
#include <deque>
#include <iostream>

int main() {
    std::deque<int> d{1, 1, 2, 2, 2, 3};
    d.erase(std::unique(d.begin(), d.end()), d.end());
    for (std::size_t i = 0; i < d.size(); ++i) std::cout << d[i] << (i + 1 < d.size() ? ' ' : '\n');
}`,
  why: String.raw`unique moves each run's first element forward and returns the new end. Erasing from that end to the old end removes the leftover duplicates.` },

{ n: 18, d: "medium", t: "Running sum over the last three values",
  p: String.raw`Feed the numbers 1 to 5 into a deque that holds at most three values, discarding the oldest when it is full. After each number from the third onward, print the sum of the values held, separated by spaces.`,
  ex: String.raw`6 9 12`,
  code: String.raw`#include <deque>
#include <iostream>
#include <numeric>

int main() {
    std::deque<int> window;
    bool first = true;
    for (int v = 1; v <= 5; ++v) {
        window.push_back(v);
        if (window.size() > 3) window.pop_front();
        if (window.size() == 3) {
            std::cout << (first ? "" : " ") << std::accumulate(window.begin(), window.end(), 0);
            first = false;
        }
    }
    std::cout << '\n';
}`,
  why: String.raw`A deque of fixed capacity works as a sliding window. New values enter at the back and the oldest leaves from the front, both in constant time.` },

{ n: 19, d: "medium", t: "Deque of vectors",
  p: String.raw`Create a deque of three vectors of ints, all empty. Append 1 to the first vector and the two values 5 and 6 to the third. Print the total number of ints across all vectors.`,
  ex: String.raw`3`,
  code: String.raw`#include <deque>
#include <iostream>
#include <vector>

int main() {
    std::deque<std::vector<int>> buckets(3);
    buckets[0].push_back(1);
    buckets[2].push_back(5);
    buckets[2].push_back(6);
    std::size_t total = 0;
    for (const auto& b : buckets) total += b.size();
    std::cout << total << '\n';
}`,
  why: String.raw`Each element of the deque is a vector with its own storage, so the outer deque only holds three small objects.` },

{ n: 20, d: "medium", t: "Palindrome check from both ends",
  p: String.raw`Load the characters of racecar into a deque. Repeatedly compare the front and back characters, removing both, until fewer than two remain. Print true if the word is a palindrome.`,
  ex: String.raw`true`,
  code: String.raw`#include <deque>
#include <iostream>
#include <string>

int main() {
    const std::string word = "racecar";
    std::deque<char> d(word.begin(), word.end());
    bool ok = true;
    while (d.size() >= 2) {
        if (d.front() != d.back()) { ok = false; break; }
        d.pop_front();
        d.pop_back();
    }
    std::cout << std::boolalpha << ok << '\n';
}`,
  why: String.raw`Removing matching characters from both ends reduces the problem to the middle, and popping from either end is constant time.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Next greater element",
  p: String.raw`For the sequence 2, 1, 2, 4, 3, print for each position the value of the first later element that is strictly greater, or -1 if there is none. Separate the values with spaces.`,
  ex: String.raw`4 2 4 -1 -1`,
  code: String.raw`#include <deque>
#include <iostream>
#include <vector>

int main() {
    const std::vector<int> a{2, 1, 2, 4, 3};
    std::vector<int> next(a.size(), -1);
    std::deque<std::size_t> pending;   // indices still waiting for a larger value
    for (std::size_t i = 0; i < a.size(); ++i) {
        while (!pending.empty() && a[pending.back()] < a[i]) {
            next[pending.back()] = a[i];
            pending.pop_back();
        }
        pending.push_back(i);
    }
    for (std::size_t i = 0; i < next.size(); ++i) std::cout << next[i] << (i + 1 < next.size() ? ' ' : '\n');
}`,
  why: String.raw`The deque holds indices whose values are still waiting for a larger element. Each new value resolves every waiting value smaller than it, so each index is pushed and popped once.` },

{ n: 22, d: "hard", t: "Minimum of each pair window",
  p: String.raw`For the sequence 4, 2, 12, 3, 8 and a window of size 2, print the minimum of each window, separated by spaces.`,
  ex: String.raw`2 2 3 3`,
  code: String.raw`#include <deque>
#include <iostream>
#include <vector>

int main() {
    const std::vector<int> a{4, 2, 12, 3, 8};
    const std::size_t k = 2;
    std::deque<std::size_t> window;   // indices, values increasing
    bool first = true;
    for (std::size_t i = 0; i < a.size(); ++i) {
        while (!window.empty() && a[window.back()] >= a[i]) window.pop_back();
        window.push_back(i);
        if (window.front() + k <= i) window.pop_front();
        if (i + 1 >= k) {
            std::cout << (first ? "" : " ") << a[window.front()];
            first = false;
        }
    }
    std::cout << '\n';
}`,
  why: String.raw`This is the mirror of the sliding maximum: the deque keeps increasing values, so the front is the smallest value still inside the window.` },

{ n: 23, d: "hard", t: "Binary search with random access",
  p: String.raw`The deque 1, 3, 5, 7, 9 is sorted. Print the number of elements less than 6, found with a standard binary search over its iterators.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <deque>
#include <iostream>

int main() {
    const std::deque<int> d{1, 3, 5, 7, 9};
    const auto it = std::lower_bound(d.begin(), d.end(), 6);
    std::cout << std::distance(d.begin(), it) << '\n';
}`,
  why: String.raw`lower_bound needs random-access iterators to halve the range in logarithmic steps, and a deque provides them. The distance is the count of elements before the insertion point.` },

{ n: 24, d: "hard", t: "Josephus elimination with rotation",
  p: String.raw`Five people stand in a circle numbered 1 to 5. Starting from person 1, every second person is removed going around the circle until one remains. Print the number of the survivor.`,
  ex: String.raw`3`,
  code: String.raw`#include <deque>
#include <iostream>

int main() {
    std::deque<int> circle{1, 2, 3, 4, 5};
    while (circle.size() > 1) {
        const int skipped = circle.front();
        circle.pop_front();
        circle.push_back(skipped);   // the person at the front is skipped
        circle.pop_front();          // the next person is removed
    }

  ex: String.raw`1 6 8 10`,
  code: String.raw`#include <algorithm>
#include <deque>
#include <iostream>
#include <utility>

int main() {

    for (const auto& iv : in) {

        first = false;
    }

}`,
  why: String.raw`Because the intervals are sorted by start, an overlap can only involve the last merged interval. The deque's back is therefore the one to extend.` },

#include <string>

int main() {

{ n: 56, d: "medium", t: "Count alerts in a sliding window",
  p: String.raw`Sensor readings 5, 12, 7, 15, 20, 3 are checked in windows of three consecutive readings. For each window, count the readings above 10. Print the counts separated by spaces.`,
  ex: String.raw`1 2 2 2`,
  code: String.raw`#include <deque>
#include <iostream>
#include <vector>

int main() {
    const std::vector<int> readings{5, 12, 7, 15, 20, 3};
    std::deque<int> window;
    int alerts = 0;
    bool first = true;
    for (int r : readings) {
        window.push_back(r);
        alerts += r > 10;
        if (window.size() > 3) {
            alerts -= window.front() > 10;
            window.pop_front();
        }
        if (window.size() == 3) {
            std::cout << (first ? "" : " ") << alerts;
            first = false;
        }
    }
    std::cout << '\n';
}`,
  why: String.raw`The window adds the new reading and removes the oldest. Keeping a running count updated on both sides avoids recounting the whole window each step.` },

const TOTAL = problems.length;
const KEY = "stl-deque-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 58, label: "Easy", range: "Problems 1–58", badge: "easy" },
  { from: 11, to: 57, label: "Medium", range: "Problems 11–57", badge: "medium" },
  { from: 21, to: 50, label: "Hard", range: "Problems 21–50", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
