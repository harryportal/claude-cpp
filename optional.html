<script>
const problems = [
{ n: 1, d: "applications", t: "Last known price with an empty slot",
  p: String.raw`Keep the last trade price for three symbol slots in an array of optionals. Slot 0 traded at 10000, slot 1 has never traded, and slot 2 traded at 10150. Print each slot as N: price, or N: no price for an empty slot.`,
  ex: String.raw`0: 10000
1: no price
2: 10150`,
  code: String.raw`#include <array>
#include <iostream>
#include <optional>

int main() {
    std::array<std::optional<long long>, 3> last;
    last[0] = 10000;
    last[2].emplace(10150);
    for (size_t i = 0; i < last.size(); ++i) {
        std::cout << i << ": ";
        if (last[i]) std::cout << *last[i] << "\n";
        else std::cout << "no price\n";
    }
}`,
  why: String.raw`An empty optional marks a symbol that has never traded, so a zero price can never be mistaken for a real last trade.` },

{ n: 2, d: "applications", t: "Reference data loaded once, on first use",
  p: String.raw`A lot-size table is expensive to load, so it is loaded lazily into an optional on first use. Call get_lot three times and after each call print lot=N loads=N, where the load count is the number of times the table was loaded. The lot size is 100.`,
  ex: String.raw`lot=100 loads=1
lot=100 loads=1
lot=100 loads=1`,
  code: String.raw`#include <iostream>
#include <optional>

struct Reference { long long lot; };

int loads = 0;
std::optional<Reference> cache;

const Reference& reference() {
    if (!cache) {
        ++loads;
        cache.emplace(Reference{100});
    }
    return *cache;
}

long long get_lot() { return reference().lot; }

int main() {
    for (int i = 0; i < 3; ++i) {
        long long lot = get_lot();
        std::cout << "lot=" << lot << " loads=" << loads << "\n";
    }
}`,
  why: String.raw`Checking the optional before loading means the expensive load runs once for the life of the process, however often the lot size is read.` },

{ n: 3, d: "applications", t: "Triggering a stop from an optional stop price",
  p: String.raw`An order may carry an optional stop price. A sell stop triggers when the market price is at or below the stop. With the market at 9900, check three orders in order: stop 10000, stop 9800, and no stop. Print triggered when the stop has fired, waiting when it has not, and no stop when the order has no stop price.`,
  ex: String.raw`triggered
waiting
no stop`,
  code: String.raw`#include <iostream>
#include <optional>

struct Order { std::optional<long long> stop; };

const char* check(const Order& o, long long market) {
    if (!o.stop) return "no stop";
    return market <= *o.stop ? "triggered" : "waiting";
}

int main() {
    const Order orders[] = {Order{10000}, Order{9800}, Order{std::nullopt}};
    for (const auto& o : orders) std::cout << check(o, 9900) << "\n";
}`,
  why: String.raw`A missing stop is distinct from a stop at zero, so an order without a stop is never triggered by a price comparison against a placeholder.` },

{ n: 4, d: "applications", t: "Mid price only when both sides exist",
  p: String.raw`The mid price is the average of bid and ask, in cents with integer division, and exists only when both sides are present. Compute the mid for a bid of 10000 with an ask of 10010, a bid of 10000 with no ask, and no bid with no ask. Print mid=N when it exists and no mid otherwise.`,
  ex: String.raw`mid=10005
no mid
no mid`,
  code: String.raw`#include <iostream>
#include <optional>
#include <utility>

using Px = std::optional<long long>;

std::optional<long long> mid(Px bid, Px ask) {
    if (!bid || !ask) return std::nullopt;
    return (*bid + *ask) / 2;
}

int main() {
    const std::pair<Px, Px> cases[] = {
        {10000, 10010}, {10000, std::nullopt}, {std::nullopt, std::nullopt}};
    for (const auto& [b, a] : cases) {
        auto m = mid(b, a);
        if (m) std::cout << "mid=" << *m << "\n";
        else std::cout << "no mid\n";
    }
}`,
  why: String.raw`Returning nullopt when either side is missing means a one-sided quote cannot quietly produce a mid price that looks real.` },

{ n: 5, d: "applications", t: "Quantity parsing that yields lots",
  p: String.raw`Parse a quantity string into an optional integer, returning nullopt when the text is not entirely a number. Convert each parsed quantity to lots of 100 with transform, and print lots=N for a valid quantity or invalid otherwise. Process the strings 300, abc and 250 in order. Lots are the quantity divided by 100 with integer division.`,
  ex: String.raw`lots=3
invalid
lots=2`,
  code: String.raw`#include <charconv>
#include <iostream>
#include <optional>
#include <string_view>
#include <system_error>

std::optional<long long> parse_qty(std::string_view s) {
    long long v = 0;
    auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
    if (ec != std::errc{} || p != s.data() + s.size()) return std::nullopt;
    return v;
}

int main() {
    for (std::string_view s : {"300", "abc", "250"}) {
        auto lots = parse_qty(s).transform([](long long q) { return q / 100; });
        if (lots) std::cout << "lots=" << *lots << "\n";
        else std::cout << "invalid\n";
    }
}`,
  why: String.raw`transform runs only on a parsed value, so the lot conversion never sees the bad input and needs no separate check.` },

{ n: 6, d: "applications", t: "Venue override with a default",
  p: String.raw`A symbol's venue override is optional and is set only when the symbol is routed away from the default venue NYSE. Resolve the venue for an override of BATS and then for no override. Print venue=NAME for each.`,
  ex: String.raw`venue=BATS
venue=NYSE`,
  code: String.raw`#include <iostream>
#include <optional>
#include <string>

std::string resolve(const std::optional<std::string>& override_venue) {
    return override_venue.value_or("NYSE");
}

int main() {
    std::cout << "venue=" << resolve(std::string("BATS")) << "\n";
    std::cout << "venue=" << resolve(std::nullopt) << "\n";
}`,
  why: String.raw`value_or states the default in one place, so every caller gets the same venue when no override is set.` },

{ n: 7, d: "applications", t: "Settlement date known only after confirmation",
  p: String.raw`A trade's settlement date is an optional integer in the form YYYYMMDD, set only once the back office confirms it. Print settles on DATE for a confirmed trade and pending for an unconfirmed one. The first trade settles on 20261104 and the second has not been confirmed.`,
  ex: String.raw`settles on 20261104
pending`,
  code: String.raw`#include <iostream>
#include <optional>

struct Trade { int id; std::optional<int> settle; };

int main() {
    const Trade trades[] = {{1, 20261104}, {2, std::nullopt}};
    for (const auto& t : trades) {
        if (t.settle) std::cout << "settles on " << *t.settle << "\n";
        else std::cout << "pending\n";
    }
}`,
  why: String.raw`The settlement date is absent until it is known, so no code can read a placeholder date and report it as confirmed.` },

{ n: 8, d: "applications", t: "Best bid across a book with empty levels",
  p: String.raw`A price book is a vector of optional prices, one per level, with empty levels as nullopt. Return the highest present price as the best bid, or nullopt when no level has a price. Print best=N for the first book, whose levels are 10000, empty, 10050 and 9990, and no bid for the second book, whose levels are all empty.`,
  ex: String.raw`best=10050
no bid`,
  code: String.raw`#include <iostream>
#include <optional>
#include <vector>

using Level = std::optional<long long>;

std::optional<long long> best_bid(const std::vector<Level>& levels) {
    std::optional<long long> best;
    for (const Level& l : levels)
        if (l && (!best || *l > *best)) best = l;
    return best;
}

int main() {
    auto a = best_bid({10000, std::nullopt, 10050, 9990});
    auto b = best_bid({std::nullopt, std::nullopt});
    if (a) std::cout << "best=" << *a << "\n";
    else std::cout << "no bid\n";
    if (b) std::cout << "best=" << *b << "\n";
    else std::cout << "no bid\n";
}`,
  why: String.raw`Starting from an empty optional lets the first real price set the running best, so an all-empty book needs no special case.` },

{ n: 9, d: "applications", t: "Memoized volatility cleared at the day boundary",
  p: String.raw`A volatility figure is expensive, so it is memoized in an optional. Call volatility twice, printing computations=N after each call, then reset the memo as at the start of a new day, call volatility again, and print computations=N. The count is the number of real computations so far.`,
  ex: String.raw`computations=1
computations=1
computations=2`,
  code: String.raw`#include <iostream>
#include <optional>

int computations = 0;
std::optional<double> memo;

double volatility() {
    if (!memo) {
        ++computations;
        memo = 0.25;
    }
    return *memo;
}

int main() {
    volatility();
    std::cout << "computations=" << computations << "\n";
    volatility();
    std::cout << "computations=" << computations << "\n";
    memo.reset();
    volatility();
    std::cout << "computations=" << computations << "\n";
}`,
  why: String.raw`reset() is the invalidation step: clearing the optional forces the next read to recompute rather than serve yesterday's figure.` },

{ n: 10, d: "applications", t: "Moving a value out of an optional",
  p: String.raw`Move the order id held in an optional string into a plain string. Then print moved=ID and whether the optional still reports having a value, as engaged=yes or engaged=no. The order id is ORDER-7.`,
  ex: String.raw`moved=ORDER-7 engaged=yes`,
  code: String.raw`#include <iostream>
#include <optional>
#include <string>
#include <utility>

int main() {
    std::optional<std::string> id = std::string("ORDER-7");
    std::string moved = std::move(*id);
    std::cout << "moved=" << moved << " engaged=" << (id.has_value() ? "yes" : "no") << "\n";
}`,
  why: String.raw`Moving out of an optional leaves it engaged with a moved-from value, so code that needs an empty state must call reset rather than rely on the move.` },

{ n: 11, d: "applications", t: "Sorting prices with missing entries first",
  p: String.raw`Sort a list of optional prices ascending. nullopt compares less than any value, so missing prices come first. The list is 10100, missing, 10000 and 10050. Print the sorted list separated by spaces, with - for a missing price.`,
  ex: String.raw`- 10000 10050 10100`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <optional>
#include <vector>

int main() {
    std::vector<std::optional<long long>> px{10100, std::nullopt, 10000, 10050};
    std::sort(px.begin(), px.end());
    for (size_t i = 0; i < px.size(); ++i) {
        if (i > 0) std::cout << " ";
        if (px[i]) std::cout << *px[i];
        else std::cout << "-";
    }
    std::cout << "\n";
}`,
  why: String.raw`The standard ordering puts nullopt first, so a sorted book shows its gaps at the front rather than mixing them into real prices.` },

{ n: 12, d: "applications", t: "Strategy size with an override chain",
  p: String.raw`A strategy takes its order size from a per-symbol override if present, otherwise from a global default if present, otherwise from a hard floor of 100. Chain the optionals with or_else, then supply the floor with value_or. Print size=N for three cases: override 300 with global 500, no override with global 500, and neither.`,
  ex: String.raw`size=300
size=500
size=100`,
  code: String.raw`#include <iostream>
#include <optional>

long long size_for(std::optional<long long> per_symbol, std::optional<long long> global) {
    return per_symbol.or_else([&] { return global; }).value_or(100);
}

int main() {
    std::cout << "size=" << size_for(300, 500) << "\n";
    std::cout << "size=" << size_for(std::nullopt, 500) << "\n";
    std::cout << "size=" << size_for(std::nullopt, std::nullopt) << "\n";
}`,
  why: String.raw`or_else expresses a fallback order without nested ifs, and the floor is written once at the end where the chain can no longer change it.` },

{ n: 13, d: "applications", t: "Lot size through a chain of lookups",
  p: String.raw`To find a symbol's lot size, look up its instrument group, then the group's lot size. Each step can be missing, and the chain stops at the first missing link with and_then. The symbols are AAPL, which belongs to group equity with a lot of 100, XYZ, which has no instrument, and ABC, whose group has no lot size. Print lot=N or unknown for each, in that order.`,
  ex: String.raw`lot=100
unknown
unknown`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>

const std::map<std::string, std::string> instrument_group{{"AAPL", "equity"}, {"ABC", "bond-x"}};
const std::map<std::string, long long> group_lot{{"equity", 100}};

std::optional<std::string> group_of(const std::string& sym) {
    auto it = instrument_group.find(sym);
    if (it == instrument_group.end()) return std::nullopt;
    return it->second;
}

std::optional<long long> lot_of(const std::string& sym) {
    return group_of(sym).and_then([](const std::string& g) -> std::optional<long long> {
        auto it = group_lot.find(g);
        if (it == group_lot.end()) return std::nullopt;
        return it->second;
    });
}

int main() {
    for (std::string s : {"AAPL", "XYZ", "ABC"}) {
        auto lot = lot_of(s);
        if (lot) std::cout << "lot=" << *lot << "\n";
        else std::cout << "unknown\n";
    }
}`,
  why: String.raw`and_then keeps each lookup's failure in the type, so a missing group is reported as unknown rather than read as a lot of zero.` },

{ n: 14, d: "applications", t: "Session token that can be logged out",
  p: String.raw`A session token is an optional string. Logging in sets it, and logging out resets it. Print active while a token is held and logged out once it is cleared. Set the token to abc123, print the state, then clear it and print the state again.`,
  ex: String.raw`active
logged out`,
  code: String.raw`#include <iostream>
#include <optional>
#include <string>

int main() {
    std::optional<std::string> token;
    token = "abc123";
    std::cout << (token ? "active" : "logged out") << "\n";
    token.reset();
    std::cout << (token ? "active" : "logged out") << "\n";
}`,
  why: String.raw`reset returns the session to an empty state that the type itself records, so logout cannot leave a stale token behind.` },

{ n: 15, d: "applications", t: "Position limit that may be absent",
  p: String.raw`A position limit is optional, and an absent limit means the position is unlimited. Check a position of 800 against a limit of 1000, a position of 1200 against the same limit, and a position of 1200 with no limit. Print accepted when the position is within the limit or no limit exists, and breach otherwise.`,
  ex: String.raw`accepted
breach
accepted`,
  code: String.raw`#include <iostream>
#include <optional>

const char* check(long long pos, std::optional<long long> limit) {
    if (!limit) return "accepted";
    return pos <= *limit ? "accepted" : "breach";
}

int main() {
    std::cout << check(800, 1000) << "\n";
    std::cout << check(1200, 1000) << "\n";
    std::cout << check(1200, std::nullopt) << "\n";
}`,
  why: String.raw`Modelling an unlimited position as an absent limit keeps the rule explicit, instead of using a huge number that could be exceeded by accident.` },

{ n: 16, d: "applications", t: "Price check inside an if-initialiser",
  p: String.raw`Look up prices for AAPL, MSFT and XYZ in a map of symbol to price, where AAPL is 10150 and MSFT is 9900. Use an if statement with an initialiser to read the price. Print SYM missing when there is no price, SYM above when the price is over 10000, and SYM not above otherwise.`,
  ex: String.raw`AAPL above
MSFT not above
XYZ missing`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>

std::optional<long long> price(const std::map<std::string, long long>& m, const std::string& s) {
    auto it = m.find(s);
    if (it == m.end()) return std::nullopt;
    return it->second;
}

int main() {
    const std::map<std::string, long long> prices{{"AAPL", 10150}, {"MSFT", 9900}};
    for (std::string s : {"AAPL", "MSFT", "XYZ"}) {
        if (auto px = price(prices, s); !px) std::cout << s << " missing\n";
        else if (*px > 10000) std::cout << s << " above\n";
        else std::cout << s << " not above\n";
    }
}`,
  why: String.raw`Scoping the optional to the if statement keeps the missing check and the value check together, so the value is never read outside them.` },

{ n: 17, d: "applications", t: "First feed that has an update",
  p: String.raw`Three feeds are polled in order. Each feed holds an optional price, empty when it has no update. Use the first feed that has a price and print price=N from feed K, where K is the feed's position counted from 1. The feeds hold nothing, 10120 and 10130.`,
  ex: String.raw`price=10120 from feed 2`,
  code: String.raw`#include <iostream>
#include <optional>
#include <vector>

int main() {
    std::vector<std::optional<long long>> feeds{std::nullopt, 10120, 10130};
    for (size_t i = 0; i < feeds.size(); ++i) {
        if (feeds[i]) {
            std::cout << "price=" << *feeds[i] << " from feed " << i + 1 << "\n";
            break;
        }
    }
}`,
  why: String.raw`Checking each optional in turn means a quiet feed is skipped without an error, and the first live price wins.` },

{ n: 18, d: "applications", t: "Draining an event source until it is empty",
  p: String.raw`An event source returns an optional event, and returns nothing once it is exhausted. Drain a source holding two fill events with quantities 100 and 50, summing the quantities, and print total=N.`,
  ex: String.raw`total=150`,
  code: String.raw`#include <iostream>
#include <optional>
#include <vector>

struct Event { long long qty; };

class Source {
    std::vector<Event> events_{{100}, {50}};
    size_t next_ = 0;
public:
    std::optional<Event> next() {
        if (next_ == events_.size()) return std::nullopt;
        return events_[next_++];
    }
};

int main() {
    Source src;
    long long total = 0;

{ n: 21, d: "applications", t: "Slot table for resting orders",
  p: String.raw`A fixed table of three slots holds resting order ids, with empty slots as nullopt. Place order 11 in the first free slot, then order 12, then cancel order 11, then place order 13, which takes the freed slot. Print each slot's id, or - for an empty slot, separated by spaces, after these operations.`,
  ex: String.raw`13 12 -`,
  code: String.raw`#include <array>
#include <iostream>
#include <optional>

using Slots = std::array<std::optional<long long>, 3>;

bool place(Slots& s, long long id) {
    for (auto& slot : s) {
        if (!slot) {
            slot = id;
            return true;
        }
    }
    return false;
}

void cancel(Slots& s, long long id) {
    for (auto& slot : s) {
        if (slot && *slot == id) {
            slot.reset();
            return;
        }
    }
}

int main() {
    Slots s{};
    place(s, 11);
    place(s, 12);
    cancel(s, 11);
    place(s, 13);
    for (size_t i = 0; i < s.size(); ++i) {
        if (i > 0) std::cout << " ";
        if (s[i]) std::cout << *s[i];
        else std::cout << "-";
    }
    std::cout << "\n";
}`,
  why: String.raw`Resetting a freed slot to nullopt is what makes it available again, so the table never needs a separate in-use flag.` },

{ n: 23, d: "medium", t: "Length of an optional account name",

{ n: 24, d: "medium", t: "Catching an empty value access",

{ n: 27, d: "medium", t: "Comparing optionals with values and with empty",

{ n: 28, d: "medium", t: "Spread check through a chain of lookups",
  p: String.raw`Look up a quote by symbol in a map, then compute its spread as ask minus bid, and report whether the spread is at least 20 cents. Chain these with and_then, so a missing quote yields no answer. Symbols are AAPL with bid 10000 and ask 10010, MSFT with bid 9980 and ask 10010, and XYZ, which is missing. Print SYM wide, SYM tight, or SYM unknown.`,
  ex: String.raw`AAPL tight
MSFT wide
XYZ unknown`,
  code: String.raw`#include <iostream>
#include <map>
#include <optional>
#include <string>

struct Quote { long long bid, ask; };

std::optional<Quote> quote_of(const std::map<std::string, Quote>& m, const std::string& s) {
    auto it = m.find(s);
    if (it == m.end()) return std::nullopt;
    return it->second;
}

std::optional<bool> is_wide(const std::map<std::string, Quote>& m, const std::string& s) {
    return quote_of(m, s).and_then([](const Quote& q) -> std::optional<bool> {
        return q.ask - q.bid >= 20;
    });
}

int main() {
    const std::map<std::string, Quote> quotes{{"AAPL", {10000, 10010}}, {"MSFT", {9980, 10010}}};
    for (std::string s : {"AAPL", "MSFT", "XYZ"}) {
        auto w = is_wide(quotes, s);
        if (!w) std::cout << s << " unknown\n";
        else std::cout << s << (*w ? " wide\n" : " tight\n");
    }
}`,
  why: String.raw`Each step returns an optional, so a missing symbol short-circuits the whole computation and the caller gets one unambiguous unknown.` },

{ n: 29, d: "medium", t: "Telling an unknown symbol from a symbol with no price",

XYZ: no price
ABC: unknown`,

#include <map>
#include <optional>
#include <string>

using Lookup = std::optional<std::optional<long long>>;

Lookup last_px(const std::map<std::string, std::optional<long long>>& m, const std::string& s) {
    auto it = m.find(s);
    if (it == m.end()) return std::nullopt;

}

int main() {

    for (std::string s : {"AAPL", "XYZ", "ABC"}) {

{ n: 31, d: "medium", t: "Finding an order by pointer without copying",

{ n: 36, d: "medium", t: "Eager and lazy fallbacks",
  p: String.raw`The price is 10150 and a fallback of 100 is needed only when the price is absent. Compute the value once with value_or, which evaluates its argument every time, and once with or_else, which runs its function only when the optional is empty. Count the calls to each fallback and print eager calls=N lazy calls=N.`,
  ex: String.raw`eager calls=1 lazy calls=0`,
  code: String.raw`#include <iostream>
#include <optional>

int eager = 0;
int lazy = 0;

long long fallback_eager() {
    ++eager;
    return 100;
}

int main() {
    std::optional<long long> px = 10150;
    long long a = px.value_or(fallback_eager());
    long long b = px.or_else([] {

}`,

{ n: 39, d: "applications", t: "Sorting orders with missing priorities last",

{ n: 44, d: "medium", t: "Conditional expression producing an optional",
  p: String.raw`Choose between an optional holding 3 and an empty optional with the conditional operator, based on a flag. Run it for the flags true and false, printing x=N or x=none for each, one per line.`,

x=none`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    for (bool active : {true, false}) {
        auto x = active ? std::optional<int>(3) : std::nullopt;
        if (x) std::cout << "x=" << *x << "\n";
        else std::cout << "x=none\n";
    }
}`,
  why: String.raw`The two branches share a common type through the optional, so a conditional can choose between a value and nothing without a temporary variable.` },

{ n: 45, d: "medium", t: "Comparing an optional zero with an empty one",
  p: String.raw`Compare two optional integers with the plain int 0 and report the result for three checks, printing zero==0 yes or no for an optional holding zero, none==0 yes or no for an empty optional, and truthy yes or no for the optional holding zero used as a condition.`,
  ex: String.raw`zero==0 yes
none==0 no
truthy yes`,
  code: String.raw`#include <iostream>
#include <optional>

int main() {
    std::optional<int> zero = 0;
    std::optional<int> none;
    std::cout << "zero==0 " << (zero == 0 ? "yes" : "no") << "\n";
    std::cout << "none==0 " << (none == 0 ? "yes" : "no") << "\n";
    std::cout << "truthy " << (zero ? "yes" : "no") << "\n";

{ n: 46, d: "medium", t: "Taking a move-only value out of an empty optional",
  p: String.raw`An empty optional holds a unique pointer. Move from it with value_or, supplying a unique pointer to 9 as the fallback, and print the value that comes out.`,
  ex: String.raw`9`,
  code: String.raw`#include <iostream>
#include <memory>
#include <optional>

int main() {
    std::optional<std::unique_ptr<int>> maybe;
    auto p = std::move(maybe).value_or(std::make_unique<int>(9));
    std::cout << *p << "\n";
}`,
  why: String.raw`Calling value_or on an rvalue optional moves the stored value out or the fallback in, so move-only types work without an extra copy.` },

{ n: 47, d: "applications", t: "Parsing a field into an optional without leaking exceptions",
  p: String.raw`Parse text into an integer with std::stoi, returning an empty optional when the text is not a number or is out of range. Parse 42, x and 99999999999 in order. Print the value or invalid for each.`,
  ex: String.raw`42
invalid
invalid`,
  code: String.raw`#include <iostream>
#include <optional>
#include <stdexcept>
#include <string>

std::optional<int> parse_or_nullopt(const std::string& s) {
    try {
        return std::stoi(s);
    } catch (const std::invalid_argument&) {
        return std::nullopt;
    } catch (const std::out_of_range&) {
        return std::nullopt;
    }
}

int main() {
    for (std::string s : {"42", "x", "99999999999"}) {
        auto v = parse_or_nullopt(s);
        if (v) std::cout << *v << "\n";
        else std::cout << "invalid\n";
    }
}`,
  why: String.raw`The function turns two exception types into one empty result, so a caller that only needs a value does not have to handle exceptions at all.` },

{ n: 48, d: "medium", t: "Defaulted three-way comparison with an optional member",
  p: String.raw`A key has an integer a and an optional integer b. Give it a defaulted three-way comparison, then check whether the key with b empty is less than the key with b equal to 5, both having a equal to 1. Print less=yes or less=no.`,
  ex: String.raw`less=yes`,
  code: String.raw`#include <compare>
#include <iostream>
#include <optional>

struct Key {
    long long a;
    std::optional<long long> b;
    auto operator<=>(const Key&) const = default;
};

int main() {
    Key x{1, std::nullopt};
    Key y{1, 5};
    std::cout << "less=" << (x < y ? "yes" : "no") << "\n";
}`,
  why: String.raw`An empty optional orders before any value, so a defaulted comparison over a struct with optional members works without a hand-written operator.` },

{ n: 49, d: "medium", t: "Projecting a member through an optional",
  p: String.raw`An order holds a quantity of 250. Use transform with a lambda that returns the quantity member to read it from an optional order, then read the same member from an empty optional with value_or 0. Print qty=N for each, one per line.`,
  ex: String.raw`qty=250
qty=0`,
  code: String.raw`#include <iostream>
#include <optional>

struct Order { long long qty; };

int main() {
    std::optional<Order> o = Order{250};
    auto q = o.transform([](const Order& x) { return x.qty; });
    std::cout << "qty=" << q.value_or(0) << "\n";
    std::optional<Order> none;
    std::cout << "qty=" << none.transform([](const Order& x) { return x.qty; }).value_or(0) << "\n";
}`,
  why: String.raw`A member pointer would yield a reference, which an optional cannot hold, so transform with a lambda returns the field by value.` },

{ n: 50, d: "applications", t: "Finding an exact price level in a sorted book",
  p: String.raw`A book has sorted price levels 9950, 10000 and 10050. Find the index of an exact price using lower_bound, returning an empty optional when the price is not one of the levels. Look up 10000, then 10025, printing level=N or no level.`,
  ex: String.raw`level=1
no level`,
  code: String.raw`#include <algorithm>
#include <cstddef>
#include <iostream>
#include <optional>
#include <vector>

std::optional<std::size_t> level_index(const std::vector<long long>& levels, long long px) {
    auto it = std::lower_bound(levels.begin(), levels.end(), px);
    if (it == levels.end() || *it != px) return std::nullopt;
    return static_cast<std::size_t>(it - levels.begin());
}

int main() {
    const std::vector<long long> levels{9950, 10000, 10050};
    for (long long px : {10000LL, 10025LL}) {
        auto i = level_index(levels, px);
        if (i) std::cout << "level=" << *i << "\n";
        else std::cout << "no level\n";
    }
}`,
  why: String.raw`An optional index makes the not-found case impossible to confuse with index zero, which a sentinel of -1 would need extra care to avoid.` },

{ n: 51, d: "applications", t: "Finding an order's position by value in a range",
  p: String.raw`A vector of prices is searched with ranges find for the target price. Return the position of the match as an optional index, empty when the target is absent. Search for 10050, then for 10075, in the list 10000, 10050, 10100. Print index=N or not found.`,
  ex: String.raw`index=1
not found`,
  code: String.raw`#include <algorithm>
#include <cstddef>
#include <iostream>
#include <iterator>
#include <optional>
#include <vector>

int main() {
    const std::vector<long long> px{10000, 10050, 10100};
    for (long long target : {10050LL, 10075LL}) {
        auto it = std::ranges::find(px, target);
        std::optional<std::ptrdiff_t> idx;
        if (it != px.end()) idx = std::distance(px.begin(), it);
        if (idx) std::cout << "index=" << *idx << "\n";
        else std::cout << "not found\n";
    }
}`,
  why: String.raw`Holding the position in an optional keeps a failed search from producing an index that could be used by mistake.` },
];

const TOTAL = problems.length;
const KEY = "cpp-optional-only-v1";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 23, to: 49, label: "Medium", range: "Problems 23–49", badge: "medium" },
  { from: 1, to: 51, label: "Applications", range: "Problems 1–51", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
