{ n: 1, d: "easy", t: "Push, top and pop",
  p: String.raw`Push 1, 2 and 3 onto a stack. Print the top element, then pop it and print the new size, separated by a space.`,
  ex: String.raw`3 2`,
  code: String.raw`#include <iostream>
#include <stack>

int main() {
    std::stack<int> s;
    s.push(1);

}`,
  why: String.raw`A stack gives access only to its top element. push adds to the top, and pop removes the top without returning it.` },

{ n: 2, d: "easy", t: "Empty stack",
  p: String.raw`Create an empty stack of ints and print whether it is empty, as true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <stack>

int main() {
    const std::stack<int> s;
    std::cout << std::boolalpha << s.empty() << '\n';
}`,
  why: String.raw`A new stack holds no elements, so empty is true until something is pushed.` },

{ n: 3, d: "easy", t: "Reverse a word with a stack",
  p: String.raw`Push the characters of stack onto a stack of characters, then pop them all into a string. Print the reversed string.`,
  ex: String.raw`kcats`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>

int main() {
    const std::string word = "stack";
    std::stack<char> s;
    for (char c : word) s.push(c);
    std::string out;
    while (!s.empty()) {
        out += s.top();
        s.pop();
    }
    std::cout << out << '\n';
}`,
  why: String.raw`Characters come off a stack in the reverse of their pushing order, so pushing a word and popping it all reverses the word.` },

{ n: 4, d: "easy", t: "Balanced parentheses",
  p: String.raw`Check whether the string (()()) has balanced parentheses, using a stack. Print true or false.`,
  ex: String.raw`true`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>

int main() {
    const std::string s = "(()())";
    std::stack<char> open;
    bool ok = true;
    for (char c : s) {
        if (c == '(') open.push(c);
        else if (open.empty()) { ok = false; break; }
        else open.pop();
    }
    std::cout << std::boolalpha << (ok && open.empty()) << '\n';
}`,
  why: String.raw`Each closing parenthesis must match the most recent unmatched opening one, which is exactly the top of the stack.` },

{ n: 5, d: "easy", t: "Last in, first out",
  p: String.raw`Push a, b and c onto a stack, then pop all three, printing each one as it is removed, separated by spaces.`,
  ex: String.raw`c b a`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>

int main() {
    std::stack<std::string> s;
    s.push("a");
    s.push("b");
    s.push("c");
    while (!s.empty()) {
        std::cout << s.top() << (s.size() > 1 ? " " : "\n");
        s.pop();
    }
}`,
  why: String.raw`The last value pushed is the first one popped, which is what last in, first out means.` },

{ n: 6, d: "easy", t: "Choose the underlying container",
  p: String.raw`Create a stack of ints backed by a std::vector. Push 5 and print the top element.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <stack>
#include <vector>

int main() {
    std::stack<int, std::vector<int>> s;
    s.push(5);
    std::cout << s.top() << '\n';
}`,
  why: String.raw`stack is an adapter over another container. The second template argument picks which one, and vector is the default for many uses.` },

{ n: 7, d: "easy", t: "emplace builds in place",
  p: String.raw`Create a stack of pairs of an int and a string. Use emplace to push the pair 1 and x, then print the string from the top element.`,
  ex: String.raw`x`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>
#include <utility>

int main() {
    std::stack<std::pair<int, std::string>> s;
    s.emplace(1, "x");
    std::cout << s.top().second << '\n';
}`,
  why: String.raw`emplace forwards its arguments to the element's constructor, so the pair is built directly on the stack.` },

{ n: 8, d: "easy", t: "Modify the top through a reference",
  p: String.raw`Push 4 onto a stack. Add 1 to the top element through the reference that top returns, then print the top element.`,
  ex: String.raw`5`,
  code: String.raw`#include <iostream>
#include <stack>

int main() {
    std::stack<int> s;
    s.push(4);
    s.top() += 1;
    std::cout << s.top() << '\n';
}`,

{ n: 9, d: "easy", t: "Compare two stacks",
  p: String.raw`Build the stacks a and b, each with 1 and then 2 pushed in that order. Print true if they are equal.`,
  ex: String.raw`true`,

#include <stack>

int main() {
    std::stack<int> a, b;
    a.push(1); a.push(2);
    b.push(1); b.push(2);
    std::cout << std::boolalpha << (a == b) << '\n';
}`,
  why: String.raw`Two stacks compare equal when their underlying containers hold the same elements in the same order.` },

{ n: 10, d: "easy", t: "Swap two stacks",
  p: String.raw`Create the stack a holding 1, and the stack b holding 2 and 3, with the top element pushed last. Swap them, then print the size of a and the size of b, separated by a space.`,
  ex: String.raw`2 1`,
  code: String.raw`#include <iostream>
#include <stack>

int main() {
    std::stack<int> a, b;
    a.push(1);
    b.push(2);
    b.push(3);
    a.swap(b);
    std::cout << a.size() << ' ' << b.size() << '\n';
}`,
  why: String.raw`swap exchanges the underlying containers, so each stack takes over the other's elements in a single step.` },

// ---------- Medium ----------
{ n: 11, d: "medium", t: "Evaluate reverse Polish notation",
  p: String.raw`Evaluate the expression 3 4 + 2 * written in reverse Polish notation, where each number is pushed and each operator pops two operands. Print the result.`,
  ex: String.raw`14`,
  code: String.raw`#include <iostream>
#include <sstream>
#include <stack>
#include <string>

int main() {
    std::istringstream in("3 4 + 2 *");
    std::stack<int> s;
    for (std::string tok; in >> tok;) {
        if (tok == "+" || tok == "*") {
            const int b = s.top(); s.pop();
            const int a = s.top(); s.pop();
            s.push(tok == "+" ? a + b : a * b);
        } else {
            s.push(std::stoi(tok));
        }
    }
    std::cout << s.top() << '\n';
}`,
  why: String.raw`Operands are pushed as they appear. An operator takes the two most recent values from the top, and the right operand is the one on top.` },

{ n: 12, d: "medium", t: "Days until a warmer day",
  p: String.raw`For the daily temperatures 73, 74, 75, 71, 69, 72, 76, 73, print for each day how many days later a warmer temperature occurs, or 0 if none does. Separate the numbers with spaces.`,
  ex: String.raw`1 1 4 2 1 1 0 0`,
  code: String.raw`#include <iostream>
#include <stack>
#include <vector>

int main() {
    const std::vector<int> t{73, 74, 75, 71, 69, 72, 76, 73};
    std::vector<int> wait(t.size(), 0);
    std::stack<std::size_t> pending;   // indices still waiting for a warmer day
    for (std::size_t i = 0; i < t.size(); ++i) {
        while (!pending.empty() && t[pending.top()] < t[i]) {
            wait[pending.top()] = static_cast<int>(i - pending.top());
            pending.pop();
        }
        pending.push(i);
    }
    for (std::size_t i = 0; i < wait.size(); ++i) std::cout << wait[i] << (i + 1 < wait.size() ? ' ' : '\n');
}`,
  why: String.raw`The stack holds days still waiting for a warmer one, with the coldest on top. Each new temperature resolves every waiting day it is warmer than.` },

{ n: 13, d: "medium", t: "Minimum after each push",
  p: String.raw`Push 5, 3, 7 and 2 onto a stack that also tracks the minimum seen so far. After each push, print the current minimum. Separate the values with spaces.`,
  ex: String.raw`5 3 3 2`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <stack>
#include <utility>

int main() {
    std::stack<std::pair<int, int>> s;   // (value, minimum up to here)
    for (int v : {5, 3, 7, 2}) {
        const int m = s.empty() ? v : std::min(v, s.top().second);
        s.emplace(v, m);
        std::cout << m << (v == 2 ? "\n" : " ");
    }
}`,
  why: String.raw`Each entry stores the minimum of everything beneath it as well as its own value. Popping an entry restores the previous minimum automatically, so the minimum is always available in constant time.` },

{ n: 14, d: "medium", t: "Reverse each word in place",
  p: String.raw`Reverse the letters of each word in the sentence ab cd, keeping the words in their original order. Use a stack to reverse each word. Print the result.`,
  ex: String.raw`ba dc`,
  code: String.raw`#include <iostream>
#include <sstream>
#include <stack>
#include <string>

int main() {
    std::istringstream in("ab cd");
    std::string out;
    for (std::string word; in >> word;) {
        if (!out.empty()) out += ' ';
        std::stack<char> s;
        for (char c : word) s.push(c);
        while (!s.empty()) { out += s.top(); s.pop(); }
    }
    std::cout << out << '\n';
}`,
  why: String.raw`Pushing and popping each word reverses its letters, and the outer loop keeps the words in order.` },

{ n: 15, d: "medium", t: "Remove adjacent duplicates",
  p: String.raw`Remove adjacent duplicate letters from abbaca by repeatedly cancelling a letter that matches the letter on top of a stack. Print what remains from bottom to top.`,
  ex: String.raw`ca`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>

int main() {
    std::stack<char> s;
    for (char c : std::string("abbaca")) {
        if (!s.empty() && s.top() == c) s.pop();
        else s.push(c);
    }
    std::string out;
    std::stack<char> rev;
    while (!s.empty()) { rev.push(s.top()); s.pop(); }
    while (!rev.empty()) { out += rev.top(); rev.pop(); }
    std::cout << out << '\n';
}`,
  why: String.raw`A duplicate that lands on top of the stack cancels with the letter there, so anything left behind has no adjacent matches. Popping into a second stack restores the original bottom-to-top order for printing.` },

{ n: 16, d: "medium", t: "Sum without destroying the stack",
  p: String.raw`Push 1, 2 and 3 onto a stack. Compute the sum of its elements without changing the original stack, then print the sum followed by the size of the original stack, separated by a space.`,
  ex: String.raw`6 3`,
  code: String.raw`#include <iostream>
#include <stack>

int main() {
    std::stack<int> s;
    s.push(1); s.push(2); s.push(3);
    std::stack<int> copy = s;   // work on a copy
    int sum = 0;
    while (!copy.empty()) { sum += copy.top(); copy.pop(); }
    std::cout << sum << ' ' << s.size() << '\n';
}`,
  why: String.raw`Popping a copy leaves the original untouched. Stacks offer no iterators, so a copy is the usual way to read every element.` },

{ n: 17, d: "hard", t: "Largest rectangle in a histogram",
  p: String.raw`Find the area of the largest rectangle that fits under the histogram with bar heights 2, 1, 5, 6, 2, 3. Print the area.`,
  ex: String.raw`10`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <stack>
#include <vector>

int main() {
    const std::vector<int> h{2, 1, 5, 6, 2, 3};
    std::stack<std::size_t> s;   // indices of increasing heights
    long long best = 0;
    for (std::size_t i = 0; i <= h.size(); ++i) {
        const int cur = i == h.size() ? 0 : h[i];
        while (!s.empty() && h[s.top()] >= cur) {
            const int height = h[s.top()];
            s.pop();
            const long long left = s.empty() ? -1 : static_cast<long long>(s.top());
            const long long width = static_cast<long long>(i) - left - 1;
            best = std::max(best, height * width);
        }
        s.push(i);
    }
    std::cout << best << '\n';
}`,
  why: String.raw`When a bar is popped, the bar below it marks the left boundary and the current index marks the right boundary, so the rectangle built on that bar is fully determined.` },

{ n: 18, d: "medium", t: "Undo sequence with a stack",
  p: String.raw`Perform these operations on a stack: push 1, push 2, pop, push 3. Print the top element and then the size, separated by a space.`,
  ex: String.raw`3 2`,

#include <stack>

int main() {
    std::stack<int> s;
    s.push(1);
    s.push(2);
    s.pop();
    s.push(3);

{ n: 19, d: "medium", t: "Depth of nested brackets",
  p: String.raw`Find the maximum nesting depth of parentheses in the string (a(b)(c(d))). Print the depth.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <stack>
#include <string>

int main() {
    const std::string s = "(a(b)(c(d)))";
    std::stack<char> open;
    int depth = 0;
    for (char c : s) {

  why: String.raw`The stack's size is the current depth, so tracking its maximum across the scan gives the deepest point reached.` },

{ n: 20, d: "medium", t: "Iterative depth-first order",
  p: String.raw`A graph has edges 0 to 1, 0 to 2 and 1 to 3. Starting from node 0, visit the nodes depth first using an explicit stack, always taking neighbours in the order they were listed. Print the visit order separated by spaces.`,
  ex: String.raw`0 1 3 2`,
  code: String.raw`#include <iostream>
#include <stack>
#include <vector>

int main() {
    const std::vector<std::vector<int>> adj{{1, 2}, {3}, {}, {}};
    std::stack<int> todo;
    std::vector<bool> seen(adj.size(), false);
    todo.push(0);
    bool first = true;
    while (!todo.empty()) {
        const int u = todo.top();
        todo.pop();
        if (seen[u]) continue;
        seen[u] = true;
        std::cout << (first ? "" : " ") << u;
        first = false;
        for (auto it = adj[u].rbegin(); it != adj[u].rend(); ++it) todo.push(*it);
    }
    std::cout << '\n';
}`,
  why: String.raw`Pushing neighbours in reverse makes the first listed neighbour the next one popped. Skipping nodes already visited keeps each node to a single visit.` },

// ---------- Hard ----------
{ n: 21, d: "hard", t: "Evaluate an infix expression",
  p: String.raw`Evaluate the infix expression 2+3*4-6/2 using the usual precedence, where * and / bind tighter than + and -, and integer division. Print the result.`,
  ex: String.raw`11`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <stack>
#include <string>

int prec(char op) { return (op == '*' || op == '/') ? 2 : 1; }

int apply(char op, int b, int a) {
    switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        default:  return a / b;
    }
}

int main() {
    const std::string s = "2+3*4-6/2";
    std::stack<int> values;
    std::stack<char> ops;
    auto reduce = [&] {
        const int b = values.top(); values.pop();
        const int a = values.top(); values.pop();
        const char op = ops.top(); ops.pop();
        values.push(apply(op, b, a));
    };
    for (std::size_t i = 0; i < s.size(); ++i) {
        const char c = s[i];
        if (std::isdigit(static_cast<unsigned char>(c))) {
            int v = 0;
            while (i < s.size() && std::isdigit(static_cast<unsigned char>(s[i]))) v = v * 10 + (s[i++] - '0');
            --i;
            values.push(v);
        } else {
            while (!ops.empty() && prec(ops.top()) >= prec(c)) reduce();
            ops.push(c);
        }
    }
    while (!ops.empty()) reduce();
    std::cout << values.top() << '\n';
}`,
  why: String.raw`Two stacks drive the shunting-yard method. An operator is applied only once every pending operator of equal or higher precedence has been reduced, which gives the precedence rules without parentheses.` },

{ n: 22, d: "hard", t: "Decode a bracketed repeat",
  p: String.raw`Decode the string 3[a]2[bc], where k[s] means s repeated k times. Print the decoded string.`,
  ex: String.raw`aaabcbc`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <stack>
#include <string>
#include <utility>

int main() {
    const std::string s = "3[a]2[bc]";
    std::stack<std::pair<int, std::string>> frames;   // (repeat count, text before the bracket)
    std::string cur;
    int num = 0;
    for (char c : s) {
        if (std::isdigit(static_cast<unsigned char>(c))) {
            num = num * 10 + (c - '0');
        } else if (c == '[') {
            frames.emplace(num, cur);
            num = 0;
            cur.clear();
        } else if (c == ']') {
            auto [count, prefix] = frames.top();
            frames.pop();
            std::string repeated;
            for (int i = 0; i < count; ++i) repeated += cur;
            cur = prefix + repeated;
        } else {
            cur += c;
        }
    }
    std::cout << cur << '\n';
}`,
  why: String.raw`Each opening bracket saves the text built so far with its repeat count. The matching closing bracket pops that frame and appends the repeated text, so nesting unwinds correctly.` },

{ n: 23, d: "hard", t: "Stock price span",

#include <stack>

{ n: 27, d: "hard", t: "Count Tower of Hanoi moves with stacks",
  p: String.raw`Model three pegs as stacks holding 3 disks, largest at the bottom. Move all disks from the first peg to the third by repeatedly moving the top disk of one peg onto another, never placing a larger disk on a smaller one. Print the number of moves.`,
  ex: String.raw`7`,
  code: String.raw`#include <iostream>
#include <stack>

int hanoi(int n, std::stack<int>& from, std::stack<int>& via, std::stack<int>& to, int moves) {
    if (n == 0) return moves;
    moves = hanoi(n - 1, from, to, via, moves);
    to.push(from.top());
    from.pop();
    ++moves;
    return hanoi(n - 1, via, from, to, moves);
}

int main() {
    std::stack<int> a, b, c;
    for (int d = 3; d >= 1; --d) a.push(d);

}`,

{ n: 28, d: "hard", t: "Trapped rain water",
  p: String.raw`Given the elevation map 0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1 where each bar has width 1, compute how many units of water are trapped between the bars. Print the total.`,
  ex: String.raw`6`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <stack>
#include <vector>

int main() {
    const std::vector<int> h{0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1};
    std::stack<std::size_t> s;   // indices of bars that may hold water
    long long water = 0;
    for (std::size_t i = 0; i < h.size(); ++i) {
        while (!s.empty() && h[i] > h[s.top()]) {
            const int bottom = h[s.top()];
            s.pop();
            if (s.empty()) break;
            const std::size_t left = s.top();
            const int bounded = std::min(h[left], h[i]) - bottom;
            water += static_cast<long long>(bounded) * static_cast<long long>(i - left - 1);
        }
        s.push(i);
    }
    std::cout << water << '\n';
}`,
  why: String.raw`When a bar is taller than the one on top, the water above the popped bar is bounded by the two walls, the shorter of which decides the level. The stack keeps the walls in order.` },

{ n: 29, d: "hard", t: "Validate a push and pop sequence",

#include <stack>
#include <vector>

int main() {

    std::stack<int> s;
    std::size_t next_push = 1, idx = 0;

            ++idx;
        } else if (next_push <= 5) {

}`,

    std::size_t i = 0;
    while (i < html.size()) {
        const std::size_t close = html.find('>', i);
        const std::string tag = html.substr(i + 1, close - i - 1);
        if (!tag.empty() && tag[0] == '/') {
            if (open.empty() || open.top() != tag.substr(1)) { ok = false; break; }
            open.pop();
        } else {
            open.push(tag);
        }
        i = html.find('<', close);
        if (i == std::string::npos) break;
    }
    std::cout << std::boolalpha << (ok && open.empty()) << '\n';
}`,
  why: String.raw`Opening tags go on the stack and each closing tag must match the top. Properly nested markup always closes the most recently opened element first.` },

{ n: 53, d: "easy", t: "Reverse the digits of a number",

    for (std::size_t i = 0; i < s.size(); ++i) {

{ n: 55, d: "easy", t: "Convert a number to binary",

{ n: 56, d: "hard", t: "Infix to postfix",
  p: String.raw`Convert the infix expression a+b*c into postfix notation using a stack of operators, where * binds tighter than +. Print the postfix form.`,
  ex: String.raw`abc*+`,
  code: String.raw`#include <iostream>
#include <stack>
#include <string>

int prec(char op) { return op == '*' ? 2 : 1; }

int main() {
    const std::string infix = "a+b*c";
    std::stack<char> ops;
    std::string out;
    for (char c : infix) {
        if (c >= 'a' && c <= 'z') {
            out += c;
        } else {
            while (!ops.empty() && prec(ops.top()) >= prec(c)) { out += ops.top(); ops.pop(); }
            ops.push(c);
        }
    }
    while (!ops.empty()) { out += ops.top(); ops.pop(); }
    std::cout << out << '\n';
}`,
  why: String.raw`Operands go straight to the output. An operator waits on the stack until an operator of lower precedence arrives, which is what makes * bind tighter than +.` },

{ n: 57, d: "medium", t: "Nesting depth of a list",
  p: String.raw`Find the maximum nesting depth of square brackets in the list text [1,[2,[3]]]. Print the depth.`,
  ex: String.raw`3`,
  code: String.raw`#include <algorithm>
#include <iostream>
#include <stack>
#include <string>

int main() {
    const std::string s = "[1,[2,[3]]]";
    std::stack<char> open;
    int depth = 0;
    for (char c : s) {
        if (c == '[') { open.push(c); depth = std::max(depth, static_cast<int>(open.size())); }
        else if (c == ']') open.pop();
    }
    std::cout << depth << '\n';
}`,
  why: String.raw`The stack size counts how many lists are open at any point, so its peak is the deepest nesting.` },

{ n: 58, d: "hard", t: "Calculator with parentheses",
  p: String.raw`Evaluate the expression (1+(4+5+2)-3)+(6+8) which uses + and - with parentheses. Print the result.`,
  ex: String.raw`23`,
  code: String.raw`#include <cctype>
#include <iostream>
#include <stack>
#include <string>

int main() {
    const std::string s = "(1+(4+5+2)-3)+(6+8)";
    std::stack<int> results;   // running total at each open parenthesis
    std::stack<int> signs;     // sign applied to the next term
    int total = 0, sign = 1;
    results.push(0);
    for (std::size_t i = 0; i < s.size(); ++i) {
        const char c = s[i];
        if (std::isdigit(static_cast<unsigned char>(c))) {
            int v = 0;
            while (i < s.size() && std::isdigit(static_cast<unsigned char>(s[i]))) v = v * 10 + (s[i++] - '0');
            --i;
            total += sign * v;
            sign = 1;
        } else if (c == '+') {
            sign = 1;
        } else if (c == '-') {
            sign = -1;
        } else if (c == '(') {
            results.push(total);
            signs.push(sign);
            total = 0;
            sign = 1;
        } else if (c == ')') {
            const int inner = total;
            total = results.top() + signs.top() * inner;
            results.pop();
            signs.pop();
            sign = 1;
        }
    }
    std::cout << total << '\n';
}`,
  why: String.raw`Each open parenthesis saves the running total and the sign that applies to the group. The closing parenthesis folds the inner total back into the saved value.` },
];

const TOTAL = problems.length;
const KEY = "stl-stack-progress";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 55, label: "Easy", range: "Problems 1–55", badge: "easy" },
  { from: 11, to: 57, label: "Medium", range: "Problems 11–57", badge: "medium" },
  { from: 17, to: 58, label: "Hard", range: "Problems 17–58", badge: "hard" }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
