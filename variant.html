<script>
const problems = [
{ n: 1, d: "medium", t: "Reading the active alternative index",
  p: String.raw`Create three variants of the type int, string or double. Initialise the first with 5, the second with the text hi, and the third with 2.5. Print index=N for each variant's active alternative index, one per line.`,
  ex: String.raw`index=0
index=1
index=2`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string, double> a = 5;
    std::variant<int, std::string, double> b = std::string("hi");
    std::variant<int, std::string, double> c = 2.5;
    std::cout << "index=" << a.index() << "\n";
    std::cout << "index=" << b.index() << "\n";
    std::cout << "index=" << c.index() << "\n";
}`,
  why: String.raw`index() reports which alternative is active as a number, which is useful for logging or for mapping states to a table.` },

{ n: 2, d: "medium", t: "Checking which alternative is held",
  p: String.raw`A variant of int or string is initialised with the text abc. Print int? yes or int? no, and string? yes or string? no, for whether the variant holds an int and whether it holds a string.`,
  ex: String.raw`int? no
string? yes`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = std::string("abc");
    std::cout << "int? " << (std::holds_alternative<int>(v) ? "yes" : "no") << "\n";
    std::cout << "string? " << (std::holds_alternative<std::string>(v) ? "yes" : "no") << "\n";
}`,
  why: String.raw`holds_alternative answers the question by type, which reads more clearly than comparing an index to a number.` },

{ n: 3, d: "medium", t: "Pointer access that returns null on mismatch",
  p: String.raw`A variant of int or double starts holding the int 5. Use get_if to read the int and print int 5 when it holds one, otherwise print not int. Then assign 2.5 to the variant and repeat the same check.`,
  ex: String.raw`int 5
not int`,
  code: String.raw`#include <iostream>
#include <variant>

int main() {
    std::variant<int, double> v = 5;
    if (auto* i = std::get_if<int>(&v)) std::cout << "int " << *i << "\n";
    else std::cout << "not int\n";
    v = 2.5;
    if (auto* i = std::get_if<int>(&v)) std::cout << "int " << *i << "\n";
    else std::cout << "not int\n";
}`,
  why: String.raw`get_if returns a null pointer rather than throwing, so a type check and a read can happen in one step.` },

{ n: 4, d: "medium", t: "Catching a wrong-alternative access",
  p: String.raw`A variant of int or string holds the int 7. Try to read it as a string with get, catching bad_variant_access and printing wrong alternative. Then read it as an int and print the value.`,
  ex: String.raw`wrong alternative
7`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> v = 7;
    try {
        std::cout << std::get<std::string>(v) << "\n";
    } catch (const std::bad_variant_access&) {
        std::cout << "wrong alternative\n";
    }
    std::cout << std::get<int>(v) << "\n";
}`,
  why: String.raw`get throws on a mismatch, so it fits code where the wrong alternative is a bug rather than an expected case.` },

{ n: 5, d: "medium", t: "Describing each alternative with an overload set",
  p: String.raw`Describe three values held in a variant of long long, string or bool. Print int 42 for the integer, text abc for the string, and flag on or flag off for the boolean, using std::visit with an overload set built from lambdas. The values are 42, abc and true, in order.`,
  ex: String.raw`int 42
text abc
flag on`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

using Value = std::variant<long long, std::string, bool>;

int main() {
    const Value values[] = {42LL, std::string("abc"), true};
    for (const auto& v : values) {
        std::cout << std::visit(Overloaded{
            [](long long x) { return "int " + std::to_string(x); },
            [](const std::string& s) { return "text " + s; },
            [](bool b) { return std::string(b ? "flag on" : "flag off"); }}, v) << "\n";
    }
}`,
  why: String.raw`An overload set lets each alternative have its own handler, and the compiler checks that every alternative is covered.` },

{ n: 6, d: "medium", t: "Combining two numeric variants",
  p: String.raw`Two variants each hold an int or a double. Write a function that adds them by visiting both, returning a double. Print the sum of 2 and 3, then the sum of 2 and 2.5, one per line, using default stream formatting.`,
  ex: String.raw`5
4.5`,
  code: String.raw`#include <iostream>
#include <variant>

using Num = std::variant<int, double>;

double add(const Num& x, const Num& y) {
    return std::visit([](auto p, auto q) {
        return static_cast<double>(p) + static_cast<double>(q);
    }, x, y);
}

int main() {
    Num a = 2, b = 3;
    Num c = 2.5;
    std::cout << add(a, b) << "\n";
    std::cout << add(a, c) << "\n";
}`,
  why: String.raw`Visiting two variants at once gives one visitor for every combination of alternatives, so the arithmetic is written once.` },

{ n: 7, d: "medium", t: "Empty state with monostate",
  p: String.raw`A state variant holds either std::monostate for no order or an order with an id. Start empty and print empty, then assign an order with id A-1 and print order A-1.`,
  ex: String.raw`empty
order A-1`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

struct Order { std::string id; };

void show(const std::variant<std::monostate, Order>& s) {
    if (std::holds_alternative<std::monostate>(s)) std::cout << "empty\n";
    else std::cout << "order " << std::get<Order>(s).id << "\n";
}

int main() {
    std::variant<std::monostate, Order> s;
    show(s);
    s = Order{"A-1"};
    show(s);
}`,
  why: String.raw`monostate is a placeholder alternative with no data, so a variant can be empty without making the other alternatives optional.` },

{ n: 8, d: "medium", t: "Replacing an alternative with emplace",
  p: String.raw`A link type prints open N when constructed and close N when destroyed. A variant of int or link starts holding an int. Emplace link 1, then emplace link 2 over it, then emplace the int 9. Print the events in order.`,
  ex: String.raw`open 1
close 1
open 2
close 2`,
  code: String.raw`#include <iostream>
#include <variant>

struct Link {
    int id;
    explicit Link(int i) : id(i) { std::cout << "open " << id << "\n"; }
    ~Link() { std::cout << "close " << id << "\n"; }
};

int main() {
    std::variant<int, Link> v;
    v.emplace<Link>(1);
    v.emplace<Link>(2);
    v.emplace<int>(9);
}`,
  why: String.raw`emplace destroys the held alternative before constructing the new one, so a resource is released before its replacement exists.` },

{ n: 9, d: "medium", t: "Selecting a duplicate alternative by index",
  p: String.raw`A variant of two int alternatives is constructed in place using the second alternative with the value 7. Print index=N and value=N, where N is the index and the value held.`,
  ex: String.raw`index=1 value=7`,
  code: String.raw`#include <iostream>
#include <variant>

int main() {
    std::variant<int, int> v{std::in_place_index<1>, 7};
    std::cout << "index=" << v.index() << " value=" << std::get<1>(v) << "\n";
}`,
  why: String.raw`Two alternatives of the same type cannot be told apart by type, so in_place_index is how the constructor chooses which one is meant.` },

{ n: 10, d: "medium", t: "Detecting a valueless variant after a throwing constructor",
  p: String.raw`A type whose constructor throws when given true is stored in a variant of int or that type. Start with the int, then emplace the type with true inside a try block that ignores the exception. Print valueless=yes or valueless=no to show whether the variant is valueless by exception.`,
  ex: String.raw`valueless=yes`,
  code: String.raw`#include <iostream>
#include <variant>

struct Thrower {
    explicit Thrower(bool t) {
        if (t) throw 1;
    }
    Thrower(Thrower&&) {}
};

int main() {
    std::variant<int, Thrower> v{std::in_place_index<0>, 0};
    try {
        v.emplace<1>(true);
    } catch (int) {
    }
    std::cout << "valueless=" << (v.valueless_by_exception() ? "yes" : "no") << "\n";
}`,
  why: String.raw`If a replacement throws during construction, the variant has no active alternative, which is a state the program must check before using the variant. The move constructor is not noexcept here because standard libraries may keep the old value when the new one is nothrow-movable, so a throwing move is what makes the valueless state appear reliably.` },

{ n: 11, d: "applications", t: "Command dispatcher with a running total",
  p: String.raw`Commands arrive as a variant of Add with a quantity, Cancel with an id, or Query. Start a total at zero. Add adds the quantity, Cancel subtracts the id, and Query prints open=N with the current total. Process Add 100, Add 50, Cancel 1 and Query, in that order.`,
  ex: String.raw`open=149`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct Add { long long qty; };
struct Cancel { long long id; };
struct Query {};
using Command = std::variant<Add, Cancel, Query>;

int main() {
    long long total = 0;
    std::vector<Command> cmds{Add{100}, Add{50}, Cancel{1}, Query{}};
    for (const auto& c : cmds) {
        std::visit(Overloaded{
            [&](const Add& a) { total += a.qty; },
            [&](const Cancel& x) { total -= x.id; },
            [&](const Query&) { std::cout << "open=" << total << "\n"; }}, c);
    }
}`,
  why: String.raw`Each command type has its own handler, so adding a new command means adding one alternative and one handler, and the compiler flags any that are missed.` },

{ n: 12, d: "medium", t: "Converting every alternative to text",
  p: String.raw`A variant holds an int or a double. Convert whichever alternative is held to a string using a generic lambda with an output stream, and print the result. The values are 3 and 2.5, in order.`,
  ex: String.raw`3
2.5`,
  code: String.raw`#include <iostream>
#include <sstream>
#include <string>
#include <variant>

int main() {
    std::variant<int, double> vals[] = {3, 2.5};
    for (const auto& v : vals) {
        std::string s = std::visit([](auto x) {
            std::ostringstream out;
            out << x;
            return out.str();
        }, v);
        std::cout << s << "\n";
    }
}`,
  why: String.raw`A generic visitor returns the same type for every alternative, which is what std::visit requires of its handlers.` },

{ n: 13, d: "applications", t: "Evaluating a nested expression tree",
  p: String.raw`An expression is either a number or a sum or product of sub-expressions. Build the expression (1 + 2) * 3, evaluate it by visiting the variant, and print the result.`,
  ex: String.raw`9`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

struct Expr;
struct Add { std::vector<Expr> args; };
struct Mul { std::vector<Expr> args; };
struct Expr { std::variant<long long, Add, Mul> node; };

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

long long eval(const Expr& e);

long long eval(const Expr& e) {
    return std::visit(Overloaded{
        [](long long n) { return n; },
        [](const Add& a) {
            long long s = 0;
            for (const auto& x : a.args) s += eval(x);
            return s;
        },
        [](const Mul& m) {
            long long p = 1;
            for (const auto& x : m.args) p *= eval(x);
            return p;
        }}, e.node);
}

int main() {
    Expr e{Mul{{Expr{Add{{Expr{1LL}, Expr{2LL}}}}, Expr{3LL}}}};
    std::cout << eval(e) << "\n";
}`,
  why: String.raw`A recursive variant keeps every node the same type while still letting each node carry different data, which is the usual way to write small interpreters.` },

{ n: 14, d: "medium", t: "Ordering variants by index then value",
  p: String.raw`Two variants of int or string are compared with the less-than operator. The first holds the int 100 and the second holds the text a. Print less=yes or less=no for whether the first is less than the second.`,
  ex: String.raw`less=yes`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

int main() {
    std::variant<int, std::string> a = 100;
    std::variant<int, std::string> b = std::string("a");
    std::cout << "less=" << (a < b ? "yes" : "no") << "\n";
}`,
  why: String.raw`Variant comparison orders by alternative first, so every int sorts before every string regardless of their values.` },

{ n: 15, d: "medium", t: "Equality across alternatives of different types",
  p: String.raw`A variant of int or long holds an int 5 in one object and a long 5 in another. Print equal=yes or equal=no for whether they compare equal. Then compare the first with an int 5 constructed as a variant and print same=yes or same=no.`,
  ex: String.raw`equal=no
same=yes`,
  code: String.raw`#include <iostream>
#include <variant>

int main() {
    std::variant<int, long> a = 5;
    std::variant<int, long> b = 5L;
    std::cout << "equal=" << (a == b ? "yes" : "no") << "\n";
    std::variant<int, long> c{std::in_place_index<0>, 5};
    std::cout << "same=" << (a == c ? "yes" : "no") << "\n";
}`,
  why: String.raw`Equality compares the active alternative as well as the value, so an int 5 and a long 5 are different variants even though their numbers match.` },

{ n: 16, d: "medium", t: "Inspecting a variant type at compile time",
  p: String.raw`A variant type holds an int, a string and a double. At compile time, check its alternative count is 3 and that alternative 1 is std::string. At run time print size=N and alt1 string=yes or alt1 string=no.`,
  ex: String.raw`size=3
alt1 string=yes`,
  code: String.raw`#include <iostream>
#include <string>
#include <type_traits>
#include <variant>

using V = std::variant<int, std::string, double>;

static_assert(std::variant_size_v<V> == 3);
static_assert(std::is_same_v<std::variant_alternative_t<1, V>, std::string>);

int main() {
    std::cout << "size=" << std::variant_size_v<V> << "\n";
    std::cout << "alt1 string="
              << (std::is_same_v<std::variant_alternative_t<1, V>, std::string> ? "yes" : "no") << "\n";
}`,
  why: String.raw`variant_size and variant_alternative let generic code inspect a variant's type without constructing a value.` },

{ n: 17, d: "medium", t: "Moving a unique pointer out of a variant",
  p: String.raw`A variant holds either an int or a unique pointer to the int 42. Move the pointer out of the variant with std::get, then print value=N with the value it points to.`,
  ex: String.raw`value=42`,
  code: String.raw`#include <iostream>
#include <memory>
#include <variant>

int main() {
    std::variant<int, std::unique_ptr<int>> v = std::make_unique<int>(42);
    auto p = std::get<std::unique_ptr<int>>(std::move(v));
    std::cout << "value=" << *p << "\n";
}`,
  why: String.raw`Getting from an rvalue variant moves the alternative out, which works for move-only types held in a variant.` },

{ n: 18, d: "applications", t: "Variant as a result type for parsing",
  p: String.raw`A parse function returns either a number or an error message held in a variant. Parse 123 and then the text x. For a number print ok N, and for an error print error TEXT, using get_if to tell them apart. Parsing x yields the error bad input, and any other text is converted with std::stoll.`,
  ex: String.raw`ok 123
error bad input`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

using Result = std::variant<long long, std::string>;

Result parse(const std::string& s) {
    if (s == "x") return std::string("bad input");
    return std::stoll(s);
}

int main() {
    for (std::string s : {"123", "x"}) {
        Result r = parse(s);
        if (auto* v = std::get_if<long long>(&r)) std::cout << "ok " << *v << "\n";
        else std::cout << "error " << std::get<std::string>(r) << "\n";
    }
}`,
  why: String.raw`A variant with a value alternative and an error alternative is a compact result type when the error needs to carry text.` },

{ n: 19, d: "medium", t: "Choosing a branch with if constexpr",
  p: String.raw`A variant holds an int 5, the text x, or a bool true, in that order. Visit it with a generic lambda that uses if constexpr to print int:5, string:x, or bool:true, with the boolean printed as a word. Print one line per alternative.`,
  ex: String.raw`int:5
string:x
bool:true`,
  code: String.raw`#include <iostream>
#include <string>
#include <type_traits>
#include <variant>

using V = std::variant<int, std::string, bool>;

int main() {
    const V values[] = {5, std::string("x"), true};
    for (const auto& v : values) {
        std::visit([](const auto& x) {
            using T = std::decay_t<decltype(x)>;
            if constexpr (std::is_same_v<T, int>) std::cout << "int:" << x << "\n";
            else if constexpr (std::is_same_v<T, std::string>) std::cout << "string:" << x << "\n";
            else std::cout << "bool:" << std::boolalpha << x << "\n";
        }, v);
    }
}`,
  why: String.raw`if constexpr discards the branches that do not apply to the current alternative, so each branch can use members that only exist for its type.` },

{ n: 20, d: "applications", t: "Summing the numbers in a mixed list",
  p: String.raw`A list holds variants that are each an int or a string. Sum the ints and count the strings, then print sum=N texts=N. The list is 1, a, 2, b and 39, in order.`,
  ex: String.raw`sum=42 texts=2`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>
#include <vector>

int main() {
    std::vector<std::variant<int, std::string>> items{1, std::string("a"), 2, std::string("b"), 39};
    long long sum = 0;
    int texts = 0;
    for (const auto& it : items) {
        if (auto* n = std::get_if<int>(&it)) sum += *n;
        else ++texts;
    }
    std::cout << "sum=" << sum << " texts=" << texts << "\n";
}`,
  why: String.raw`get_if lets a loop test and read each element in one step, so mixed lists need no separate type tags.` },

{ n: 21, d: "applications", t: "Replaying a market data message stream into a resting book",
  p: String.raw`A feed sends three message kinds: AddOrder with an id and quantity, Execute with an id and the quantity filled, and Remove with an id. Replay the stream AddOrder 1 quantity 100, AddOrder 2 quantity 50, Execute 1 quantity 30, Remove 2, Execute 1 quantity 70. Remove the order from the book when its quantity reaches zero. Print adds=N execs=N removes=N resting=N with the counts of each message kind and the number of orders still resting.`,
  ex: String.raw`adds=2 execs=2 removes=1 resting=0`,
  code: String.raw`#include <iostream>
#include <map>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct AddOrder { long long id; long long qty; };
struct Execute { long long id; long long qty; };
struct Remove { long long id; };
using Msg = std::variant<AddOrder, Execute, Remove>;

int main() {
    std::vector<Msg> stream{AddOrder{1, 100}, AddOrder{2, 50}, Execute{1, 30}, Remove{2}, Execute{1, 70}};
    std::map<long long, long long> book;
    int adds = 0, execs = 0, removes = 0;
    for (const auto& m : stream) {
        std::visit(Overloaded{
            [&](const AddOrder& a) { book[a.id] = a.qty; ++adds; },
            [&](const Execute& e) {
                book[e.id] -= e.qty;
                if (book[e.id] == 0) book.erase(e.id);
                ++execs;
            },
            [&](const Remove& r) { book.erase(r.id); ++removes; }}, m);
    }
    std::cout << "adds=" << adds << " execs=" << execs << " removes=" << removes
              << " resting=" << book.size() << "\n";
}`,
  why: String.raw`Each feed message is its own type, so the replay handler for each kind only touches the fields that kind carries, and a new message type cannot be silently ignored.` },

{ n: 22, d: "applications", t: "SQL-style cell values with NULL and a numeric filter",
  p: String.raw`A table column stores cells that may be NULL, an integer, a double, or text. Return the row indices where the cell is a number greater than 10. NULL and text never match. The column is 12, NULL, 9.5, the text 15, and 10.5, in that order. Print matched rows: followed by the matching indices separated by spaces.`,
  ex: String.raw`matched rows: 0 4`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>
#include <vector>

using Cell = std::variant<std::monostate, long long, double, std::string>;

bool matches(const Cell& c) {
    if (auto* i = std::get_if<long long>(&c)) return *i > 10;
    if (auto* d = std::get_if<double>(&c)) return *d > 10.0;
    return false;
}

int main() {
    std::vector<Cell> column{12LL, std::monostate{}, 9.5, std::string("15"), 10.5};
    std::cout << "matched rows:";
    for (size_t i = 0; i < column.size(); ++i)
        if (matches(column[i])) std::cout << " " << i;
    std::cout << "\n";
}`,
  why: String.raw`Modelling NULL as its own alternative keeps it distinct from zero or an empty string, which is how SQL three-valued logic avoids treating missing data as a real value.` },

{ n: 23, d: "applications", t: "Summing numbers in a nested JSON-like document",
  p: String.raw`A document is a value that is an integer, a string, an array of values, or an object of named values. Sum every integer in the document, ignoring strings. The document is an object with a = 5, b = an array of 1, 2 and an object with c = 10, and d = the text x. Print sum=N.`,
  ex: String.raw`sum=18`,
  code: String.raw`#include <iostream>
#include <string>
#include <type_traits>
#include <utility>
#include <variant>
#include <vector>

struct Json;
using Array = std::vector<Json>;
using Object = std::vector<std::pair<std::string, Json>>;

struct Json {
    std::variant<long long, std::string, Array, Object> v;
};

long long sum_numbers(const Json& j) {
    return std::visit([](const auto& x) -> long long {
        using T = std::decay_t<decltype(x)>;
        if constexpr (std::is_same_v<T, long long>) {
            return x;
        } else if constexpr (std::is_same_v<T, std::string>) {
            return 0;
        } else if constexpr (std::is_same_v<T, Array>) {
            long long s = 0;
            for (const auto& e : x) s += sum_numbers(e);
            return s;
        } else {
            long long s = 0;
            for (const auto& [key, e] : x) s += sum_numbers(e);
            return s;
        }
    }, j.v);
}

int main() {
    Json doc{Object{
        {"a", Json{5LL}},
        {"b", Json{Array{Json{1LL}, Json{2LL}, Json{Object{{"c", Json{10LL}}}}}}},
        {"d", Json{std::string("x")}}}};
    std::cout << "sum=" << sum_numbers(doc) << "\n";
}`,
  why: String.raw`A recursive variant lets one type describe any nesting depth, and visiting it recurses through arrays and objects without a separate tree class for each shape.` },

{ n: 24, d: "applications", t: "Typing configuration values from text",
  p: String.raw`A configuration loader turns text into a typed setting, trying bool for true and false, then integer, then double, and falling back to text. Parse the values true, 42, 1.5 and abc in order. For each, print its type and value: bool true, int 42, double 1.5 or string abc, using std::boolalpha for the bool.`,
  ex: String.raw`bool true
int 42
double 1.5
string abc`,
  code: String.raw`#include <charconv>
#include <iostream>
#include <string>
#include <string_view>
#include <system_error>
#include <type_traits>
#include <variant>

using Setting = std::variant<bool, long long, double, std::string>;

Setting parse_setting(std::string_view s) {
    if (s == "true") return true;
    if (s == "false") return false;
    long long i = 0;
    auto [pi, ei] = std::from_chars(s.data(), s.data() + s.size(), i);
    if (ei == std::errc{} && pi == s.data() + s.size()) return i;
    double d = 0;
    auto [pd, ed] = std::from_chars(s.data(), s.data() + s.size(), d);
    if (ed == std::errc{} && pd == s.data() + s.size()) return d;
    return std::string(s);
}

int main() {
    for (std::string_view text : {"true", "42", "1.5", "abc"}) {
        Setting s = parse_setting(text);
        std::visit([](const auto& x) {
            using T = std::decay_t<decltype(x)>;
            if constexpr (std::is_same_v<T, bool>) std::cout << "bool " << std::boolalpha << x << "\n";
            else if constexpr (std::is_same_v<T, long long>) std::cout << "int " << x << "\n";
            else if constexpr (std::is_same_v<T, double>) std::cout << "double " << x << "\n";
            else std::cout << "string " << x << "\n";
        }, s);
    }
}`,
  why: String.raw`Trying parsers in a fixed order and returning the first that succeeds gives a typed value without the caller needing to know the type in advance.` },

{ n: 25, d: "applications", t: "Alerting on sensor readings of mixed kinds",
  p: String.raw`Sensor readings arrive as temperature in degrees Celsius, humidity as a percentage, or pressure in hectopascals. Count and print an alert line for every temperature above 30. The readings are temperature 21.5, humidity 80, temperature 31, and pressure 1013, in order. Print alert temp N for each alert, then alerts=N.`,
  ex: String.raw`alert temp 31
alerts=1`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct Temp { double c; };
struct Humidity { double pct; };
struct Pressure { double hpa; };
using Reading = std::variant<Temp, Humidity, Pressure>;

int main() {
    std::vector<Reading> readings{Temp{21.5}, Humidity{80.0}, Temp{31.0}, Pressure{1013.0}};
    int alerts = 0;
    for (const auto& r : readings) {
        std::visit(Overloaded{
            [&](const Temp& t) {
                if (t.c > 30.0) {
                    ++alerts;
                    std::cout << "alert temp " << t.c << "\n";
                }
            },
            [](const Humidity&) {},
            [](const Pressure&) {}}, r);
    }
    std::cout << "alerts=" << alerts << "\n";
}`,
  why: String.raw`Each sensor kind carries its own unit, so the alert rule sits with the temperature alternative and cannot be applied to a pressure reading by mistake.` },

{ n: 26, d: "applications", t: "Dispatching UI events and tracking the last width",
  p: String.raw`A UI event queue holds clicks with x and y, key presses with a character, and resize events with width and height. Count each kind and record the width of the last resize. The queue is a click at 3,4, a key press a, a resize to 800 by 600, and a click at 1,1. Print clicks=N keys=N resizes=N width=N.`,
  ex: String.raw`clicks=2 keys=1 resizes=1 width=800`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct Click { int x, y; };
struct Key { char ch; };
struct Resize { int w, h; };
using Event = std::variant<Click, Key, Resize>;

int main() {
    std::vector<Event> queue{Click{3, 4}, Key{'a'}, Resize{800, 600}, Click{1, 1}};
    int clicks = 0, keys = 0, resizes = 0, width = 0;
    for (const auto& e : queue) {
        std::visit(Overloaded{
            [&](const Click&) { ++clicks; },
            [&](const Key&) { ++keys; },
            [&](const Resize& r) { ++resizes; width = r.w; }}, e);
    }
    std::cout << "clicks=" << clicks << " keys=" << keys << " resizes=" << resizes
              << " width=" << width << "\n";
}`,
  why: String.raw`A single visit covers every event kind, so adding an event type forces the handler to say what it does with that event.` },

{ n: 27, d: "applications", t: "Decoding a tagged binary protocol",
  p: String.raw`A binary protocol encodes messages with a one-byte tag. Tag 1 is a heartbeat with no payload. Tag 2 is a trade followed by one byte of quantity. Tag 3 is a cancel followed by one byte of order id. Decode the bytes 1, 2, 5, 3, 7 in order, printing heartbeat, trade qty=N or cancel id=N for each message, and stop with unknown tag N on any other tag.`,
  ex: String.raw`heartbeat
trade qty=5
cancel id=7`,
  code: String.raw`#include <cstdint>
#include <iostream>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct Heartbeat {};
struct Trade { std::uint8_t qty; };
struct Cancel { std::uint8_t id; };
using Msg = std::variant<Heartbeat, Trade, Cancel>;

int main() {
    const std::vector<std::uint8_t> bytes{1, 2, 5, 3, 7};
    std::size_t i = 0;
    while (i < bytes.size()) {
        const std::uint8_t tag = bytes[i];
        Msg msg;
        if (tag == 1) {
            msg = Heartbeat{};
            i += 1;
        } else if (tag == 2 && i + 1 < bytes.size()) {
            msg = Trade{bytes[i + 1]};
            i += 2;
        } else if (tag == 3 && i + 1 < bytes.size()) {
            msg = Cancel{bytes[i + 1]};
            i += 2;
        } else {
            std::cout << "unknown tag " << static_cast<int>(tag) << "\n";
            break;
        }
        std::visit(Overloaded{
            [](const Heartbeat&) { std::cout << "heartbeat\n"; },
            [](const Trade& t) { std::cout << "trade qty=" << static_cast<int>(t.qty) << "\n"; },
            [](const Cancel& c) { std::cout << "cancel id=" << static_cast<int>(c.id) << "\n"; }}, msg);
    }
}`,
  why: String.raw`Decoding into a variant turns a byte stream into typed messages once, so the rest of the program never has to look at raw tags again.` },

{ n: 28, d: "applications", t: "Collecting validation errors of different kinds",
  p: String.raw`An order's fields are validated and each failure is recorded as either a missing field with its name, or a value out of range with its name and value. The quantity must be between 1 and 1000, and the price field must be present. Validate the fields with only qty set to 0, and print one line per error: missing NAME or NAME out of range: VALUE.`,
  ex: String.raw`missing px
qty out of range: 0`,
  code: String.raw`#include <iostream>
#include <map>
#include <string>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct MissingField { std::string name; };
struct OutOfRange { std::string name; long long value; };
using ValidationError = std::variant<MissingField, OutOfRange>;

std::vector<ValidationError> validate(const std::map<std::string, long long>& fields) {
    std::vector<ValidationError> errors;
    if (!fields.contains("px")) errors.push_back(MissingField{"px"});
    auto it = fields.find("qty");
    if (it == fields.end()) {
        errors.push_back(OutOfRange{"qty", 0});
    } else if (it->second < 1 || it->second > 1000) {
        errors.push_back(OutOfRange{"qty", it->second});
    }
    return errors;
}

int main() {
    for (const auto& e : validate({{"qty", 0}})) {
        std::visit(Overloaded{
            [](const MissingField& m) { std::cout << "missing " << m.name << "\n"; },
            [](const OutOfRange& o) { std::cout << o.name << " out of range: " << o.value << "\n"; }}, e);
    }
}`,
  why: String.raw`A validator that returns a list of typed errors lets the caller format each kind differently, and an empty list means the input is valid.` },

{ n: 29, d: "applications", t: "Connection state machine with a bounded retry",
  p: String.raw`A connection starts Idle. A Start event moves it to Connecting with attempt 1. Each Timeout while connecting moves it to the next attempt, until attempt 3 has timed out, when it becomes Failed with the reason timeout after 3 attempts. Apply the events Start, Timeout, Timeout and Timeout in order, then print failed: REASON for the final failed state.`,
  ex: String.raw`failed: timeout after 3 attempts`,
  code: String.raw`#include <iostream>
#include <string>
#include <variant>

struct Idle {};
struct Connecting { int attempt; };
struct Connected { std::string session; };
struct Failed { std::string reason; };
using State = std::variant<Idle, Connecting, Connected, Failed>;

struct Start {};
struct Timeout {};
using Event = std::variant<Start, Timeout>;

State step(const State& s, const Event& e) {
    if (std::holds_alternative<Idle>(s) && std::holds_alternative<Start>(e)) return Connecting{1};
    if (auto* c = std::get_if<Connecting>(&s); c && std::holds_alternative<Timeout>(e)) {
        if (c->attempt < 3) return Connecting{c->attempt + 1};
        return Failed{"timeout after 3 attempts"};
    }
    return s;
}

int main() {
    State s = Idle{};
    for (Event e : {Event{Start{}}, Event{Timeout{}}, Event{Timeout{}}, Event{Timeout{}}}) s = step(s, e);
    if (auto* f = std::get_if<Failed>(&s)) std::cout << "failed: " << f->reason << "\n";
}`,
  why: String.raw`Each state carries only the data valid in that state, so a Connected state can hold a session while Idle and Failed have nothing to store.` },

{ n: 30, d: "applications", t: "Adding lengths given in different units",
  p: String.raw`Lengths are given either in metres or in feet. Convert each to centimetres using integer arithmetic, where one foot is 30.4 centimetres, so a length in feet is the feet times 304 divided by 10. Sum a length of 100 metres and a length of 10 feet, and print total_cm=N.`,
  ex: String.raw`total_cm=10304`,
  code: String.raw`#include <iostream>
#include <variant>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct Meters { long long m; };
struct Feet { long long ft; };
using Length = std::variant<Meters, Feet>;

long long to_cm(const Length& l) {
    return std::visit(Overloaded{
        [](const Meters& m) { return m.m * 100; },
        [](const Feet& f) { return f.ft * 304 / 10; }}, l);
}

int main() {
    const Length lengths[] = {Meters{100}, Feet{10}};
    long long total = 0;
    for (const auto& l : lengths) total += to_cm(l);
    std::cout << "total_cm=" << total << "\n";
}`,
  why: String.raw`Converting each unit in its own visitor keeps the conversion factors next to the type they belong to, and the sum is always taken in one agreed unit.` },

{ n: 31, d: "applications", t: "Counting live cache entries among tombstones",
  p: String.raw`A cache slot is a value holding an integer, a tombstone left by a deleted entry, or a pending load. Count the slots holding values and the slots pending. The slots are the value 5, a tombstone, a pending load, and the value 7, in order. Print live=N pending=N.`,
  ex: String.raw`live=2 pending=1`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

struct Value { long long v; };
struct Tombstone {};
struct Pending {};
using Slot = std::variant<Value, Tombstone, Pending>;

int main() {
    const std::vector<Slot> slots{Value{5}, Tombstone{}, Pending{}, Value{7}};
    int live = 0, pending = 0;
    for (const auto& s : slots) {
        if (std::holds_alternative<Value>(s)) ++live;
        else if (std::holds_alternative<Pending>(s)) ++pending;
    }
    std::cout << "live=" << live << " pending=" << pending << "\n";
}`,
  why: String.raw`Tombstones and pending loads are named states rather than sentinel numbers, so a lookup cannot mistake a deleted slot for a stored value of zero.` },

{ n: 32, d: "applications", t: "Routing order intents through a notional limit",
  p: String.raw`Trading intents are Buy with quantity and price, Sell with quantity and price, or Hold. A buy or sell is placed only when its notional, quantity times price, is at most 1000000. Process Buy 100 at 10000, Sell 200 at 10000 and Hold. Count the placed, rejected and held intents, and print placed=N rejected=N held=N.`,
  ex: String.raw`placed=1 rejected=1 held=1`,
  code: String.raw`#include <iostream>
#include <variant>
#include <vector>

template <class... Ts> struct Overloaded : Ts... { using Ts::operator()...; };
template <class... Ts> Overloaded(Ts...) -> Overloaded<Ts...>;

struct Buy { long long qty, px; };
struct Sell { long long qty, px; };
struct Hold {};
using Intent = std::variant<Buy, Sell, Hold>;

int main() {
    const std::vector<Intent> intents{Buy{100, 10000}, Sell{200, 10000}, Hold{}};
    int placed = 0, rejected = 0, held = 0;
    for (const auto& in : intents) {
        std::visit(Overloaded{
            [&](const Buy& b) { (b.qty * b.px <= 1000000 ? placed : rejected)++; },
            [&](const Sell& s) { (s.qty * s.px <= 1000000 ? placed : rejected)++; },
            [&](const Hold&) { ++held; }}, in);
    }
    std::cout << "placed=" << placed << " rejected=" << rejected << " held=" << held << "\n";
}`,
  why: String.raw`Handling each intent in its own visitor keeps the limit check next to the order it applies to, and Hold needs no check at all.` },
];

const TOTAL = problems.length;
const KEY = "cpp-variant-only-v1";
const list = document.getElementById("list");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const barEl = document.querySelector(".bar");

let done = new Set();
try {
  done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
} catch (e) { /* storage unavailable: start empty */ }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ }
}

function updateProgress() {
  const n = done.size;
  countEl.textContent = n;
  fillEl.style.width = (n / TOTAL * 100) + "%";
  barEl.setAttribute("aria-valuenow", String(n));
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function buildCard(p) {
  const id = "problem-" + p.n;
  const card = el("article", "card");

  const head = el("div", "card-head");
  const toggle = el("button", "toggle");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.setAttribute("aria-controls", id);
  const chev = el("span", "chev");
  chev.setAttribute("aria-hidden", "true");
  toggle.append(
    el("span", "num", String(p.n).padStart(2, "0")),
    el("span", "title", p.t),
    el("span", "badge " + p.d, cap(p.d)),
    chev
  );

  const check = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = done.has(p.n);
  check.append(box, el("span", null, "Done"));
  head.append(toggle, check);

  const body = el("div", "body");
  body.id = id;
  body.hidden = true;
  body.append(el("p", null, p.p));
  if (p.idiom) body.append(el("p", "label", "Topic covered"), el("p", null, p.idiom));
  if (p.ex) body.append(el("p", "label", "Example"), el("pre", null, p.ex));

  const reveal = el("button", "reveal", "Show solution");
  reveal.type = "button";
  reveal.setAttribute("aria-expanded", "false");
  const answer = el("div", "answer");
  answer.hidden = true;
  answer.append(
    el("p", "label", "Solution"), el("pre", "code", p.code),
    el("p", "label", "Explanation"), el("p", null, p.why)
  );
  reveal.addEventListener("click", () => {
    const showing = answer.hidden;
    answer.hidden = !showing;
    reveal.textContent = showing ? "Hide solution" : "Show solution";
    reveal.setAttribute("aria-expanded", String(showing));
  });
  body.append(reveal, answer);

  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.addEventListener("change", () => {
    if (box.checked) done.add(p.n); else done.delete(p.n);
    saveProgress();
    updateProgress();
  });

  card.append(head, body);
  return card;
}

for (const sec of [
  { from: 1, to: 19, label: "Medium", range: "Problems 1–19", badge: "medium" },
  { from: 11, to: 32, label: "Applications", range: "Problems 11–32", badge: null }
]) {
  const section = el("section", "section");
  const h = el("h2");
  h.append(el("span", sec.badge ? "badge " + sec.badge : "badge", sec.label), el("span", "range", sec.range));
  section.append(h);
  for (const p of problems.filter(x => x.n >= sec.from && x.n <= sec.to)) section.append(buildCard(p));
  list.append(section);
}

document.getElementById("total").textContent = TOTAL;
barEl.setAttribute("aria-valuemax", String(TOTAL));
updateProgress();
</script>
